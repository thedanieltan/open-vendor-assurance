[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openva-mcp"
version = "0.1.0"
description = "Read-only MCP server over the OpenVA public export contract (stdio and Streamable HTTP)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["openva", "mcp", "vendor-assurance", "model-context-protocol"]
dependencies = [
  # v1 FastMCP/low-level API. Hold below 2 until the server is tested against it.
  "mcp>=1.27,<2",
  # Standards-compliant JSON Schema validation of tool inputs.
  "jsonschema>=4.0",
  # Shared vendor-identity matching and primary-source ranking authority (also the
  # CSV adapter's core and the match service's enrichment authority).
  "openva-vendor-inventory-matcher>=0.1.0",
  # Streamable HTTP transport (read-only remote MCP). Imported only on the HTTP
  # path; both are already in the MCP SDK's dependency closure.
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# httpx drives the in-process Streamable HTTP ASGI tests (Starlette TestClient).
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
openva-mcp = "openva_mcp.server:main"

[project.urls]
Homepage = "https://thedanieltan.github.io/open-vendor-assurance"
Repository = "https://github.com/thedanieltan/open-vendor-assurance"

[tool.hatch.build.targets.wheel]
packages = ["openva_mcp"]
