schema_version: 0.1.0

prohibited_terms:
  - compliant
  - compliance-ready
  - legally sufficient
  - safe
  - secure enough
  - approved
  - recommended
  - suitable
  - adequate
  - low risk
  - trusted vendor
  - satisfies obligations
  - meets requirements
  - passes due diligence
  - certified for your use

allowed_context_notes:
  - A public source may use words such as certified or compliant in its own title or claims, but OpenVA records must describe the public source without endorsing the claim.
  - Records may say a public source references a certification, but must not conclude that the vendor is certified for a user's workload.
