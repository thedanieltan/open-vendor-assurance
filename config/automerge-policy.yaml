# OpenVA agent auto-merge policy.
#
# Auto-merge is a separate authority tier. A bot opening a PR does not imply
# that the PR is eligible for auto-merge.

mode: enforce

freshness:
  # Strict growth creates new catalog vendors and has higher blast radius.
  # The checker evaluates the evidence bundle timestamp, not the PR event time.
  strict_growth_hours: 4
  # Generated-output sync is deterministic and derived from canonical inputs,
  # so it can tolerate a longer window while still preventing stale green ticks.
  generated_hours: 24

machine_canonical:
  max_source_records_per_pr: 50

strict_growth:
  label: automerge:strict-growth
  required_labels:
    - catalog-growth
  execution_wired: true
  max_new_vendors_per_pr: 5
  max_sources_per_new_vendor: 2
  freshness_hours: 4
  required_action_field: strict_machine_candidate
  required_action_field_value: true
  action_id_fields:
    - vendor.candidate_vendor_id
    - source.source_type_candidate
    - source.candidate_source_id
  report_only_is_merge_authority: false
  head_sha_mismatch: hard_fail
  base_sha_mismatch: failure
  evidence_timestamp_source:
    primary: eligibility_report.generated_at
    fallback: promotion_plan.generated_at
  core_source_types:
    - dpa
    - subprocessors_list
    - privacy_notice
    - security_page
  source_type_priority:
    - dpa
    - privacy_notice
    - subprocessors_list
    - security_page
  allowed_attestation_modes:
    - source_attested
    - registry_attested
  allowed_inference_modes:
    - none
    - explicit_source_statement
  blocked_inference_modes:
    - domain_similarity
    - name_similarity
    - group_affiliation_inferred
    - third_party_assertion
    - model_inferred
    - unknown
  relationship_type_prefixes:
    - vendor_stated_
    - registry_stated_
  source_attested_required_fields:
    - evidence_url
    - source_id
  registry_attested_required_fields:
    - registry_source_url
    - registry_authority

source_repair:
  max_source_records_per_pr: 10

observation:
  # WP35.5 autonomous observation-ledger append lane. Append-only operational
  # observation events under the committed ledger events path only; never
  # catalog truth. The observation_automerge checker enforces append-only
  # behaviour and schema validity on top of this path restriction.
  allowed_path_prefix: maintenance/source-observations/events/
  max_appended_rows: 5000

backlog:
  cadence: weekly
  strict_pr_candidate:
    expires_after_days: 21
    expires_after_cycles: 3
  human_review_required:
    refresh_after_days: 42
    refresh_after_cycles: 6
  deferred:
    refresh_after_days: 84
    refresh_after_cycles: 12
  rejected:
    suppress_rediscovery_days: 90
  evidence_hash_controls_reclassification: true

blocked_paths:
  - .github/workflows/
  - schemas/
  - docs/catalog-autonomy-policy.md
  - SECURITY.md
  - GOVERNANCE.md
  - MAINTAINERS.md
  - LICENSE
  - .github/CODEOWNERS
  - tools/openva/validate.py
  - tools/openva/automation_rules.py

lanes:
  generated:
    label: automerge:generated
  observation:
    label: automerge:observation
    required_labels:
      - observation-ledger
    execution_wired: true
  machine_canonical:
    label: automerge:machine-canonical
  strict_growth:
    label: automerge:strict-growth
    required_labels:
      - catalog-growth
    execution_wired: true
  p0_source_repair:
    label: automerge:p0-source-repair
    required_labels:
      - source-refinement
  machine_provisional:
    label: automerge:machine-provisional
    required_labels:
      - machine-provisional
    execution_wired: true
  quorum_promotion:
    label: automerge:quorum-promotion
    required_labels:
      - quorum-promotion
    execution_wired: true
  quarantine:
    label: automerge:quarantine
    required_labels:
      - quarantine
    execution_wired: true
  rollback:
    label: automerge:rollback
    required_labels:
      - rollback
    execution_wired: true
