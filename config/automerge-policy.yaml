# OpenVA agent auto-merge policy.
#
# v0.1 ships this policy in report-only mode. The eligibility checker reports
# what would qualify for an autonomous lane, but no workflow merges PRs.
#
# Actual merge activation requires a separate explicit PR updating policy docs,
# workflow permissions, and enforcement mode after calibration criteria are met.

mode: enforce

machine_canonical:
  max_source_records_per_pr: 50

source_repair:
  max_source_records_per_pr: 10

blocked_paths:
  - .github/workflows/
  - schemas/
  - docs/catalog-autonomy-policy.md
  - SECURITY.md
  - GOVERNANCE.md
  - MAINTAINERS.md
  - LICENSE
  - .github/CODEOWNERS
  - tools/openva/validate.py
  - tools/openva/automation_rules.py

lanes:
  generated:
    label: automerge:generated
  observation:
    label: automerge:observation
  machine_canonical:
    label: automerge:machine-canonical
  p0_source_repair:
    label: automerge:p0-source-repair
    required_labels:
      - source-refinement
