schema_version: 0.1.0

source_types:
  - dpa
  - subprocessors_list
  - privacy_notice
  - trust_center
  - security_page
  - compliance_page
  - certification_reference
  - terms_of_service
  - kyc_statement
  - aml_statement
  - ai_terms
  - government_request_policy
  - transparency_report
  - status_page
  - other_public_source

artifact_types:
  - dpa
  - subprocessors_list
  - privacy_notice
  - trust_center
  - security_page
  - compliance_page
  - certification_reference
  - terms_of_service
  - kyc_statement
  - aml_statement
  - ai_terms
  - government_request_policy
  - transparency_report
  - status_page
  - questionnaire_template
  - evidence_request_template
  - other_public_artifact

access_classes:
  - public_web
  - public_pdf
  - public_doc_portal
  - public_landing_gated_docs
  - excluded_non_public

# Tier A: how far content verification reached for a source. landing_page_only
# means the public landing page was content-verified but its gated child
# documents were not (and must not be) inspected. Absent => full_content.
verified_scopes:
  - full_content
  - landing_page_only

# Tier A: durable, structured provenance for why a discovered URL is treated as
# vendor-authorized. Locator discovered != authority proven; authority must be
# reconstructable after eligibility evaluation, not free-text only.
authority_classes:
  - strong
  - corroborating
  - unproven
authority_methods:
  - same_official_domain
  - official_domain_link
  - official_domain_redirect
  - official_vendor_manifest
  - manual_exception
  - cname_corroboration
  - tls_corroboration
# Only strong, content-anchored or governed signals may establish authority on
# their own. CNAME/TLS relationships are corroboration only and never establish
# authority by themselves (dangling-CNAME / forgotten-subdomain takeover risk).
strong_authority_methods:
  - same_official_domain
  - official_domain_link
  - official_domain_redirect
  - official_vendor_manifest
  - manual_exception
corroborating_authority_methods:
  - cname_corroboration
  - tls_corroboration

rights_classes:
  - metadata_only
  - public_link_only
  - snapshot_allowed
  - snapshot_forbidden
  - gated_excluded

review_states:
  - proposed
  - validated
  - auto_validated
  - auto_observed
  - quarantined
  - superseded

catalog_change_significance:
  - low
  - medium
  - high
  - unknown

vendor_statuses:
  - active
  - stub
  - canonical
  - watchlist
  - deprecated
  - quarantined
  # WP36: machine-materialized vendor not yet promoted to active. Carries
  # machine-decision provenance and a reversal reference; promoted to active
  # only through WP37 quorum after a stable observation window.
  - machine_provisional

regulated_vendor_categories:
  - financial_services
  - healthcare
  - government

regulated_legal_terms:
  - bank
  - banking
  - insurance
  - insurer
  - hospital
  - clinic
  - government
  - ministry
