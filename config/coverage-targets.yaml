schema_version: "0.1.0"
# WP34 coverage growth target model. This is a growth-reporting overlay over
# the controlled vendor-category taxonomy (config/category-taxonomy.yaml);
# it never changes vendor records. Growth is measured by completeness and
# freshness, not raw URL count. Weights are editorial, maintainer-tunable
# via reviewed PRs, and every report row records its additive breakdown.
#
# priority = category weight
#          + missing source criticality
#          + business prevalence (wishlist membership)
#          + staleness component

required_source_types:
  - trust_center
  - dpa
  - subprocessors_list
  - privacy_notice
  - security_page
  - status_page

source_type_criticality:
  dpa: 3
  subprocessors_list: 3
  trust_center: 2
  privacy_notice: 2
  security_page: 1
  status_page: 1

staleness_weights:
  fresh: 0
  unknown: 1
  stale: 2
  expired: 3

prevalence_weight: 2

# priority_vendors are maintainer-curated wishlists (public vendor names
# only), seeded from docs/vendor-expansion-backlog.md. Entries are matched
# to the catalog by vendor_id; top-missing-vendors = wishlist entries with
# no materialized vendor record. New vendors enter as candidates through
# the submission/verification model, never as direct writes.
categories:
  cloud:
    weight: 5
    taxonomy_tags: [cloud_infrastructure]
    priority_vendors:
      - {vendor_id: ovhcloud, name: OVHcloud}
      - {vendor_id: scaleway, name: Scaleway}
      - {vendor_id: hetzner, name: Hetzner}
      - {vendor_id: huawei-cloud, name: Huawei Cloud}
      - {vendor_id: kingsoft-cloud, name: Kingsoft Cloud}
      - {vendor_id: naver-cloud, name: NAVER Cloud}
  security:
