[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openva-csv-export"
version = "0.1.0"
description = "CSV export adapter for OpenVA public metadata packs."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
openva-csv-export = "openva_csv_export.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openva_csv_export"]
