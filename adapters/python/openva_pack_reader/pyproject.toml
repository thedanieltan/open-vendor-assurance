[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openva-pack-reader"
version = "0.1.0"
description = "Read-only OpenVA pack reader for public metadata imports."
requires-python = ">=3.11"
license = "MIT"

[tool.hatch.build.targets.wheel]
packages = ["openva_pack_reader"]
