[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openva-sqlite-export"
version = "0.1.0"
description = "SQLite export adapter for OpenVA public metadata packs."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
openva-sqlite-export = "openva_sqlite_export.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openva_sqlite_export"]
