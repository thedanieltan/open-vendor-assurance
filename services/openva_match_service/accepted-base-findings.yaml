# Accepted base-image risk baseline (WP-02E).
#
# The ONLY at/above-threshold image findings the supply-chain gate may pass: exact,
# presently UNFIXABLE vulnerabilities inherited from the reviewed, digest-pinned base
# image. Each entry is matched by the full tuple (id, package, installed_version, severity,
# status) AND the base digest; anything app-introduced, fixable, new, changed, expired, or
# of a non-no-fix status fails closed (openva_match_service.supply_chain
# evaluate_image_vulnerabilities). This is a reviewed artifact — it is changed only by an
# independent PR, never generated/accepted automatically by release-image.
#
# UNKNOWN-severity findings: Trivy reports a severity of UNKNOWN for very recently
# disclosed CVEs that neither NVD nor Debian has scored yet. Such a finding is NOT
# auto-suppressed and NOT auto-blocked — it is attributed exactly like any other inherited
# finding and may be accepted ONLY through an explicit tuple below (severity: unknown). An
# app-introduced, fixable, or unreviewed unknown-severity finding still fails closed, and a
# blanket CVE-id exception can never suppress one. Each unknown-severity entry is an
# individual maintainer judgement that the inherited base CVE is acceptable pending scoring.
#
# Provenance: authored from a Trivy v0.71.2 scan of the pinned base on 2026-06-24
# (Debian 12.14). Every inherited finding below has NO fix available (FixedVersion empty);
# none is suppressed by --ignore-unfixed — the full base and image reports are retained in
# the release evidence. 13 HIGH/CRITICAL + 17 UNKNOWN-severity (util-linux CVE-2026-53613 /
# CVE-2026-53615 across its 8 binary packages, and gpgv CVE-2026-57062). Re-review
# on/before valid_until, by which point upstream should have scored the UNKNOWN entries.
