[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openva-match-service"
version = "0.1.0"
description = "Hosted HTTP match service for OpenVA public metadata packs."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0"
]

[project.scripts]
openva-match-service = "openva_match_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openva_match_service"]
