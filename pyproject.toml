[project]
name = "open-vendor-assurance"
version = "0.1.0"
description = "Public-source-only vendor assurance metadata substrate"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22.0",
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
