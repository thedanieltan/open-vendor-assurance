name: Catalog request

description: Request a new vendor or public artifact metadata record.
title: "Catalog request: "
labels: ["status:needs-triage", "area:catalog", "lane:catalog-agent"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to request a new vendor or public artifact metadata record.

        OpenVA accepts public metadata only. Do not submit private agreements, gated trust-center exports, SOC reports, ISO certificates, screenshots, copied document text, or customer-specific terms.
  - type: input
    id: vendor
    attributes:
      label: Vendor name
      description: Name of the vendor to add or update.
    validations:
      required: true
  - type: textarea
    id: public_sources
    attributes:
      label: Public source URLs
      description: List public vendor-controlled, regulator-controlled, or standards-body-controlled URLs.
      placeholder: |
        - https://vendor.example/legal/dpa
        - https://vendor.example/trust/subprocessors
    validations:
      required: true
  - type: dropdown
    id: artifact_type
    attributes:
      label: Source or artifact type
      options:
        - dpa
        - subprocessors_list
        - privacy_notice
        - trust_center
        - security_page
        - compliance_page
        - certification_reference
        - terms_of_service
        - kyc_statement
        - aml_statement
        - ai_terms
        - government_request_policy
        - transparency_report
        - other_public_source
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The listed sources are public.
          required: true
        - label: The listed sources are not gated, private, customer-specific, or bespoke.
          required: true
        - label: The listed sources do not require login, NDA, sales approval, customer status, support ticket access, form submission, private portal access, or anti-bot bypass.
          required: true
        - label: This request does not ask OpenVA to conclude that a vendor is compliant, safe, recommended, suitable, adequate, approved, low risk, or high risk.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add factual notes only. Do not include advice, ranking, scoring, or endorsement language.
    validations:
      required: false
