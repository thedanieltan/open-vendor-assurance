name: New vendor candidate

description: Use this when proposing a vendor that is not yet in the OpenVA catalog. Do not use this to add a source to an existing vendor or to correct existing records. If unsure, use New assurance source.
title: "Vendor candidate: "
labels: ["status:needs-triage", "submission:new-vendor"]
body:
  - type: markdown
    attributes:
      value: |
        This submission is a claim, not a catalog change. It enters verification before any catalog update. OpenVA records public source metadata and provenance, not legal conclusions.

        Submit public sources only. Do not upload confidential reports. Do not paste SOC reports, DPA contents, customer portal content, screenshots, copied document text, credentials, or any non-public document. If a source is gated, mark it as gated below; OpenVA records that a gated source exists, never its contents.
  - type: input
    id: vendor_name
    attributes:
      label: Vendor name
      description: The vendor's current public name.
      placeholder: Example Vendor
    validations:
      required: true
  - type: input
    id: vendor_domain
    attributes:
      label: Vendor domain
      description: The vendor's primary official domain.
      placeholder: vendor.example
    validations:
      required: true
  - type: input
    id: vendor_legal_name
    attributes:
      label: Vendor legal name
      description: Optional. The vendor's legal entity name, if publicly stated.
    validations:
      required: false
  - type: input
    id: headquarters_country
    attributes:
      label: Headquarters country
      description: Optional. Two-letter country code, if publicly stated.
      placeholder: US
    validations:
      required: false
  - type: textarea
    id: known_public_sources
    attributes:
      label: Known public assurance source URLs
      description: Optional. Public vendor-controlled assurance URLs you already know (trust center, DPA page, subprocessors list, privacy notice, security page).
      placeholder: |
        - https://vendor.example/trust
        - https://vendor.example/legal/dpa
    validations:
      required: false
  - type: textarea
    id: why_this_is_authoritative
    attributes:
      label: Why this is authoritative
      description: Why the listed domain and any listed URLs are the vendor's official public surface.
    validations:
      required: true
  - type: dropdown
    id: public_access_confirmed
    attributes:
      label: Public access confirmed
      description: Are the listed domain and URLs publicly reachable?
      options:
        - Yes - public, no login, paywall, or bot-wall
        - No - gated or restricted (mark as gated)
    validations:
      required: true
  - type: dropdown
    id: machine_readable_surface
    attributes:
      label: Machine-readable surface
      description: Does the vendor expose a machine-readable surface for assurance content? Contributor-facing shorthand; verification classifies the exact retrieval method later.
      options:
        - none
        - rss
        - sitemap
        - llms_txt
        - openapi
        - mcp
        - api
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: public_source_checks
    attributes:
      label: Public-source checks
      options:
        - label: I am not submitting private customer agreements, bespoke terms, customer portal exports, private trust-center documents, private reports, private certificates, screenshots, copied full text, or login-only documents.
          required: true
        - label: If a listed source requires login, credentials, NDA, customer status, sales approval, support ticket access, private portal access, form submission, or anti-bot bypass, I have marked it as gated in the public access field above.
          required: true
  - type: checkboxes
    id: non_advisory_checks
    attributes:
      label: Non-advisory checks
      options:
        - label: This submission does not claim the vendor is approved, recommended, compliant, suitable, safe, adequate, trusted, best-in-class, audit-ready, certified for a user's use case, low risk, or high risk.
          required: true
        - label: This submission is factual public metadata only.
          required: true
  - type: checkboxes
    id: claim_checks
    attributes:
      label: Claim checks
      options:
        - label: I checked the existing catalog and open submissions for a duplicate.
          required: true
        - label: I understand this is a claim that enters verification, not a direct catalog change.
          required: true
  - type: textarea
    id: submitter_notes
    attributes:
      label: Submitter notes
      description: Optional factual context for maintainers. Do not paste private, gated, customer-specific, or copied document text.
    validations:
      required: false
