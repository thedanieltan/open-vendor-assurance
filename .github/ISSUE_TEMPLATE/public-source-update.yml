name: Public source update
description: Submit a factual update to public vendor-source metadata
title: "Public source update: "
labels: ["public-source-update", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest factual updates to public vendor-controlled source metadata. OpenVA does not collect private, gated, bespoke, NDA, customer-portal, or login-only materials.
  - type: input
    id: vendor
    attributes:
      label: Vendor name
      description: Vendor legal or commonly used name.
    validations:
      required: true
  - type: input
    id: submitter_role
    attributes:
      label: Submitter role
      description: Vendor staff, vendor representative, customer, researcher, consultant, contributor, or other.
    validations:
      required: true
  - type: input
    id: public_url
    attributes:
      label: Public source URL
      description: Public URL to add, correct, move, retire, or review.
    validations:
      required: true
  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - trust_center
        - security_page
        - dpa
        - subprocessors_list
        - privacy_notice
        - ai_terms
        - data_residency
        - legal_terms
        - public_changelog
        - other_public_source
    validations:
      required: true
  - type: dropdown
    id: update_type
    attributes:
      label: Update type
      options:
        - Add public source
        - Correct public source URL
        - Source moved
        - Source retired
        - Correct title or language metadata
        - Correct source type
        - Correct public version or date metadata
        - Other factual metadata correction
    validations:
      required: true
  - type: textarea
    id: update_summary
    attributes:
      label: Factual update summary
      description: Describe the factual metadata update. Do not include legal, compliance, procurement, security, KYC, AML, or risk advice.
    validations:
      required: true
  - type: checkboxes
    id: public_boundary
    attributes:
      label: Public-source boundary
      options:
        - label: The source is accessible without login, credentials, NDA, customer status, sales approval, support ticket access, private portal access, form submission, or anti-bot bypass.
          required: true
        - label: I am not submitting private customer agreements, bespoke terms, customer portal exports, private trust-center documents, private reports, private certificates, or login-only documents.
          required: true
  - type: checkboxes
    id: non_advisory_boundary
    attributes:
      label: Non-advisory boundary
      options:
        - label: This update does not claim the vendor is approved, recommended, compliant, suitable, safe, adequate, low risk, audit-ready, or certified for a user's use case.
          required: true
        - label: This update is factual public metadata only.
          required: true
  - type: checkboxes
    id: anti_bot_boundary
    attributes:
      label: Anti-bot and access-control boundary
      options:
        - label: I understand OpenVA does not bypass anti-bot systems, CAPTCHAs, login gates, private portals, form gates, or access controls.
          required: true
