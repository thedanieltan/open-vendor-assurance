name: Scope or boundary question

description: Ask whether a source, request, or contribution is in scope before submitting data.
title: "Scope question: "
labels: ["status:needs-triage", "area:governance", "scope:public-source-only"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when you are unsure whether a source, request, or contribution is in scope for OpenVA.

        OpenVA does not provide legal, compliance, procurement, security, KYC, AML, vendor-risk, or due-diligence advice.

        Do not paste private, gated, customer-specific, NDA, portal, SOC report, ISO certificate, credential, token, or sensitive content into this issue.
  - type: dropdown
    id: request_type
    attributes:
      label: What are you checking?
      options:
        - Public vs gated source
        - Vendor-controlled or authoritative source
        - Native-language or translation boundary
        - Rights or redistribution boundary
        - Advisory wording boundary
        - Artifact type boundary
        - Legal or compliance interpretation request
        - Procurement or vendor recommendation request
        - Vendor risk scoring request
        - Private or customer-specific material request
        - Bot-protection or access-control bypass request
        - Other scope boundary
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: Public URL under consideration, if any.
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask the scope or boundary question without including private, gated, sensitive, or customer-specific materials.
    validations:
      required: true
  - type: checkboxes
    id: private_materials
    attributes:
      label: Sensitive material check
      options:
        - label: I have not included private, gated, customer-specific, NDA, portal, credential, token, SOC report, ISO certificate, or sensitive content in this issue.
          required: true
        - label: I understand OpenVA does not bypass anti-bot systems, CAPTCHAs, login gates, private portals, form gates, or access controls.
          required: true
