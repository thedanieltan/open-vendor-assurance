name: Vendor-submitted public metadata update
description: Submit a factual public-source update for a vendor record
title: "Vendor update: "
labels: ["vendor-update", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for factual public-source metadata updates only. Do not submit private, gated, bespoke, NDA, customer-portal, or sales-only material.
  - type: input
    id: vendor
    attributes:
      label: Vendor name
      description: Vendor legal or commonly used name.
    validations:
      required: true
  - type: input
    id: submitter_affiliation
    attributes:
      label: Submitter affiliation
      description: State whether you are vendor staff, vendor representative, customer, researcher, consultant, or other.
    validations:
      required: true
  - type: input
    id: public_source_url
    attributes:
      label: Public source URL
      description: The public URL to add, correct, or deprecate.
    validations:
      required: true
  - type: dropdown
    id: update_type
    attributes:
      label: Update type
      options:
        - Add public source
        - Correct public source URL
        - Deprecate moved or retired public source
        - Correct vendor metadata
        - Correct official domain
        - Correct source language
        - Other factual metadata correction
    validations:
      required: true
  - type: checkboxes
    id: public_checks
    attributes:
      label: Public-source checks
      options:
        - label: The source is accessible without login, credentials, NDA, customer status, sales approval, support ticket access, private portal access, or anti-bot bypass.
          required: true
        - label: I am not submitting private customer agreements, bespoke terms, customer portal exports, private trust-center documents, private reports, or private certificates.
          required: true
  - type: checkboxes
    id: non_advisory_checks
    attributes:
      label: Non-advisory and non-promotional checks
      options:
        - label: This update does not claim the vendor is compliant, safe, adequate, suitable, approved, recommended, trusted, best-in-class, or low risk.
          required: true
        - label: This update is factual metadata only.
          required: true
