name: Broken or moved source

description: Use this when an existing OpenVA-cataloged source URL is broken, moved, gated, or retired. Do not use this to propose new sources or vendors. If unsure, use New assurance source.
title: "Broken source: "
labels: ["status:needs-triage", "submission:broken-source"]
body:
  - type: markdown
    attributes:
      value: |
        This submission is a claim, not a catalog change. It enters verification before any catalog update. OpenVA records public source metadata and provenance, not legal conclusions.

        Submit public sources only. Do not upload confidential reports. Do not paste SOC reports, DPA contents, customer portal content, screenshots, copied document text, credentials, or any non-public document. If a source is gated, mark it as gated below; OpenVA records that a gated source exists, never its contents.
  - type: input
    id: vendor_name
    attributes:
      label: Vendor name
      description: The vendor's current public name.
      placeholder: Example Vendor
    validations:
      required: true
  - type: input
    id: vendor_domain
    attributes:
      label: Vendor domain
      description: The vendor's primary official domain.
      placeholder: vendor.example
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Existing source URL or OpenVA source ID
      description: The cataloged source URL or OpenVA source ID that is broken, moved, gated, or retired.
      placeholder: https://vendor.example/legal/dpa or example-vendor-dpa
    validations:
      required: true
  - type: dropdown
    id: observed_state
    attributes:
      label: Observed state
      description: What you observed when accessing the source.
      options:
        - Moved - redirects or relocated to a new URL
        - Gated - now requires login or restricted access
        - Broken - unreachable or page removed
        - Retired - vendor withdrew the page
        - Unsure
    validations:
      required: true
  - type: input
    id: replacement_url
    attributes:
      label: Replacement URL
      description: Optional. The new public URL, if the source moved.
      placeholder: https://vendor.example/trust/dpa
    validations:
      required: false
  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      description: Optional. The kind of assurance source affected, if you know it.
      options:
        - dpa
        - subprocessors_list
        - privacy_notice
        - trust_center
        - security_page
        - compliance_page
        - certification_reference
        - terms_of_service
        - kyc_statement
        - aml_statement
        - ai_terms
        - government_request_policy
        - transparency_report
        - other_public_source
    validations:
      required: false
  - type: textarea
    id: why_this_is_authoritative
    attributes:
      label: Why this is authoritative
      description: Optional. If you provided a replacement URL, why it is the vendor's official public location.
    validations:
      required: false
  - type: dropdown
    id: public_access_confirmed
    attributes:
      label: Public access confirmed
      description: Is the replacement or current working URL publicly reachable?
      options:
        - Yes - public, no login, paywall, or bot-wall
        - No - gated or restricted (mark as gated)
        - Not applicable - reporting breakage only
    validations:
      required: true
  - type: checkboxes
    id: public_source_checks
    attributes:
      label: Public-source checks
      options:
        - label: I am not submitting private customer agreements, bespoke terms, customer portal exports, private trust-center documents, private reports, private certificates, screenshots, copied full text, or login-only documents.
          required: true
        - label: If a listed source requires login, credentials, NDA, customer status, sales approval, support ticket access, private portal access, form submission, or anti-bot bypass, I have marked it as gated in the public access field above.
          required: true
  - type: checkboxes
    id: non_advisory_checks
    attributes:
      label: Non-advisory checks
      options:
        - label: This submission does not claim the vendor is approved, recommended, compliant, suitable, safe, adequate, trusted, best-in-class, audit-ready, certified for a user's use case, low risk, or high risk.
          required: true
        - label: This submission is factual public metadata only.
          required: true
  - type: checkboxes
    id: claim_checks
    attributes:
      label: Claim checks
      options:
        - label: I checked the existing catalog and open submissions for a duplicate.
          required: true
        - label: I understand this is a claim that enters verification, not a direct catalog change.
          required: true
  - type: textarea
    id: submitter_notes
    attributes:
      label: Submitter notes
      description: Optional factual context for maintainers. Do not paste private, gated, customer-specific, or copied document text.
    validations:
      required: false
