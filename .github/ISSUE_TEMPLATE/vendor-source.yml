name: Vendor public source request
description: Suggest a public vendor assurance source for OpenVA
title: "Vendor source: "
labels: ["vendor-source", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for public vendor-published or standards-body-published sources. Do not submit private, gated, NDA, portal-only, customer-specific, or bespoke materials.
  - type: input
    id: vendor
    attributes:
      label: Vendor name
      description: Legal or commonly used vendor name.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Public source URL
      description: The public URL to the vendor-published assurance source.
    validations:
      required: true
  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - DPA
        - Subprocessor list
        - Privacy notice
        - Trust center
        - Security page
        - Compliance page
        - Certification reference
        - KYC / AML statement
        - AI / data terms
        - Other public source
    validations:
      required: true
  - type: input
    id: source_language
    attributes:
      label: Source language
      placeholder: en, zh-CN, ja, de, fr, etc.
    validations:
      required: true
  - type: checkboxes
    id: public_source_checks
    attributes:
      label: Public-source checks
      options:
        - label: The source is accessible without login or credentials.
          required: true
        - label: The source does not require NDA, customer status, sales approval, support ticket access, or private portal access.
          required: true
        - label: I am not submitting private, bespoke, gated, or customer-specific material.
          required: true
  - type: checkboxes
    id: non_advisory_checks
    attributes:
      label: Non-advisory checks
      options:
        - label: This request does not claim the vendor is compliant, safe, approved, adequate, suitable, or recommended.
          required: true
        - label: This request is for factual metadata only.
          required: true
