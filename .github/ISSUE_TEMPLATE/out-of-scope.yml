name: Out-of-scope request

description: Use when you are unsure whether your request is outside OpenVA scope.
title: "Out-of-scope check: "
labels: ["status:needs-triage", "scope:out-of-scope"]
body:
  - type: markdown
    attributes:
      value: |
        OpenVA does not provide legal, compliance, procurement, security, KYC, AML, vendor-risk, or due-diligence advice.

        OpenVA does not collect private, gated, customer-specific, NDA, login-required, portal, SOC report, ISO certificate, or bespoke agreement materials.
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - Legal or compliance interpretation
        - Procurement or vendor recommendation
        - Vendor risk scoring
        - Private or gated material handling
        - Customer-specific agreement handling
        - Bot-protection or access-control bypass
        - Other possible out-of-scope request
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request summary
      description: Describe the request without including private or gated materials.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included private, gated, customer-specific, NDA, login-required, portal, credential, token, SOC report, ISO certificate, or sensitive content in this issue.
          required: true
