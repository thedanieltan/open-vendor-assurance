name: source-completion-finalize-diagnostic

on:
  pull_request:
    branches:
      - catalog/source-completion-final-control-v2
    types: [opened, synchronize, reopened]

permissions:
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'catalog/source-completion-final-diagnostic-trigger'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      JOB_ID: '86917885358'
    steps:
      - name: Print workflow failure signal
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/job.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          tokens = ('error', 'failed', 'failure', 'rejected', 'conflict', 'expected install', 'remote:', 'fatal:', 'workflow', 'permission', 'denied')
          print('DIAGNOSTIC_BEGIN')
          for line in lines:
              if any(token in line.lower() for token in tokens):
                  print(line)
          print('LOG_TAIL_BEGIN')
          for line in lines[-220:]:
              print(line)
          print('LOG_TAIL_END')
          print('DIAGNOSTIC_END')
          PY
