name: source-completion-finalize-diagnostic

on:
  pull_request:
    branches:
      - catalog/source-completion-final-control-v2
    types: [opened, synchronize, reopened]

permissions:
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'catalog/source-completion-final-diagnostic-trigger-v2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      JOB_ID: '86925993113'
    steps:
      - name: Print latest release or test failure
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/job.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          tokens = (
              '##[error]', 'process completed with exit code', 'release gate', 'failed', 'failure',
              'short test summary', 'assertionerror', 'traceback', 'error:', 'drift', 'diff -u',
              'generated-before', 'generated-after', 'review_required', 'source_observation',
          )
          selected = set()
          for index, line in enumerate(lines):
              lower = line.lower()
              if any(token in lower for token in tokens):
                  selected.update(range(max(0, index - 6), min(len(lines), index + 12)))
          print('LATEST_ACCEPTANCE_DIAGNOSTIC_BEGIN')
          for index in sorted(selected):
              print(lines[index])
          print('LATEST_ACCEPTANCE_LOG_TAIL_BEGIN')
          for line in lines[-250:]:
              print(line)
          print('LATEST_ACCEPTANCE_LOG_TAIL_END')
          print('LATEST_ACCEPTANCE_DIAGNOSTIC_END')
          PY
