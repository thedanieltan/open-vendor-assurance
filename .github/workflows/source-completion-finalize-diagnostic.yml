name: source-completion-finalize-diagnostic

on:
  pull_request:
    branches:
      - catalog/source-completion-final-control-v2
    types: [opened, synchronize, reopened]

permissions:
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'catalog/source-completion-final-diagnostic-trigger-v2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      JOB_ID: '86925993113'
    steps:
      - name: Print blocking release gate
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/job.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          hits = [index for index, line in enumerate(lines) if '## Blocking failures' in line]
          start = hits[-1] if hits else max(0, len(lines) - 500)
          segment = lines[start:start + 180]
          print('BLOCKING_RELEASE_GATE_BEGIN')
          for line in segment:
              print(line)
          print('FAILED_TABLE_ROWS_BEGIN')
          for line in lines:
              lower = line.lower()
              if '| ' in line and ('| fail |' in lower or '| blocked |' in lower):
                  print(line)
          print('FAILED_TABLE_ROWS_END')
          print('BLOCKING_RELEASE_GATE_END')
          PY
