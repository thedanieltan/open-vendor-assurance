name: source-completion-finalize-diagnostic

on:
  pull_request:
    branches:
      - catalog/source-completion-final-control-v2
    types: [opened, synchronize, reopened]

permissions:
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'catalog/source-completion-final-diagnostic-trigger'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      JOB_ID: '86917172773'
    steps:
      - name: Print finalizer failure signal
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/finalizer.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/finalizer.log').read_text(encoding='utf-8', errors='replace').splitlines()
          signal = []
          for line in lines:
              lower = line.lower()
              if any(token in lower for token in (
                  'requires a live canonical source',
                  'live core groups',
                  'unresolved groups',
                  'removed_poisoned_sources',
                  'added_privacy_sources',
                  'failure_count',
                  'airwallex',
                  'microsoft-azure',
                  'netsuite',
                  'runtimeerror',
                  'traceback',
                  'systemexit',
                  'error',
              )):
                  signal.append(line)
          print('FINALIZER_DIAGNOSTIC_BEGIN')
          for line in signal[-500:]:
              print(line)
          print('FINALIZER_LOG_TAIL_BEGIN')
          for line in lines[-250:]:
              print(line)
          print('FINALIZER_LOG_TAIL_END')
          print('FINALIZER_DIAGNOSTIC_END')
          PY
