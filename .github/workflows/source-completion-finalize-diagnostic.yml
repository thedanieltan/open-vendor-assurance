name: source-completion-finalize-diagnostic

on:
  pull_request:
    branches:
      - catalog/source-completion-final-control-v2
    types: [opened, synchronize, reopened]

permissions:
  actions: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'catalog/source-completion-final-diagnostic-trigger-v2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      JOB_ID: '86923195846'
    steps:
      - name: Print final acceptance step output
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/job.log
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace').splitlines()
          needles = (
              'python -m tools.openva.validate validate',
              'python -m tools.openva.release_gates check --profile pr',
              'pytest -q tests/test_catalog',
          )
          starts = [index for index, line in enumerate(lines) if any(needle in line for needle in needles)]
          start = max(0, min(starts) - 8) if starts else max(0, len(lines) - 400)
          print('FINAL_ACCEPTANCE_STEP_BEGIN')
          for line in lines[start:]:
              print(line)
          print('FINAL_ACCEPTANCE_STEP_END')
          PY
