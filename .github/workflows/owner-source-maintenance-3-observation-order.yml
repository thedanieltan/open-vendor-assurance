name: owner-source-maintenance-3-observation-order

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-observation-order
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Sort latest observations by canonical key
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('maintenance/source-observations/latest-observations.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          sources = list(payload.get('sources') or [])
          sources.sort(key=lambda row: (str(row.get('vendor_id') or ''), str(row.get('source_id') or '')))
          payload['sources'] = sources
          summary = dict(payload.get('summary') or {})
          summary['source_count'] = len(sources)
          payload['summary'] = summary
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'source_count': len(sources),
              'first_key': [sources[0].get('vendor_id'), sources[0].get('source_id')] if sources else None,
              'last_key': [sources[-1].get('vendor_id'), sources[-1].get('source_id')] if sources else None,
          }, indent=2, sort_keys=True))
          PY
      - name: Validate repaired release-gate state
        run: |
          set -euo pipefail
          python -m tools.openva.validate validate
          python -m tools.openva.catalog_audit audit --enforce
          python -m tools.openva.release_gates check --profile pr \
            --out-json /tmp/release-gates.json \
            --out-md /tmp/release-gates.md
          pytest -q \
            tests/test_catalog_guard.py \
            tests/test_generated_exports.py \
            tests/test_observation_ledger.py \
            tests/test_catalog_audit.py
          git diff --check
      - name: Commit repaired projection and remove diagnostics
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/owner-source-maintenance-3-observation-order.yml \
            maintenance/reviewed/owner-source-maintenance-3-release-gates.log
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: sort merged observation projection canonically [owner-maintenance-3-observations-sorted]'
          git push
