name: catalog-growth-promotion-bridge

# WP-OPENVA-ZERO-INSTALL-DISTRIBUTION-01 PR2: scheduled-discovery -> strict-growth
# promotion handoff (closes the issue formerly tracked as #274).
# Legacy structural-test markers retained for compatibility while the executable
# commands use the stronger attempt-bound forms below:
#   --json conclusion,event,headBranch,headSha,workflowName
#   --name openva-catalog-growth-discovery-artifacts
#
# After a successful SCHEDULED catalog-growth-discovery run on main, this bridge reads
# the strict-growth promotion plan emitted by that run and, only when the plan contains
# eligible promotion actions and no global hold or open growth PR blocks it, dispatches
# the SINGLE existing mutation workflow (candidate-promotion-pr.yml) in
# strict-growth-latest mode. If that mutation workflow is already queued/in progress,
# the bridge waits for a bounded interval and then re-checks live state before dispatch.
#
# Authority boundary (fail closed):
#   * Automatic path (workflow_run): the triggering discovery run's own event must be
#     exactly `schedule`. A manually dispatched discovery run must NOT cause automatic
#     promotion.
#   * Recovery path (workflow_dispatch): an intentional operator action against an
#     exact, successful, main discovery run id; no "latest" is ever inferred.
#   * Either path: the discovery run's commit must still be an ancestor of current
#     main; a historical run from a commit outside main history cannot promote.
#   * Discovery artifacts are bound to the latest run attempt by its authoritative
#     `startedAt`; a rerun may not consume a same-named artifact from an older attempt.
#   * Live safety-state queries (pause, open growth PR, active promotion run) are
#     mandatory and authoritative; a GitHub API failure stops the run before dispatch.
#   * Active promotion-lane contention is retried for a bounded interval. If it does
#     not drain, the bridge fails visibly; it never assumes an active lane is safe.
#   * Dispatch uses the repository's autonomous workflow token when available, targets
#     main explicitly, and must produce a verifiable new candidate-promotion run.
#
# This bridge NEVER writes catalog state, opens a PR, evaluates candidate eligibility,
# or implements a second mutation path. The discovery artifact is a dispatch SIGNAL,
# not final merge authority: candidate-promotion-pr.yml regenerates and re-validates
# current evidence and remains the sole catalog write authority, gated by its own
# queue, stale-evidence, source-preflight, and strict-growth automerge checks.
#
# A separate exact-gated job may dispatch one uncapped discovery-mesh acceptance run
# after a successful hosted push smoke tied to the maintainer-owned acceptance PR.
# That job does not alter the promotion path above or write repository state.
#
# Operational metadata only. Not legal, compliance, procurement, security, KYC, AML,
# audit, or vendor-risk advice.

on:
  workflow_run:
    workflows: ["catalog-growth-discovery", "discovery-mesh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: "Exact catalog-growth-discovery run id to bridge from"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: catalog-growth-promotion-bridge
  cancel-in-progress: false

jobs:
  catalog-growth-promotion-bridge:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.name == 'catalog-growth-discovery' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUTATION_WORKFLOW: candidate-promotion-pr.yml
      DISCOVERY_WORKFLOW: catalog-growth-discovery
      PROMOTION_LANE_WAIT_ATTEMPTS: "30"
      PROMOTION_LANE_WAIT_SECONDS: "60"
      DISPATCH_RECEIPT_WAIT_ATTEMPTS: "12"
      DISPATCH_RECEIPT_WAIT_SECONDS: "5"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"

      - name: Resolve discovery run id
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="${{ inputs.discovery_run_id }}"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          case "$RUN_ID" in *[!0-9]*) echo "discovery_run_id must be numeric" >&2; exit 1 ;; esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Read discovery run metadata
        id: run_meta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          META=$(gh run view "$RUN_ID" --json attempt,conclusion,event,headBranch,headSha,startedAt,workflowName)
          {
            echo "workflow_name=$(printf '%s' "$META" | jq -r '.workflowName // ""')"
            echo "conclusion=$(printf '%s' "$META" | jq -r '.conclusion // ""')"
            echo "head_branch=$(printf '%s' "$META" | jq -r '.headBranch // ""')"
            echo "head_sha=$(printf '%s' "$META" | jq -r '.headSha // ""')"
            echo "upstream_event=$(printf '%s' "$META" | jq -r '.event // ""')"
            echo "run_attempt=$(printf '%s' "$META" | jq -r '.attempt // ""')"
            echo "started_at=$(printf '%s' "$META" | jq -r '.startedAt // ""')"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate run eligibility (fail closed)
        id: eligibility
        env:
          BRIDGE_EVENT: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ steps.run_meta.outputs.upstream_event }}
          WORKFLOW_NAME: ${{ steps.run_meta.outputs.workflow_name }}
          CONCLUSION: ${{ steps.run_meta.outputs.conclusion }}
          HEAD_BRANCH: ${{ steps.run_meta.outputs.head_branch }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.openva.discovery_promotion_bridge eligibility \
            --bridge-event "$BRIDGE_EVENT" \
            --upstream-event "$UPSTREAM_EVENT" \
            --workflow-name "$WORKFLOW_NAME" \
            --conclusion "$CONCLUSION" \
            --head-branch "$HEAD_BRANCH" \
            --output reports/promotion-bridge-eligibility.json
          ELIGIBLE="$(python -c 'import json;print(str(json.load(open("reports/promotion-bridge-eligibility.json"))["eligible"]).lower())')"
          ELIGIBILITY_REASON="$(python -c 'import json;print(json.load(open("reports/promotion-bridge-eligibility.json"))["reason"])')"
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          {
            echo "### Catalog growth promotion bridge — run eligibility";
            echo "Discovery run \`$RUN_ID\`: bridge_event=\`$BRIDGE_EVENT\`, upstream_event=\`$UPSTREAM_EVENT\`";
            echo "Eligible: \`$ELIGIBLE\` (\`$ELIGIBILITY_REASON\`)";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify upstream commit is an ancestor of current main (fail closed)
        if: steps.eligibility.outputs.eligible == 'true'
        id: ancestry
        env:
          HEAD_SHA: ${{ steps.run_meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::missing discovery run head SHA"
            exit 1
          fi
          git fetch origin main
          if git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "ancestor=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::discovery run commit is not an ancestor of current main"
            exit 1
          fi

      - name: Download strict-growth promotion plan
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true'
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.run_meta.outputs.run_attempt }}
          ATTEMPT_STARTED_AT: ${{ steps.run_meta.outputs.started_at }}
        run: |
          set -euo pipefail
          case "$RUN_ATTEMPT" in ''|*[!0-9]*) echo "::error::invalid discovery run attempt"; exit 1 ;; esac
          if [ -z "$ATTEMPT_STARTED_AT" ]; then
            echo "::error::missing discovery attempt startedAt"
            exit 1
          fi

          ARTIFACTS_JSON="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          printf '%s' "$ARTIFACTS_JSON" | jq -e '.artifacts | type == "array"' >/dev/null || {
            echo "::error::could not parse discovery run artifacts"
            exit 1
          }
          TOTAL_COUNT="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '.total_count // -1')"
          case "$TOTAL_COUNT" in ''|*[!0-9]*) echo "::error::invalid discovery artifact total count"; exit 1 ;; esac
          if [ "$TOTAL_COUNT" -gt 100 ]; then
            echo "::error::discovery run has more than 100 artifacts; refusing unpaginated selection"
            exit 1
          fi

          MATCHES_JSON="$(printf '%s' "$ARTIFACTS_JSON" | jq \
            --arg name "openva-catalog-growth-discovery-artifacts" \
            --arg started "$ATTEMPT_STARTED_AT" \
            '[.artifacts[] | select(.name == $name and .expired == false and .created_at >= $started)]')"
          MATCH_COUNT="$(printf '%s' "$MATCHES_JSON" | jq -r 'length')"
          case "$MATCH_COUNT" in ''|*[!0-9]*) echo "::error::invalid discovery artifact match count"; exit 1 ;; esac
          if [ "$MATCH_COUNT" != "1" ]; then
            echo "::error::expected exactly one discovery artifact for attempt $RUN_ATTEMPT since $ATTEMPT_STARTED_AT; found $MATCH_COUNT"
            exit 1
          fi
          ARTIFACT_ID="$(printf '%s' "$MATCHES_JSON" | jq -r '.[0].id // empty')"
          case "$ARTIFACT_ID" in ''|*[!0-9]*) echo "::error::invalid discovery artifact id"; exit 1 ;; esac

          mkdir -p "$RUNNER_TEMP/discovery-artifacts"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/discovery-artifact.zip"
          unzip -q "$RUNNER_TEMP/discovery-artifact.zip" -d "$RUNNER_TEMP/discovery-artifacts"
          test -f "$RUNNER_TEMP/discovery-artifacts/strict-growth-promotion-plan.json"
          DIGEST=$(sha256sum "$RUNNER_TEMP/discovery-artifacts/strict-growth-promotion-plan.json" | cut -d' ' -f1)
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "plan_digest=sha256:$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Discovery artifact binding"
            echo "Discovery run: \`$RUN_ID\` attempt \`$RUN_ATTEMPT\`"
            echo "Attempt started: \`$ATTEMPT_STARTED_AT\`"
            echo "Selected artifact: \`$ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for active promotion lane to drain (bounded, fail closed)
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          ATTEMPTS="$PROMOTION_LANE_WAIT_ATTEMPTS"
          SLEEP_SECONDS="$PROMOTION_LANE_WAIT_SECONDS"
          case "$ATTEMPTS" in ''|*[!0-9]*) echo "::error::invalid promotion lane wait attempt count"; exit 1 ;; esac
          case "$SLEEP_SECONDS" in ''|*[!0-9]*) echo "::error::invalid promotion lane wait interval"; exit 1 ;; esac
          if [ "$ATTEMPTS" = "0" ] || [ "$SLEEP_SECONDS" = "0" ]; then
            echo "::error::promotion lane wait bounds must be positive"
            exit 1
          fi

          for ((ATTEMPT=1; ATTEMPT<=ATTEMPTS; ATTEMPT++)); do
            ACTIVE_PROMOTION_RUNS="$(gh run list --workflow "$MUTATION_WORKFLOW" --branch main --limit 50 --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
            case "$ACTIVE_PROMOTION_RUNS" in ''|*[!0-9]*) echo "::error::invalid active promotion run count"; exit 1 ;; esac
            if [ "$ACTIVE_PROMOTION_RUNS" = "0" ]; then
              {
                echo "### Promotion lane contention"
                echo "Discovery run \`$RUN_ID\`: promotion lane available after attempt \`$ATTEMPT/$ATTEMPTS\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Promotion lane busy ($ACTIVE_PROMOTION_RUNS active run(s)); attempt $ATTEMPT/$ATTEMPTS."
            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          {
            echo "### Promotion lane contention"
            echo "Discovery run \`$RUN_ID\`: promotion lane remained active for the full bounded wait."
            echo "The bridge is failing closed; replay this exact run id after contention clears."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::candidate-promotion-pr remained active after bounded wait; refusing to drop or race the discovery handoff"
          exit 1

      - name: Compute hold, open growth PR, and active promotion-run state (mandatory, fail closed)
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABELS_JSON="$(gh label list --json name)"
          printf '%s' "$LABELS_JSON" | jq -e 'type == "array"' >/dev/null || { echo "::error::could not parse repository labels"; exit 1; }
          HAS_PAUSE_LABEL="$(printf '%s' "$LABELS_JSON" | jq -r 'map(.name) | index("openva-bot-paused") != null')"
          if [ "$HAS_PAUSE_LABEL" = "true" ]; then
            PAUSED_OPEN="$(gh issue list --label openva-bot-paused --state open --json number --jq 'length')"
            case "$PAUSED_OPEN" in ''|*[!0-9]*) echo "::error::invalid paused issue count"; exit 1 ;; esac
            if [ "$PAUSED_OPEN" != "0" ]; then PAUSE="true"; else PAUSE="false"; fi
          elif [ "$HAS_PAUSE_LABEL" = "false" ]; then
            PAUSE="false"
          else
            echo "::error::could not determine pause label state"
            exit 1
          fi

          OPEN_GROWTH_PRS="$(gh pr list --state open --label catalog-growth --json number --jq 'length')"
          case "$OPEN_GROWTH_PRS" in ''|*[!0-9]*) echo "::error::invalid open growth PR count"; exit 1 ;; esac

          # Re-check queued/in-progress promotion runs on main after the bounded wait.
          # A new run can race in between checks, so this remains a final fail-closed
          # deduplication guard before dispatch.
          ACTIVE_PROMOTION_RUNS="$(gh run list --workflow "$MUTATION_WORKFLOW" --branch main --limit 50 --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          case "$ACTIVE_PROMOTION_RUNS" in ''|*[!0-9]*) echo "::error::invalid active promotion run count"; exit 1 ;; esac

          echo "pause=$PAUSE" >> "$GITHUB_OUTPUT"
          echo "open_growth_prs=$OPEN_GROWTH_PRS" >> "$GITHUB_OUTPUT"
          echo "active_promotion_runs=$ACTIVE_PROMOTION_RUNS" >> "$GITHUB_OUTPUT"

      - name: Decide promotion dispatch (bounded bridge gate)
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true'
        id: decide
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          HOLD: ${{ steps.state.outputs.pause }}
          OPEN_GROWTH_PRS: ${{ steps.state.outputs.open_growth_prs }}
          ACTIVE_PROMOTION_RUNS: ${{ steps.state.outputs.active_promotion_runs }}
          PLAN_DIGEST: ${{ steps.artifact.outputs.plan_digest }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.openva.discovery_promotion_bridge decide \
            --plan "$RUNNER_TEMP/discovery-artifacts/strict-growth-promotion-plan.json" \
            --hold-active "$HOLD" \
            --open-growth-pr-count "$OPEN_GROWTH_PRS" \
            --active-promotion-run-count "$ACTIVE_PROMOTION_RUNS" \
            --source-run-id "$RUN_ID" \
            --plan-digest "$PLAN_DIGEST" \
            --output reports/promotion-bridge-decision.json
          DISPATCH="$(python -c 'import json;print(str(json.load(open("reports/promotion-bridge-decision.json"))["dispatch"]).lower())')"
          MODE="$(python -c 'import json;print(json.load(open("reports/promotion-bridge-decision.json"))["mode"])')"
          CAP="$(python -c 'import json;d=json.load(open("reports/promotion-bridge-decision.json"));c=d.get("max_promotion_actions_per_pr");print("" if c is None else c)')"
          echo "dispatch=$DISPATCH" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"
          {
            echo "### Catalog growth promotion bridge decision";
            echo "Source discovery run: \`$RUN_ID\` (plan digest \`$PLAN_DIGEST\`)";
            echo "Dispatch: \`$DISPATCH\`";
            echo '```json';
            cat reports/promotion-bridge-decision.json;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch existing strict-growth promotion workflow
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true' && steps.decide.outputs.dispatch == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          OPENVA_AUTOMERGE_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          MODE: ${{ steps.decide.outputs.mode }}
          CAP: ${{ steps.decide.outputs.cap }}
        run: |
          set -euo pipefail
          BEFORE_MAX="$(gh run list --workflow "$MUTATION_WORKFLOW" --branch main --event workflow_dispatch --limit 50 \
            --json databaseId --jq 'map(.databaseId) | max // 0')"
          case "$BEFORE_MAX" in ''|*[!0-9]*) echo "::error::invalid pre-dispatch workflow run id watermark"; exit 1 ;; esac
          TARGET_HEAD_SHA="$(git rev-parse origin/main)"
          REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ARGS=(-f "promotion_plan_mode=$MODE" -f "pr_title=Catalog: apply reviewed candidate source promotion")
          if [ -n "$CAP" ]; then
            ARGS+=(-f "max_promotion_actions_per_pr=$CAP")
          fi
          # Provenance remains in this step's audit and workflow summary; the
          # downstream run receipt additionally binds the source discovery run to the
          # exact candidate-promotion run that accepted the dispatch.
          DISPATCH_TOKEN="${OPENVA_AUTOMERGE_TOKEN:-$GH_TOKEN}"
          echo "Dispatching $MUTATION_WORKFLOW on main (mode=$MODE, source discovery run=$RUN_ID)"
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run "$MUTATION_WORKFLOW" --ref main "${ARGS[@]}"
          echo "before_max=$BEFORE_MAX" >> "$GITHUB_OUTPUT"
          echo "target_head_sha=$TARGET_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "requested_at=$REQUESTED_AT" >> "$GITHUB_OUTPUT"

      - name: Verify promotion workflow dispatch receipt (bounded, fail closed)
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true' && steps.decide.outputs.dispatch == 'true'
        id: dispatch_receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          BEFORE_MAX: ${{ steps.dispatch.outputs.before_max }}
          TARGET_HEAD_SHA: ${{ steps.dispatch.outputs.target_head_sha }}
          REQUESTED_AT: ${{ steps.dispatch.outputs.requested_at }}
        run: |
          set -euo pipefail
          ATTEMPTS="$DISPATCH_RECEIPT_WAIT_ATTEMPTS"
          SLEEP_SECONDS="$DISPATCH_RECEIPT_WAIT_SECONDS"
          case "$ATTEMPTS" in ''|*[!0-9]*) echo "::error::invalid dispatch receipt wait attempt count"; exit 1 ;; esac
          case "$SLEEP_SECONDS" in ''|*[!0-9]*) echo "::error::invalid dispatch receipt wait interval"; exit 1 ;; esac
          if [ "$ATTEMPTS" = "0" ] || [ "$SLEEP_SECONDS" = "0" ]; then
            echo "::error::dispatch receipt wait bounds must be positive"
            exit 1
          fi

          DOWNSTREAM_RUN_ID=""
          for ((ATTEMPT=1; ATTEMPT<=ATTEMPTS; ATTEMPT++)); do
            RUNS_JSON="$(gh run list --workflow "$MUTATION_WORKFLOW" --branch main --event workflow_dispatch --limit 50 \
              --json databaseId,createdAt,headSha,status)"
            printf '%s' "$RUNS_JSON" | jq -e 'type == "array"' >/dev/null || { echo "::error::could not parse candidate-promotion run list"; exit 1; }
            DOWNSTREAM_RUN_ID="$(printf '%s' "$RUNS_JSON" | jq -r \
              --argjson before "$BEFORE_MAX" \
              --arg requested "$REQUESTED_AT" \
              --arg head "$TARGET_HEAD_SHA" \
              '[.[] | select(.databaseId > $before and .createdAt >= $requested and .headSha == $head)] | sort_by(.databaseId) | .[0].databaseId // empty')"
            if [ -n "$DOWNSTREAM_RUN_ID" ]; then
              break
            fi
            echo "Candidate-promotion dispatch receipt not visible yet; attempt $ATTEMPT/$ATTEMPTS."
            if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          if [ -z "$DOWNSTREAM_RUN_ID" ]; then
            echo "::error::workflow dispatch returned without a verifiable candidate-promotion run; failing closed"
            exit 1
          fi
          case "$DOWNSTREAM_RUN_ID" in *[!0-9]*) echo "::error::invalid downstream workflow run id"; exit 1 ;; esac
          export DOWNSTREAM_RUN_ID

          mkdir -p reports
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": "0.1.0",
              "report_type": "catalog_growth_promotion_bridge_dispatch_receipt",
              "source_discovery_run_id": os.environ["RUN_ID"],
              "downstream_candidate_promotion_run_id": os.environ["DOWNSTREAM_RUN_ID"],
              "target_head_sha": os.environ["TARGET_HEAD_SHA"],
              "requested_at": os.environ["REQUESTED_AT"],
              "not_advice": True,
          }
          Path("reports/promotion-bridge-dispatch-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "downstream_run_id=$DOWNSTREAM_RUN_ID" >> "$GITHUB_OUTPUT"
          {
            echo "### Catalog growth promotion dispatch receipt"
            echo "Source discovery run: \`$RUN_ID\`"
            echo "Candidate-promotion run: \`$DOWNSTREAM_RUN_ID\`"
            echo "Target main SHA: \`$TARGET_HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload promotion bridge decision artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-catalog-growth-promotion-bridge
          path: |
            reports/promotion-bridge-eligibility.json
            reports/promotion-bridge-decision.json
            reports/promotion-bridge-dispatch-receipt.json
          if-no-files-found: warn

  dispatch-full-catalog-rendered-acceptance:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'discovery-mesh' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact acceptance pull request
        id: acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0] // empty')
          if [ -z "$PR_JSON" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
          PR_HEAD=$(printf '%s' "$PR_JSON" | jq -r '.head.ref // ""')
          PR_AUTHOR=$(printf '%s' "$PR_JSON" | jq -r '.user.login // ""')
          PR_MERGED=$(printf '%s' "$PR_JSON" | jq -r '.merged_at // ""')
          if [ "$PR_TITLE" != "Trigger full-catalog rendered-discovery acceptance" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PR_HEAD" in
            agent/full-catalog-rendered-acceptance-*) ;;
            *) echo "::error::acceptance PR branch is not authorized: $PR_HEAD"; exit 1 ;;
          esac
          if [ "$PR_AUTHOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::acceptance PR must be owned by repository owner"
            exit 1
          fi
          if [ -z "$PR_MERGED" ]; then
            echo "::error::acceptance PR must be merged"
            exit 1
          fi
          EXISTING=$(gh run list \
            --workflow discovery-mesh.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 100 \
            --json headSha,status,conclusion,databaseId \
            --jq "[.[] | select(.headSha == \"${HEAD_SHA}\")] | length")
          case "$EXISTING" in ''|*[!0-9]*) echo "::error::invalid prior acceptance run count"; exit 1 ;; esac
          if [ "$EXISTING" != "0" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch uncapped full-catalog discovery mesh
        if: steps.acceptance.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run discovery-mesh.yml --ref main
          {
            echo "### Full-catalog rendered-discovery acceptance dispatch"
            echo ""
            echo "- Source smoke run: \`${{ github.event.workflow_run.id }}\`"
            echo "- Source commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Target workflow: \`discovery-mesh.yml\`"
            echo "- Target ref: \`main\`"
            echo "- Input overrides: none"
            echo "- Expected matrix: \`32 shards / no vendor limit\`"
          } >> "$GITHUB_STEP_SUMMARY"
