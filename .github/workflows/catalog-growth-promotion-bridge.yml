name: catalog-growth-promotion-bridge

# WP-OPENVA-ZERO-INSTALL-DISTRIBUTION-01 PR2: scheduled-discovery -> strict-growth
# promotion handoff (closes the issue formerly tracked as #274).
#
# After a successful SCHEDULED catalog-growth-discovery run on main, this bridge reads
# the strict-growth promotion plan emitted by that run and, only when the plan contains
# eligible promotion actions and no global hold, no active promotion run, and no open
# growth PR blocks it, dispatches the SINGLE existing mutation workflow
# (candidate-promotion-pr.yml) in strict-growth-latest mode.
#
# Authority boundary (fail closed):
#   * Automatic path (workflow_run): the triggering discovery run's own event must be
#     exactly `schedule`. A manually dispatched discovery run must NOT cause automatic
#     promotion.
#   * Recovery path (workflow_dispatch): an intentional operator action against an
#     exact, successful, main discovery run id; no "latest" is ever inferred.
#   * Either path: the discovery run's commit must still be an ancestor of current
#     main; a historical run from a commit outside main history cannot promote.
#   * Live safety-state queries (pause, open growth PR, active promotion run) are
#     mandatory and authoritative; a GitHub API failure stops the run before dispatch.
#
# This bridge NEVER writes catalog state, opens a PR, evaluates candidate eligibility,
# or implements a second mutation path. The discovery artifact is a dispatch SIGNAL,
# not final merge authority: candidate-promotion-pr.yml regenerates and re-validates
# current evidence and remains the sole catalog write authority, gated by its own
# queue, stale-evidence, source-preflight, and strict-growth automerge checks.
#
# A separate exact-gated job may dispatch one uncapped discovery-mesh acceptance run
# after a successful hosted push smoke tied to the maintainer-owned acceptance PR.
# That job does not alter the promotion path above or write repository state.
#
# Operational metadata only. Not legal, compliance, procurement, security, KYC, AML,
# audit, or vendor-risk advice.

on:
  workflow_run:
    workflows: ["catalog-growth-discovery", "discovery-mesh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: "Exact catalog-growth-discovery run id to bridge from"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: catalog-growth-promotion-bridge
  cancel-in-progress: false

jobs:
  catalog-growth-promotion-bridge:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.name == 'catalog-growth-discovery' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    runs-on: ubuntu-latest
    env:
      MUTATION_WORKFLOW: candidate-promotion-pr.yml
      DISCOVERY_WORKFLOW: catalog-growth-discovery
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"

      - name: Resolve discovery run id
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="${{ inputs.discovery_run_id }}"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          case "$RUN_ID" in *[!0-9]*) echo "discovery_run_id must be numeric" >&2; exit 1 ;; esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Read discovery run metadata
        id: run_meta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          # Authoritative run metadata, including the run's own triggering event and
          # head commit. No "latest run" is ever inferred.
          META=$(gh run view "$RUN_ID" --json conclusion,event,headBranch,headSha,workflowName)
          {
            echo "workflow_name=$(printf '%s' "$META" | jq -r '.workflowName // ""')"
            echo "conclusion=$(printf '%s' "$META" | jq -r '.conclusion // ""')"
            echo "head_branch=$(printf '%s' "$META" | jq -r '.headBranch // ""')"
            echo "head_sha=$(printf '%s' "$META" | jq -r '.headSha // ""')"
            echo "upstream_event=$(printf '%s' "$META" | jq -r '.event // ""')"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate run eligibility (fail closed)
        id: eligibility
        env:
          BRIDGE_EVENT: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ steps.run_meta.outputs.upstream_event }}
          WORKFLOW_NAME: ${{ steps.run_meta.outputs.workflow_name }}
          CONCLUSION: ${{ steps.run_meta.outputs.conclusion }}
          HEAD_BRANCH: ${{ steps.run_meta.outputs.head_branch }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.openva.discovery_promotion_bridge eligibility \
            --bridge-event "$BRIDGE_EVENT" \
            --upstream-event "$UPSTREAM_EVENT" \
            --workflow-name "$WORKFLOW_NAME" \
            --conclusion "$CONCLUSION" \
            --head-branch "$HEAD_BRANCH" \
            --output reports/promotion-bridge-eligibility.json
          ELIGIBLE="$(python -c 'import json;print(str(json.load(open("reports/promotion-bridge-eligibility.json"))["eligible"]).lower())')"
          ELIGIBILITY_REASON="$(python -c 'import json;print(json.load(open("reports/promotion-bridge-eligibility.json"))["reason"])')"
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          {
            echo "### Catalog growth promotion bridge — run eligibility";
            echo "Discovery run \`$RUN_ID\`: bridge_event=\`$BRIDGE_EVENT\`, upstream_event=\`$UPSTREAM_EVENT\`";
            echo "Eligible: \`$ELIGIBLE\` (\`$ELIGIBILITY_REASON\`)";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify upstream commit is an ancestor of current main (fail closed)
        if: steps.eligibility.outputs.eligible == 'true'
        id: ancestry
        env:
          HEAD_SHA: ${{ steps.run_meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          # A successful historical discovery run must not promote if its commit is no
          # longer part of current main. Applies to both the automatic and the explicit
          # operator-recovery paths. Same authority pattern as
          # discovery-ledger-append-pr.yml.
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::missing discovery run head SHA"
            exit 1
          fi
          git fetch origin main
          if git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "ancestor=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::discovery run commit is not an ancestor of current main"
            exit 1
          fi

      - name: Download strict-growth promotion plan
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true'
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery-artifacts"
          gh run download "$RUN_ID" \
            --name openva-catalog-growth-discovery-artifacts \
            --dir "$RUNNER_TEMP/discovery-artifacts"
          test -f "$RUNNER_TEMP/discovery-artifacts/strict-growth-promotion-plan.json"
          DIGEST=$(sha256sum "$RUNNER_TEMP/discovery-artifacts/strict-growth-promotion-plan.json" | cut -d' ' -f1)
          echo "plan_digest=sha256:$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Compute hold, open growth PR, and active promotion-run state (mandatory, fail closed)
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every query below is authoritative and mandatory. Under set -euo pipefail a
          # GitHub API/auth/rate-limit failure aborts this step (the job fails and no
          # dispatch occurs); failures are never converted to an unblocked state.

          # Global pause state.
          LABELS_JSON="$(gh label list --json name)"
          printf '%s' "$LABELS_JSON" | jq -e 'type == "array"' >/dev/null || { echo "::error::could not parse repository labels"; exit 1; }
          HAS_PAUSE_LABEL="$(printf '%s' "$LABELS_JSON" | jq -r 'map(.name) | index("openva-bot-paused") != null')"
          if [ "$HAS_PAUSE_LABEL" = "true" ]; then
            PAUSED_OPEN="$(gh issue list --label openva-bot-paused --state open --json number --jq 'length')"
            case "$PAUSED_OPEN" in ''|*[!0-9]*) echo "::error::invalid paused issue count"; exit 1 ;; esac
            if [ "$PAUSED_OPEN" != "0" ]; then PAUSE="true"; else PAUSE="false"; fi
          elif [ "$HAS_PAUSE_LABEL" = "false" ]; then
            PAUSE="false"
          else
            echo "::error::could not determine pause label state"
            exit 1
          fi

          # Open catalog-growth PR count.
          OPEN_GROWTH_PRS="$(gh pr list --state open --label catalog-growth --json number --jq 'length')"
          case "$OPEN_GROWTH_PRS" in ''|*[!0-9]*) echo "::error::invalid open growth PR count"; exit 1 ;; esac

          # Queued/in-progress promotion runs on main, so a second dispatch cannot race
          # the PR-creation window of an already-active promotion run.
          ACTIVE_PROMOTION_RUNS="$(gh run list --workflow "$MUTATION_WORKFLOW" --branch main --limit 50 --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          case "$ACTIVE_PROMOTION_RUNS" in ''|*[!0-9]*) echo "::error::invalid active promotion run count"; exit 1 ;; esac

          echo "pause=$PAUSE" >> "$GITHUB_OUTPUT"
          echo "open_growth_prs=$OPEN_GROWTH_PRS" >> "$GITHUB_OUTPUT"
          echo "active_promotion_runs=$ACTIVE_PROMOTION_RUNS" >> "$GITHUB_OUTPUT"

      - name: Decide promotion dispatch (bounded bridge gate)
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true'
        id: decide
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          HOLD: ${{ steps.state.outputs.pause }}
          OPEN_GROWTH_PRS: ${{ steps.state.outputs.open_growth_prs }}
          ACTIVE_PROMOTION_RUNS: ${{ steps.state.outputs.active_promotion_runs }}
          PLAN_DIGEST: ${{ steps.artifact.outputs.plan_digest }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.openva.discovery_promotion_bridge decide \
            --plan "$RUNNER_TEMP/discovery-artifacts/strict-growth-promotion-plan.json" \
            --hold-active "$HOLD" \
            --open-growth-pr-count "$OPEN_GROWTH_PRS" \
            --active-promotion-run-count "$ACTIVE_PROMOTION_RUNS" \
            --source-run-id "$RUN_ID" \
            --plan-digest "$PLAN_DIGEST" \
            --output reports/promotion-bridge-decision.json
          DISPATCH="$(python -c 'import json;print(str(json.load(open("reports/promotion-bridge-decision.json"))["dispatch"]).lower())')"
          MODE="$(python -c 'import json;print(json.load(open("reports/promotion-bridge-decision.json"))["mode"])')"
          CAP="$(python -c 'import json;d=json.load(open("reports/promotion-bridge-decision.json"));c=d.get("max_promotion_actions_per_pr");print("" if c is None else c)')"
          echo "dispatch=$DISPATCH" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"
          {
            echo "### Catalog growth promotion bridge decision";
            echo "Source discovery run: \`$RUN_ID\` (plan digest \`$PLAN_DIGEST\`)";
            echo "Dispatch: \`$DISPATCH\`";
            echo '```json';
            cat reports/promotion-bridge-decision.json;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch existing strict-growth promotion workflow
        if: steps.eligibility.outputs.eligible == 'true' && steps.ancestry.outputs.ancestor == 'true' && steps.decide.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          MODE: ${{ steps.decide.outputs.mode }}
          CAP: ${{ steps.decide.outputs.cap }}
        run: |
          set -euo pipefail
          # Hand the single authorised cycle to the one existing mutation workflow.
          # This bridge never writes catalog state itself; candidate-promotion-pr.yml
          # regenerates/re-validates current evidence and remains the sole catalog
          # write authority. Provenance remains in this step's audit and workflow summary;
          # the dispatched PR title must match the generated-catalog automerge lane.
          ARGS=(-f "promotion_plan_mode=$MODE" -f "pr_title=Catalog: apply reviewed candidate source promotion")
          if [ -n "$CAP" ]; then
            ARGS+=(-f "max_promotion_actions_per_pr=$CAP")
          fi
          echo "Dispatching $MUTATION_WORKFLOW (mode=$MODE, source discovery run=$RUN_ID)"
          gh workflow run "$MUTATION_WORKFLOW" "${ARGS[@]}"

      - name: Upload promotion bridge decision artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-catalog-growth-promotion-bridge
          path: |
            reports/promotion-bridge-eligibility.json
            reports/promotion-bridge-decision.json
          if-no-files-found: warn

  dispatch-full-catalog-rendered-acceptance:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'discovery-mesh' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact acceptance pull request
        id: acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0] // empty')
          if [ -z "$PR_JSON" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
          PR_HEAD=$(printf '%s' "$PR_JSON" | jq -r '.head.ref // ""')
          PR_AUTHOR=$(printf '%s' "$PR_JSON" | jq -r '.user.login // ""')
          PR_MERGED=$(printf '%s' "$PR_JSON" | jq -r '.merged_at // ""')
          if [ "$PR_TITLE" != "Trigger full-catalog rendered-discovery acceptance" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PR_HEAD" in
            agent/full-catalog-rendered-acceptance-*) ;;
            *) echo "::error::acceptance PR branch is not authorized: $PR_HEAD"; exit 1 ;;
          esac
          if [ "$PR_AUTHOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::acceptance PR must be owned by repository owner"
            exit 1
          fi
          if [ -z "$PR_MERGED" ]; then
            echo "::error::acceptance PR must be merged"
            exit 1
          fi
          EXISTING=$(gh run list \
            --workflow discovery-mesh.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 100 \
            --json headSha,status,conclusion,databaseId \
            --jq "[.[] | select(.headSha == \"${HEAD_SHA}\")] | length")
          case "$EXISTING" in ''|*[!0-9]*) echo "::error::invalid prior acceptance run count"; exit 1 ;; esac
          if [ "$EXISTING" != "0" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch uncapped full-catalog discovery mesh
        if: steps.acceptance.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run discovery-mesh.yml --ref main
          {
            echo "### Full-catalog rendered-discovery acceptance dispatch"
            echo ""
            echo "- Source smoke run: \`${{ github.event.workflow_run.id }}\`"
            echo "- Source commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Target workflow: \`discovery-mesh.yml\`"
            echo "- Target ref: \`main\`"
            echo "- Input overrides: none"
            echo "- Expected matrix: \`32 shards / no vendor limit\`"
          } >> "$GITHUB_STEP_SUMMARY"
