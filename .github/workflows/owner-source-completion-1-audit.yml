name: owner-source-completion-1-audit

on:
  push:
    branches:
      - catalog/owner-source-completion-1

permissions:
  contents: write

concurrency:
  group: owner-source-completion-1-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install PyYAML
      - name: Build whole-catalog completeness ledger
        run: |
          mkdir -p .owner-source-completion-1
          python -m tools.openva.catalog_completeness build \
            --output .owner-source-completion-1/catalog-completeness.json \
            --csv-output .owner-source-completion-1/catalog-completeness.csv \
            --markdown-output .owner-source-completion-1/catalog-completeness.md
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path('.owner-source-completion-1')
          report = json.loads((root / 'catalog-completeness.json').read_text())
          vendors = report['vendors']
          patterns = Counter(tuple(v['missing_expected_sources']) for v in vendors)
          missing_by_group = defaultdict(list)
          for vendor in vendors:
              for group in vendor['missing_expected_sources']:
                  missing_by_group[group].append(vendor['vendor_id'])
          ranked = sorted(
              vendors,
              key=lambda v: (
                  -len(v['missing_expected_sources']),
                  v['source_count'],
                  v['vendor_id'],
              ),
          )
          compact = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_completion_gap_ledger',
              'base_commit': '${{ github.sha }}',
              'summary': report['summary'],
              'missing_pattern_counts': [
                  {'missing_expected_sources': list(pattern), 'vendor_count': count}
                  for pattern, count in sorted(patterns.items(), key=lambda item: (-len(item[0]), -item[1], item[0]))
              ],
              'missing_by_group': {key: sorted(value) for key, value in sorted(missing_by_group.items())},
              'priority_vendors': ranked,
              'completion_definition': {
                  'expected_source_groups': ['privacy_notice', 'dpa', 'subprocessors_list', 'security', 'compliance'],
                  'complete_when': 'Every existing vendor has a canonical public source for each available expected group, or an evidence-backed explicit unavailable/not-public decision for the group; all recorded URLs must be authority-verified, source-type-correct, non-duplicative, and currently reachable or accurately classified.',
                  'public_ui_exposure': False,
                  'not_advice': True,
              },
          }
          (root / 'gap-ledger.json').write_text(json.dumps(compact, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit audit evidence and remove runner
        run: |
          rm .github/workflows/owner-source-completion-1-audit.yml
          git config user.name "openva-owner-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .owner-source-completion-1 .github/workflows/owner-source-completion-1-audit.yml
          git commit -m "Catalog: inventory whole-catalog source completion gaps"
          git push origin HEAD:catalog/owner-source-completion-1
