name: source-completion-expanded-discovery

on:
  pull_request:
    branches:
      - catalog/source-completion-audit-control
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: source-completion-expanded-discovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'catalog/owner-source-completion-1-builder'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: terms_of_service, shard: 0, shards: 6}
          - {group: terms_of_service, shard: 1, shards: 6}
          - {group: terms_of_service, shard: 2, shards: 6}
          - {group: terms_of_service, shard: 3, shards: 6}
          - {group: terms_of_service, shard: 4, shards: 6}
          - {group: terms_of_service, shard: 5, shards: 6}
          - {group: status_page, shard: 0, shards: 6}
          - {group: status_page, shard: 1, shards: 6}
          - {group: status_page, shard: 2, shards: 6}
          - {group: status_page, shard: 3, shards: 6}
          - {group: status_page, shard: 4, shards: 6}
          - {group: status_page, shard: 5, shards: 6}
          - {group: privacy_notice, shard: 0, shards: 1}
          - {group: security_assurance, shard: 0, shards: 2}
          - {group: security_assurance, shard: 1, shards: 2}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Discover source-completion shard
        run: |
          mkdir -p expanded-discovery
          python .owner-source-completion-1/expanded_completion.py discover \
            --group '${{ matrix.group }}' \
            --shard-index '${{ matrix.shard }}' \
            --shard-count '${{ matrix.shards }}' \
            --output 'expanded-discovery/${{ matrix.group }}-${{ matrix.shard }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-source-${{ matrix.group }}-${{ matrix.shard }}
          path: expanded-discovery/${{ matrix.group }}-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate:
    if: github.event.pull_request.head.ref == 'catalog/owner-source-completion-1-builder'
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: expanded-source-*
          path: .owner-source-completion-1/expanded-discovery
          merge-multiple: true
      - name: Materialize verified sources and status absence records
        run: |
          python .owner-source-completion-1/expanded_completion.py aggregate \
            --reports-dir .owner-source-completion-1/expanded-discovery \
            --output-dir .owner-source-completion-1/results
      - name: Rebuild and validate repository
        run: |
          python -m tools.openva.validate build-indexes
          python -m tools.openva.catalog_source_completion build \
            --as-of 2026-07-14 \
            --output .owner-source-completion-1/results/expanded-completion-report.json
          python -m tools.openva.validate validate
          pytest -q \
            tests/test_catalog_source_completion.py \
            tests/test_catalog_guard.py \
            tests/test_source_discovery.py \
            tests/test_source_verification.py \
            tests/test_coverage_audit.py
      - name: Commit bounded discovery transaction
        run: |
          rm -f .owner-source-completion-1/expanded_completion.py
          rm -rf .owner-source-completion-1/expanded-discovery
          git config user.name 'openva-owner-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Catalog: complete residual source coverage automatically'
          git push origin HEAD:catalog/owner-source-completion-1-builder
