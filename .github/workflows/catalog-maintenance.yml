name: catalog maintenance

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate catalog
        run: python -m tools.openva.validate validate
      - name: Rebuild generated indexes
        run: python -m tools.openva.validate build-indexes
      - name: Check generated-file drift
        run: git diff --exit-code openva-pack.json indexes/
      - name: Run tests
        run: pytest -q
      - name: Create maintenance summary
        run: |
          mkdir -p reports
          {
            echo "# Catalog Maintenance Report"
            echo
            echo "Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Checks"
            echo
            echo "- validation completed"
            echo "- indexes rebuilt"
            echo "- generated-file drift checked"
            echo "- tests completed"
            echo
            echo "## Review posture"
            echo
            echo "This workflow is non-mutating. Any catalog correction should be proposed through a pull request."
          } > reports/catalog-maintenance-report.md
      - name: Upload maintenance report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-maintenance-report
          path: reports/catalog-maintenance-report.md
