name: manual-stabilization-repair

on:
  push:
    branches:
      - fix/manual-stabilization-20260910

permissions:
  contents: write

concurrency:
  group: manual-stabilization-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Normalize candidate intake and repair committed candidate records
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          intake = Path('tools/openva/discovery_mesh_intake.py')
          text = intake.read_text(encoding='utf-8')
          old = '''def yaml_text(value: dict[str, Any]) -> str:\n    return yaml.safe_dump(value, sort_keys=False, allow_unicode=True)\n'''
          new = '''MAX_PAGE_TITLE_LENGTH = 300\n\n\ndef normalize_candidate_for_storage(value: dict[str, Any]) -> dict[str, Any]:\n    normalized = deepcopy(value)\n    evidence = normalized.get("evidence")\n    if isinstance(evidence, dict):\n        page_title = evidence.get("page_title")\n        if isinstance(page_title, str) and len(page_title) > MAX_PAGE_TITLE_LENGTH:\n            evidence["page_title"] = page_title[:MAX_PAGE_TITLE_LENGTH].rstrip()\n    return normalized\n\n\ndef yaml_text(value: dict[str, Any]) -> str:\n    return yaml.safe_dump(normalize_candidate_for_storage(value), sort_keys=False, allow_unicode=True)\n'''
          if old in text:
              intake.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'def normalize_candidate_for_storage' not in text:
              raise SystemExit('expected yaml_text implementation not found')

          repaired = []
          for path in sorted(Path('data/vendors').glob('*/candidate_sources/*.yaml')):
              value = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  continue
              evidence = value.get('evidence')
              if not isinstance(evidence, dict):
                  continue
              title = evidence.get('page_title')
              if isinstance(title, str) and len(title) > 300:
                  evidence['page_title'] = title[:300].rstrip()
                  path.write_text(yaml.safe_dump(value, sort_keys=False, allow_unicode=True), encoding='utf-8')
                  repaired.append(str(path))
          print(f'repaired candidate page titles: {len(repaired)}')
          for path in repaired:
              print(path)
          PY
      - name: Rebuild deterministic generated state
        run: python -m tools.openva.validate build-indexes
      - name: Run focused normalization tests
        run: pytest -q tests/test_discovery_mesh_intake_page_title.py
      - name: Validate repository
        run: python -m tools.openva.validate validate
      - name: Commit stabilization repair
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git config user.name 'openva-stabilization'
          git config user.email 'openva-stabilization@users.noreply.github.com'
          git add tools/openva/discovery_mesh_intake.py tests/test_discovery_mesh_intake_page_title.py data/vendors indexes dist openva-pack.json maintenance/generated || true
          git commit -m 'Repair candidate metadata normalization and generated state'
          git push origin HEAD:fix/manual-stabilization-20260910
