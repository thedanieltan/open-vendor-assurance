name: source-discovery-report

on:
  workflow_dispatch:
    inputs:
      vendor_limit:
        description: "Optional number of vendors to check"
        required: false
        type: string
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read

concurrency:
  group: source-discovery-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-discovery-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build candidate source discovery report
        run: |
          LIMIT="${{ inputs.vendor_limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_discovery discover --vendor-limit "$LIMIT" --output source-discovery-report.json
          else
            python -m tools.openva.source_discovery discover --output source-discovery-report.json
          fi
      - name: Print source discovery report summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('source-discovery-report.json', encoding='utf-8'))
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          PY
      - name: Upload source discovery report
        uses: actions/upload-artifact@v4
        with:
          name: openva-source-discovery-report
          path: source-discovery-report.json
          if-no-files-found: error
