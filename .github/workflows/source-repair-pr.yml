name: source-repair-pr

on:
  workflow_dispatch:
    inputs:
      validation_report_path:
        description: "Committed p0_source_repair_plan_validation JSON file"
        required: true
        type: string
      evidence_report_path:
        description: "Optional committed p0_source_repair_evidence JSON file for strict automerge review"
        required: false
        default: ""
        type: string
      pr_branch:
        description: "Generated PR branch. Must start with agent-"
        required: false
        default: ""
        type: string
      pr_title:
        description: "Repair PR title. Must start with Catalog: repair"
        required: false
        default: "Catalog: repair confirmed P0 sources"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-repair-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-repair-pr:
    runs-on: ubuntu-latest
    env:
      REQUESTED_VALIDATION_REPORT_PATH: "${{ inputs.validation_report_path }}"
      REQUESTED_EVIDENCE_REPORT_PATH: "${{ inputs.evidence_report_path || '' }}"
      REQUESTED_PR_BRANCH: "${{ inputs.pr_branch || '' }}"
      REQUESTED_PR_TITLE: "${{ inputs.pr_title || 'Catalog: repair confirmed P0 sources' }}"
      DEFAULT_PR_BRANCH: "agent-source-repair-${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow source-repair-pr.yml \
              --lane source_repair \
              --failure-code schema_validation_failure \
              --message "schema validation failed before source repair" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/source-repair-failure-input.json
            exit 1
          }
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path, PurePosixPath

          validation_report_path = os.environ["REQUESTED_VALIDATION_REPORT_PATH"].strip()
          evidence_report_path = os.environ["REQUESTED_EVIDENCE_REPORT_PATH"].strip()
          pr_branch = os.environ["REQUESTED_PR_BRANCH"].strip()
          pr_title = os.environ["REQUESTED_PR_TITLE"].strip()
          if not pr_branch:
              pr_branch = os.environ["DEFAULT_PR_BRANCH"]

          path = PurePosixPath(validation_report_path)
          parts = path.parts
          if (
              not validation_report_path
              or path.is_absolute()
              or ".." in parts
              or len(parts) < 3
              or parts[0] != "maintenance"
              or parts[1] != "reviewed"
              or path.suffix != ".json"
          ):
              raise SystemExit("validation_report_path must be under maintenance/reviewed/ and end with .json")
          if not Path(validation_report_path).is_file():
              raise SystemExit(f"validation report file not found: {validation_report_path}")
          tracked = subprocess.run(
              ["git", "ls-files", "--error-unmatch", validation_report_path],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          )
          if tracked.returncode != 0:
              raise SystemExit(f"validation report must be committed and tracked: {validation_report_path}")
          if evidence_report_path:
              evidence_path = PurePosixPath(evidence_report_path)
              evidence_parts = evidence_path.parts
              if (
                  evidence_path.is_absolute()
                  or ".." in evidence_parts
                  or len(evidence_parts) < 3
                  or evidence_parts[0] != "maintenance"
                  or evidence_parts[1] != "reviewed"
                  or evidence_path.suffix != ".json"
              ):
                  raise SystemExit("evidence_report_path must be under maintenance/reviewed/ and end with .json")
              if not Path(evidence_report_path).is_file():
                  raise SystemExit(f"evidence report file not found: {evidence_report_path}")
              tracked = subprocess.run(
                  ["git", "ls-files", "--error-unmatch", evidence_report_path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if tracked.returncode != 0:
                  raise SystemExit(f"evidence report must be committed and tracked: {evidence_report_path}")
          if not pr_branch.startswith("agent-"):
              raise SystemExit("pr_branch must start with agent-")
          if not pr_title.startswith("Catalog: repair"):
              raise SystemExit("pr_title must start with Catalog: repair")
          if "\n" in pr_branch or "\r" in pr_branch:
              raise SystemExit("pr_branch must not contain newlines")
          if "\n" in pr_title or "\r" in pr_title:
              raise SystemExit("pr_title must not contain newlines")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"VALIDATION_REPORT_PATH={validation_report_path}\n")
              if evidence_report_path:
                  handle.write(f"EVIDENCE_REPORT_PATH={evidence_report_path}\n")
              handle.write(f"PR_BRANCH={pr_branch}\n")
              handle.write(f"PR_TITLE={pr_title}\n")
          PY
      - name: Check repair source collisions
        run: |
          python -m tools.openva.source_repair_collision_check check \
            --validation "$VALIDATION_REPORT_PATH" \
            --catalog-root data/vendors \
            --output source-repair-collision-report.json \
            --summary-output source-repair-collision-summary.md
      - name: Upload source repair collision artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-repair-collision-check
          path: |
            source-repair-collision-report.json
            source-repair-collision-summary.md
          if-no-files-found: ignore
      - name: Apply reviewed P0 source repairs
        run: |
          python -m tools.openva.source_repair_actions apply \
            --validation-report "$VALIDATION_REPORT_PATH" \
            --output source-repair-action-report.json
      - name: Validate generated catalog repair
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow source-repair-pr.yml \
              --lane source_repair \
              --failure-code schema_validation_failure \
              --message "schema validation failed after source repair actions" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/source-repair-failure-input.json
            exit 1
          }
      - name: Check whether catalog changes were produced
        id: catalog_changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data indexes dist openva-pack.json; then
            echo "No source repair changes produced."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source repair changes produced."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build source repair queue state
        if: steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          mkdir -p reports/openva-queue
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          validation_path = Path(os.environ["VALIDATION_REPORT_PATH"])
          evidence_path = Path(os.environ.get("EVIDENCE_REPORT_PATH", ""))
          evidence_source = evidence_path if evidence_path.is_file() else validation_path
          generated_at = datetime.fromtimestamp(evidence_source.stat().st_mtime, UTC).replace(microsecond=0)
          duplicate_key = hashlib.sha256(
              f"{validation_path.as_posix()}:{validation_path.read_bytes().hex()}".encode("utf-8")
          ).hexdigest()
          state = {
              "version": 1,
              "lane_id": "source_repair",
              "state_source": "workflow_local_fallback",
              "fallback_state": True,
              "live_state_checks_report_only": [
                  "max_open_prs",
                  "recent_bot_prs_per_day",
                  "recent_bot_prs_per_week",
                  "duplicate_pr_policy",
                  "source_host_rate_limit",
                  "vendor_domain_concurrency_limit",
              ],
              "open_prs": [],
              "recent_bot_prs": {"day_count": 0, "week_count": 0},
              "pause": {"active": False, "source": "workflow fallback; maintainer pause label not fetched"},
              "evidence": {
                  "generated_at": generated_at.isoformat().replace("+00:00", "Z"),
                  "source": evidence_source.as_posix(),
              },
              "requested_action": {
                  "duplicate_key": duplicate_key,
                  "vendor_domain": "",
                  "source_host": "",
                  "base_sha": os.environ["GITHUB_SHA"],
                  "head_sha": os.environ["GITHUB_SHA"],
              },
          }
          Path("reports/openva-queue/source-repair-queue-state.json").write_text(
              json.dumps(state, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Evaluate source repair queue gate
        if: steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          python -m tools.openva.bot_queue evaluate \
            --lane source_repair \
            --state reports/openva-queue/source-repair-queue-state.json \
            --out reports/openva-queue/source-repair-queue-report.json \
            --out-md reports/openva-queue/source-repair-queue-report.md
      - name: Enforce source repair queue gate
        if: steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          report = json.load(open("reports/openva-queue/source-repair-queue-report.json", encoding="utf-8"))
          state = json.load(open("reports/openva-queue/source-repair-queue-state.json", encoding="utf-8"))
          reasons = set(report.get("reasons", []))
          hard_stop_reasons = {
              "unknown_lane",
              "lane_missing_queue_policy",
              "lane_not_deny_by_default",
              "lane_not_write_capable",
              "missing_evidence",
              "stale_evidence",
              "pause_switch_active",
          }
          if state.get("state_source") != "workflow_local_fallback":
              hard_stop_reasons.update(
                  {
                      "max_open_prs_exceeded",
                      "max_bot_prs_per_day_exceeded",
                      "max_bot_prs_per_week_exceeded",
                  }
              )
          blocked = report.get("decision") in {"deny", "pause"} or bool(reasons & hard_stop_reasons)
          if blocked:
              raise SystemExit(
                  "source_repair queue gate blocked PR creation: "
                  + ", ".join(report.get("reasons", []))
              )
          print("source_repair queue gate passed; fallback live-state checks remain report-only.")
          PY
      - name: Upload source repair queue gate artifacts
        if: always() && steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-repair-queue-report
          path: |
            reports/openva-queue/source-repair-queue-state.json
            reports/openva-queue/source-repair-queue-report.json
            reports/openva-queue/source-repair-queue-report.md
          if-no-files-found: warn
      - name: Prepare compact PR body
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.load(open("source-repair-action-report.json", encoding="utf-8"))
          summary = report["summary"]
          lines = [
              "## Summary",
              "",
              "Applies a committed, human-reviewed P0 source repair validation report.",
              "",
              "## Reviewed input",
              "",
              f"- Validation report: `{os.environ['VALIDATION_REPORT_PATH']}`",
              *(
                  [f"- Evidence report: `{os.environ['EVIDENCE_REPORT_PATH']}`"]
                  if os.environ.get("EVIDENCE_REPORT_PATH")
                  else []
              ),
              "",
              "## Counts",
              "",
              f"- Approved repairs seen: `{summary['approved_repairs_seen']}`",
              f"- File actions applied: `{summary['file_actions_applied']}`",
              f"- Blocked repairs: `{summary['blocked_repairs']}`",
              "",
              "## Guardrails",
              "",
              "- Uses only committed validation reports under maintenance/reviewed/",
              "- Uses reviewed evidence freshness for the source_repair queue gate",
              "- Applies only rows approved by source_repair_plan validator",
              "- Re-checks current source YAML before applying each replacement",
              "- Does not run live discovery",
              "- Does not run automerge",
              "- Does not mirror raw documents",
              "",
          ]
          Path("source-repair-pr-body.md").write_text("\n".join(lines), encoding="utf-8")
          PY
      - name: Commit and push source repair branch
        if: steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PR_BRANCH"
          git add data indexes dist openva-pack.json
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Create or update pull request
        if: steps.catalog_changes.outputs.has_changes == 'true'
        env:
          # Workflow-triggering token so the opened PR can trigger agent-automerge;
          # falls back to github.token (current behaviour) until the secret is set.
          GH_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body-file source-repair-pr-body.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "$PR_TITLE" \
              --body-file source-repair-pr-body.md
          fi
      - name: Upload source repair PR artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-repair-pr-artifacts
          path: |
            source-repair-action-report.json
            source-repair-pr-body.md
            source-repair-collision-report.json
            source-repair-collision-summary.md
          if-no-files-found: error
      - name: Build source repair failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow source-repair-pr.yml \
            --lane source_repair \
            --message "source repair workflow failed; inspect logs for workflow input compatibility, schema validation, queue denial, or source repair failure context" \
            --queue-report reports/openva-queue/source-repair-queue-report.json \
            --out reports/openva-failure-routing/source-repair-failure-input.json \
            --preserve-existing
      - name: Route source repair failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/source-repair-failure-input.json \
            --out reports/openva-failure-routing/source-repair-failure-routing-report.json \
            --out-md reports/openva-failure-routing/source-repair-failure-routing-report.md
      - name: Upload source repair failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-repair-failure-routing
          path: |
            reports/openva-failure-routing/source-repair-failure-input.json
            reports/openva-failure-routing/source-repair-failure-routing-report.json
            reports/openva-failure-routing/source-repair-failure-routing-report.md
          if-no-files-found: ignore
