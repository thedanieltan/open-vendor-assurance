name: owner-apac-expansion-1

on:
  push:
    branches:
      - catalog/owner-apac-expansion-1

permissions:
  contents: write

concurrency:
  group: owner-apac-expansion-1
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[owner-apac-1-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-apac-expansion-1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Rebuild generated catalog outputs
        run: python -m tools.openva.validate build-indexes
      - name: Validate corrected catalog
        run: python -m tools.openva.validate validate
      - name: Run focused catalog tests
        run: pytest -q tests/test_catalog_batch.py tests/test_catalog_guard.py tests/test_source_type_labels.py tests/test_generated_exports.py
      - name: Show APAC observation outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          selected = {
              'xendit-service-agreement',
              'xendit-privacy-policy',
              'xendit-licenses',
              'xendit-status',
              'smarthr-security',
              'smarthr-terms',
              'smarthr-privacy-policy',
              'keka-security',
              'keka-terms',
              'keka-privacy-policy',
              'keka-dpa',
          }
          data = json.loads(Path('maintenance/source-observations/latest-observations.json').read_text())
          for row in data.get('sources', []):
              if row.get('source_id') in selected:
                  print(json.dumps({
                      'source_id': row.get('source_id'),
                      'http_status': row.get('http_status'),
                      'source_health_status': row.get('source_health_status'),
                      'final_url': row.get('final_url'),
                      'review_signal': row.get('review_signal'),
                  }, sort_keys=True))
          PY
      - name: Commit finalized APAC catalog
        run: |
          set -euo pipefail
          rm -f owner-apac-validation.log
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add \
            data/vendors/xendit \
            data/vendors/smarthr \
            data/vendors/keka \
            dist/vendors/xendit.json \
            dist/vendors/smarthr.json \
            dist/vendors/keka.json \
            indexes \
            openva-pack.json \
            maintenance/source-observations/latest-observations.json
          git add -u owner-apac-validation.log
          git diff --cached --stat
          git commit -m 'Catalog: finalize owner APAC batch 1 [owner-apac-1-complete]'
          git push
