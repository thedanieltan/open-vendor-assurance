name: owner executor origin-check repair

on:
  push:
    branches:
      - fix/owner-catalog-executor-origin-check
    paths:
      - .github/workflows/owner-origin-fix-materialize.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/owner-catalog-executor-origin-check
          fetch-depth: 0
      - name: Repair origin validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/catalog-pr-guard.yml')
          text = path.read_text(encoding='utf-8')
          old = '          test "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}.git"\n'
          new = '''          ORIGIN_URL="$(git remote get-url origin)"
          case "$ORIGIN_URL" in
            "https://github.com/${GITHUB_REPOSITORY}"|"https://github.com/${GITHUB_REPOSITORY}.git") ;;
            *) echo "unexpected origin URL: $ORIGIN_URL" >&2; exit 1 ;;
          esac
'''
          if old not in text:
              raise SystemExit('owner executor origin assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/owner-origin-fix-materialize.yml
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix owner catalog executor origin validation'
          git push origin HEAD:fix/owner-catalog-executor-origin-check
