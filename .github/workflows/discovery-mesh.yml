name: discovery-mesh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discovery-mesh.yml"
      - "tools/openva/discovery_mesh_config.py"
      - "tools/openva/discovery_mesh_runner.py"
      - "tools/openva/rendered_discovery.py"
      - "tools/openva/rendered_discovery_runner.py"
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Optional diagnostic override. Scheduled runs use worker defaults."
        required: false
        type: string
        default: ""
      vendor_limit:
        description: "Optional per-shard diagnostic limit. Scheduled runs leave this blank and process the full catalog."
        required: false
        type: string
        default: ""
  schedule:
    # Daily at 03:37 UTC / 11:37 Asia/Singapore. The entire eligible catalog is sharded.
    - cron: "37 3 * * *"
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: discovery-mesh-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Build full-catalog shard matrix
        id: plan
        env:
          REQUESTED_SHARD_COUNT: "${{ github.event_name == 'push' && '1' || inputs.shard_count || '' }}"
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          from tools.openva import discovery_mesh_config as config

          requested = os.environ.get("REQUESTED_SHARD_COUNT", "").strip()
          shard_count = int(requested) if requested else config.DEFAULT_SHARD_COUNT
          if shard_count < 1 or shard_count > 256:
              raise SystemExit("shard_count must be between 1 and 256")
          if config.CATALOG_VENDOR_LIMIT is not None:
              raise SystemExit("scheduled discovery mesh must not define a catalog vendor cap")
          print("matrix=" + json.dumps({"shard": list(range(shard_count))}, separators=(",", ":")))
          print(f"shard_count={shard_count}")
          PY

  discover:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      REQUESTED_VENDOR_LIMIT: "${{ github.event_name == 'push' && '5' || inputs.vendor_limit || '' }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and rendered discovery dependency
        run: |
          set -euo pipefail
          pip install -e ".[dev]"
          pip install "playwright==1.57.0"
          CHROMIUM="$(command -v chromium)"
          test -x "$CHROMIUM"
          echo "OPENVA_CHROMIUM_EXECUTABLE=$CHROMIUM" >> "$GITHUB_ENV"
          OPENVA_CHROMIUM_EXECUTABLE="$CHROMIUM" pytest -q \
            tests/test_rendered_discovery.py::test_playwright_renderer_executes_javascript_through_intercepted_fetcher \
            tests/test_rendered_discovery.py::test_renderer_blocks_off_authority_requests
      - name: Resolve growth-oriented per-vendor bounds
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          from tools.openva import discovery_mesh_config as config

          print(f"MESH_MAX_PAGES={config.MAX_PAGES_PER_VENDOR}")
          print(f"MESH_MAX_TOTAL_REQUESTS={config.MAX_TOTAL_REQUESTS_PER_VENDOR}")
          print(f"MESH_MAX_LINKS_PER_PAGE={config.MAX_LINKS_PER_PAGE}")
          print(f"MESH_MAX_LOCATORS={config.MAX_LOCATOR_CANDIDATES_PER_VENDOR}")
          print(f"MESH_FETCH_TIMEOUT={config.FETCH_TIMEOUT_SECONDS}")
          print(f"MESH_RENDER_MAX_PAGES={config.RENDER_MAX_PAGES_PER_VENDOR}")
          print(f"MESH_RENDER_MAX_REQUESTS={config.RENDER_MAX_REQUESTS_PER_PAGE}")
          print(f"MESH_RENDER_MAX_BYTES={config.RENDER_MAX_BYTES_PER_PAGE}")
          print(f"MESH_RENDER_TIMEOUT_MS={config.RENDER_TIMEOUT_MS}")
          print(f"MESH_RENDER_SETTLE_MS={config.RENDER_SETTLE_MS}")
          PY
      - name: Run full-catalog discovery shard with selective rendering
        run: |
          set -euo pipefail
          mkdir -p reports/discovery-mesh
          ARGS=(
            --shard-index "${{ matrix.shard }}"
            --shard-count "${{ needs.plan.outputs.shard_count }}"
            --fetch-timeout "$MESH_FETCH_TIMEOUT"
            --max-pages "$MESH_MAX_PAGES"
            --max-total-requests "$MESH_MAX_TOTAL_REQUESTS"
            --max-links-per-page "$MESH_MAX_LINKS_PER_PAGE"
            --max-locators-per-vendor "$MESH_MAX_LOCATORS"
            --max-render-pages-per-vendor "$MESH_RENDER_MAX_PAGES"
            --max-render-requests-per-page "$MESH_RENDER_MAX_REQUESTS"
            --max-render-bytes-per-page "$MESH_RENDER_MAX_BYTES"
            --render-timeout-ms "$MESH_RENDER_TIMEOUT_MS"
            --render-settle-ms "$MESH_RENDER_SETTLE_MS"
            --output "reports/discovery-mesh/shard-${{ matrix.shard }}.json"
          )
          LIMIT="$(printf '%s' "$REQUESTED_VENDOR_LIMIT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$LIMIT" ]; then
            case "$LIMIT" in *[!0-9]*) echo "vendor_limit must be a positive integer" >&2; exit 1 ;; esac
            if [ "$LIMIT" = "0" ]; then echo "vendor_limit must be positive" >&2; exit 1; fi
            ARGS+=(--vendor-limit "$LIMIT")
          fi
          python -m tools.openva.rendered_discovery_runner "${ARGS[@]}"
      - name: Upload shard report
        uses: actions/upload-artifact@v6
        with:
          name: openva-discovery-mesh-shard-${{ matrix.shard }}
          path: reports/discovery-mesh/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [plan, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Download every shard report
        uses: actions/download-artifact@v6
        with:
          pattern: openva-discovery-mesh-shard-*
          path: reports/discovery-mesh/shards
          merge-multiple: true
      - name: Build rendered-discovery differential report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import UTC, datetime
          from pathlib import Path

          report_dir = Path("reports/discovery-mesh/shards")
          reports = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(report_dir.glob("shard-*.json"))
          ]
          if not reports:
              raise SystemExit("no shard reports available for rendered differential")

          metric_names = (
              "javascript_fallback_eligible_pages",
              "rendered_pages",
              "render_failures",
              "browser_requests",
              "browser_fulfilled_requests",
              "browser_blocked_requests",
              "browser_bytes_fulfilled",
              "rendered_locator_signal_count",
              "rendered_verified_candidate_count",
          )
          totals = {name: 0 for name in metric_names}
          reasons: Counter[str] = Counter()
          vendors_eligible = 0
          vendors_with_verified_candidates = 0
          for report in reports:
              summary = report.get("summary") or {}
              for name in metric_names:
                  totals[name] += int(summary.get(name) or 0)
              for frontier in report.get("source_frontier_reports", []) or []:
                  rendered = frontier.get("rendered_discovery") or {}
                  if int(rendered.get("javascript_fallback_eligible_pages") or 0) > 0:
                      vendors_eligible += 1
                  if int(rendered.get("rendered_verified_candidate_count") or 0) > 0:
                      vendors_with_verified_candidates += 1
                  reasons.update(
                      {
                          str(key): int(value)
                          for key, value in (rendered.get("reason_counts") or {}).items()
                      }
                  )

          output = {
              "schema_version": "0.1.0",
              "report_type": "rendered_discovery_differential",
              "generated_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "shard_report_count": len(reports),
              "baseline": "bounded_static_html_discovery",
              "differential": {
                  **totals,
                  "vendors_with_javascript_fallback_eligibility": vendors_eligible,
                  "vendors_with_rendered_verified_candidates": vendors_with_verified_candidates,
                  "eligibility_reason_counts": dict(sorted(reasons.items())),
              },
              "posture": {
                  "browser_direct_network_access": False,
                  "rendered_signals_are_catalog_facts": False,
                  "writes_canonical_sources": False,
                  "public_sources_only": True,
                  "non_advisory": True,
              },
          }
          output_path = Path("reports/discovery-mesh/rendered-discovery-differential.json")
          output_path.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("### Rendered discovery differential")
          print("")
          for key, value in output["differential"].items():
              if key != "eligibility_reason_counts":
                  print(f"- {key}: `{value}`")
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/discovery-mesh/rendered-discovery-differential.json").read_text(
                  encoding="utf-8"
              )
          )
          print("### Rendered discovery differential")
          print("")
          for key, value in report["differential"].items():
              print(f"- {key}: `{value}`")
          PY
      - name: Aggregate reports and stage noncanonical candidates
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p maintenance/generated reports/discovery-mesh
          python -m tools.openva.discovery_mesh_runner aggregate \
            --input-dir reports/discovery-mesh/shards \
            --write-candidates \
            --output reports/discovery-mesh/source-discovery-report.json \
            --identity-output "maintenance/generated/discovery-mesh-identity-signals-${RUN_KEY}.json" \
            --manifest-output "maintenance/generated/discovery-mesh-candidate-manifest-${RUN_KEY}.json"
          PLAN_PATH="maintenance/generated/strict-growth-discovery-mesh-promotion-plan-${RUN_KEY}.json"
          python -m tools.openva.promotion_planner plan \
            --discovery-report reports/discovery-mesh/source-discovery-report.json \
            --output "$PLAN_PATH"
          python -m tools.openva.candidate_promotion_actions filter-reviewed-plan \
            --promotion-plan "$PLAN_PATH" \
            --output "$PLAN_PATH" \
            --viability-report "maintenance/generated/discovery-mesh-promotion-viability-${RUN_KEY}.json"
      - name: Replenish stable vendor breadth state
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IDENTITY_REPORT="maintenance/generated/discovery-mesh-identity-signals-${RUN_KEY}.json"
          LEDGER="maintenance/generated/vendor-breadth-signal-ledger.json"
          QUEUE="maintenance/generated/vendor-breadth-resolution-queue.json"
          CANDIDATES="maintenance/generated/vendor-breadth-candidates.json"
          METRICS="maintenance/generated/vendor-breadth-provider-metrics.json"
          RUN_REPORT="reports/discovery-mesh/vendor-breadth-replenishment-run-${RUN_KEY}.json"
          python -m tools.openva.vendor_breadth_replenishment build \
            --relationship-report "$IDENTITY_REPORT" \
            --existing-ledger "$LEDGER" \
            --existing-queue "$QUEUE" \
            --existing-candidates "$CANDIDATES" \
            --existing-metrics "$METRICS" \
            --ledger-output "$LEDGER" \
            --queue-output "$QUEUE" \
            --candidate-output "$CANDIDATES" \
            --metrics-output "$METRICS" \
            --run-report-output "$RUN_REPORT" \
            --generated-at "$GENERATED_AT" \
            --root .
      - name: Build production health and intake decision
        if: github.event_name != 'push'
        id: health
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PLAN_PATH="maintenance/generated/strict-growth-discovery-mesh-promotion-plan-${RUN_KEY}.json"
          RUN_REPORT="reports/discovery-mesh/vendor-breadth-replenishment-run-${RUN_KEY}.json"
          HEALTH_JSON="reports/discovery-mesh/discovery-mesh-health-${RUN_KEY}.json"
          HEALTH_MD="reports/discovery-mesh/discovery-mesh-health-${RUN_KEY}.md"
          python -m tools.openva.discovery_mesh_health build \
            --root . \
            --source-discovery-report reports/discovery-mesh/source-discovery-report.json \
            --breadth-metrics maintenance/generated/vendor-breadth-provider-metrics.json \
            --breadth-queue maintenance/generated/vendor-breadth-resolution-queue.json \
            --breadth-candidates maintenance/generated/vendor-breadth-candidates.json \
            --promotion-plan "$PLAN_PATH" \
            --replenishment-run "$RUN_REPORT" \
            --generated-at "$GENERATED_AT" \
            --output-json "$HEALTH_JSON" \
            --output-md "$HEALTH_MD"
          INTAKE_NEEDED=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8"))["intake"]["intake_needed"]).lower())' "$HEALTH_JSON")
          HEALTH_STATUS=$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$HEALTH_JSON")
          case "$INTAKE_NEEDED" in true|false) ;; *) echo "invalid intake decision" >&2; exit 1 ;; esac
          echo "intake_needed=$INTAKE_NEEDED" >> "$GITHUB_OUTPUT"
          echo "health_status=$HEALTH_STATUS" >> "$GITHUB_OUTPUT"
          cat "$HEALTH_MD" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate staged candidate intake
        if: github.event_name != 'push'
        run: python -m tools.openva.validate validate
      - name: Publish read-only deployment smoke evidence
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_STATUS: deployment_smoke
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with merge commit ${GITHUB_SHA}; smoke evidence remains in artifacts."
            exit 0
          fi
          DIFFERENTIAL="reports/discovery-mesh/rendered-discovery-differential.json"
          BODY_FILE="$RUNNER_TEMP/rendered-discovery-smoke.md"
          python - "$DIFFERENTIAL" "$BODY_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          differential = report.get("differential") or {}
          lines = [
              "## Rendered discovery hosted smoke",
              "",
              "The read-only post-merge deployment smoke completed in the GitHub-hosted runner.",
              "",
              f"- Run: `{os.environ['GITHUB_RUN_ID']}` (attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`)",
              f"- Commit: `{os.environ['GITHUB_SHA']}`",
              "- Profile: `1 shard / 5-vendor diagnostic limit`",
              f"- Health status: `{os.environ.get('HEALTH_STATUS', 'unknown')}`",
              "- Candidate-intake mutation: `skipped for push smoke`",
              f"- Artifact: `openva-discovery-mesh-aggregate`",
              "",
              "### Static-to-rendered differential",
              "",
          ]
          for key, value in differential.items():
              lines.append(f"- {key}: `{json.dumps(value, sort_keys=True) if isinstance(value, dict) else value}`")
          lines.extend(
              [
                  "",
                  "This accepts the hosted deployment path only. Full-catalog production acceptance remains separate and requires an uncapped scheduled or manually dispatched run.",
              ]
          )
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
      - name: Record partitioned intake handoff
        if: github.event_name != 'push'
        env:
          INTAKE_NEEDED: ${{ steps.health.outputs.intake_needed }}
          HEALTH_STATUS: ${{ steps.health.outputs.health_status }}
        run: |
          set -euo pipefail
          {
            echo "### Partitioned intake handoff"
            echo ""
            echo "- Health status: \`${HEALTH_STATUS}\`"
            echo "- Intake needed: \`${INTAKE_NEEDED}\`"
            echo "- Aggregate artifact: \`openva-discovery-mesh-aggregate\`"
            if [ "$INTAKE_NEEDED" = "true" ]; then
              echo "- Next authority: \`discovery-mesh-intake-recovery.yml\` partitions the complete uncapped action set after this run completes."
            else
              echo "- Next authority: none; the health decision is a true no-op."
            fi
            echo "- Canonical mutation authority: unchanged; \`candidate-promotion-pr.yml\` remains sole authority."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-discovery-mesh-aggregate
          path: |
            reports/discovery-mesh/source-discovery-report.json
            reports/discovery-mesh/rendered-discovery-differential.json
            reports/discovery-mesh/vendor-breadth-replenishment-run-*.json
            reports/discovery-mesh/discovery-mesh-health-*.json
            reports/discovery-mesh/discovery-mesh-health-*.md
            maintenance/generated/*discovery-mesh*.json
            maintenance/generated/vendor-breadth-*.json
          if-no-files-found: warn
          retention-days: 30

  promotion-handoff:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'agent-discovery-mesh-intake-') &&
      github.event.pull_request.title == 'Ops: stage discovery mesh candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve exact merged discovery mesh plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --name-only \
            | grep '^maintenance/generated/strict-growth-discovery-mesh-.*promotion-plan-.*\.json$' \
            | sort -u > discovery-mesh-plan-paths.txt || true
          COUNT=$(wc -l < discovery-mesh-plan-paths.txt | tr -d ' ')
          if [ "$COUNT" = "0" ]; then
            echo "No discovery mesh promotion plan merged; nothing to dispatch."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$COUNT" != "1" ]; then
            echo "Expected exactly one discovery mesh promotion plan, found $COUNT" >&2
            cat discovery-mesh-plan-paths.txt >&2
            exit 1
          fi
          PLAN_PATH=$(cat discovery-mesh-plan-paths.txt)
          test -f "$PLAN_PATH" || { echo "Merged promotion plan missing: $PLAN_PATH" >&2; exit 1; }
          ACTION_COUNT=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8")).get("actions", []) or []))' "$PLAN_PATH")
          case "$ACTION_COUNT" in *[!0-9]*) echo "Invalid action count" >&2; exit 1 ;; esac
          if [ "$ACTION_COUNT" = "0" ]; then
            echo "Discovery mesh plan contains zero viable actions; no canonical mutation dispatch."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "plan_path=$PLAN_PATH" >> "$GITHUB_OUTPUT"
          echo "action_count=$ACTION_COUNT" >> "$GITHUB_OUTPUT"
      - name: Dispatch existing canonical mutation workflow
        if: steps.plan.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_PATH: ${{ steps.plan.outputs.plan_path }}
        run: |
          set -euo pipefail
          gh workflow run candidate-promotion-pr.yml \
            -f promotion_plan_mode=reviewed-path \
            -f promotion_plan_path="$PLAN_PATH" \
            -f pr_title="Catalog: apply reviewed candidate source promotion"
          {
            echo "### Discovery mesh promotion handoff"
            echo ""
            echo "- Plan: \`$PLAN_PATH\`"
            echo "- Actions: \`${{ steps.plan.outputs.action_count }}\`"
            echo "- Mutation authority: \`candidate-promotion-pr.yml\`"
            echo "- Catalog breadth cap: none"
          } >> "$GITHUB_STEP_SUMMARY"
