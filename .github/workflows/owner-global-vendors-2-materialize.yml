name: repair owner global vendor categories

on:
  push:
    branches:
      - catalog/owner-global-vendors-3
    paths:
      - .github/workflows/owner-global-vendors-2-materialize.yml

permissions:
  contents: write

concurrency:
  group: owner-global-vendors-3-category-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-global-vendors-3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Align new vendors to controlled category taxonomy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          updates = {
              Path('data/vendors/docebo/vendor.yaml'): ['education_systems'],
              Path('data/vendors/red-hat/vendor.yaml'): ['developer_platform', 'cloud_infrastructure'],
          }
          for path, categories in updates.items():
              record = yaml.safe_load(path.read_text(encoding='utf-8'))
              record['vendor_categories'] = categories
              path.write_text(yaml.safe_dump(record, sort_keys=False, allow_unicode=True), encoding='utf-8')
          PY

          python -m tools.openva.validate build-indexes
          python -m tools.openva.validate validate
          pytest -q tests/test_source_*.py tests/test_p0_repair_automerge_workflow.py tests/test_release_candidate_workflow.py --tb=short
      - name: Remove temporary diagnostic and workflow
        run: |
          rm maintenance/generated/pr-667-merge-ref-diagnostic.md
          rm .github/workflows/owner-global-vendors-2-materialize.yml
      - name: Commit repaired catalog state
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: align five-vendor tranche categories'
          git push origin HEAD:catalog/owner-global-vendors-3
