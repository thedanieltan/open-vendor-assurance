name: owner global vendors materializer

on:
  push:
    branches:
      - catalog/owner-global-vendors-3
    paths:
      - catalog-batches/owner-global-vendors-3.yaml
      - .github/workflows/owner-global-vendors-2-materialize.yml

permissions:
  contents: write

concurrency:
  group: owner-global-vendors-3-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-global-vendors-3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Generate catalog or capture diagnostic
        id: generate
        shell: bash
        run: |
          set +e
          python -m tools.openva.catalog_batch catalog-batches/owner-global-vendors-3.yaml --build-indexes > /tmp/materializer.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p maintenance/generated
            {
              echo '# Owner global vendors 3 materializer diagnostic'
              echo
              echo 'The catalog generator exited non-zero.'
              echo
              echo '```text'
              tail -n 200 /tmp/materializer.log
              echo '```'
            } > maintenance/generated/owner-global-vendors-3-materializer-diagnostic.md
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          else
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Remove one-time inputs after successful generation
        if: steps.generate.outputs.generated == 'true'
        run: |
          rm catalog-batches/owner-global-vendors-3.yaml
          rm .github/workflows/owner-global-vendors-2-materialize.yml
      - name: Commit generation result
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materializer output was produced.'
            exit 1
          fi
          if [ "${{ steps.generate.outputs.generated }}" = 'true' ]; then
            git commit -m 'Catalog: add ten global vendors'
          else
            git commit -m 'Catalog: capture ten-vendor materializer failure'
          fi
          git push origin HEAD:catalog/owner-global-vendors-3
      - name: Fail after publishing diagnostic
        if: steps.generate.outputs.generated != 'true'
        run: exit 1
