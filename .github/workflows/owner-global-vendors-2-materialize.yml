name: owner catalog expansion seed audit

on:
  push:
    branches:
      - catalog/owner-completeness-and-scale-500
    paths:
      - .github/workflows/owner-global-vendors-2-materialize.yml
      - maintenance/generated/owner-scale-500-trigger.txt

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-completeness-and-scale-500
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Build seed and candidate reports
        run: |
          python -m tools.openva.vendor_candidate_discovery validate-seeds --output maintenance/generated/owner-scale-500-seed-validation.json
          python -m tools.openva.vendor_candidate_discovery discover --output maintenance/generated/owner-scale-500-candidates.json
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maintenance/generated/owner-scale-500-*.json
          git commit -m 'Catalog: capture expansion seed capacity'
          git push origin HEAD:catalog/owner-completeness-and-scale-500
# registered-trigger
