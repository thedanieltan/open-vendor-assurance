name: owner global vendors 2 materializer

on:
  push:
    branches:
      - catalog/owner-global-vendors-2
    paths:
      - catalog-batches/owner-global-vendors-2.yaml
      - .github/workflows/owner-global-vendors-2-materialize.yml

permissions:
  contents: write

concurrency:
  group: owner-global-vendors-2-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-global-vendors-2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Materialize new vendors and rebuild derived catalog outputs
        run: python -m tools.openva.catalog_batch catalog-batches/owner-global-vendors-2.yaml --build-indexes
      - name: Observe only the new source records
        shell: bash
        run: |
          find \
            data/vendors/circleci/sources \
            data/vendors/brevo/sources \
            data/vendors/eset/sources \
            data/vendors/bitdefender/sources \
            data/vendors/trend-micro/sources \
            -type f -name '*.yaml' | sort > /tmp/owner-global-vendors-2-source-paths.txt

          python -m tools.openva.source_verification verify \
            --source-path-file /tmp/owner-global-vendors-2-source-paths.txt \
            --output /tmp/owner-global-vendors-2-verification.json

          baseline_args=()
          if [ -f maintenance/source-observations/latest-observations.json ]; then
            baseline_args=(--baseline maintenance/source-observations/latest-observations.json)
          fi

          python -m tools.openva.observation_ledger build \
            --verification-report /tmp/owner-global-vendors-2-verification.json \
            --output-dir /tmp/owner-global-vendors-2-observations \
            --run-id owner-global-vendors-2 \
            "${baseline_args[@]}"

          python -m tools.openva.observation_ledger append \
            --delta /tmp/owner-global-vendors-2-observations/observation-ledger-delta.ndjson

          python -m tools.openva.observation_ledger install-latest \
            --latest /tmp/owner-global-vendors-2-observations/latest-observations.json
      - name: Validate generated catalog state
        run: |
          python -m tools.openva.validate validate
          python -m pytest -q \
            tests/test_catalog_guard.py \
            tests/test_source_type_labels.py \
            tests/test_generated_exports.py \
            tests/test_source_observation_ledger.py
      - name: Remove one-time materialization inputs
        run: |
          rm catalog-batches/owner-global-vendors-2.yaml
          rm .github/workflows/owner-global-vendors-2-materialize.yml
      - name: Commit materialized new-vendor records
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated catalog changes were produced.'
            exit 1
          fi
          git commit -m 'Catalog: add five global vendors'
          git push origin HEAD:catalog/owner-global-vendors-2
