name: owner global vendors validation

on:
  push:
    branches:
      - catalog/owner-global-vendors-3
    paths:
      - .github/workflows/owner-global-vendors-2-materialize.yml

permissions:
  contents: write

concurrency:
  group: owner-global-vendors-3-validation
  cancel-in-progress: false

jobs:
  validate-tranche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-global-vendors-3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Observe new sources and validate catalog
        id: validate
        shell: bash
        run: |
          set +e
          {
            find \
              data/vendors/f-secure/sources \
              data/vendors/withsecure/sources \
              data/vendors/jetbrains/sources \
              data/vendors/red-hat/sources \
              data/vendors/docebo/sources \
              -type f -name '*.yaml' | sort > /tmp/owner-global-vendors-3-source-paths.txt

            python -m tools.openva.source_verification verify \
              --source-path-file /tmp/owner-global-vendors-3-source-paths.txt \
              --output /tmp/owner-global-vendors-3-verification.json

            baseline_args=()
            if [ -f maintenance/source-observations/latest-observations.json ]; then
              baseline_args=(--baseline maintenance/source-observations/latest-observations.json)
            fi

            python -m tools.openva.observation_ledger build \
              --verification-report /tmp/owner-global-vendors-3-verification.json \
              --output-dir /tmp/owner-global-vendors-3-observations \
              --run-id owner-global-vendors-3 \
              "${baseline_args[@]}"

            python -m tools.openva.observation_ledger install-latest \
              --latest /tmp/owner-global-vendors-3-observations/latest-observations.json

            python -m tools.openva.validate validate
            python -m pytest -q \
              tests/test_catalog_guard.py \
              tests/test_source_type_labels.py \
              tests/test_generated_exports.py \
              tests/test_source_observation_ledger.py
          } > /tmp/validation.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p maintenance/generated
            {
              echo '# Owner global vendors 3 validation diagnostic'
              echo
              echo 'The observation or validation lane exited non-zero.'
              echo
              echo '```text'
              tail -n 250 /tmp/validation.log
              echo '```'
            } > maintenance/generated/owner-global-vendors-3-validation-diagnostic.md
            echo 'validated=false' >> "$GITHUB_OUTPUT"
          else
            echo 'validated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Remove one-time workflow after successful validation
        if: steps.validate.outputs.validated == 'true'
        run: rm .github/workflows/owner-global-vendors-2-materialize.yml
      - name: Commit validation result
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No validation output was produced.'
            exit 1
          fi
          if [ "${{ steps.validate.outputs.validated }}" = 'true' ]; then
            git commit -m 'Catalog: validate five global vendors'
          else
            git commit -m 'Catalog: capture five-vendor validation failure'
          fi
          git push origin HEAD:catalog/owner-global-vendors-3
      - name: Fail after publishing diagnostic
        if: steps.validate.outputs.validated != 'true'
        run: exit 1
