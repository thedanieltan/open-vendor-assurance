name: workspace-fast-diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_workflow_retirement.py
          - tests/test_workflow_retirement_enforcement.py
          - tests/test_pr_scope_guard.py
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run focused test
        run: pytest -q -vv "${{ matrix.test_file }}"
