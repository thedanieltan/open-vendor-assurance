name: source-completion-page-purpose-audit

on:
  pull_request:
    branches:
      - catalog/source-completion-audit-control
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: source-completion-page-purpose-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'catalog/owner-source-completion-1-builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install PyYAML
      - name: Audit source page purpose
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          import yaml

          root = Path('.')
          audit_path = root / '.owner-source-completion-1/results/adversarial-audit.json'
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          editorial_segments = {
              'blog', 'blogs', 'article', 'articles', 'news', 'press', 'faq', 'faqs',
              'webinar', 'webinars', 'event', 'events', 'academy', 'learn', 'podcast',
              'case-study', 'case-studies', 'customer-stories', 'integrations', 'marketplace'
          }
          user_content_markers = {'@', 'community', 'forum', 'forums'}
          purpose_terms = {
              'dpa': {'dpa', 'data-processing', 'data-processing-agreement', 'data-processing-addendum'},
              'subprocessors_list': {'subprocessor', 'subprocessors', 'sub-processors', 'third-party-processors'},
              'privacy_notice': {'privacy', 'privacy-policy', 'privacy-notice'},
              'security_page': {'security', 'trust', 'secure'},
              'trust_center': {'trust', 'trust-center', 'trustcenter', 'security'},
              'compliance_page': {'compliance', 'trust', 'security', 'soc', 'iso', 'certification'},
              'certification_reference': {'certification', 'certifications', 'certificate', 'certificates', 'soc2', 'iso27001', 'iso-27001', 'compliance', 'trust'},
          }
          specialized = set(purpose_terms)

          def shape(url):
              parsed = urlsplit(str(url or ''))
              host = (parsed.hostname or '').lower().removeprefix('www.')
              segments = [part.lower() for part in parsed.path.split('/') if part]
              path_text = '-'.join(segments)
              return parsed, host, segments, path_text

          rows = []
          for source in audit.get('sources') or []:
              source_type = str(source.get('source_type') or '')
              vendor_id = str(source.get('vendor_id') or '')
              vendor_path = root / 'data' / 'vendors' / vendor_id / 'vendor.yaml'
              vendor = yaml.safe_load(vendor_path.read_text(encoding='utf-8')) if vendor_path.exists() else {}
              official = {str(item).lower().removeprefix('www.') for item in (vendor.get('official_domains') or [])}
              source_parsed, source_host, source_segments, source_text = shape(source.get('source_url'))
              final_parsed, final_host, final_segments, final_text = shape(source.get('final_url'))
              combined_segments = source_segments + final_segments
              combined_text = f'{source_text}-{final_text}'
              specialized_subdomain = any(
                  token in final_host.split('.')[0]
                  for token in ('trust', 'security', 'compliance', 'privacy', 'legal')
              )
              primary_homepage = not source_segments and source_host in official
              final_primary_homepage = not final_segments and final_host in official
              editorial_hits = sorted(set(combined_segments) & editorial_segments)
              user_content = (
                  '@' in source_parsed.path
                  or '@' in final_parsed.path
                  or bool(set(combined_segments) & user_content_markers)
              )
              purpose_hit = any(term in combined_text for term in purpose_terms.get(source_type, set()))
              title = ' '.join(str(source.get('title_detected') or '').lower().split())
              reasons = []
              if source_type in specialized and primary_homepage and not specialized_subdomain:
                  reasons.append('generic_primary_homepage')
              if source_type in specialized and final_primary_homepage and not specialized_subdomain:
                  reasons.append('generic_final_homepage')
              if editorial_hits:
                  reasons.append('editorial_or_marketplace_path')
              if user_content:
                  reasons.append('user_generated_or_community_path')
              if source_type in specialized and combined_segments and not purpose_hit and not specialized_subdomain:
                  reasons.append('path_lacks_source_purpose_term')
              if source.get('verification_status') not in {'ok', 'redirected'}:
                  reasons.append('verification_requires_review')
              if (source.get('semantic_match') or {}).get('status') != 'strong':
                  reasons.append('semantic_not_strong')
              if source.get('soft_404_detected') or title.startswith(('404', 'not found', 'page not found')):
                  reasons.append('not_found_surface')
              if source_host != final_host and source.get('verification_status') == 'redirected' and not specialized_subdomain:
                  reasons.append('redirected_to_different_non_specialized_host')
              if reasons:
                  rows.append({
                      'vendor_id': vendor_id,
                      'source_id': source.get('source_id'),
                      'source_type': source_type,
                      'source_url': source.get('source_url'),
                      'final_url': source.get('final_url'),
                      'title_detected': source.get('title_detected'),
                      'verification_status': source.get('verification_status'),
                      'semantic_match': source.get('semantic_match'),
                      'reasons': sorted(set(reasons)),
                      'editorial_segments': editorial_hits,
                      'source_host': source_host,
                      'final_host': final_host,
                      'official_domains': sorted(official),
                  })
          rows.sort(key=lambda row: (row['vendor_id'], row['source_id']))
          output = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_completion_page_purpose_audit',
              'base_commit': audit.get('base_commit'),
              'summary': {
                  'added_sources_evaluated': len(audit.get('sources') or []),
                  'suspicious_page_purpose_count': len(rows),
                  'generic_homepage_count': sum(any(reason in {'generic_primary_homepage', 'generic_final_homepage'} for reason in row['reasons']) for row in rows),
                  'editorial_or_marketplace_count': sum('editorial_or_marketplace_path' in row['reasons'] for row in rows),
                  'user_generated_or_community_count': sum('user_generated_or_community_path' in row['reasons'] for row in rows),
                  'verification_review_count': sum('verification_requires_review' in row['reasons'] for row in rows),
                  'semantic_not_strong_count': sum('semantic_not_strong' in row['reasons'] for row in rows),
              },
              'sources': rows,
              'not_advice': True,
          }
          output_path = root / '.owner-source-completion-1/results/page-purpose-audit.json'
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(output, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(output['summary'], indent=2, sort_keys=True))
          PY
      - name: Remove superseded branch-local audit files
        run: |
          rm -f .github/workflows/owner-source-completion-1-path-audit.yml
          rm -f .owner-source-completion-1/path-audit-trigger.txt
      - name: Commit audit report to builder branch
        run: |
          git config user.name 'openva-owner-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Catalog: audit completed source page purpose'
          git push origin HEAD:catalog/owner-source-completion-1-builder
