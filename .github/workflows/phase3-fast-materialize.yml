name: phase3-fast-materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase3-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Execute materialization steps with diagnostics
        id: materialize
        shell: bash
        run: |
          set +e
          python - <<'PY' > phase3-materialize.log 2>&1
          import subprocess
          from pathlib import Path

          raw = Path('.github/workflows/phase3-materialize.yml').read_text(encoding='utf-8')
          names = [
              'Extend homepage metadata and visible direct answers',
              'Extend deterministic discovery output',
              'Add discoverability acceptance tests',
          ]
          for index, name in enumerate(names):
              marker = f'      - name: {name}\n        run: |\n'
              start = raw.index(marker) + len(marker)
              next_positions = [
                  raw.find(f'\n      - name: {candidate}', start)
                  for candidate in names[index + 1:]
              ]
              next_positions.extend([
                  raw.find('\n      - name: Validate generated discovery surface', start),
                  raw.find('\n      - name: Commit phase 3 implementation', start),
              ])
              ends = [position for position in next_positions if position >= 0]
              end = min(ends) if ends else len(raw)
              block = raw[start:end]
              script_lines = []
              for line in block.splitlines():
                  script_lines.append(line[10:] if line.startswith('          ') else line)
              script = '\n'.join(script_lines) + '\n'
              print(f'RUNNING: {name}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 180 phase3-materialize.log > phase3-tail.log
          cat phase3-tail.log
          exit 0
      - name: Post diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- phase3-materializer-diagnostic -->'
            echo '### Phase 3 materializer diagnostic'
            echo '```text'
            cat phase3-tail.log
            echo '```'
          } > phase3-comment.md
          gh pr comment 660 --body-file phase3-comment.md
      - name: Commit materialized publication surface
        if: steps.materialize.outputs.exit_code == '0'
        run: |
          git rm .github/workflows/phase3-fast-materialize.yml
          git config user.name 'openva-publication-maintainer'
          git config user.email 'openva-publication-maintainer@users.noreply.github.com'
          git add site/src/index.html site/src/styles.css tools/openva/site_discovery.py tests/test_discoverability.py
          python -m py_compile tools/openva/site_discovery.py tests/test_discoverability.py
          git commit -m 'Site: add SEO AEO and GEO discovery surfaces [phase3-materialized]'
          git push origin HEAD:site/seo-aeo-geo-phase3
      - name: Enforce materialization result
        run: exit "${{ steps.materialize.outputs.exit_code }}"
