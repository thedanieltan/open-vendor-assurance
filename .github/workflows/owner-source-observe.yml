name: owner-catalog-rebuild

on:
  push:
    branches:
      - catalog/owner-security-identity-expansion-1

permissions:
  contents: write

concurrency:
  group: owner-catalog-rebuild-security-identity-1
  cancel-in-progress: true

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[rebuilt]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Rebuild generated catalog outputs
        run: python -m tools.openva.validate build-indexes
      - name: Validate catalog
        run: python -m tools.openva.validate validate
      - name: Run focused catalog tests
        run: pytest -q tests/test_catalog_guard.py tests/test_source_type_labels.py tests/test_generated_exports.py
      - name: Commit rebuilt outputs
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add indexes dist openva-pack.json
          if git diff --cached --quiet; then
            echo 'Generated outputs already current.'
            exit 0
          fi
          git commit -m 'Catalog: rebuild outputs after Wiz privacy entrypoint repair [rebuilt]'
          git push
