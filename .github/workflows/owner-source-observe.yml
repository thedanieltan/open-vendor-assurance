name: owner-source-observe

on:
  push:
    branches:
      - catalog/owner-security-identity-expansion-1

permissions:
  contents: write

jobs:
  observe:
    if: ${{ !contains(github.event.head_commit.message, '[observed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Select new sources
        run: |
          cat > owner-source-paths.txt <<'EOF'
          data/vendors/cyberark/sources/cyberark-trust-center.yaml
          data/vendors/cyberark/sources/cyberark-privacy-notice.yaml
          data/vendors/cyberark/sources/cyberark-website-terms.yaml
          data/vendors/cyberark/sources/cyberark-subprocessors.yaml
          data/vendors/wiz/sources/wiz-trust-center.yaml
          data/vendors/wiz/sources/wiz-privacy-notice.yaml
          data/vendors/wiz/sources/wiz-subprocessors.yaml
          data/vendors/wiz/sources/wiz-status.yaml
          data/vendors/darktrace/sources/darktrace-trust-center.yaml
          data/vendors/darktrace/sources/darktrace-privacy-notice.yaml
          data/vendors/darktrace/sources/darktrace-subprocessors.yaml
          data/vendors/darktrace/sources/darktrace-master-services-agreement.yaml
          data/vendors/sophos/sources/sophos-trust-center.yaml
          data/vendors/sophos/sources/sophos-privacy-notice.yaml
          data/vendors/sophos/sources/sophos-compliance.yaml
          data/vendors/sophos/sources/sophos-status.yaml
          EOF
      - name: Verify selected public sources
        run: |
          python -m tools.openva.source_verification verify \
            --source-path-file owner-source-paths.txt \
            --output owner-source-verification-report.json
      - name: Build latest observation projection
        run: |
          python -m tools.openva.observation_ledger build \
            --verification-report owner-source-verification-report.json \
            --run-id "owner-${{ github.run_id }}" \
            --baseline maintenance/source-observations/latest-observations.json \
            --output-dir owner-observation
          cp owner-observation/latest-observations.json maintenance/source-observations/latest-observations.json
      - name: Show new-source outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          selected = {
              Path(line).stem
              for line in Path('owner-source-paths.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          }
          report = json.loads(Path('maintenance/source-observations/latest-observations.json').read_text(encoding='utf-8'))
          for row in report.get('sources', []):
              if row.get('source_id') in selected:
                  print(json.dumps({
                      'source_id': row.get('source_id'),
                      'http_status': row.get('http_status'),
                      'source_health_status': row.get('source_health_status'),
                      'final_url': row.get('final_url'),
                      'review_signal': row.get('review_signal'),
                  }, sort_keys=True))
      - name: Commit observation baseline
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-observer'
          git config user.email 'openva-owner-observer@users.noreply.github.com'
          git add maintenance/source-observations/latest-observations.json
          git commit -m 'Catalog: observe owner-led security and identity sources [observed]'
          git push
