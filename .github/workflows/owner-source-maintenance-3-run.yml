name: owner-source-maintenance-3-run

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-run
  cancel-in-progress: true

jobs:
  transaction:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-complete]') && !contains(github.event.head_commit.message, '[owner-maintenance-3-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        id: install
        continue-on-error: true
        run: pip install -e '.[dev]' 2>&1 | tee /tmp/owner-maintenance-install.log
      - name: Apply evidence-backed repairs
        id: apply
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/owner-maintenance-apply.log
          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          import yaml

          from tools.openva.catalog_lifecycle import change_event
          from tools.openva.indexes import build_indexes

          root = Path('.')
          plan = json.loads((root / 'maintenance/reviewed/owner-source-maintenance-3-plan.json').read_text(encoding='utf-8'))
          classification = json.loads((root / 'maintenance/reviewed/owner-source-maintenance-3-classification.json').read_text(encoding='utf-8'))
          replacements = {str(key): str(value) for key, value in plan['replacements'].items()}
          collected_at = str(plan['collected_at'])
          batch_id = str(plan['batch_id'])

          align_ids = {
              str(row['source_id'])
              for row in classification.get('candidates', [])
              if row.get('recommended_action') == 'align_artifact_to_source'
          }
          observation_ids = {
              str(row['source_id'])
              for row in classification.get('candidates', [])
              if row.get('recommended_action') == 'refresh_observation_only'
          }
          mutation_ids = sorted(align_ids | set(replacements))
          verification_ids = sorted(set(replacements) | observation_ids)

          for label, actual, expected in (
              ('artifact_alignments', len(align_ids), 40),
              ('replacement_urls', len(replacements), 10),
              ('observation_refreshes', len(observation_ids), 4),
          ):
              if actual != expected:
                  raise RuntimeError(f'{label}: expected {expected}, found {actual}')

          source_paths: dict[str, Path] = {}
          sources: dict[str, dict[str, Any]] = {}
          for path in sorted((root / 'data/vendors').glob('*/sources/*.yaml')):
              record = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              source_id = str(record.get('source_id') or '')
              if source_id:
                  source_paths[source_id] = path
                  sources[source_id] = record

          artifact_paths: dict[str, list[Path]] = {}
          artifacts: dict[Path, dict[str, Any]] = {}
          for path in sorted((root / 'data/vendors').glob('*/artifacts/*.yaml')):
              record = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              source_id = str(record.get('source_id') or '')
              if source_id:
                  artifact_paths.setdefault(source_id, []).append(path)
                  artifacts[path] = record

          missing = sorted((set(mutation_ids) | set(verification_ids)) - set(source_paths))
          if missing:
              raise RuntimeError(f'missing source records: {missing}')

          def write_yaml(path: Path, payload: dict[str, Any]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(yaml.safe_dump(payload, sort_keys=False, allow_unicode=True), encoding='utf-8')

          touched_vendors: set[str] = set()
          mutations = []
          for source_id in mutation_ids:
              source_path = source_paths[source_id]
              source = dict(sources[source_id])
              vendor_id = str(source.get('vendor_id') or source_path.parents[1].name)
              linked_artifacts = artifact_paths.get(source_id, [])
              if not linked_artifacts:
                  raise RuntimeError(f'{source_id}: no artifact record references this source')

              old_url = str(source.get('source_url') or '')
              new_url = replacements.get(source_id, old_url)
              if not new_url.startswith('https://'):
                  raise RuntimeError(f'{source_id}: maintained URL must be HTTPS: {new_url}')

              source['source_url'] = new_url
              provenance = dict(source.get('provenance') or {})
              provenance['publisher'] = provenance.get('publisher') or 'vendor'
              provenance['collected_at'] = collected_at
              provenance['observer'] = 'hybrid'
              provenance['confidence'] = provenance.get('confidence') or 'high'
              source['provenance'] = provenance
              source['not_advice'] = True
              write_yaml(source_path, source)

              artifact_ids = []
              for artifact_path in linked_artifacts:
                  artifact = dict(artifacts[artifact_path])
                  artifact['canonical_url'] = new_url
                  artifact['not_advice'] = True
                  write_yaml(artifact_path, artifact)
                  artifact_ids.append(str(artifact.get('artifact_id') or artifact_path.stem))

              change_path = source_path.parents[1] / 'changes' / f'{batch_id}-{source_id}.yaml'
              summary = (
                  'Owner-led catalog maintenance replaced a confirmed broken public source URL and aligned its artifact metadata.'
                  if source_id in replacements
                  else 'Owner-led catalog maintenance aligned stale artifact metadata to the live canonical public source URL.'
              )
              write_yaml(
                  change_path,
                  change_event(
                      change_id=f'{batch_id}-{source_id}',
                      vendor_id=vendor_id,
                      source_id=source_id,
                      artifact_id=artifact_ids[0],
                      change_type='updated',
                      detected_at=collected_at,
                      summary=summary,
                  ),
              )
              touched_vendors.add(vendor_id)
              mutations.append({
                  'vendor_id': vendor_id,
                  'source_id': source_id,
                  'old_url': old_url,
                  'new_url': new_url,
                  'replacement': source_id in replacements,
                  'artifact_ids': artifact_ids,
              })

          build_indexes()
          Path('/tmp/owner-source-paths.txt').write_text(
              '\n'.join(source_paths[source_id].as_posix() for source_id in verification_ids) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/owner-replacement-source-ids.txt').write_text(
              '\n'.join(sorted(replacements)) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/owner-source-mutation-report.json').write_text(
              json.dumps({
                  'batch_id': batch_id,
                  'artifact_alignments': len(align_ids),
                  'replacement_urls': len(replacements),
                  'observation_refreshes': len(observation_ids),
                  'network_verification_sources': len(verification_ids),
                  'touched_vendors': sorted(touched_vendors),
                  'mutations': mutations,
                  'not_advice': True,
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'artifact_alignments': len(align_ids),
              'replacement_urls': len(replacements),
              'observation_refreshes': len(observation_ids),
              'network_verification_sources': len(verification_ids),
              'touched_vendors': len(touched_vendors),
          }, indent=2, sort_keys=True))
          PY
      - name: Verify changed and observed sources
        id: verify
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m tools.openva.source_verification verify \
              --source-path-file /tmp/owner-source-paths.txt \
              --output /tmp/owner-source-verification-report.json
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/owner-source-verification-report.json').read_text(encoding='utf-8'))
          plan = json.loads(Path('maintenance/reviewed/owner-source-maintenance-3-plan.json').read_text(encoding='utf-8'))
          replacement_ids = {
              line.strip()
              for line in Path('/tmp/owner-replacement-source-ids.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          }
          exceptions = set(plan.get('verification_exceptions', {}))
          by_id = {str(row.get('source_id')): row for row in report.get('sources', [])}
          missing = sorted(replacement_ids - set(by_id))
          if missing:
              raise RuntimeError(f'replacement verification rows missing: {missing}')

          acceptable = {'ok', 'redirected', 'bot_protected', 'forbidden_unknown', 'rate_limited'}

          def accepted(source_id: str) -> bool:
              row = by_id[source_id]
              if row.get('verification_status') in acceptable:
                  return True
              if source_id not in exceptions or row.get('http_status') not in {200, 203, 206}:
                  return False
              source_url = str(row.get('source_url') or '').rstrip('/')
              final_url = str(row.get('final_url') or '').rstrip('/')
              return bool(source_url and source_url == final_url)

          failures = [
              {
                  'source_id': source_id,
                  'status': by_id[source_id].get('verification_status'),
                  'http_status': by_id[source_id].get('http_status'),
                  'source_url': by_id[source_id].get('source_url'),
                  'final_url': by_id[source_id].get('final_url'),
                  'semantic_match': by_id[source_id].get('semantic_match'),
                  'fetch_error': by_id[source_id].get('fetch_error'),
              }
              for source_id in sorted(replacement_ids)
              if not accepted(source_id)
          ]
          if failures:
              print(json.dumps(failures, indent=2, sort_keys=True))
              raise RuntimeError('one or more replacement URLs failed authority-bound verification')
          print(json.dumps({
              'replacement_urls_verified': len(replacement_ids),
              'reviewed_exceptions_used': sorted(
                  source_id for source_id in replacement_ids
                  if source_id in exceptions and by_id[source_id].get('verification_status') not in acceptable
              ),
              'statuses': {
                  source_id: by_id[source_id].get('verification_status')
                  for source_id in sorted(replacement_ids)
              },
          }, indent=2, sort_keys=True))
          PY
          } 2>&1 | tee /tmp/owner-maintenance-verify.log
      - name: Build latest observation projection
        id: observe
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m tools.openva.observation_ledger build \
              --verification-report /tmp/owner-source-verification-report.json \
              --run-id "owner-maintenance-3-${{ github.run_id }}" \
              --baseline maintenance/source-observations/latest-observations.json \
              --output-dir /tmp/owner-observation
            python -m tools.openva.observation_ledger install-latest \
              --latest /tmp/owner-observation/latest-observations.json \
              --out maintenance/source-observations/latest-observations.json
          } 2>&1 | tee /tmp/owner-maintenance-observe.log
      - name: Validate maintained catalog
        id: validate
        if: steps.observe.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m tools.openva.validate validate
            python -m tools.openva.catalog_audit audit --enforce
            pytest -q \
              tests/test_catalog_guard.py \
              tests/test_source_type_labels.py \
              tests/test_generated_exports.py \
              tests/test_source_verification.py \
              tests/test_observation_ledger.py \
              tests/test_catalog_audit.py
          } 2>&1 | tee /tmp/owner-maintenance-validate.log
      - name: Commit maintained catalog
        id: commit
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            git config user.name 'openva-owner-catalog'
            git config user.email 'openva-owner-catalog@users.noreply.github.com'
            git add \
              data/vendors \
              dist/vendors \
              indexes \
              openva-pack.json \
              maintenance/source-observations/latest-observations.json
            git diff --cached --stat
            if git diff --cached --quiet; then
              echo 'No catalog changes were produced.' >&2
              exit 1
            fi
            git commit -m 'Catalog: repair and observe confirmed vendor source links [owner-maintenance-3-complete]'
            git pull --rebase origin catalog/owner-source-maintenance-3
            git push
          } 2>&1 | tee /tmp/owner-maintenance-commit.log
      - name: Preserve fail-closed diagnostic
        if: always() && steps.commit.outcome != 'success'
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p maintenance/reviewed
          INSTALL_OUTCOME='${{ steps.install.outcome }}' \
          APPLY_OUTCOME='${{ steps.apply.outcome }}' \
          VERIFY_OUTCOME='${{ steps.verify.outcome }}' \
          OBSERVE_OUTCOME='${{ steps.observe.outcome }}' \
          VALIDATE_OUTCOME='${{ steps.validate.outcome }}' \
          COMMIT_OUTCOME='${{ steps.commit.outcome }}' \
          RUN_ID='${{ github.run_id }}' \
          HEAD_SHA='${{ github.sha }}' \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcomes = {
              'install': os.environ['INSTALL_OUTCOME'],
              'apply': os.environ['APPLY_OUTCOME'],
              'verify': os.environ['VERIFY_OUTCOME'],
              'observe': os.environ['OBSERVE_OUTCOME'],
              'validate': os.environ['VALIDATE_OUTCOME'],
              'commit': os.environ['COMMIT_OUTCOME'],
          }
          failed_stage = next(
              (stage for stage in ('install', 'apply', 'verify', 'observe', 'validate', 'commit') if outcomes[stage] == 'failure'),
              'not_run',
          )
          logs = {}
          for stage in outcomes:
              path = Path(f'/tmp/owner-maintenance-{stage}.log')
              if path.exists():
                  logs[stage] = path.read_text(encoding='utf-8', errors='replace')[-30000:]
          report = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_transaction_diagnostic',
              'failed_stage': failed_stage,
              'step_outcomes': outcomes,
              'run_id': os.environ['RUN_ID'],
              'head_sha': os.environ['HEAD_SHA'],
              'logs': logs,
              'not_advice': True,
          }
          Path('maintenance/reviewed/owner-source-maintenance-3-diagnostic.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add maintenance/reviewed/owner-source-maintenance-3-diagnostic.json
          git commit -m 'Catalog: preserve source maintenance diagnostic [owner-maintenance-3-diagnostic]'
          git pull --rebase origin catalog/owner-source-maintenance-3
          git push
          exit 1
