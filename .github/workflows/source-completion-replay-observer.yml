name: source-completion-replay-observer

on:
  push:
    branches:
      - catalog/source-completion-audit-control

permissions:
  actions: read
  contents: write

concurrency:
  group: source-completion-replay-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - name: Poll matching replay run to completion
        run: |
          set -euo pipefail
          run_id=''
          status=''
          conclusion=''
          html_url=''
          for attempt in $(seq 1 180); do
            payload="$(gh api "repos/$REPO/actions/workflows/source-completion-registry-and-replay.yml/runs?event=push&branch=catalog/source-completion-audit-control&per_page=20")"
            row="$(printf '%s' "$payload" | jq -c --arg sha "$CONTROL_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | first // empty')"
            if [ -n "$row" ]; then
              run_id="$(printf '%s' "$row" | jq -r '.id')"
              status="$(printf '%s' "$row" | jq -r '.status')"
              conclusion="$(printf '%s' "$row" | jq -r '.conclusion // ""')"
              html_url="$(printf '%s' "$row" | jq -r '.html_url')"
              echo "Replay run $run_id status=$status conclusion=$conclusion"
              if [ "$status" = 'completed' ]; then
                break
              fi
            fi
            sleep 20
          done
          if [ -z "$run_id" ] || [ "$status" != 'completed' ]; then
            echo 'Replay run did not reach a completed state within observer bounds.'
            exit 1
          fi
          mkdir -p /tmp/replay-observer
          jq -n \
            --arg control_sha "$CONTROL_SHA" \
            --argjson run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg html_url "$html_url" \
            '{schema_version:"0.1.0",report_type:"source_completion_replay_outcome",control_sha:$control_sha,run_id:$run_id,status:$status,conclusion:$conclusion,html_url:$html_url,not_advice:true}' \
            > /tmp/replay-observer/outcome.json
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
          fetch-depth: 0
      - name: Record outcome on latest builder head
        run: |
          git fetch origin catalog/owner-source-completion-1-builder
          git reset --hard origin/catalog/owner-source-completion-1-builder
          mkdir -p .owner-source-completion-1/results
          cp /tmp/replay-observer/outcome.json .owner-source-completion-1/results/replay-outcome.json
          git config user.name 'openva-owner-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .owner-source-completion-1/results/replay-outcome.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Catalog: record source completion replay outcome'
          git push origin HEAD:catalog/owner-source-completion-1-builder
