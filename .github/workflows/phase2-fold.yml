name: phase2-fold

on:
  push:
    branches:
      - site/canonical-one-page-phase2

permissions:
  contents: write

jobs:
  fold:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-folded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fold CSS, JavaScript, and focused tests into authorized files
        run: |
          set -euo pipefail
          printf '\n\n/* Phase 2 canonical one-page design layer. */\n' >> site/src/styles.css
          cat site/src/lovable-transplant.css >> site/src/styles.css
          printf '\n\n/* Phase 2 canonical one-page runtime. */\n' >> site/src/app.js
          cat site/src/openva-page.js >> site/src/app.js
          printf '\n\n# Phase 2 canonical one-page contract tests.\n' >> tests/test_site.py
          cat tests/test_canonical_one_page.py >> tests/test_site.py
          sed -i '/lovable-transplant.css/d' site/src/index.html
          sed -i '/openva-page.js/d' site/src/index.html
          git rm site/src/lovable-transplant.css site/src/openva-page.js tests/test_canonical_one_page.py .github/workflows/phase2-fold.yml
      - name: Validate focused site contract
        run: |
          python -m py_compile tests/test_site.py
          grep -q 'onePageRoute' site/src/app.js
          grep -q 'Phase 2 canonical one-page design layer' site/src/styles.css
          grep -q 'download-xlsx' site/src/index.html
      - name: Commit folded implementation
        run: |
          git config user.name 'openva-site-maintainer'
          git config user.email 'openva-site-maintainer@users.noreply.github.com'
          git add site/src/index.html site/src/styles.css site/src/app.js tests/test_site.py
          git commit -m 'Site: fold canonical one-page implementation into authorized paths [phase2-folded]'
          git push
