name: owner global vendors 3 materializer

on:
  push:
    branches:
      - catalog/owner-global-vendors-3
    paths:
      - catalog-batches/owner-global-vendors-3.yaml
      - .github/workflows/owner-global-vendors-3-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-global-vendors-3-materializer
  cancel-in-progress: false

# This workflow is intentionally one-shot and deletes itself after successful materialization.
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-global-vendors-3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Materialize new vendors and rebuild derived catalog outputs
        run: python -m tools.openva.catalog_batch catalog-batches/owner-global-vendors-3.yaml --build-indexes
      - name: Observe only the new source records
        shell: bash
        run: |
          find \
            data/vendors/f-secure/sources \
            data/vendors/withsecure/sources \
            data/vendors/jetbrains/sources \
            data/vendors/hashicorp/sources \
            data/vendors/red-hat/sources \
            data/vendors/grafana-labs/sources \
            data/vendors/pagerduty/sources \
            data/vendors/bigcommerce/sources \
            data/vendors/commercetools/sources \
            data/vendors/docebo/sources \
            -type f -name '*.yaml' | sort > /tmp/owner-global-vendors-3-source-paths.txt

          python -m tools.openva.source_verification verify \
            --source-path-file /tmp/owner-global-vendors-3-source-paths.txt \
            --output /tmp/owner-global-vendors-3-verification.json

          baseline_args=()
          if [ -f maintenance/source-observations/latest-observations.json ]; then
            baseline_args=(--baseline maintenance/source-observations/latest-observations.json)
          fi

          python -m tools.openva.observation_ledger build \
            --verification-report /tmp/owner-global-vendors-3-verification.json \
            --output-dir /tmp/owner-global-vendors-3-observations \
            --run-id owner-global-vendors-3 \
            "${baseline_args[@]}"

          python -m tools.openva.observation_ledger install-latest \
            --latest /tmp/owner-global-vendors-3-observations/latest-observations.json
      - name: Validate generated catalog state
        run: |
          python -m tools.openva.validate validate
          python -m pytest -q \
            tests/test_catalog_guard.py \
            tests/test_source_type_labels.py \
            tests/test_generated_exports.py \
            tests/test_source_observation_ledger.py
      - name: Remove one-time materialization inputs
        run: |
          rm catalog-batches/owner-global-vendors-3.yaml
          rm .github/workflows/owner-global-vendors-3-materialize.yml
      - name: Commit materialized new-vendor records
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated catalog changes were produced.'
            exit 1
          fi
          git commit -m 'Catalog: add ten global vendors'
          git push origin HEAD:catalog/owner-global-vendors-3
