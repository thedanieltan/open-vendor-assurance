name: phase2-site-diagnostic

on:
  push:
    branches:
      - site/canonical-one-page-phase2

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Run focused site tests
        id: tests
        shell: bash
        run: |
          set +e
          pytest -q tests/test_site.py -vv --tb=short > phase2-site-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 160 phase2-site-tests.log > phase2-site-tests-tail.log
          cat phase2-site-tests-tail.log
          exit 0
      - name: Post focused diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- phase2-site-diagnostic -->'
            echo '### Phase 2 focused site diagnostic'
            echo '```text'
            cat phase2-site-tests-tail.log
            echo '```'
          } > phase2-comment.md
          gh pr comment 659 --body-file phase2-comment.md
      - name: Upload focused diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: phase2-site-diagnostic
          path: phase2-site-tests.log
          retention-days: 2
      - name: Enforce result
        run: exit "${{ steps.tests.outputs.exit_code }}"
