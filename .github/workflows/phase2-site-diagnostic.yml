name: phase2-site-diagnostic

on:
  push:
    branches:
      - site/canonical-one-page-phase2

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: phase2-site-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Run new phase 2 contract tests
        id: tests
        shell: bash
        run: |
          set +e
          pytest -q tests/test_site.py -vv --tb=short \
            -k 'canonical_site or all_supported_source_types or local_resolver_and_review_first or public_page_has_no_vendor' \
            > phase2-site-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat phase2-site-tests.log
          exit 0
      - name: Post focused diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- phase2-site-diagnostic -->'
            echo '### Phase 2 focused site diagnostic'
            echo '```text'
            cat phase2-site-tests.log
            echo '```'
          } > phase2-comment.md
          gh pr comment 659 --body-file phase2-comment.md
      - name: Enforce result
        run: exit "${{ steps.tests.outputs.exit_code }}"
