name: owner-source-maintenance-3-reconcile

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-reconciled]') && !contains(github.event.head_commit.message, '[owner-maintenance-3-reconcile-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Merge current main and regenerate combined catalog
        id: merge
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG=/tmp/owner-maintenance-reconcile.log
          : > "$LOG"
          {
            git config user.name 'openva-owner-catalog'
            git config user.email 'openva-owner-catalog@users.noreply.github.com'
            git fetch origin main

            git show HEAD:maintenance/source-observations/latest-observations.json > /tmp/maintenance-observations.json
            git show origin/main:maintenance/source-observations/latest-observations.json > /tmp/main-observations.json

            set +e
            git merge --no-commit --no-ff origin/main
            MERGE_RC=$?
            set -e

            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            if [ -n "$CONFLICTS" ]; then
              echo 'Merge conflicts:'
              printf '%s\n' "$CONFLICTS"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  indexes/*|dist/vendors/*|openva-pack.json|maintenance/source-observations/latest-observations.json)
                    ;;
                  *)
                    echo "Unexpected canonical conflict: $path" >&2
                    exit 1
                    ;;
                esac
              done <<< "$CONFLICTS"

              while IFS= read -r path; do
                [ -z "$path" ] && continue
                if [ "$path" != 'maintenance/source-observations/latest-observations.json' ]; then
                  git checkout --ours -- "$path"
                  git add "$path"
                fi
              done <<< "$CONFLICTS"
            elif [ "$MERGE_RC" -ne 0 ]; then
              echo "Merge failed without listed conflicts (status $MERGE_RC)." >&2
              exit 1
            fi

            python - <<'PY'
          import json
          from pathlib import Path

          ours = json.loads(Path('/tmp/maintenance-observations.json').read_text(encoding='utf-8'))
          main = json.loads(Path('/tmp/main-observations.json').read_text(encoding='utf-8'))

          merged_by_id = {
              str(row['source_id']): row
              for row in main.get('sources', [])
              if row.get('source_id')
          }
          merged_by_id.update({
              str(row['source_id']): row
              for row in ours.get('sources', [])
              if row.get('source_id')
          })
          sources = [merged_by_id[key] for key in sorted(merged_by_id)]

          result = dict(ours)
          result['generated_at'] = max(
              str(ours.get('generated_at') or ''),
              str(main.get('generated_at') or ''),
          )
          result['sources'] = sources
          observed = int((ours.get('summary') or {}).get('observed_this_run') or 0)
          result['summary'] = {
              'source_count': len(sources),
              'observed_this_run': observed,
              'carried_forward': len(sources) - observed,
          }
          Path('maintenance/source-observations/latest-observations.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'main_observations': len(main.get('sources', [])),
              'maintenance_observations': len(ours.get('sources', [])),
              'combined_observations': len(sources),
              'maintenance_rows_preserved': observed,
          }, indent=2, sort_keys=True))
          PY
            git add maintenance/source-observations/latest-observations.json

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved conflicts remain:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi

            python -m tools.openva.indexes
            git add data/vendors dist/vendors indexes openva-pack.json maintenance/source-observations/latest-observations.json

            python -m tools.openva.validate validate
            python -m tools.openva.catalog_audit audit --enforce
            pytest -q \
              tests/test_catalog_guard.py \
              tests/test_source_type_labels.py \
              tests/test_generated_exports.py \
              tests/test_observation_ledger.py \
              tests/test_catalog_audit.py

            git diff --check
            git commit -m 'Merge current main catalog expansion into source maintenance [owner-maintenance-3-reconciled]'
            git push
          } 2>&1 | tee "$LOG"
      - name: Preserve reconciliation diagnostic
        if: steps.merge.outcome == 'failure'
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p maintenance/reviewed
          RUN_ID='${{ github.run_id }}' HEAD_SHA='${{ github.sha }}' python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path('/tmp/owner-maintenance-reconcile.log')
          report = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_reconcile_diagnostic',
              'run_id': os.environ['RUN_ID'],
              'head_sha': os.environ['HEAD_SHA'],
              'log': log_path.read_text(encoding='utf-8', errors='replace')[-100000:] if log_path.exists() else '',
              'not_advice': True,
          }
          Path('maintenance/reviewed/owner-source-maintenance-3-reconcile-diagnostic.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add maintenance/reviewed/owner-source-maintenance-3-reconcile-diagnostic.json
          git commit -m 'Catalog: preserve main reconciliation diagnostic [owner-maintenance-3-reconcile-diagnostic]'
          git pull --rebase origin catalog/owner-source-maintenance-3
          git push
          exit 1
