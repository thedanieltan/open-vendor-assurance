name: owner-source-maintenance-3-audit

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Build deterministic source audit
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          import yaml

          root = Path('.')
          observation_path = root / 'maintenance/source-observations/latest-observations.json'
          observation_index = json.loads(observation_path.read_text(encoding='utf-8'))
          latest = {item['source_id']: item for item in observation_index.get('sources', [])}

          sources = {}
          artifacts = {}
          source_paths = {}
          artifact_paths = {}

          for path in sorted((root / 'data/vendors').glob('*/sources/*.yaml')):
              record = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              source_id = str(record.get('source_id') or '').strip()
              if source_id:
                  sources[source_id] = record
                  source_paths[source_id] = path.as_posix()

          for path in sorted((root / 'data/vendors').glob('*/artifacts/*.yaml')):
              record = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              artifact_id = str(record.get('artifact_id') or '').strip()
              if artifact_id:
                  artifacts[artifact_id] = record
                  artifact_paths[artifact_id] = path.as_posix()

          def normalized_url(value: str) -> str:
              value = value.strip()
              if not value:
                  return ''
              parts = urlsplit(value)
              scheme = parts.scheme.lower()
              host = (parts.hostname or '').lower()
              port = parts.port
              netloc = host
              if port and not ((scheme == 'https' and port == 443) or (scheme == 'http' and port == 80)):
                  netloc = f'{host}:{port}'
              path = parts.path or '/'
              if path != '/':
                  path = path.rstrip('/')
              return urlunsplit((scheme, netloc, path, parts.query, ''))

          findings = []
          by_vendor_url = defaultdict(list)

          for source_id, source in sorted(sources.items()):
              vendor_id = str(source.get('vendor_id') or '').strip()
              source_url = str(source.get('source_url') or '').strip()
              source_path = source_paths[source_id]
              observation = latest.get(source_id)
              artifact = artifacts.get(source_id)

              if not source_url:
                  findings.append({
                      'kind': 'missing_source_url',
                      'severity': 'error',
                      'vendor_id': vendor_id,
                      'source_id': source_id,
                      'source_path': source_path,
                  })
              else:
                  parsed = urlsplit(source_url)
                  if parsed.scheme not in {'http', 'https'} or not parsed.hostname:
                      findings.append({
                          'kind': 'invalid_source_url',
                          'severity': 'error',
                          'vendor_id': vendor_id,
                          'source_id': source_id,
                          'source_path': source_path,
                          'source_url': source_url,
                      })
                  by_vendor_url[(vendor_id, normalized_url(source_url))].append(source_id)

              if source.get('review_state') == 'quarantined':
                  findings.append({
                      'kind': 'quarantined_source',
                      'severity': 'repair_candidate',
                      'vendor_id': vendor_id,
                      'source_id': source_id,
                      'source_path': source_path,
                      'source_url': source_url,
                      'quarantine': source.get('quarantine'),
                  })

              if observation:
                  status = observation.get('http_status')
                  health = observation.get('source_health_status')
                  if status in {404, 410}:
                      findings.append({
                          'kind': 'observed_not_found',
                          'severity': 'error',
                          'vendor_id': vendor_id,
                          'source_id': source_id,
                          'source_path': source_path,
                          'source_url': source_url,
                          'http_status': status,
                          'final_url': observation.get('final_url'),
                          'observed_at': observation.get('observed_at'),
                      })
                  elif health == 'unreachable':
                      findings.append({
                          'kind': 'observed_unreachable_non_404',
                          'severity': 'review',
                          'vendor_id': vendor_id,
                          'source_id': source_id,
                          'source_path': source_path,
                          'source_url': source_url,
                          'http_status': status,
                          'final_url': observation.get('final_url'),
                          'observed_at': observation.get('observed_at'),
                      })
                  observed_url = str(observation.get('source_url') or '').strip()
                  if observed_url and source_url and normalized_url(observed_url) != normalized_url(source_url):
                      findings.append({
                          'kind': 'observation_catalog_url_mismatch',
                          'severity': 'review',
                          'vendor_id': vendor_id,
                          'source_id': source_id,
                          'source_path': source_path,
                          'source_url': source_url,
                          'observed_source_url': observed_url,
                          'observed_at': observation.get('observed_at'),
                      })
              else:
                  findings.append({
                      'kind': 'missing_latest_observation',
                      'severity': 'review',
                      'vendor_id': vendor_id,
                      'source_id': source_id,
                      'source_path': source_path,
                      'source_url': source_url,
                  })

              if artifact is None:
                  findings.append({
                      'kind': 'missing_artifact_record',
                      'severity': 'error',
                      'vendor_id': vendor_id,
                      'source_id': source_id,
                      'source_path': source_path,
                      'source_url': source_url,
                  })
              else:
                  canonical_url = str(artifact.get('canonical_url') or '').strip()
                  if normalized_url(canonical_url) != normalized_url(source_url):
                      findings.append({
                          'kind': 'source_artifact_url_mismatch',
                          'severity': 'error',
                          'vendor_id': vendor_id,
                          'source_id': source_id,
                          'source_path': source_path,
                          'artifact_path': artifact_paths.get(source_id),
                          'source_url': source_url,
                          'artifact_url': canonical_url,
                      })

          for (vendor_id, url), source_ids in sorted(by_vendor_url.items()):
              if url and len(source_ids) > 1:
                  findings.append({
                      'kind': 'duplicate_vendor_source_url',
                      'severity': 'review',
                      'vendor_id': vendor_id,
                      'normalized_url': url,
                      'source_ids': sorted(source_ids),
                  })

          counts = defaultdict(int)
          for finding in findings:
              counts[finding['kind']] += 1

          report = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_audit',
              'base_sha': '${{ github.sha }}',
              'source_count': len(sources),
              'artifact_count': len(artifacts),
              'observation_count': len(latest),
              'finding_count': len(findings),
              'counts_by_kind': dict(sorted(counts.items())),
              'findings': findings,
              'not_advice': True,
          }
          output = root / 'maintenance/reviewed/owner-source-maintenance-3-audit.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report['counts_by_kind'], indent=2, sort_keys=True))
          PY
      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add maintenance/reviewed/owner-source-maintenance-3-audit.json
          git commit -m 'Catalog: record owner source maintenance audit [owner-maintenance-3-audit]'
          git push
