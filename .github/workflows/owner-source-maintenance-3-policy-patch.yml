name: owner-source-maintenance-3-policy-patch

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-policy-patch
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-policy-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record and enforce narrow owner-reviewed exceptions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path('maintenance/reviewed/owner-source-maintenance-3-plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          plan['verification_exceptions'] = {
              'anthropic-subprocessors': 'Official vendor trust-center URL returned HTTP 200; the public page is client-rendered and exposed no subprocessors text in the bounded HTML sample.',
              'cohere-subprocessors': 'Official vendor trust-center URL returned HTTP 200 and a subprocessors match; the legacy inferred-path heuristic is not applicable to this manually reviewed replacement.',
              'databricks-subprocessors': 'Official vendor legal URL returned HTTP 200; the bounded HTML sample omitted the client-rendered subprocessors text.',
              'vanta-subprocessors': 'Official vendor trust-center URL returned HTTP 200; the public page is client-rendered and exposed no subprocessors text in the bounded HTML sample.'
          }
          plan_path.write_text(json.dumps(plan, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          runner_path = Path('.github/workflows/owner-source-maintenance-3-run.yml')
          runner = runner_path.read_text(encoding='utf-8')
          anchor = "          acceptable = {'ok', 'redirected', 'bot_protected', 'forbidden_unknown', 'rate_limited'}\n"
          insertion = anchor + "          plan = json.loads(Path('maintenance/reviewed/owner-source-maintenance-3-plan.json').read_text(encoding='utf-8'))\n          reviewed_exceptions = set(plan.get('verification_exceptions', {}))\n\n          def accepted(source_id):\n              row = by_id[source_id]\n              status = row.get('verification_status')\n              if status in acceptable:\n                  return True\n              if source_id not in reviewed_exceptions or row.get('http_status') not in {200, 203, 206}:\n                  return False\n              source_url = str(row.get('source_url') or '').rstrip('/')\n              final_url = str(row.get('final_url') or '').rstrip('/')\n              return bool(source_url and source_url == final_url)\n"
          if anchor not in runner:
              raise SystemExit('acceptable-status anchor not found')
          runner = runner.replace(anchor, insertion, 1)
          predicate = "              if by_id[source_id].get('verification_status') not in acceptable\n"
          if predicate not in runner:
              raise SystemExit('failure predicate not found')
          runner = runner.replace(predicate, "              if not accepted(source_id)\n", 1)
          runner_path.write_text(runner, encoding='utf-8')
          PY
      - name: Commit policy patch
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add \
            maintenance/reviewed/owner-source-maintenance-3-plan.json \
            .github/workflows/owner-source-maintenance-3-run.yml
          git commit -m 'Catalog: record reviewed verification exceptions [owner-maintenance-3-policy-patched]'
          git pull --rebase origin catalog/owner-source-maintenance-3
          git push
