name: observe-report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observe-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Run full public-source observation dry run
        run: python -m tools.openva.observe observe-all --dry-run --emit-yaml > /tmp/openva-observations.yaml
      - name: Generate observation report
        run: |
          mkdir -p reports
          python -m tools.openva.observation_report /tmp/openva-observations.yaml \
            --markdown-out reports/observation-report.md \
            --json-out reports/observation-report.json
      - name: Build observation CSV export
        run: |
          python - <<'PY'
          import csv
          import json

          report = json.load(open("reports/observation-report.json", encoding="utf-8"))
          with open("reports/observation-review-queue.csv", "w", encoding="utf-8", newline="") as handle:
              fields = ["vendor_id", "source_id", "result", "http_status", "final_url", "observed_at", "notes"]
              writer = csv.DictWriter(handle, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              for item in report.get("human_review_queue", []):
                  writer.writerow(item)
          PY
      - name: Print observation report
        run: cat reports/observation-report.md
      - name: Upload observation report artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openva-observation-report
          path: |
            reports/observation-report.md
            reports/observation-report.json
            reports/observation-review-queue.csv
          if-no-files-found: error
