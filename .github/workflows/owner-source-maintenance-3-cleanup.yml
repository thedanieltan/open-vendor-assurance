name: owner-source-maintenance-3-cleanup

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Remove temporary maintenance evidence and runner
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/owner-source-maintenance-3-cleanup.yml \
            maintenance/reviewed/owner-source-maintenance-3-audit.json \
            maintenance/reviewed/owner-source-maintenance-3-classification.json \
            maintenance/reviewed/owner-source-maintenance-3-diagnostic.json \
            maintenance/reviewed/owner-source-maintenance-3-discovery.json \
            maintenance/reviewed/owner-source-maintenance-3-plan.json \
            maintenance/reviewed/owner-source-maintenance-3-probes.json \
            maintenance/reviewed/owner-source-maintenance-3-reconcile-diagnostic.json \
            maintenance/reviewed/owner-source-maintenance-3-shortlist.json
      - name: Validate final PR boundary
        run: |
          set -euo pipefail
          python -m tools.openva.validate validate
          python -m tools.openva.catalog_audit audit --enforce
          pytest -q \
            tests/test_catalog_guard.py \
            tests/test_source_type_labels.py \
            tests/test_generated_exports.py \
            tests/test_source_verification.py \
            tests/test_observation_ledger.py \
            tests/test_catalog_audit.py
          git diff --check
      - name: Commit clean work package
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: finalize owner source maintenance work package [owner-maintenance-3-clean]'
          git push
