name: site-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: site-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate records
        run: python -m tools.openva.validate validate
      - name: Rebuild generated catalog indexes for site publish
        run: |
          set -euo pipefail
          python -m tools.openva.validate build-indexes
      - name: Download latest source health snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-health-artifacts public
          RUN_ID="$(gh run list \
            --workflow source-maintenance-report.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::source health snapshot unavailable: no successful source-maintenance-report run was found. Site will show No source-health observation labels."
            exit 0
          fi
          if ! gh run download "$RUN_ID" \
            --name openva-source-maintenance-report \
            --dir source-health-artifacts; then
            echo "::warning::source health snapshot unavailable: could not download openva-source-maintenance-report from run $RUN_ID. Site will show No source-health observation labels."
            exit 0
          fi
          if [ -f source-health-artifacts/public/source-health-snapshot.json ]; then
            cp source-health-artifacts/public/source-health-snapshot.json public/source-health-snapshot.json
          else
            echo "::warning::source health snapshot unavailable: public/source-health-snapshot.json was not present in run $RUN_ID. Site will show No source-health observation labels."
          fi
      - name: Build Assurance Intelligence public snapshot
        run: python -m tools.openva.assurance_intelligence_publication build --output public/assurance-intelligence.json
      - name: Build reviewed catalog site
        run: python site/build.py --out site/dist
      - name: Cache-bust catalog JSON loads
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path("site/dist/app.js")
          text = app.read_text(encoding="utf-8")
          sha = "${{ github.sha }}"
          replacements = {
              'fetch("data/meta.json")': f'fetch("data/meta.json?v={sha}")',
              'fetch("data/vendor-search.min.json")': f'fetch("data/vendor-search.min.json?v={sha}")',
              'fetch("data/source-types.json")': f'fetch("data/source-types.json?v={sha}")',
              'fetch("data/observation-feed.json")': f'fetch("data/observation-feed.json?v={sha}")',
              'fetch("data/source-health-snapshot.json").catch(() => null)': f'fetch("data/source-health-snapshot.json?v={sha}").catch(() => null)',
              'fetch("data/assurance-intelligence.json").catch(() => null)': f'fetch("data/assurance-intelligence.json?v={sha}").catch(() => null)',
              'fetch(vendor.detail_path)': 'fetch(`${vendor.detail_path}${vendor.detail_path.includes("?") ? "&" : "?"}v=${encodeURIComponent(catalogData.meta.catalog_snapshot_identity || catalogData.meta.commit_sha || Date.now())}`)',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"expected fetch expression not found: {before}")
              text = text.replace(before, after)
          app.write_text(text, encoding="utf-8")
          PY
      - name: Build agent exports (publish-time, read-only)
        run: |
          set -euo pipefail
          ARGS=(
            --out site/dist/public
            --commit-sha "${{ github.sha }}"
          )
          if [ -f source-health-artifacts/observation-ledger/latest-observations.json ]; then
            ARGS+=(--latest-observations source-health-artifacts/observation-ledger/latest-observations.json)
          fi
          if [ -f source-health-artifacts/observation-ledger/source-freshness-report.json ]; then
            ARGS+=(--freshness-report source-health-artifacts/observation-ledger/source-freshness-report.json)
          fi
          python -m tools.openva.agent_export build "${ARGS[@]}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
