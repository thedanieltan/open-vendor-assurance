name: site-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: site-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate records
        run: python -m tools.openva.validate validate
      - name: Rebuild generated catalog indexes for site publish
        run: |
          set -euo pipefail
          python -m tools.openva.validate build-indexes
      - name: Download latest source health snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-health-artifacts public
          RUN_ID="$(gh run list \
            --workflow source-maintenance-report.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::source health snapshot unavailable: no successful source-maintenance-report run was found. Site will show No source-health observation labels."
            exit 0
          fi
          if ! gh run download "$RUN_ID" \
            --name openva-source-maintenance-report \
            --dir source-health-artifacts; then
            echo "::warning::source health snapshot unavailable: could not download openva-source-maintenance-report from run $RUN_ID. Site will show No source-health observation labels."
            exit 0
          fi
          if [ -f source-health-artifacts/public/source-health-snapshot.json ]; then
            cp source-health-artifacts/public/source-health-snapshot.json public/source-health-snapshot.json
          else
            echo "::warning::source health snapshot unavailable: public/source-health-snapshot.json was not present in run $RUN_ID. Site will show No source-health observation labels."
          fi
      - name: Select complete latest-observation input
        id: observation_input
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          current_sources = {
              row["source_id"]
              for row in json.loads(Path("indexes/sources.json").read_text(encoding="utf-8")).get("items", [])
          }
          committed = Path("maintenance/source-observations/latest-observations.json")
          if not committed.is_file():
              raise SystemExit(f"committed latest-observation index missing: {committed}")
          committed_document = json.loads(committed.read_text(encoding="utf-8"))
          committed_sources = {
              row["source_id"] for row in committed_document.get("sources", [])
          }
          if committed_sources != current_sources:
              missing = sorted(current_sources - committed_sources)
              orphan = sorted(committed_sources - current_sources)
              raise SystemExit(
                  "committed latest-observation index is not source-complete: "
                  f"current={len(current_sources)} observed={len(committed_sources)} "
                  f"missing={len(missing)} orphan={len(orphan)}"
              )

          selected = committed
          artifact = Path("source-health-artifacts/observation-ledger/latest-observations.json")
          if artifact.is_file():
              artifact_document = json.loads(artifact.read_text(encoding="utf-8"))
              artifact_sources = {
                  row["source_id"] for row in artifact_document.get("sources", [])
              }
              if artifact_sources == current_sources:
                  selected = artifact
                  print(f"Using complete run artifact with {len(artifact_sources)} observations.")
              else:
                  print(
                      "::warning::latest source-maintenance artifact is incomplete for the current catalog; "
                      f"using committed latest-observation index instead "
                      f"(current={len(current_sources)} artifact={len(artifact_sources)} "
                      f"missing={len(current_sources - artifact_sources)} "
                      f"orphan={len(artifact_sources - current_sources)})."
                  )
          else:
              print("No run-artifact observation index found; using committed latest-observation index.")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={selected.as_posix()}\n")
          PY
      - name: Build Assurance Intelligence public snapshot
        run: python -m tools.openva.assurance_intelligence_publication build --output public/assurance-intelligence.json
      - name: Build reviewed catalog site
        run: python site/build.py --out site/dist
      - name: Cache-bust catalog JSON loads
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path("site/dist/app.js")
          text = app.read_text(encoding="utf-8")
          sha = "${{ github.sha }}"
          replacements = {
              'fetch("data/meta.json")': f'fetch("data/meta.json?v={sha}")',
              'fetch("data/vendor-search.min.json")': f'fetch("data/vendor-search.min.json?v={sha}")',
              'fetch("data/source-types.json")': f'fetch("data/source-types.json?v={sha}")',
              'fetch("data/observation-feed.json")': f'fetch("data/observation-feed.json?v={sha}")',
              'fetch("data/source-health-snapshot.json").catch(() => null)': f'fetch("data/source-health-snapshot.json?v={sha}").catch(() => null)',
              'fetch("data/assurance-intelligence.json").catch(() => null)': f'fetch("data/assurance-intelligence.json?v={sha}").catch(() => null)',
              'fetch(vendor.detail_path)': 'fetch(`${vendor.detail_path}${vendor.detail_path.includes("?") ? "&" : "?"}v=${encodeURIComponent(catalogData.meta.catalog_snapshot_identity || catalogData.meta.commit_sha || Date.now())}`)',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"expected fetch expression not found: {before}")
              text = text.replace(before, after)
          app.write_text(text, encoding="utf-8")
          PY
      - name: Build agent exports (publish-time, read-only)
        run: |
          set -euo pipefail
          ARGS=(
            --out site/dist/public
            --commit-sha "${{ github.sha }}"
            --latest-observations "${{ steps.observation_input.outputs.path }}"
          )
          if [ -f source-health-artifacts/observation-ledger/source-freshness-report.json ]; then
            ARGS+=(--freshness-report source-health-artifacts/observation-ledger/source-freshness-report.json)
          fi
          python -m tools.openva.agent_export build "${ARGS[@]}"
      - name: Verify publication exports before packaging
        run: |
          set -euo pipefail
          test -s site/dist/.well-known/openva.json
          python -m json.tool site/dist/.well-known/openva.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          current_sources = {
              row["source_id"]
              for row in json.loads(Path("indexes/sources.json").read_text(encoding="utf-8")).get("items", [])
          }
          observations_document = json.loads(
              Path("site/dist/public/observations/latest.json").read_text(encoding="utf-8")
          )
          published_sources = {
              row["source_id"] for row in observations_document.get("sources", [])
          }
          missing = sorted(current_sources - published_sources)
          orphan = sorted(published_sources - current_sources)
          if missing or orphan or observations_document.get("count") != len(published_sources):
              raise SystemExit(
                  "published observation export is not source-complete: "
                  f"current={len(current_sources)} published={len(published_sources)} "
                  f"declared={observations_document.get('count')} "
                  f"missing={len(missing)} orphan={len(orphan)}"
              )
          print(f"Published observation parity: {len(current_sources)}/{len(current_sources)}")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        # Pin the upstream commit that adds include-hidden-files support. The v4
        # tag always excludes dot-prefixed paths and silently ignores this input.
        uses: actions/upload-pages-artifact@0ca16172ca884f0a37117fed41734f29784cc980
        with:
          path: site/dist
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
