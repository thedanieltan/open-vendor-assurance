name: site-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: site-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate records
        run: python -m tools.openva.validate validate
      - name: Download latest source health snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-health-artifacts public
          RUN_ID="$(gh run list \
            --workflow source-maintenance-report.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::source health snapshot unavailable: no successful source-maintenance-report run was found. Site will show Not yet verified labels."
            exit 0
          fi
          if ! gh run download "$RUN_ID" \
            --name openva-source-maintenance-report \
            --dir source-health-artifacts; then
            echo "::warning::source health snapshot unavailable: could not download openva-source-maintenance-report from run $RUN_ID. Site will show Not yet verified labels."
            exit 0
          fi
          if [ -f source-health-artifacts/public/source-health-snapshot.json ]; then
            cp source-health-artifacts/public/source-health-snapshot.json public/source-health-snapshot.json
          else
            echo "::warning::source health snapshot unavailable: public/source-health-snapshot.json was not present in run $RUN_ID. Site will show Not yet verified labels."
          fi
      - name: Download latest catalog confidence reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p coverage-audit-artifacts reports
          RUN_ID="$(gh run list \
            --workflow coverage-audit.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::catalog confidence reports unavailable: no successful coverage-audit run was found. Site will use fallback confidence labels."
            exit 0
          fi
          if ! gh run download "$RUN_ID" \
            --name openva-coverage-audit-report \
            --dir coverage-audit-artifacts; then
            echo "::warning::catalog confidence reports unavailable: could not download openva-coverage-audit-report from run $RUN_ID. Site will use fallback confidence labels."
            exit 0
          fi
          copied=0
          for report in catalog-completeness-report.json entity-review-queue.json field-provenance-coverage.json; do
            if [ -f "coverage-audit-artifacts/reports/$report" ]; then
              cp "coverage-audit-artifacts/reports/$report" "reports/$report"
              copied=$((copied + 1))
            elif [ -f "coverage-audit-artifacts/$report" ]; then
              cp "coverage-audit-artifacts/$report" "reports/$report"
              copied=$((copied + 1))
            else
              echo "::warning::catalog confidence report unavailable: reports/$report was not present in coverage-audit run $RUN_ID. Site may use fallback confidence labels."
            fi
          done
          if [ "$copied" -eq 3 ]; then
            echo "Catalog confidence reports copied from coverage-audit run $RUN_ID."
          fi
      - name: Build Assurance Intelligence public snapshot
        run: python -m tools.openva.assurance_intelligence_publication build --output public/assurance-intelligence.json
      - name: Build reviewed catalog site
        run: python site/build.py --out site/dist
      - name: Build agent exports (publish-time, read-only)
        run: |
          set -euo pipefail
          ARGS=(
            --out site/dist/public
            --commit-sha "${{ github.sha }}"
          )
          if [ -f source-health-artifacts/observation-ledger/latest-observations.json ]; then
            ARGS+=(--latest-observations source-health-artifacts/observation-ledger/latest-observations.json)
          fi
          if [ -f source-health-artifacts/observation-ledger/source-freshness-report.json ]; then
            ARGS+=(--freshness-report source-health-artifacts/observation-ledger/source-freshness-report.json)
          fi
          python -m tools.openva.agent_export build "${ARGS[@]}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
