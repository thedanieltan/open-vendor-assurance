name: release-candidate

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload generated release artifacts"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      source_health_policy:
        description: "Source health readiness policy"
        required: false
        default: "enforce"
        type: choice
        options:
          - "report_only"
          - "enforce"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install -e ".[dev]"
          pip install -e "services/openva_match_service[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Run tests
        run: pytest -q
      - name: Run release smoke test
        run: python -m tools.openva.release_smoke
      - name: Download latest source maintenance artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-health-artifacts
          RUN_ID="$(gh run list \
            --workflow source-maintenance-report.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::source health artifact unavailable: no successful source-maintenance-report run was found."
            exit 0
          fi
          if ! gh run download "$RUN_ID" \
            --name openva-source-maintenance-report \
            --dir source-health-artifacts; then
            echo "::warning::source health artifact unavailable: could not download openva-source-maintenance-report from run $RUN_ID."
            exit 0
          fi
          if [ -f source-health-artifacts/source-verification-report.json ]; then
            cp source-health-artifacts/source-verification-report.json source-verification-report.json
          else
            echo "::warning::source health artifact unavailable: source-verification-report.json was not present in run $RUN_ID."
          fi
      - name: Download latest source refinement scan artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-refinement-artifacts
          RUN_ID="$(gh run list \
            --workflow source-refinement-scan.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::confirmed P0 scan artifact unavailable: no successful source-refinement-scan run was found."
            exit 0
          fi
          if ! gh run download "$RUN_ID" \
            --name openva-confirmed-p0-source-refinement-scan \
            --dir source-refinement-artifacts; then
            echo "::warning::confirmed P0 scan artifact unavailable: could not download openva-confirmed-p0-source-refinement-scan from run $RUN_ID."
            exit 0
          fi
          if [ -f source-refinement-artifacts/confirmed-p0-repair-candidates.json ]; then
            cp source-refinement-artifacts/confirmed-p0-repair-candidates.json confirmed-p0-repair-candidates.json
          else
            echo "::warning::confirmed P0 scan artifact unavailable: confirmed-p0-repair-candidates.json was not present in source-refinement-scan run $RUN_ID."
          fi
      # Source health is one constituent of the aggregate release gate. This
      # step is the PRODUCER of the readiness evidence; the aggregate gate below
      # consumes it. The producer never recomputes source health twice and never
      # enforces on its own; final enforcement is the aggregate exit code.
      - name: Build source health readiness
        run: |
          set +e
          MODE_FLAG="--report-only"
          if [ "${{ inputs.source_health_policy }}" = "enforce" ]; then
            MODE_FLAG="--enforce"
          fi
          python -m tools.openva.release_source_health check \
            --source-verification-report source-verification-report.json \
            --confirmed-p0-scan confirmed-p0-repair-candidates.json \
            --output-json release-source-health-readiness.json \
            --summary-md release-source-health-summary.md \
            "$MODE_FLAG"
          set -e
      - name: Print source health readiness summary
        run: cat release-source-health-summary.md
      # Aggregate release-gate decision. Consumes the readiness artifact as one
      # gate, plus exports/digests/advisory/leakage/freshness/constitution gates.
      # This is the authoritative release blocker; its exit code is enforced last.
      - name: Build aggregate release gate report
        run: |
          set +e
          python -m tools.openva.release_gates check \
            --profile release \
            --source-health-readiness release-source-health-readiness.json \
            --source-health-policy "${{ inputs.source_health_policy }}" \
            --out-json release-gates.json \
            --out-md release-gates-summary.md \
            --enforce
          echo "RELEASE_GATES_EXIT_CODE=$?" >> "$GITHUB_ENV"
          set -e
      - name: Print release gate summary
        run: cat release-gates-summary.md
      - name: Build release artifact manifest
        run: python -m tools.openva.release_artifacts build
      - name: Check release artifact manifest
        run: python -m tools.openva.release_artifacts check
      - name: Print release artifact manifest
        run: cat release-artifacts.json
      - name: Upload release candidate artifacts
        if: inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openva-release-candidate-artifacts
          path: |
            release-artifacts.json
            release-source-health-readiness.json
            release-source-health-summary.md
            release-gates.json
            release-gates-summary.md
          if-no-files-found: error
      - name: Enforce release gate result
        run: exit "$RELEASE_GATES_EXIT_CODE"
