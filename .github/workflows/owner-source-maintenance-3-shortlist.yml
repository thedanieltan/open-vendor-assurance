name: owner-source-maintenance-3-shortlist

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-shortlist
  cancel-in-progress: true

jobs:
  shortlist:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-shortlisted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build strict replacement shortlist
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          report = json.loads(
              Path('maintenance/reviewed/owner-source-maintenance-3-discovery.json').read_text(encoding='utf-8')
          )

          excluded_path_terms = (
              '/blog/', '/blogs/', '/article/', '/articles/', '/spark/', '/news/', '/press/', '/events/',
              '/webinars/', '/careers/', '/customer-stories/', '/academy/', '/learn/', '/resources/'
          )

          def semantic_match(source_type: str, url: str, title: str) -> tuple[bool, list[str]]:
              path = urlsplit(url).path.lower()
              text = f'{path} {title}'.lower()
              reasons = []
              if any(term in path for term in excluded_path_terms):
                  return False, ['editorial_or_marketing_path']

              if source_type == 'dpa':
                  if 'data processing addendum' in text or 'data-processing-addendum' in text:
                      reasons.append('data_processing_addendum')
                  if 'data processing agreement' in text or 'data-processing-agreement' in text:
                      reasons.append('data_processing_agreement')
                  if re.search(r'(^|[-_/])dpa($|[-_/])', path):
                      reasons.append('dpa_path_token')
              elif source_type == 'subprocessors_list':
                  if 'subprocessor' in text or 'sub-processor' in text or 'sub_processor' in text:
                      reasons.append('subprocessor_term')
              elif source_type == 'privacy_notice':
                  if any(term in text for term in ('privacy policy', 'privacy-policy', 'privacy notice', 'privacy-notice')):
                      reasons.append('privacy_notice_term')
              elif source_type == 'trust_center':
                  if 'trust center' in text or 'trust-center' in text or 'trustcenter' in text:
                      reasons.append('trust_center_term')
              elif source_type == 'security_page':
                  if any(term in text for term in ('security', 'data-security', 'security-and-privacy', 'trust-center', 'trust center')):
                      reasons.append('security_or_trust_term')
              elif source_type == 'compliance_page':
                  if any(term in text for term in ('compliance', 'assurance', 'trust-center', 'trust center')):
                      reasons.append('compliance_or_trust_term')
              elif source_type == 'certification_reference':
                  if any(term in text for term in ('certification', 'certificate', 'iso-27001', 'soc-2', 'compliance')):
                      reasons.append('certification_term')
              elif source_type == 'terms_of_service':
                  if any(term in text for term in ('terms of service', 'terms-of-service', 'terms of use', 'terms-of-use', 'service-terms')):
                      reasons.append('terms_term')
              elif source_type == 'government_request_policy':
                  if any(term in text for term in ('government request', 'government-request', 'law enforcement', 'law-enforcement')):
                      reasons.append('government_request_term')
              elif source_type == 'transparency_report':
                  if 'transparency report' in text or 'transparency-report' in text:
                      reasons.append('transparency_report_term')
              elif source_type == 'status_page':
                  host = (urlsplit(url).hostname or '').lower()
                  if 'status' in path or host.startswith('status.') or '.status.' in host:
                      reasons.append('status_surface')
              else:
                  if any(term in text for term in ('legal', 'trust', 'security', 'privacy')):
                      reasons.append('generic_public_source_term')

              return bool(reasons), reasons

          targets = []
          for vendor in report.get('vendors', []):
              for target in vendor.get('targets', []):
                  if not target.get('candidates'):
                      continue
                  strict = []
                  rejected = []
                  for candidate in target['candidates']:
                      ok, reasons = semantic_match(
                          str(target.get('source_type') or ''),
                          str(candidate.get('url') or ''),
                          str(candidate.get('title') or ''),
                      )
                      row = {**candidate, 'semantic_reasons': reasons}
                      (strict if ok else rejected).append(row)
                  strict.sort(key=lambda row: (-int(row.get('score') or 0), str(row.get('url') or '')))
                  selected = None
                  if len(strict) == 1:
                      selected = strict[0]
                  elif strict:
                      first = strict[0]
                      second = strict[1]
                      if int(first.get('score') or 0) >= int(second.get('score') or 0) + 3:
                          selected = first
                  targets.append({
                      'vendor_id': target.get('vendor_id'),
                      'source_id': target.get('source_id'),
                      'source_type': target.get('source_type'),
                      'title_en': target.get('title_en'),
                      'current_url': target.get('current_url'),
                      'strict_candidate_count': len(strict),
                      'selected_url': selected.get('url') if selected else None,
                      'selected_title': selected.get('title') if selected else None,
                      'selected_score': selected.get('score') if selected else None,
                      'strict_candidates': strict,
                      'rejected_candidates': rejected,
                  })

          selected = [target for target in targets if target.get('selected_url')]
          output = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_strict_shortlist',
              'summary': {
                  'targets_with_live_candidates': len(targets),
                  'targets_with_strict_candidates': sum(target['strict_candidate_count'] > 0 for target in targets),
                  'targets_selected': len(selected),
                  'targets_requiring_review': sum(target['strict_candidate_count'] > 0 and not target.get('selected_url') for target in targets),
                  'targets_rejected': sum(target['strict_candidate_count'] == 0 for target in targets),
              },
              'selected': selected,
              'targets': targets,
              'not_advice': True,
          }
          path = Path('maintenance/reviewed/owner-source-maintenance-3-shortlist.json')
          path.write_text(json.dumps(output, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(output['summary'], indent=2, sort_keys=True))
          PY
      - name: Commit shortlist
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add maintenance/reviewed/owner-source-maintenance-3-shortlist.json
          git commit -m 'Catalog: shortlist semantically valid source replacements [owner-maintenance-3-shortlisted]'
          git push
