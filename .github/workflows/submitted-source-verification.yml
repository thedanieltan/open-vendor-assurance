name: submitted-source-verification

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Submission issue number to verify"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: submitted-source-verification-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  verify-submission:
    # Cheap event-payload prefilter only. The authoritative hold and
    # submission-label guards run on live labels inside the verifier, so
    # workflow_dispatch cannot bypass the openva-hold label.
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.issue.labels.*.name, ','), 'submission:')
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Fetch live issue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > issue-body.md
          gh issue view "$ISSUE_NUMBER" --json title --jq .title > issue-title.txt
          gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name] | join(",")' > issue-labels.txt
      - name: Verify submission claim
        run: |
          python -m tools.openva.submission_verify issue \
            --issue-body issue-body.md \
            --issue-title "$(cat issue-title.txt)" \
            --issue-labels "$(cat issue-labels.txt)" \
            --issue-number "$ISSUE_NUMBER" \
            --output-dir .openva-submission \
            --network-check \
            --github-env "$GITHUB_ENV"
      - name: Upload verification report
        if: env.OPENVA_SUBMISSION_SKIP != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: submission-verification-${{ env.ISSUE_NUMBER }}
          path: .openva-submission/
      - name: Comment verification summary and apply triage label
        if: env.OPENVA_SUBMISSION_SKIP != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- openva-submitted-source-verification -->';
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const body = fs.readFileSync('.openva-submission/verification-comment.md', 'utf8');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

            const outcomeLabel = process.env.OPENVA_SUBMISSION_VERIFICATION_LABEL;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const stale = issue.labels
              .map((label) => (typeof label === 'string' ? label : label.name))
              .filter((name) => name && name.startsWith('candidate:') && name !== outcomeLabel);
            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (error) {
                core.info(`Could not remove stale label ${name}: ${error.message}`);
              }
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [outcomeLabel],
              });
            } catch (error) {
              core.info(`Could not apply label ${outcomeLabel} (candidate:* labels are created as a repo setup step): ${error.message}`);
            }
