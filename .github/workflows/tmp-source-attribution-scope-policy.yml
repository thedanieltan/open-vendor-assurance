name: tmp-source-attribution-scope-policy

on:
  push:
    branches:
      - agent/source-attribution-scope-policy

permissions:
  contents: write

concurrency:
  group: tmp-source-attribution-scope-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/source-attribution-scope-policy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply scope manifest patch
        run: python .github/source-attribution-scope-patch.py
      - name: Validate YAML and package scope entry
        run: |
          pip install 'pyyaml>=6'
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('docs/operations/contracts/work-package-scope.yaml')
          manifest = yaml.safe_load(path.read_text(encoding='utf-8'))
          package = manifest['work_packages']['WP-SOURCE-PUBLISHER-ATTRIBUTION-01']
          required = {
              '.github/workflows/coverage-audit.yml',
              'schemas/openva/source-reference.schema.json',
              'site/src/app.js',
              'tools/openva/source_attribution.py',
          }
          assert required <= set(package['allowed_paths'])
          PY
      - name: Commit scope manifest
        run: |
          if git diff --quiet -- docs/operations/contracts/work-package-scope.yaml; then
            echo 'Scope entry already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/contracts/work-package-scope.yaml
          git commit -m 'Declare source publisher attribution work package'
          git push origin HEAD
