name: temporary-artifact-bound-object-trigger

on:
  push:
    branches:
      - agent/catalog-growth-artifact-bound-promotion

permissions:
  contents: write

jobs:
  build-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build production commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/openva/zz_temp_artifact_bound_object_builder.py
