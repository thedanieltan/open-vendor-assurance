name: validate

on:
  pull_request:
    # Code-change events only. PR title/body/base `edited` events are handled by the
    # dedicated validate-pr-metadata.yml workflow, which reruns ONLY pr-scope-guard on an
    # edit. Keeping `edited` off this workflow means no validate job is ever skipped on an
    # edit, so a metadata edit cannot flip a failing required check to skipped/passing.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # push validation on main is unchanged, but full regression is now sharded.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-change-classifier:
    name: pr-change-classifier
    runs-on: ubuntu-latest
    outputs:
      repository_integrity_heavy: ${{ steps.classify.outputs.repository_integrity_heavy }}
      workflow_operating_model: ${{ steps.classify.outputs.workflow_operating_model }}
      catalog_growth: ${{ steps.classify.outputs.catalog_growth }}
      source_maintenance: ${{ steps.classify.outputs.source_maintenance }}
      catalog_quality: ${{ steps.classify.outputs.catalog_quality }}
      release_site: ${{ steps.classify.outputs.release_site }}
      mcp_integration: ${{ steps.classify.outputs.mcp_integration }}
      google_sheets_integration: ${{ steps.classify.outputs.google_sheets_integration }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify PR change risk
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "repository_integrity_heavy=true"
              echo "workflow_operating_model=true"
              echo "catalog_growth=true"
              echo "source_maintenance=true"
              echo "catalog_quality=true"
              echo "release_site=true"
              echo "mcp_integration=true"
              echo "google_sheets_integration=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          echo "Changed paths:"; sed 's/^/  /' changed-paths.txt

          python - <<'PY'
          from pathlib import Path

          paths = [
              line.strip()
              for line in Path("changed-paths.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          def starts(prefix: str) -> bool:
              return any(path.startswith(prefix) for path in paths)

          def exact(value: str) -> bool:
              return value in paths

          def contains(fragment: str) -> bool:
              return any(fragment in path for path in paths)

          workflow_paths = starts(".github/workflows/") or starts(".github/actions/")
          governance_docs = starts("docs/operations/")
          catalog_data = starts("data/") or starts("indexes/") or starts("dist/") or exact("openva-pack.json")
          schema_or_contract = starts("schemas/") or starts("config/")
          validator_or_release = (
              contains("tools/openva/validate")
              or contains("tools/openva/release_gates")
              or contains("tools/openva/repository_hygiene")
              or contains("tools/openva/pr_scope_guard")
          )
          catalog_growth = (
              starts("maintenance/candidates/")
              or contains("catalog_growth")
              or contains("candidate")
              or contains("promotion")
              or exact(".github/workflows/catalog-growth-discovery.yml")
              or exact(".github/workflows/candidate-promotion-pr.yml")
              or exact(".github/workflows/contribution-intake-agent.yml")
              or any(path.startswith("tests/test_catalog_growth") for path in paths)
              or any(path.startswith("tests/test_vendor_candidate") for path in paths)
              or any(path.startswith("tests/test_candidate_promotion") for path in paths)
              or exact("tests/test_reviewed_candidate_promotion_doc.py")
              or exact("tests/test_promotion_planner.py")
          )
          source_maintenance = (
              starts("maintenance/source")
              or contains("source_maintenance")
              or contains("source_preflight")
              or contains("source_repair")
              or contains("source_refinement")
              or exact(".github/workflows/source-maintenance-report.yml")
              or exact(".github/workflows/source-repair-pr.yml")
              or exact(".github/workflows/source-repair-pr-cleanup.yml")
              or exact(".github/workflows/source-refinement-queue.yml")
              or exact(".github/workflows/source-refinement-scan.yml")
              or any(path.startswith("tests/test_source_") for path in paths)
              or exact("tests/test_p0_repair_automerge_workflow.py")
              or exact("tests/test_release_candidate_workflow.py")
          )
          catalog_quality = (
              catalog_data
              or schema_or_contract
              or contains("automation_rules")
              or contains("catalog_guard")
              or any(path.startswith("tests/test_catalog") for path in paths)
              or exact("tests/test_automation_rules.py")
          )
          release_site = (
              starts("site/")
              or starts("releases/")
              or exact(".github/workflows/release-downloads.yml")
              or exact(".github/workflows/site-pages.yml")
              or exact(".github/workflows/site-live-feed.yml")
              or any(path.startswith("tests/test_release_") for path in paths)
              or exact("tests/test_site.py")
              or exact("tests/test_adapter_contract.py")
          )
          mcp_integration = (
              starts("integrations/mcp/")
              or starts("adapters/python/openva_pack_reader/")
              or starts("adapters/python/openva_vendor_inventory_matcher/")
              or any(path.startswith("tests/test_openva_mcp") for path in paths)
              or exact("tests/test_matching_conformance.py")
              or exact("tests/test_release_coherence.py")
              or exact("tests/test_agent_bundle_verification.py")
          )
          google_sheets = starts("integrations/google-sheets/")
          workflow_operating_model = (
              workflow_paths
              or governance_docs
              or any(path.startswith("tests/test_workflow") for path in paths)
              or exact("tests/test_ci_readiness.py")
              or exact("tests/test_workflow_retirement_evidence.py")
              or exact("tests/test_future_operations_specs.py")
          )
          repository_integrity_heavy = (
              catalog_data
              or schema_or_contract
              or validator_or_release
              or workflow_paths
              or catalog_growth
              or source_maintenance
              or catalog_quality
          )

          outputs = {
              "repository_integrity_heavy": repository_integrity_heavy,
              "workflow_operating_model": workflow_operating_model,
              "catalog_growth": catalog_growth,
              "source_maintenance": source_maintenance,
              "catalog_quality": catalog_quality,
              "release_site": release_site,
              "mcp_integration": mcp_integration,
              "google_sheets_integration": google_sheets,
          }

          with Path(__import__("os").environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={'true' if value else 'false'}\n")

          print("Path-aware validation lanes:")
          for key, value in outputs.items():
              print(f"  {key}: {value}")
          PY

  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    # Fast by default on PRs. Heavy validation/index/release gates only run for
    # catalog/schema/workflow/authority-sensitive changes, or every push to main.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Enforce repository hygiene
        env:
          OPENVA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENVA_HEAD_SHA: ${{ github.sha }}
          OPENVA_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: >-
          python -m tools.openva.repository_hygiene check
          --base "$OPENVA_BASE_SHA"
          --head "$OPENVA_HEAD_SHA"
          --head-ref "$OPENVA_HEAD_REF"
      - name: Run OpenVA validator
        if: github.event_name != 'pull_request' || needs.pr-change-classifier.outputs.repository_integrity_heavy == 'true'
        run: python -m tools.openva.validate validate
      - name: Rebuild generated indexes
        if: github.event_name != 'pull_request' || needs.pr-change-classifier.outputs.repository_integrity_heavy == 'true'
        run: python -m tools.openva.validate build-indexes
      - name: Check generated files are committed
        if: github.event_name != 'pull_request' || needs.pr-change-classifier.outputs.repository_integrity_heavy == 'true'
        run: git diff --exit-code openva-pack.json indexes/ dist/
      - name: Determine scope-policy operational freshness exclusion
        id: scope_policy_freshness
        if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.repository_integrity_heavy == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          echo "skip_release_gates=false" >> "$GITHUB_OUTPUT"
          git worktree add /tmp/base-scope-policy "$BASE_SHA"
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-paths.txt
          cd /tmp/base-scope-policy
          if ! python -m tools.openva.pr_scope_guard --declaration-file /tmp/pr-body.txt --changed-paths-file /tmp/changed-paths.txt; then
            exit 0
          fi
          if python - /tmp/pr-body.txt /tmp/changed-paths.txt <<'PY'
          import re
          import sys
          from pathlib import Path

          import yaml

          body = Path(sys.argv[1]).read_text(encoding="utf-8")
          changed = [line.strip() for line in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines() if line.strip()]
          found = []
          for match in re.finditer(r"^\s*Work-Package:\s*(WP-[A-Z0-9][A-Z0-9-]*)\s*$", body or "", re.MULTILINE):
              if match.group(1) not in found:
                  found.append(match.group(1))
          manifest = yaml.safe_load(Path("docs/operations/contracts/work-package-scope.yaml").read_text(encoding="utf-8"))
          policy = (manifest.get("work_packages") or {}).get("WP-PR-SCOPE-POLICY-01") or {}
          exclusive = set(policy.get("allowed_paths") or [])
          raise SystemExit(0 if found == ["WP-PR-SCOPE-POLICY-01"] and changed and set(changed) <= exclusive else 1)
          PY
          then
            echo "skip_release_gates=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run source-intelligence release gates (pr profile)
        if: >-
          github.event_name != 'pull_request' ||
          (
            needs.pr-change-classifier.outputs.repository_integrity_heavy == 'true' &&
            steps.scope_policy_freshness.outputs.skip_release_gates != 'true'
          )
        run: >-
          python -m tools.openva.release_gates check --profile pr
          --out-json "$RUNNER_TEMP/release-gates.json"
          --out-md "$RUNNER_TEMP/release-gates-summary.md"

  pr-scope-guard:
    name: pr-scope-guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install PyYAML
        run: pip install "pyyaml>=6"
      - name: Run scope guard from the trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git worktree add /tmp/base-guard "$BASE_SHA"
          if [ ! -f /tmp/base-guard/tools/openva/pr_scope_guard.py ]; then
            echo "scope guard not present at the base revision yet; skipping (self-bootstrap)."
            exit 0
          fi
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-paths.txt
          echo "Changed paths:"; sed 's/^/  /' /tmp/changed-paths.txt
          cd /tmp/base-guard
          python -m tools.openva.pr_scope_guard --declaration-file /tmp/pr-body.txt --changed-paths-file /tmp/changed-paths.txt

  workflow-operating-model:
    name: workflow-operating-model
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.workflow_operating_model == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run workflow operating model tests
        run: >-
          pytest -q
          tests/test_ci_readiness.py
          tests/test_workflow_operating_model.py
          tests/test_workflow_retirement_evidence.py
          tests/test_future_operations_specs.py
          tests/test_workflow_contracts.py

  catalog-growth:
    name: catalog-growth
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.catalog_growth == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run catalog growth tests
        run: >-
          pytest -q
          tests/test_catalog_growth_discovery_queue.py
          tests/test_vendor_candidate_discovery.py
          tests/test_reviewed_candidate_promotion_doc.py
          tests/test_candidate_promotion_actions.py
          tests/test_promotion_planner.py

  source-maintenance:
    name: source-maintenance
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.source_maintenance == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run source maintenance tests
        run: >-
          pytest -q
          tests/test_source_*.py
          tests/test_p0_repair_automerge_workflow.py
          tests/test_release_candidate_workflow.py

  catalog-quality:
    name: catalog-quality
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.catalog_quality == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run catalog quality tests
        run: pytest -q tests/test_catalog*.py tests/test_automation_rules.py

  release-site:
    name: release-site
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.release_site == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run release and site tests
        run: pytest -q tests/test_release_*.py tests/test_site.py tests/test_adapter_contract.py

  mcp-integration:
    name: mcp-integration
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.mcp_integration == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install MCP local dependency chain
        run: |
          pip install -e adapters/python/openva_pack_reader
          pip install -e adapters/python/openva_vendor_inventory_matcher
          pip install -e "integrations/mcp/openva_mcp[dev]"
      - name: Assert MCP SDK is installed
        run: python -c "import mcp.shared.memory, mcp.client.stdio, openva_mcp, jsonschema"
      - name: Run MCP integration tests
        run: >-
          pytest -q
          tests/test_openva_mcp.py
          tests/test_openva_mcp_protocol.py
          tests/test_openva_mcp_hardening.py
          tests/test_openva_mcp_metadata.py
          tests/test_openva_mcp_enrich.py
          tests/test_openva_mcp_streamable_http.py
          tests/test_openva_mcp_authority_boundaries.py
          tests/test_matching_conformance.py
          tests/test_release_coherence.py
          tests/test_agent_bundle_verification.py

  google-sheets-integration:
    name: google-sheets-integration
    runs-on: ubuntu-latest
    needs: pr-change-classifier
    if: github.event_name == 'pull_request' && needs.pr-change-classifier.outputs.google_sheets_integration == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Google Sheets pure-function tests
        run: node --test integrations/google-sheets/test/*.test.mjs

  full-regression-shards:
    name: full-regression-shards (${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: workflow-contracts
            install_mcp: false
            install_match_service: false
            pytest_args: >-
              tests/test_ci_readiness.py
              tests/test_workflow_operating_model.py
              tests/test_workflow_retirement_evidence.py
              tests/test_future_operations_specs.py
              tests/test_workflow_contracts.py
          - shard: catalog-and-release
            install_mcp: false
            install_match_service: false
            pytest_args: >-
              tests/test_catalog*.py
              tests/test_automation_rules.py
              tests/test_release_*.py
              tests/test_site.py
              tests/test_adapter_contract.py
              tests/test_release_coherence.py
              tests/test_agent_bundle_verification.py
          - shard: source-maintenance
            install_mcp: false
            install_match_service: false
            pytest_args: >-
              tests/test_source_*.py
              tests/test_p0_repair_automerge_workflow.py
              tests/test_release_candidate_workflow.py
          - shard: mcp-and-adapters
            install_mcp: true
            install_match_service: false
            pytest_args: >-
              tests/test_openva_mcp.py
              tests/test_openva_mcp_protocol.py
              tests/test_openva_mcp_hardening.py
              tests/test_openva_mcp_metadata.py
              tests/test_openva_mcp_enrich.py
              tests/test_openva_mcp_streamable_http.py
              tests/test_openva_mcp_authority_boundaries.py
              tests/test_matching_conformance.py
          - shard: match-service
            install_mcp: false
            install_match_service: true
            pytest_args: >-
              tests/test_openva_match_service.py
              tests/test_hosted_job_lifecycle.py
              tests/test_supply_chain_policy.py
          - shard: remaining-unit
            install_mcp: false
            install_match_service: false
            pytest_args: >-
              tests/test_agent_export.py
              tests/test_resolver_result_pack.py
              tests/test_validate.py
              tests/test_safe_fetch.py
              tests/test_safe_verify.py
              tests/test_sitemap_discovery.py
              tests/test_source_verification.py
              tests/test_web_bot_auth.py
              tests/test_google_sheets_integration.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install MCP local dependency chain
        if: matrix.install_mcp
        run: |
          pip install -e adapters/python/openva_pack_reader
          pip install -e adapters/python/openva_vendor_inventory_matcher
          pip install -e "integrations/mcp/openva_mcp[dev]"
      - name: Install match service test dependencies
        if: matrix.install_match_service
        run: pip install -e "services/openva_match_service[dev]"
      - name: Run sharded regression tests
        run: pytest -q ${{ matrix.pytest_args }}
