name: validate

on:
  pull_request:
    # `edited` fires on PR title/body/base edits, so a PR-body `Work-Package:` change
    # reruns the pr-scope-guard job and cannot leave a stale-green scope-guard result;
    # opened/synchronize/reopened/ready_for_review preserve normal code-change validation.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    # push validation on main is unchanged.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    # Runs on PR code events and on pushes to main. Skipped on PR metadata-only edits
    # (title/body/base) — nothing here depends on the PR body, so a stale-green is
    # impossible and we avoid rerunning validation on every edit.
    if: github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Enforce repository hygiene
        env:
          OPENVA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENVA_HEAD_SHA: ${{ github.sha }}
          OPENVA_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: >-
          python -m tools.openva.repository_hygiene check
          --base "$OPENVA_BASE_SHA"
          --head "$OPENVA_HEAD_SHA"
          --head-ref "$OPENVA_HEAD_REF"
      - name: Run OpenVA validator
        run: python -m tools.openva.validate validate
      - name: Rebuild generated indexes
        run: python -m tools.openva.validate build-indexes
      - name: Check generated files are committed
        run: git diff --exit-code openva-pack.json indexes/ dist/
      - name: Run source-intelligence release gates (pr profile)
        run: >-
          python -m tools.openva.release_gates check --profile pr
          --out-json "$RUNNER_TEMP/release-gates.json"
          --out-md "$RUNNER_TEMP/release-gates-summary.md"

  pr-scope-guard:
    name: pr-scope-guard
    runs-on: ubuntu-latest
    # PR-only: every changed path must fall within the PR's declared work package
    # (docs/operations/pr-scope-guard.md). The guard CODE and MANIFEST are read from
    # the BASE revision (trusted), so a PR cannot weaken its own gate or expand its own
    # allowlist in the same change — new policy applies only to later, human-reviewed
    # PRs. The PR declares its work package with a single `Work-Package: WP-...` line in
    # its body; zero/multiple/unknown fails closed.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install "pyyaml>=6"
      - name: Run scope guard from the trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Trusted policy: run the guard + manifest exactly as they exist at the base,
          # so the PR under evaluation cannot modify the policy that judges it.
          git worktree add /tmp/base-guard "$BASE_SHA"
          if [ ! -f /tmp/base-guard/tools/openva/pr_scope_guard.py ]; then
            echo "scope guard not present at the base revision yet; skipping (self-bootstrap)."
            exit 0
          fi
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-paths.txt
          echo "Changed paths:"; sed 's/^/  /' /tmp/changed-paths.txt
          cd /tmp/base-guard
          python -m tools.openva.pr_scope_guard --declaration-file /tmp/pr-body.txt --changed-paths-file /tmp/changed-paths.txt

  workflow-operating-model:
    name: workflow-operating-model
    runs-on: ubuntu-latest
    # Targeted PR coverage: runs on PR code events only. Skipped on metadata-only edits
    # and on pushes to main, where full-suite reruns every test.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run workflow operating model tests
        run: >-
          pytest -q
          tests/test_ci_readiness.py
          tests/test_workflow_operating_model.py
          tests/test_workflow_retirement_evidence.py
          tests/test_future_operations_specs.py
          tests/test_workflow_contracts.py

  catalog-growth:
    name: catalog-growth
    runs-on: ubuntu-latest
    # Targeted PR coverage: runs on PR code events only. Skipped on metadata-only edits
    # and on pushes to main, where full-suite reruns every test.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run catalog growth tests
        run: >-
          pytest -q
          tests/test_catalog_growth_discovery_queue.py
          tests/test_vendor_candidate_discovery.py
          tests/test_reviewed_candidate_promotion_doc.py
          tests/test_candidate_promotion_actions.py
          tests/test_promotion_planner.py

  source-maintenance:
    name: source-maintenance
    runs-on: ubuntu-latest
    # Targeted PR coverage: runs on PR code events only. Skipped on metadata-only edits
    # and on pushes to main, where full-suite reruns every test.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run source maintenance tests
        run: >-
          pytest -q
          tests/test_source_*.py
          tests/test_p0_repair_automerge_workflow.py
          tests/test_release_candidate_workflow.py

  catalog-quality:
    name: catalog-quality
    runs-on: ubuntu-latest
    # Targeted PR coverage: runs on PR code events only. Skipped on metadata-only edits
    # and on pushes to main, where full-suite reruns every test.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run catalog quality tests
        run: pytest -q tests/test_catalog*.py tests/test_automation_rules.py

  release-site:
    name: release-site
    runs-on: ubuntu-latest
    # Targeted PR coverage: runs on PR code events only. Skipped on metadata-only edits
    # and on pushes to main, where full-suite reruns every test.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run release and site tests
        run: pytest -q tests/test_release_*.py tests/test_site.py tests/test_adapter_contract.py

  mcp-integration:
    name: mcp-integration
    runs-on: ubuntu-latest
    # Targeted PR coverage: runs on PR code events only. Skipped on metadata-only edits
    # and on pushes to main, where full-suite reruns the Python tests.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install MCP local dependency chain
        run: |
          pip install -e adapters/python/openva_pack_reader
          pip install -e adapters/python/openva_vendor_inventory_matcher
          pip install -e "integrations/mcp/openva_mcp[dev]"
      - name: Assert MCP SDK is installed
        run: python -c "import mcp.shared.memory, mcp.client.stdio, openva_mcp, jsonschema"
      - name: Run MCP integration tests
        run: >-
          pytest -q
          tests/test_openva_mcp.py
          tests/test_openva_mcp_protocol.py
          tests/test_openva_mcp_hardening.py
          tests/test_openva_mcp_metadata.py
          tests/test_openva_mcp_enrich.py
          tests/test_openva_mcp_streamable_http.py
          tests/test_openva_mcp_authority_boundaries.py
          tests/test_matching_conformance.py
          tests/test_release_coherence.py
          tests/test_agent_bundle_verification.py

  google-sheets-integration:
    name: google-sheets-integration
    runs-on: ubuntu-latest
    # Targeted PR coverage: runs on PR code events only. Skipped on metadata-only edits
    # and on pushes to main, where full-suite reruns every test.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Google Sheets pure-function tests
        run: node --test integrations/google-sheets/test/*.test.mjs

  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    # Global regression signal on pushes to main (and not on pull requests, where the
    # targeted jobs above cover the change without rerunning the whole suite per push).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install match service test dependencies
        run: pip install -e "services/openva_match_service[dev]"
      - name: Run tests
        run: pytest -q
