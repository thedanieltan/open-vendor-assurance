name: owner customer engagement vendor materializer

on:
  push:
    branches:
      - catalog/owner-customer-engagement-expansion-1
    paths:
      - catalog-batches/owner-customer-engagement-expansion-1.yaml

permissions:
  contents: write

concurrency:
  group: owner-customer-engagement-expansion-1-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-customer-engagement-expansion-1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Generate, observe, and validate customer engagement tranche
        id: tranche
        shell: bash
        run: |
          set +e
          bash -euo pipefail <<'RUN' > /tmp/materializer.log 2>&1
          python -m tools.openva.catalog_batch catalog-batches/owner-customer-engagement-expansion-1.yaml --build-indexes

          find \
            data/vendors/customer-io/sources \
            data/vendors/activecampaign/sources \
            data/vendors/front/sources \
            data/vendors/campaign-monitor/sources \
            data/vendors/mailerlite/sources \
            -type f -name '*.yaml' | sort > /tmp/owner-customer-engagement-source-paths.txt

          python -m tools.openva.source_verification verify \
            --source-path-file /tmp/owner-customer-engagement-source-paths.txt \
            --output /tmp/owner-customer-engagement-verification.json

          baseline_args=()
          if [ -f maintenance/source-observations/latest-observations.json ]; then
            baseline_args=(--baseline maintenance/source-observations/latest-observations.json)
          fi

          python -m tools.openva.observation_ledger build \
            --verification-report /tmp/owner-customer-engagement-verification.json \
            --output-dir /tmp/owner-customer-engagement-observations \
            --run-id owner-customer-engagement-expansion-1 \
            "${baseline_args[@]}"

          python -m tools.openva.observation_ledger install-latest \
            --latest /tmp/owner-customer-engagement-observations/latest-observations.json

          python -m tools.openva.validate validate
          python -m pytest -q \
            tests/test_catalog_guard.py \
            tests/test_source_type_labels.py \
            tests/test_generated_exports.py \
            tests/test_source_observation_ledger.py
          RUN
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            mkdir -p maintenance/generated
            {
              echo '# Owner customer engagement tranche diagnostic'
              echo
              echo 'The fail-fast generator, observation, or validation lane exited non-zero.'
              echo
              echo '```text'
              tail -n 300 /tmp/materializer.log
              echo '```'
            } > maintenance/generated/owner-customer-engagement-expansion-1-diagnostic.md
            echo 'success=false' >> "$GITHUB_OUTPUT"
          else
            rm -f maintenance/generated/owner-customer-engagement-expansion-1-diagnostic.md
            echo 'success=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Remove one-time inputs after successful validation
        if: steps.tranche.outputs.success == 'true'
        run: |
          rm catalog-batches/owner-customer-engagement-expansion-1.yaml
          rm .github/workflows/owner-customer-engagement-materialize.yml
      - name: Commit materialized result
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materializer output was produced.'
            exit 1
          fi
          if [ "${{ steps.tranche.outputs.success }}" = 'true' ]; then
            git commit -m 'Catalog: add five customer engagement vendors'
          else
            git commit -m 'Catalog: capture customer engagement materializer failure'
          fi
          git push origin HEAD:catalog/owner-customer-engagement-expansion-1
      - name: Fail after publishing diagnostic
        if: steps.tranche.outputs.success != 'true'
        run: exit 1
