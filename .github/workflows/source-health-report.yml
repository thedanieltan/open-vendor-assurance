name: source-health-report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: source-health-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-health-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build source health inventory report
        run: python -m tools.openva.source_health build --output source-health-report.json
      - name: Print source health report summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('source-health-report.json', encoding='utf-8'))
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          print(json.dumps(report['breakdowns'].get('issues', {}), indent=2, sort_keys=True))
          PY
      - name: Upload source health report
        uses: actions/upload-artifact@v4
        with:
          name: openva-source-health-report
          path: source-health-report.json
          if-no-files-found: error
