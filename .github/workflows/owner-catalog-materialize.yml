name: owner-catalog-materialize

on:
  push:
    branches:
      - catalog/owner-security-identity-expansion-1

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Generate catalog records and indexes
        run: python -m tools.openva.catalog_batch catalog-batches/owner-security-identity-expansion-1.yaml --build-indexes
      - name: Validate generated catalog
        run: python -m tools.openva.validate validate
      - name: Run focused catalog tests
        run: pytest -q tests/test_catalog_batch.py tests/test_catalog_guard.py tests/test_source_type_labels.py
      - name: Commit materialized catalog
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add \
            data/vendors/cyberark \
            data/vendors/wiz \
            data/vendors/darktrace \
            data/vendors/sophos \
            dist/vendors/cyberark.json \
            dist/vendors/wiz.json \
            dist/vendors/darktrace.json \
            dist/vendors/sophos.json \
            indexes \
            openva-pack.json
          git diff --cached --stat
          git commit -m 'Catalog: materialize owner-led security and identity expansion [materialized]'
          git push
