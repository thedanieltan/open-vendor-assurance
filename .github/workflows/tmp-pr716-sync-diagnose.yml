name: tmp-pr716-sync-diagnose

on:
  push:
    branches:
      - agent/source-attribution-applicability

permissions:
  contents: write

concurrency:
  group: tmp-pr716-focused-${{ github.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install affected packages
        run: |
          pip install -e ".[dev]"
          pip install -e adapters/python/openva_pack_reader
          pip install -e adapters/python/openva_csv_export
          pip install -e adapters/python/openva_sqlite_export
      - name: Run focused contracts and persist diagnostics
        run: |
          set +e
          python -m pytest -q \
            tests/test_openva_csv_export.py \
            tests/test_openva_sqlite_export.py \
            tests/test_source_attribution.py \
            tests/test_catalog_guard.py \
            tests/test_site.py \
            tests/test_adapter_contract.py \
            tests/test_validate.py \
            > "$RUNNER_TEMP/pytest-output.txt" 2>&1
          STATUS=$?
          set -e
          {
            echo "PR #716 focused diagnostic"
            echo "Branch is based on current main."
            echo
            cat "$RUNNER_TEMP/pytest-output.txt"
            echo
            echo "exit_status=$STATUS"
          } > tmp-pr716-focused-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-pr716-focused-diagnostic.txt
          git commit -m "Record temporary PR 716 focused diagnostic"
          git push origin HEAD:agent/source-attribution-applicability
          cat "$RUNNER_TEMP/pytest-output.txt"
          exit "$STATUS"
