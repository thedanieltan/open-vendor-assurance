name: tmp-pr716-sync-diagnose

on:
  push:
    branches:
      - agent/source-attribution-applicability

permissions:
  contents: write

concurrency:
  group: tmp-pr716-sync-diagnose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install workspace
        run: pip install -e ".[dev]"
      - name: Build affected-test plan
        run: |
          set -euo pipefail
          git fetch origin main
          python -m tools.openva.workspace validate
          python -m tools.openva.workspace plan \
            --base-ref origin/main \
            --head-ref HEAD \
            --pretty > "$RUNNER_TEMP/workspace-plan.json"
          cat "$RUNNER_TEMP/workspace-plan.json"
      - name: Install affected dependency chain
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          import os

          plan = json.loads(Path(os.environ['RUNNER_TEMP'], 'workspace-plan.json').read_text(encoding='utf-8'))
          for path in plan['install_paths']:
              target = path
              if path in {'services/openva_match_service', 'integrations/mcp/openva_mcp'}:
                  target = f"{path}[dev]"
              subprocess.run([sys.executable, '-m', 'pip', 'install', '-e', target], check=True)
          PY
      - name: Run affected tests and persist diagnostics
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/pytest-output.txt" 2>&1
          import json
          import subprocess
          import sys
          from pathlib import Path
          import os

          plan = json.loads(Path(os.environ['RUNNER_TEMP'], 'workspace-plan.json').read_text(encoding='utf-8'))
          raise SystemExit(subprocess.run([sys.executable, '-m', 'pytest', '-q', *plan['test_paths']]).returncode)
          PY
          STATUS=$?
          set -e
          {
            echo "PR #716 workspace diagnostic"
            echo "Branch and test plan are based on current main."
            echo
            echo "Workspace plan:"
            cat "$RUNNER_TEMP/workspace-plan.json"
            echo
            echo "Pytest tail:"
            tail -n 300 "$RUNNER_TEMP/pytest-output.txt"
            echo
            echo "exit_status=$STATUS"
          } > tmp-pr716-workspace-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-pr716-workspace-diagnostic.txt
          git commit -m "Record temporary PR 716 workspace diagnostic"
          git push origin HEAD:agent/source-attribution-applicability
          cat "$RUNNER_TEMP/pytest-output.txt"
          exit "$STATUS"
