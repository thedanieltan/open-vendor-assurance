name: catalog reset PR

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET-CATALOG-LAYER to confirm controlled catalog-layer reset"
        required: true
      branch_name:
        description: "Branch name for reset PR. Must start with reset-"
        required: true
        default: "reset-catalog-layer-for-reseed"
      pr_title:
        description: "Pull request title. Must start with P:"
        required: true
        default: "P: reset generated catalog layer for breadth-depth reseed"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-reset-pr
  cancel-in-progress: false

jobs:
  catalog-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow inputs
        run: |
          test "${{ github.event.inputs.confirm }}" = "RESET-CATALOG-LAYER" || { echo "confirm must equal RESET-CATALOG-LAYER" >&2; exit 1; }
          case "${{ github.event.inputs.branch_name }}" in
            reset-*) ;;
            *) echo "branch_name must start with reset-" >&2; exit 1 ;;
          esac
          case "${{ github.event.inputs.pr_title }}" in
            P:*) ;;
            *) echo "pr_title must start with P:" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Dry-run reset report
        run: python -m tools.openva.reset_catalog --dry-run --output catalog-reset-dry-run.json
      - name: Run controlled catalog-layer reset
        run: python -m tools.openva.reset_catalog --output catalog-reset-report.json
      - name: Validate reset state
        run: python -m tools.openva.validate validate
      - name: Run tests
        run: pytest -q
      - name: Create reset PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ github.event.inputs.branch_name }}
          title: ${{ github.event.inputs.pr_title }}
          commit-message: ${{ github.event.inputs.pr_title }}
          body: |
            ## Summary

            Performs a controlled reset of the generated/shallow OpenVA catalog layer before breadth-depth reseed.

            ## Reset scope

            This PR removes/rebuilds the catalog layer only:

            ```text
            data/vendors/
            stale catalog-batches/
            indexes/
            openva-pack.json
            ```

            The workflow preserves repository substrate:

            ```text
            schemas/
            policy/
            config/category-taxonomy.yaml
            tools/
            tests/
            docs/
            .github/workflows/
            README.md
            CONTRIBUTING.md
            SECURITY.md
            LICENSE
            ```

            ## Safety posture

            - Manual dispatch only.
            - Requires explicit `RESET-CATALOG-LAYER` confirmation.
            - Opens a PR only; does not merge.
            - No live vendor fetches.
            - No raw document mirroring.
            - No gated/private/NDA/portal materials.
            - No advisory, scoring, compliance, procurement, or security conclusions.

            ## Reseed rule after merge

            Future catalog PRs should include canonical records, generated indexes, and validation in the same PR.

            ```text
            data/vendors/{vendor_id}/vendor.yaml
            data/vendors/{vendor_id}/sources/*.yaml
            data/vendors/{vendor_id}/artifacts/*.yaml
            indexes/*.json
            openva-pack.json
            ```

            ## Review checklist

            - Confirm only catalog-layer files were removed/rebuilt.
            - Confirm substrate files are preserved.
            - Confirm generated indexes and pack manifest are valid after reset.
            - Confirm the next PR will reseed tier-1 vendors with breadth and depth together.
          labels: reset,catalog-quality,governance
