name: coverage-audit

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: coverage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-source-index:
    if: github.head_ref == 'agent/source-attribution-applicability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/source-attribution-applicability
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Rebuild generated indexes and validate
        run: |
          set -euo pipefail
          python -m tools.openva.validate build-indexes
          git status --short
          python -m tools.openva.validate validate
          git diff --exit-code -- . ':!indexes/sources.json'
      - name: Create source-index Git object
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          api = f'https://api.github.com/repos/{repo}'

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'openva-source-attribution-index-rebuild',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          commit = request('GET', f'/git/commits/{head_sha}')
          content = Path('indexes/sources.json').read_bytes()
          blob = request('POST', '/git/blobs', {
              'content': base64.b64encode(content).decode('ascii'),
              'encoding': 'base64',
          })
          metadata = {
              'head_sha': head_sha,
              'base_tree_sha': commit['tree']['sha'],
              'sources_index_blob_sha': blob['sha'],
          }
          Path('source-index-object.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(metadata, indent=2))
          PY
      - name: Upload source-index object metadata
        uses: actions/upload-artifact@v6
        with:
          name: source-attribution-index-object
          path: source-index-object.json
          if-no-files-found: error
          retention-days: 1
