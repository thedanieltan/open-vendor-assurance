name: coverage-audit

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-validator:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Capture validator output
        run: |
          set +e
          python -m tools.openva.validate validate > validator-diagnostic.log 2>&1
          status=$?
          cat validator-diagnostic.log
          printf '\nexit_status=%s\n' "$status" >> validator-diagnostic.log
          exit 0
      - name: Upload validator diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: source-attribution-validator-diagnostic
          path: validator-diagnostic.log
          if-no-files-found: error
          retention-days: 1

  coverage-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Download latest source maintenance artifact for freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source-health-artifacts
          RUN_ID="$(gh run list \
            --workflow source-maintenance-report.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // ""')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::freshness inputs unavailable: no successful source-maintenance-report run was found. Coverage growth will use the committed-events fallback."
            exit 0
          fi
          if ! gh run download "$RUN_ID" \
            --name openva-source-maintenance-report \
            --dir source-health-artifacts; then
            echo "::warning::freshness inputs unavailable: could not download openva-source-maintenance-report from run $RUN_ID. Coverage growth will use the committed-events fallback."
            exit 0
          fi
      - name: Build coverage growth report
        run: |
          mkdir -p reports
          ARGS=(
            --output reports/coverage-growth-report.json
            --markdown-output reports/coverage-growth-summary.md
            --csv-output reports/coverage-growth-queue.csv
          )
          if [ -f source-health-artifacts/observation-ledger/latest-observations.json ]; then
            ARGS+=(--latest-observations source-health-artifacts/observation-ledger/latest-observations.json)
          fi
          if [ -f source-health-artifacts/observation-ledger/source-freshness-report.json ]; then
            ARGS+=(--freshness-report source-health-artifacts/observation-ledger/source-freshness-report.json)
          fi
          python -m tools.openva.coverage_growth build "${ARGS[@]}"
      - name: Build breadth and depth coverage audit
        run: |
          mkdir -p reports
          python -m tools.openva.coverage_audit build --output reports/coverage-audit-report.json
      - name: Build source publisher attribution audit
        run: |
          mkdir -p reports
          python -m tools.openva.source_attribution audit --output reports/source-attribution-audit.json
      - name: Build catalog completeness audit
        run: |
          mkdir -p reports
          python -m tools.openva.catalog_completeness build \
            --output reports/catalog-completeness-report.json \
            --csv-output reports/catalog-completeness-vendors.csv \
            --markdown-output reports/catalog-completeness-summary.md
      - name: Build entity correctness review queue
        run: |
          mkdir -p reports
          python -m tools.openva.entity_review_queue build \
            --output reports/entity-review-queue.json \
            --csv-output reports/entity-review-queue.csv \
            --markdown-output reports/entity-review-summary.md
      - name: Build field provenance coverage report
        run: |
          mkdir -p reports
          python -m tools.openva.field_provenance coverage \
            --output reports/field-provenance-coverage.json \
            --csv-output reports/field-provenance-coverage.csv \
            --markdown-output reports/field-provenance-summary.md
      - name: Build reviewer-friendly summary and CSV export
        run: |
          mkdir -p reports
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          report = json.load(open('reports/coverage-audit-report.json', encoding='utf-8'))
          attribution = json.load(open('reports/source-attribution-audit.json', encoding='utf-8'))
          lines = [
              "# OpenVA Coverage Audit",
              "",
              "This report measures catalog breadth, depth, and source-attribution completeness only. It is not legal, compliance, procurement, security, KYC, AML, audit, or vendor-risk advice.",
              "",
              "## Summary",
              "",
              f"- Vendors: `{report['summary']['vendor_count']}`",
              f"- Artifacts: `{report['summary']['artifact_count']}`",
              f"- Vendors with DPA: `{report['summary']['vendors_with_dpa']}`",
              f"- Vendors with subprocessors list: `{report['summary']['vendors_with_subprocessors_list']}`",
              f"- Vendors with at least three core artifacts: `{report['summary']['vendors_with_at_least_three_core_artifacts']}`",
              f"- Cross-domain sources: `{attribution['summary']['cross_domain_source_count']}`",
              f"- Cross-domain sources without complete attribution: `{attribution['summary']['unresolved_cross_domain_source_count']}`",
              f"- Parse failures: `{report['summary']['parse_failures']}`",
              f"- Attribution audit pipeline failures: `{attribution['summary']['pipeline_failure_count']}`",
              "",
              "## Files",
              "",
              "- `coverage-audit-summary.md`: maintainer-readable summary.",
              "- `coverage-audit-report.json`: machine-readable breadth and depth source of truth.",
              "- `coverage-audit-vendors.csv`: reviewer-friendly vendor coverage export.",
              "- `source-attribution-audit.json`: report-only publisher relationship and product-applicability inventory.",
              "",
          ]
          Path('reports/coverage-audit-summary.md').write_text('\n'.join(lines), encoding='utf-8')
          with open('reports/coverage-audit-vendors.csv', 'w', encoding='utf-8', newline='') as handle:
              fields = [
                  'vendor_id',
                  'display_name',
                  'artifact_count',
                  'artifact_types',
                  'core_artifacts_present',
                  'core_artifacts_missing',
                  'depth_score',
                  'depth_tier',
              ]
              writer = csv.DictWriter(handle, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              for vendor in report.get('vendors', []):
                  writer.writerow({
                      **vendor,
                      'artifact_types': ';'.join(vendor.get('artifact_types', [])),
                      'core_artifacts_present': ';'.join(vendor.get('core_artifacts_present', [])),
                      'core_artifacts_missing': ';'.join(vendor.get('core_artifacts_missing', [])),
                  })
          print(Path('reports/coverage-audit-summary.md').read_text(encoding='utf-8'))
          print(json.dumps(report['breakdowns'].get('artifact_types', {}), indent=2, sort_keys=True))
          print(json.dumps(report['breakdowns'].get('depth_tiers', {}), indent=2, sort_keys=True))
          print(json.dumps(attribution['summary'], indent=2, sort_keys=True))
          PY
      - name: Upload coverage audit report
        uses: actions/upload-artifact@v6
        with:
          name: openva-coverage-audit-report
          path: |
            reports/coverage-growth-report.json
            reports/coverage-growth-summary.md
            reports/coverage-growth-queue.csv
            reports/coverage-audit-summary.md
            reports/coverage-audit-report.json
            reports/coverage-audit-vendors.csv
            reports/source-attribution-audit.json
            reports/catalog-completeness-summary.md
            reports/catalog-completeness-report.json
            reports/catalog-completeness-vendors.csv
            reports/entity-review-summary.md
            reports/entity-review-queue.json
            reports/entity-review-queue.csv
            reports/field-provenance-summary.md
            reports/field-provenance-coverage.json
            reports/field-provenance-coverage.csv
          if-no-files-found: error
