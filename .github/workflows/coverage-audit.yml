name: temporary-rebuild-artifact-bound-production

on:
  push:
    branches:
      - agent/catalog-growth-artifact-bound-promotion

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    if: github.ref_name == 'agent/catalog-growth-artifact-bound-promotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/catalog-growth-artifact-bound-promotion
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild from exact PR base
        env:
          BASE_SHA: 9f797629f145b118874ea899a32f23481d3e3240
          PATCH_SOURCE_SHA: f2d04de162abc2dcdbafe3594badbc9a68cf0908
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout "$BASE_SHA" -- \
            .github/workflows/candidate-promotion-pr.yml \
            .github/workflows/catalog-growth-promotion-bridge.yml \
            tools/openva/discovery_promotion_bridge.py \
            tests/test_discovery_promotion_bridge.py
          rm -f tests/test_catalog_growth_artifact_bound_promotion.py
          git show "$PATCH_SOURCE_SHA:.github/workflows/zz-temp-artifact-bound-patch.yml" > .github/workflows/zz-temp-artifact-bound-patch.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/zz-temp-artifact-bound-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Commit patched branch"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          program = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply_artifact_bound_patch.py').write_text(program, encoding='utf-8')
          PY
          python /tmp/apply_artifact_bound_patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/candidate-promotion-pr.yml')
          text = path.read_text(encoding='utf-8')

          old_event = '[ "$DISCOVERY_EVENT" = "schedule" ] || { echo "::error::artifact-bound automatic promotion requires a scheduled discovery run"; exit 1; }'
          new_event = '''case "$DISCOVERY_EVENT" in
            schedule|workflow_dispatch) ;;
            *) echo "::error::artifact-bound promotion source event is not authorized: $DISCOVERY_EVENT"; exit 1 ;;
          esac'''
          if text.count(old_event) != 1:
              raise SystemExit('expected exactly one schedule-only artifact event gate')
          text = text.replace(old_event, new_event)

          step_start = text.index('      - name: Load artifact-bound strict-growth evidence\n')
          step_end = text.index('      - name: Regenerate strict-growth promotion plan\n', step_start)
          block = text[step_start:step_end].splitlines()
          run_idx = block.index('        run: |')
          env_idx = block.index('        env:')
          if run_idx != env_idx + 2 or not block[env_idx + 1].startswith('GH_TOKEN:'):
              raise SystemExit('unexpected generated artifact step structure')
          block[env_idx + 1] = '          ' + block[env_idx + 1]
          for idx in range(run_idx + 1, len(block)):
              if block[idx]:
                  block[idx] = '          ' + block[idx]
          text = text[:step_start] + '\n'.join(block) + '\n' + text[step_end:]

          old_body = '''          if os.environ.get('SOURCE_DISCOVERY_RUN_ID'):
    insert_at = lines.index('## Counts') - 1
    lines[insert_at:insert_at] = [
        f"- Source discovery run: `{os.environ['SOURCE_DISCOVERY_RUN_ID']}`",
        f"- Source discovery artifact: `{os.environ['SOURCE_DISCOVERY_ARTIFACT_ID']}`",
        f"- Source discovery plan SHA-256: `{os.environ['SOURCE_DISCOVERY_PLAN_DIGEST']}`",
    ]
'''
          new_body = '''          if os.environ.get('SOURCE_DISCOVERY_RUN_ID'):
              insert_at = lines.index('## Counts') - 1
              lines[insert_at:insert_at] = [
                  f"- Source discovery run: `{os.environ['SOURCE_DISCOVERY_RUN_ID']}`",
                  f"- Source discovery artifact: `{os.environ['SOURCE_DISCOVERY_ARTIFACT_ID']}`",
                  f"- Source discovery plan SHA-256: `{os.environ['SOURCE_DISCOVERY_PLAN_DIGEST']}`",
              ]
'''
          if text.count(old_body) != 1:
              raise SystemExit('expected exactly one malformed PR provenance block')
          text = text.replace(old_body, new_body)

          old_upload = '''        with:
name: openva-candidate-promotion-pr-artifact-bound-source
path: |
  strict-growth-source-plan.json
  catalog-growth-source-eligibility-report.json
  vendor-candidate-discovery-report.json
  vendor-candidate-source-discovery-report.json
  catalog-growth-backlog-report.json
  strict-growth-shortlist.json
if-no-files-found: warn
      - name: Build catalog promotion failure routing input
'''
          new_upload = '''        with:
          name: openva-candidate-promotion-pr-artifact-bound-source
          path: |
            strict-growth-source-plan.json
            catalog-growth-source-eligibility-report.json
            vendor-candidate-discovery-report.json
            vendor-candidate-source-discovery-report.json
            catalog-growth-backlog-report.json
            strict-growth-shortlist.json
          if-no-files-found: warn
      - name: Build catalog promotion failure routing input
'''
          if text.count(old_upload) != 1:
              raise SystemExit('expected exactly one malformed artifact upload block')
          text = text.replace(old_upload, new_upload)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_catalog_growth_artifact_bound_promotion.py')
          body = test.read_text(encoding='utf-8')
          old = '''    assert 'DISCOVERY_EVENT" = "schedule"' in step
'''
          new = '''    assert 'schedule|workflow_dispatch' in step
    assert 'artifact-bound promotion source event is not authorized' in step
'''
          if body.count(old) != 1:
              raise SystemExit('expected exactly one focused schedule-only assertion')
          test.write_text(body.replace(old, new), encoding='utf-8')
          PY
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/candidate-promotion-pr.yml"); YAML.load_file(".github/workflows/catalog-growth-promotion-bridge.yml")'
          python -m py_compile tools/openva/discovery_promotion_bridge.py tests/test_discovery_promotion_bridge.py tests/test_catalog_growth_artifact_bound_promotion.py
          git diff --check
          CAND_DEL=$(git diff --numstat "$BASE_SHA" -- .github/workflows/candidate-promotion-pr.yml | awk '{print $2+0}')
          BRIDGE_DEL=$(git diff --numstat "$BASE_SHA" -- .github/workflows/catalog-growth-promotion-bridge.yml | awk '{print $2+0}')
          echo "candidate deletions=$CAND_DEL bridge deletions=$BRIDGE_DEL"
          [ "$CAND_DEL" -lt 100 ] || { echo "::error::candidate workflow deletion guard tripped"; exit 1; }
          [ "$BRIDGE_DEL" -lt 100 ] || { echo "::error::bridge workflow deletion guard tripped"; exit 1; }
      - name: Create self-cleaning production commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_HEAD=$(git rev-parse HEAD)
          BASE_TREE=$(git rev-parse HEAD^{tree})
          make_blob() {
            jq -Rs '{content: ., encoding: "utf-8"}' < "$1" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha'
          }
          CAND=$(make_blob .github/workflows/candidate-promotion-pr.yml)
          BRIDGE=$(make_blob .github/workflows/catalog-growth-promotion-bridge.yml)
          MODULE=$(make_blob tools/openva/discovery_promotion_bridge.py)
          TEST=$(make_blob tests/test_discovery_promotion_bridge.py)
          FOCUSED=$(make_blob tests/test_catalog_growth_artifact_bound_promotion.py)
          jq -n --arg base "$BASE_TREE" --arg cand "$CAND" --arg bridge "$BRIDGE" --arg module "$MODULE" --arg test "$TEST" --arg focused "$FOCUSED" '{base_tree:$base,tree:[
            {path:".github/workflows/candidate-promotion-pr.yml",mode:"100644",type:"blob",sha:$cand},
            {path:".github/workflows/catalog-growth-promotion-bridge.yml",mode:"100644",type:"blob",sha:$bridge},
            {path:"tools/openva/discovery_promotion_bridge.py",mode:"100644",type:"blob",sha:$module},
            {path:"tests/test_discovery_promotion_bridge.py",mode:"100644",type:"blob",sha:$test},
            {path:"tests/test_catalog_growth_artifact_bound_promotion.py",mode:"100644",type:"blob",sha:$focused},
            {path:".github/workflows/zz-temp-rebuild-clean-production.yml",mode:"100644",type:"blob",sha:null}
          ]}' >/tmp/tree.json
          TREE=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree.json --jq '.sha')
          jq -n --arg message "Bind catalog growth promotion to discovery artifact" --arg tree "$TREE" --arg parent "$BASE_HEAD" '{message:$message,tree:$tree,parents:[$parent]}' >/tmp/commit.json
          COMMIT=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input /tmp/commit.json --jq '.sha')
          echo "CLEAN_OBJECT_PARENT=$BASE_HEAD"
          echo "CLEAN_OBJECT_TREE=$TREE"
          echo "CLEAN_OBJECT_COMMIT=$COMMIT"
          gh pr comment 821 --repo "$GITHUB_REPOSITORY" --body "CLEAN_ARTIFACT_BOUND_OBJECT_COMMIT=$COMMIT\nCLEAN_ARTIFACT_BOUND_OBJECT_PARENT=$BASE_HEAD\nCLEAN_ARTIFACT_BOUND_OBJECT_TREE=$TREE"
