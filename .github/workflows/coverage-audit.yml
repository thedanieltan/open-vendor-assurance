name: coverage-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: coverage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build breadth and depth coverage audit
        run: python -m tools.openva.coverage_audit build --output coverage-audit-report.json
      - name: Print coverage audit summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('coverage-audit-report.json', encoding='utf-8'))
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          print(json.dumps(report['breakdowns'].get('artifact_types', {}), indent=2, sort_keys=True))
          print(json.dumps(report['breakdowns'].get('depth_tiers', {}), indent=2, sort_keys=True))
          PY
      - name: Upload coverage audit report
        uses: actions/upload-artifact@v4
        with:
          name: openva-coverage-audit-report
          path: coverage-audit-report.json
          if-no-files-found: error
