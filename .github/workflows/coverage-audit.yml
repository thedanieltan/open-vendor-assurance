name: coverage-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: coverage-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build breadth and depth coverage audit
        run: |
          mkdir -p reports
          python -m tools.openva.coverage_audit build --output reports/coverage-audit-report.json
      - name: Build catalog completeness audit
        run: |
          mkdir -p reports
          python -m tools.openva.catalog_completeness build \
            --output reports/catalog-completeness-report.json \
            --csv-output reports/catalog-completeness-vendors.csv \
            --markdown-output reports/catalog-completeness-summary.md
      - name: Build reviewer-friendly summary and CSV export
        run: |
          mkdir -p reports
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          report = json.load(open('reports/coverage-audit-report.json', encoding='utf-8'))
          lines = [
              "# OpenVA Coverage Audit",
              "",
              "This report measures catalog breadth and depth only. It is not legal, compliance, procurement, security, KYC, AML, audit, or vendor-risk advice.",
              "",
              "## Summary",
              "",
              f"- Vendors: `{report['summary']['vendor_count']}`",
              f"- Artifacts: `{report['summary']['artifact_count']}`",
              f"- Vendors with DPA: `{report['summary']['vendors_with_dpa']}`",
              f"- Vendors with subprocessors list: `{report['summary']['vendors_with_subprocessors_list']}`",
              f"- Vendors with at least three core artifacts: `{report['summary']['vendors_with_at_least_three_core_artifacts']}`",
              f"- Parse failures: `{report['summary']['parse_failures']}`",
              "",
              "## Files",
              "",
              "- `coverage-audit-summary.md`: maintainer-readable summary.",
              "- `coverage-audit-report.json`: machine-readable source of truth.",
              "- `coverage-audit-vendors.csv`: reviewer-friendly vendor coverage export.",
              "",
          ]
          Path('reports/coverage-audit-summary.md').write_text('\n'.join(lines), encoding='utf-8')
          with open('reports/coverage-audit-vendors.csv', 'w', encoding='utf-8', newline='') as handle:
              fields = [
                  'vendor_id',
                  'display_name',
                  'artifact_count',
                  'artifact_types',
                  'core_artifacts_present',
                  'core_artifacts_missing',
                  'depth_score',
                  'depth_tier',
              ]
              writer = csv.DictWriter(handle, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              for vendor in report.get('vendors', []):
                  writer.writerow({
                      **vendor,
                      'artifact_types': ';'.join(vendor.get('artifact_types', [])),
                      'core_artifacts_present': ';'.join(vendor.get('core_artifacts_present', [])),
                      'core_artifacts_missing': ';'.join(vendor.get('core_artifacts_missing', [])),
                  })
          print(Path('reports/coverage-audit-summary.md').read_text(encoding='utf-8'))
          print(json.dumps(report['breakdowns'].get('artifact_types', {}), indent=2, sort_keys=True))
          print(json.dumps(report['breakdowns'].get('depth_tiers', {}), indent=2, sort_keys=True))
          PY
      - name: Upload coverage audit report
        uses: actions/upload-artifact@v6
        with:
          name: openva-coverage-audit-report
          path: |
            reports/coverage-audit-summary.md
            reports/coverage-audit-report.json
            reports/coverage-audit-vendors.csv
            reports/catalog-completeness-summary.md
            reports/catalog-completeness-report.json
            reports/catalog-completeness-vendors.csv
          if-no-files-found: error
