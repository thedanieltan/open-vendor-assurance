name: temporary-rebuild-artifact-bound-production

on:
  push:
    branches:
      - agent/catalog-growth-artifact-bound-promotion

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build clean production commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show f2d04de162abc2dcdbafe3594badbc9a68cf0908:.github/workflows/zz-temp-artifact-bound-patch.yml > .github/workflows/zz-temp-artifact-bound-patch.yml
          python tools/openva/zz_temp_rebuild_artifact_bound.py
