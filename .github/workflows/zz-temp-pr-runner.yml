name: temporary-artifact-bound-pr-runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/catalog-growth-artifact-bound-promotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/catalog-growth-artifact-bound-promotion
          token: ${{ secrets.OPENVA_AUTOMERGE_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Extract and run exact patch program
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/zz-temp-artifact-bound-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Commit patched branch"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          program = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply_artifact_bound_patch.py').write_text(program, encoding='utf-8')
          PY
          python /tmp/apply_artifact_bound_patch.py
          rm -f .github/workflows/zz-temp-pr-runner.yml
      - name: Export generated production files
        uses: actions/upload-artifact@v6
        with:
          name: openva-artifact-bound-promotion-generated-files
          path: |
            .github/workflows/candidate-promotion-pr.yml
            .github/workflows/catalog-growth-promotion-bridge.yml
            tools/openva/discovery_promotion_bridge.py
            tests/test_discovery_promotion_bridge.py
            tests/test_catalog_growth_artifact_bound_promotion.py
          if-no-files-found: error
      - name: Commit final production diff
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind catalog growth promotion to discovery artifact"
          git push origin HEAD:agent/catalog-growth-artifact-bound-promotion
