name: source-completion-normalize-unavailable

on:
  pull_request:
    branches:
      - catalog/source-completion-audit-control
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: source-completion-normalize-unavailable-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'catalog/owner-source-completion-1-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Normalize unavailable-source paths and merge duplicate evidence
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          import yaml

          root = Path('.')
          renamed = []
          merged = []

          def load_yaml(path: Path) -> dict[str, Any]:
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise ValueError(f'{path}: expected mapping')
              return data

          def write_yaml(path: Path, data: dict[str, Any]) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(yaml.safe_dump(data, sort_keys=False, allow_unicode=True), encoding='utf-8')

          for vendor_dir in sorted((root / 'data/vendors').glob('*')):
              unavailable_dir = vendor_dir / 'unavailable_sources'
              if not unavailable_dir.exists():
                  continue
              for path in sorted(unavailable_dir.glob('*.yaml')):
                  if not path.exists():
                      continue
                  record = load_yaml(path)
                  record_id = str(record.get('unavailable_source_id') or '')
                  vendor_id = str(record.get('vendor_id') or vendor_dir.name)
                  source_type = str(record.get('source_type') or '')
                  expected_id = f"{vendor_id}-{source_type.replace('_', '-')}"
                  if record_id != expected_id:
                      record['unavailable_source_id'] = expected_id
                  canonical = unavailable_dir / f'{expected_id}.yaml'
                  if path == canonical:
                      if record != load_yaml(path):
                          write_yaml(path, record)
                      continue
                  if canonical.exists():
                      existing = load_yaml(canonical)
                      checked = list(dict.fromkeys([
                          *[str(item) for item in existing.get('candidate_urls_checked') or [] if item],
                          *[str(item) for item in record.get('candidate_urls_checked') or [] if item],
                      ]))
                      merged_record = dict(existing)
                      merged_record['unavailable_source_id'] = expected_id
                      merged_record['vendor_id'] = vendor_id
                      merged_record['source_type'] = source_type
                      merged_record['candidate_urls_checked'] = checked
                      merged_record['reviewed_at'] = max(
                          str(existing.get('reviewed_at') or ''),
                          str(record.get('reviewed_at') or ''),
                      )
                      merged_record['next_review_after'] = max(
                          str(existing.get('next_review_after') or ''),
                          str(record.get('next_review_after') or ''),
                      )
                      current_notes = str(record.get('notes') or '')
                      existing_notes = str(existing.get('notes') or '')
                      merged_record['notes'] = current_notes if len(current_notes) >= len(existing_notes) else existing_notes
                      merged_record['reviewed_by'] = record.get('reviewed_by') or existing.get('reviewed_by') or 'agent'
                      merged_record['status'] = record.get('status') or existing.get('status') or 'not_identified'
                      merged_record['reason'] = record.get('reason') or existing.get('reason') or 'distinct_public_url_not_identified'
                      merged_record['not_advice'] = True
                      write_yaml(canonical, merged_record)
                      path.unlink()
                      merged.append({
                          'vendor_id': vendor_id,
                          'source_type': source_type,
                          'removed_duplicate_path': str(path),
                          'canonical_path': str(canonical),
                          'candidate_url_count': len(checked),
                      })
                  else:
                      write_yaml(canonical, record)
                      path.unlink()
                      renamed.append({
                          'vendor_id': vendor_id,
                          'source_type': source_type,
                          'old_path': str(path),
                          'canonical_path': str(canonical),
                      })

          report = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_completion_unavailable_normalization',
              'renamed_count': len(renamed),
              'merged_duplicate_count': len(merged),
              'renamed': renamed,
              'merged_duplicates': merged,
              'not_advice': True,
          }
          output = root / '.owner-source-completion-1/results/unavailable-normalization.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'renamed_count': len(renamed),
              'merged_duplicate_count': len(merged),
          }, indent=2, sort_keys=True))
          PY
      - name: Rebuild and validate normalized catalog
        run: |
          python -m tools.openva.validate build-indexes
          python -m tools.openva.catalog_source_completion check \
            --as-of 2026-07-14 \
            --output .owner-source-completion-1/results/post-normalization-completion.json
          python -m tools.openva.validate validate
          pytest -q \
            tests/test_catalog_source_completion.py \
            tests/test_candidate_promotion_actions.py \
            tests/test_source_discovery.py \
            tests/test_sitemap_discovery.py \
            tests/test_coverage_audit.py
      - name: Commit normalization to builder branch
        run: |
          rm -f .owner-source-completion-1/unavailable-normalization-trigger.txt
          rm -f .owner-source-completion-1/remediation-v2-trigger.txt
          git config user.name 'openva-owner-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No normalization changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Catalog: normalize unavailable source records'
          git push origin HEAD:catalog/owner-source-completion-1-builder
