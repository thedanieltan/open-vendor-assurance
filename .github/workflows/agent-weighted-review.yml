name: agent-weighted-review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    # Advisory review remains available for authority-sensitive and public-claim
    # surfaces, but no longer fans out into four install-heavy jobs for every
    # touched path. The single job below classifies changed files and skips
    # validators that are irrelevant to the PR.
    paths:
      - ".github/workflows/agent-weighted-review.yml"
      - "data/**"
      - "examples/**"
      - "indexes/**"
      - "dist/**"
      - "adapters/**"
      - "schemas/**"
      - "tools/openva/**"
      - "tests/**"
      - "docs/**"
      - "site/**"
      - "config/**"
      - "README.md"
      - "openva-pack.json"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: agent-weighted-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  weighted-review:
    name: weighted-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > changed-files.txt
      - name: Classify weighted-review validators
        id: classify
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          paths = [
              line.strip()
              for line in Path("changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          def starts(prefix: str) -> bool:
              return any(path.startswith(prefix) for path in paths)

          def exact(value: str) -> bool:
              return value in paths

          def contains(fragment: str) -> bool:
              return any(fragment in path for path in paths)

          catalog_or_schema = (
              starts("data/")
              or starts("indexes/")
              or starts("dist/")
              or starts("adapters/")
              or starts("schemas/")
              or starts("config/")
              or exact("openva-pack.json")
              or contains("tools/openva/validate")
              or contains("tools/openva/schema_registry")
              or contains("tools/openva/automation_rules")
          )
          source_records = any(
              path.startswith("data/vendors/")
              and ("/sources/" in path or "/artifacts/" in path)
              for path in paths
          )
          provenance_records = any(
              path.startswith("data/vendors/")
              and (
                  "/sources/" in path
                  or "/legal_entities/" in path
                  or "/entity_mentions/" in path
                  or "/candidate_sources/" in path
                  or "/unavailable_sources/" in path
              )
              for path in paths
          )
          public_claim_surfaces = (
              starts("docs/")
              or starts("site/")
              or starts("data/")
              or starts("indexes/")
              or starts("dist/")
              or starts("adapters/")
              or exact("README.md")
          )

          outputs = {
              "schema_required": catalog_or_schema,
              "source_required": source_records,
              "advisory_required": public_claim_surfaces,
              "provenance_required": provenance_records,
          }

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={'true' if value else 'false'}\n")

          print("Weighted-review validators:")
          for key, value in outputs.items():
              print(f"  {key}: {value}")
          PY
      - name: Run schema conformance agent when relevant
        if: steps.classify.outputs.schema_required == 'true'
        run: python -m tools.openva.automation_rules schema-conformance --changed-files changed-files.txt --output weighted-review-schema.json
      - name: Skip schema conformance agent when not relevant
        if: steps.classify.outputs.schema_required != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          changed = [line.strip() for line in Path("changed-files.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          Path("weighted-review-schema.json").write_text(json.dumps({
            "schema_version": "0.1.0",
            "generated_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "validator": "schema-conformance-agent",
            "score": 1,
            "max_score": 1,
            "warnings": [],
            "escalations": [],
            "failures": [],
            "changed_files": changed,
            "details": {"skipped": True, "reason": "no catalog, schema, config, adapter, or generated export changes"},
            "advisory_only": True,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Run source accessibility agent when relevant
        if: steps.classify.outputs.source_required == 'true'
        run: python -m tools.openva.automation_rules source-accessibility --changed-files changed-files.txt --retry-429 --output weighted-review-source.json
      - name: Skip source accessibility agent when not relevant
        if: steps.classify.outputs.source_required != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          changed = [line.strip() for line in Path("changed-files.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          Path("weighted-review-source.json").write_text(json.dumps({
            "schema_version": "0.1.0",
            "generated_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "validator": "source-accessibility-agent",
            "score": 1,
            "max_score": 1,
            "warnings": [],
            "escalations": [],
            "failures": [],
            "changed_files": changed,
            "details": {"skipped": True, "reason": "no changed source or artifact URL records"},
            "advisory_only": True,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Run advisory wording agent when relevant
        if: steps.classify.outputs.advisory_required == 'true'
        run: python -m tools.openva.automation_rules advisory-wording --changed-files changed-files.txt --output weighted-review-wording.json
      - name: Skip advisory wording agent when not relevant
        if: steps.classify.outputs.advisory_required != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          changed = [line.strip() for line in Path("changed-files.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          Path("weighted-review-wording.json").write_text(json.dumps({
            "schema_version": "0.1.0",
            "generated_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "validator": "advisory-wording-agent",
            "score": 1,
            "max_score": 1,
            "warnings": [],
            "escalations": [],
            "failures": [],
            "changed_files": changed,
            "details": {"skipped": True, "reason": "no public-claim or structured catalog surfaces changed"},
            "advisory_only": True,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Run provenance completeness agent when relevant
        if: steps.classify.outputs.provenance_required == 'true'
        run: python -m tools.openva.automation_rules provenance-completeness --changed-files changed-files.txt --output weighted-review-provenance.json
      - name: Skip provenance completeness agent when not relevant
        if: steps.classify.outputs.provenance_required != 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          changed = [line.strip() for line in Path("changed-files.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          Path("weighted-review-provenance.json").write_text(json.dumps({
            "schema_version": "0.1.0",
            "generated_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "validator": "provenance-completeness-agent",
            "score": 1,
            "max_score": 1,
            "warnings": [],
            "escalations": [],
            "failures": [],
            "changed_files": changed,
            "details": {"skipped": True, "reason": "no provenance-bearing vendor records changed"},
            "advisory_only": True,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Build weighted review summary
        run: python -m tools.openva.automation_rules weighted-review weighted-review-*.json --output weighted-review-summary.json
      - name: Comment and label weighted review summary
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('weighted-review-summary.json', 'utf8'));
            const marker = '<!-- openva-weighted-review:summary -->';
            const validatorLines = result.validators.map((item) => {
              const skipped = item.details?.skipped ? 'skipped' : 'ran';
              return `- ${item.validator}: ${skipped}; score ${item.score}/${item.max_score}; escalations ${item.escalations.length}; warnings ${item.warnings.length}`;
            }).join('\n');
            const body = `${marker}
            ### OpenVA weighted review summary

            Advisory score: ${result.total_score}/${result.max_score}
            Label: \`${result.label}\`
            Escalations: ${result.escalations.length}
            Warnings: ${result.warnings.length}

            Validator routing:
            ${validatorLines}

            This workflow is advisory only. It does not merge, close, or mutate catalog files.

            \`\`\`json
            ${JSON.stringify(result, null, 2)}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
            const labelColors = {
              'openva:weighted-pass': '0e8a16',
              'openva:weighted-warning': 'fbca04',
              'openva:needs-human-review': 'd93f0b',
              'openva:blocked-by-policy': 'b60205',
            };
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: result.label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: result.label,
                color: labelColors[result.label] || 'ededed',
                description: 'OpenVA weighted advisory review result',
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [result.label],
            });
      - uses: actions/upload-artifact@v6
        with:
          name: weighted-review-results
          path: |
            weighted-review-schema.json
            weighted-review-source.json
            weighted-review-wording.json
            weighted-review-provenance.json
            weighted-review-summary.json
