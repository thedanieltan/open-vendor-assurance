name: agent-weighted-review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - "data/**"
      - "examples/**"
      - "indexes/**"
      - "dist/**"
      - "adapters/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - "config/**"
      - "openva-pack.json"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: agent-weighted-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  schema-conformance-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > changed-files.txt
      - name: Run schema conformance agent
        run: python -m tools.openva.automation_rules schema-conformance --changed-files changed-files.txt --output weighted-review-schema.json
      - name: Comment schema conformance result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('weighted-review-schema.json', 'utf8'));
            const marker = '<!-- openva-weighted-review:schema-conformance-agent -->';
            const body = `${marker}
            ### OpenVA weighted review: schema conformance agent

            Score: ${result.score}/1
            Escalations: ${result.escalations.length}
            Warnings: ${result.warnings.length}

            \`\`\`json
            ${JSON.stringify(result, null, 2)}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
      - uses: actions/upload-artifact@v6
        with:
          name: weighted-review-schema
          path: weighted-review-schema.json

  source-accessibility-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > changed-files.txt
      - name: Run source accessibility agent
        run: python -m tools.openva.automation_rules source-accessibility --changed-files changed-files.txt --retry-429 --output weighted-review-source.json
      - name: Comment source accessibility result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('weighted-review-source.json', 'utf8'));
            const marker = '<!-- openva-weighted-review:source-accessibility-agent -->';
            const body = `${marker}
            ### OpenVA weighted review: source accessibility agent

            Score: ${result.score}/1
            Escalations: ${result.escalations.length}
            Warnings: ${result.warnings.length}

            \`\`\`json
            ${JSON.stringify(result, null, 2)}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
      - uses: actions/upload-artifact@v6
        with:
          name: weighted-review-source
          path: weighted-review-source.json

  advisory-wording-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > changed-files.txt
      - name: Run advisory wording agent
        run: python -m tools.openva.automation_rules advisory-wording --changed-files changed-files.txt --output weighted-review-wording.json
      - name: Comment advisory wording result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('weighted-review-wording.json', 'utf8'));
            const marker = '<!-- openva-weighted-review:advisory-wording-agent -->';
            const body = `${marker}
            ### OpenVA weighted review: advisory wording agent

            Score: ${result.score}/1
            Escalations: ${result.escalations.length}
            Warnings: ${result.warnings.length}

            \`\`\`json
            ${JSON.stringify(result, null, 2)}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
      - uses: actions/upload-artifact@v6
        with:
          name: weighted-review-wording
          path: weighted-review-wording.json

  provenance-completeness-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > changed-files.txt
      - name: Run provenance completeness agent
        run: python -m tools.openva.automation_rules provenance-completeness --changed-files changed-files.txt --output weighted-review-provenance.json
      - name: Comment provenance completeness result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('weighted-review-provenance.json', 'utf8'));
            const marker = '<!-- openva-weighted-review:provenance-completeness-agent -->';
            const body = `${marker}
            ### OpenVA weighted review: provenance completeness agent

            Score: ${result.score}/1
            Escalations: ${result.escalations.length}
            Warnings: ${result.warnings.length}

            \`\`\`json
            ${JSON.stringify(result, null, 2)}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
      - uses: actions/upload-artifact@v6
        with:
          name: weighted-review-provenance
          path: weighted-review-provenance.json

  weighted-review-summary:
    runs-on: ubuntu-latest
    needs:
      - schema-conformance-agent
      - source-accessibility-agent
      - advisory-wording-agent
      - provenance-completeness-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v6
        with:
          pattern: weighted-review-*
          path: weighted-review-results
          merge-multiple: true
      - name: Build weighted review summary
        run: python -m tools.openva.automation_rules weighted-review weighted-review-results/*.json --output weighted-review-summary.json
      - name: Comment and label weighted review summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('weighted-review-summary.json', 'utf8'));
            const marker = '<!-- openva-weighted-review:summary -->';
            const body = `${marker}
            ### OpenVA weighted review summary

            Advisory score: ${result.total_score}/${result.max_score}
            Label: \`${result.label}\`
            Escalations: ${result.escalations.length}
            Warnings: ${result.warnings.length}

            This workflow is advisory only. It does not merge, close, or mutate catalog files.

            \`\`\`json
            ${JSON.stringify(result, null, 2)}
            \`\`\`
            `;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            }
            const labelColors = {
              'openva:weighted-pass': '0e8a16',
              'openva:weighted-warning': 'fbca04',
              'openva:needs-human-review': 'd93f0b',
              'openva:blocked-by-policy': 'b60205',
            };
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: result.label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: result.label,
                color: labelColors[result.label] || 'ededed',
                description: 'OpenVA weighted advisory review result',
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [result.label],
            });
      - uses: actions/upload-artifact@v6
        with:
          name: weighted-review-summary
          path: weighted-review-summary.json
