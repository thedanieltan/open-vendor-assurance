name: source-reviewer-inbox-dry-run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-reviewer-inbox-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-reviewer-inbox-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Build synthetic source review triage plan
        run: |
          cat > source-review-triage-plan.json <<'JSON'
          {
            "schema_version": "0.1.0",
            "generated_at": "2026-05-26T00:00:00Z",
            "report_type": "source_review_triage_plan",
            "source_maintenance_run_id": "source-reviewer-inbox-dry-run-${{ github.run_id }}",
            "items": [
              {
                "vendor_id": "dry-run-vendor-a",
                "source_id": "dry-run-vendor-a-security",
                "source_type": "security_page",
                "source_url": "https://vendor-a.example/security-old",
                "final_url": "https://vendor-a.example/security-old",
                "http_status": 404,
                "verification_status": "not_found",
                "bucket": "mark_no_replacement_available",
                "reason_codes": ["no_verified_public_vendor_replacement"],
                "recommended_next_action": "Keep source unavailable until a public vendor source is verified."
              },
              {
                "vendor_id": "dry-run-vendor-b",
                "source_id": "dry-run-vendor-b-privacy",
                "source_type": "privacy_notice",
                "source_url": "https://vendor-b.example/privacy-old",
                "final_url": "https://vendor-b.example/privacy-old",
                "http_status": 403,
                "verification_status": "gated_or_forbidden",
                "bucket": "access_ambiguous_review",
                "reason_codes": ["access_ambiguous"],
                "recommended_next_action": "Defer for access ambiguity review."
              }
            ],
            "summary": {"triage_rows": 2}
          }
          JSON
      - name: Build reviewer decision sheet
        run: |
          python -m tools.openva.source_review_decisions build-sheet \
            --triage-plan source-review-triage-plan.json \
            --output-csv source-review-decision-sheet.csv \
            --output-md source-review-decision-sheet-summary.md
      - name: Build completed valid reviewer sheet
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("source-review-decision-sheet.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8", newline="")))
          rows[0].update({
              "review_decision": "mark_no_replacement_available",
              "approved_replacement_url": "",
              "reviewer_note": "Dry run reviewed source context; no public replacement supplied.",
              "reviewed_by": "source-reviewer-inbox-dry-run",
              "reviewed_at": "2026-05-26T00:00:00Z",
          })
          rows[1].update({
              "review_decision": "defer_access_ambiguous",
              "approved_replacement_url": "",
              "reviewer_note": "Dry run access is ambiguous and needs follow-up.",
              "reviewed_by": "source-reviewer-inbox-dry-run",
              "reviewed_at": "2026-05-26T00:00:00Z",
          })
          out = Path("completed-source-review-decision-sheet.csv")
          with out.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)
          PY
      - name: Validate completed reviewer sheet
        run: |
          python -m tools.openva.source_review_decisions validate-sheet \
            --triage-plan source-review-triage-plan.json \
            --decision-sheet completed-source-review-decision-sheet.csv \
            --output-json source-review-decision-validation.json \
            --output-md source-review-decision-validation-summary.md
      - name: Export reviewed artifacts
        run: |
          python -m tools.openva.source_review_decisions export-reviewed-artifacts \
            --validation source-review-decision-validation.json \
            --output-dir reviewed-artifacts
      - name: Build intentionally invalid binding sheet
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          valid = Path("completed-source-review-decision-sheet.csv")
          rows = list(csv.DictReader(valid.open(encoding="utf-8", newline="")))
          rows[0]["triage_plan_sha256"] = "0" * 64
          out = Path("invalid-binding-source-review-decision-sheet.csv")
          with out.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()))
              writer.writeheader()
              writer.writerows(rows)
          PY
      - name: Confirm invalid binding is rejected
        run: |
          set +e
          python -m tools.openva.source_review_decisions validate-sheet \
            --triage-plan source-review-triage-plan.json \
            --decision-sheet invalid-binding-source-review-decision-sheet.csv \
            --output-json invalid-binding-validation.json \
            --output-md invalid-binding-validation-summary.md
          status="$?"
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected invalid binding validation to fail, but it passed."
            exit 1
          fi
          grep -q "triage_plan_sha256_changed" invalid-binding-validation.json
      - name: Upload dry run artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-reviewer-inbox-dry-run
          path: |
            source-review-triage-plan.json
            source-review-decision-sheet.csv
            source-review-decision-sheet-summary.md
            completed-source-review-decision-sheet.csv
            source-review-decision-validation.json
            source-review-decision-validation-summary.md
            reviewed-artifacts/
            invalid-binding-source-review-decision-sheet.csv
            invalid-binding-validation.json
            invalid-binding-validation-summary.md
          if-no-files-found: error
