name: tmp-source-attribution-implementation

on:
  push:
    branches:
      - agent/source-attribution-applicability
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tmp-source-attribution-implementation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Apply deterministic implementation patch
        run: |
          if [ ! -f .github/openva-source-attribution-patch.py ]; then
            echo 'Patch script not present yet; no-op.'
            exit 0
          fi
          python .github/openva-source-attribution-patch.py
      - name: Rebuild generated catalog outputs
        run: python -m tools.openva.validate build-indexes
      - name: Validate implementation
        run: |
          python -m tools.openva.validate validate
          pytest -q tests/test_source_attribution.py tests/test_site.py tests/test_source_ledger_schemas.py
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement source publisher attribution'
          git push origin HEAD
