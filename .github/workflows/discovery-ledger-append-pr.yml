name: discovery-ledger-append-pr

on:
  workflow_run:
    workflows: ["catalog-growth-discovery", "discovery-mesh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: "Exact catalog-growth-discovery run id to append"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: discovery-ledger-append-pr
  cancel-in-progress: false

jobs:
  discovery-ledger-append:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.name == 'catalog-growth-discovery' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Require autonomous PR token
        env:
          OPENVA_AUTOMERGE_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPENVA_AUTOMERGE_TOKEN:-}" ]; then
            echo "::error::OPENVA_AUTOMERGE_TOKEN is required for autonomous discovery-ledger PR triggering"
            exit 1
          fi
      - name: Resolve discovery run id
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="${{ inputs.discovery_run_id }}"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          case "$RUN_ID" in *[!0-9]*) echo "discovery_run_id must be numeric" >&2; exit 1 ;; esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Validate discovery run authority
        id: run_meta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          META=$(gh run view "$RUN_ID" --json attempt,conclusion,headBranch,headSha,workflowName)
          WORKFLOW_NAME=$(printf '%s' "$META" | jq -r '.workflowName // ""')
          CONCLUSION=$(printf '%s' "$META" | jq -r '.conclusion // ""')
          HEAD_BRANCH=$(printf '%s' "$META" | jq -r '.headBranch // ""')
          HEAD_SHA=$(printf '%s' "$META" | jq -r '.headSha // ""')
          RUN_ATTEMPT=$(printf '%s' "$META" | jq -r '.attempt // ""')
          if [ "$WORKFLOW_NAME" != "catalog-growth-discovery" ]; then
            echo "::error::discovery ledger append only accepts catalog-growth-discovery artifacts"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::discovery run must have succeeded"
            exit 1
          fi
          if [ "$HEAD_BRANCH" != "main" ]; then
            echo "::error::discovery run must originate from main"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::discovery run commit is not an ancestor of current main"
            exit 1
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Download discovery artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery-artifacts"
          gh run download "$RUN_ID" \
            --name openva-catalog-growth-discovery-artifacts \
            --dir "$RUNNER_TEMP/discovery-artifacts"
          test -f "$RUNNER_TEMP/discovery-artifacts/source-discovery-report.json"
          DIGEST=$(find "$RUNNER_TEMP/discovery-artifacts" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "digest=sha256:$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Append discovery ledger delta
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::base moved before discovery-ledger append; rerun against current main"
            exit 1
          fi
          python -m tools.openva.discovery_ledger append \
            --discovery-report "$RUNNER_TEMP/discovery-artifacts/source-discovery-report.json" \
            --max-append-count 500 \
            --summary reports/discovery-ledger-append-summary.json
      - name: Verify diff confined to discovery ledger path
        run: |
          set -euo pipefail
          git add maintenance/discovery-events
          CHANGED=$(git diff --cached --name-only)
          if [ -z "$CHANGED" ]; then
            echo "No new discovery ledger events to append."
            exit 0
          fi
          while IFS= read -r f; do
            case "$f" in
              maintenance/discovery-events/*.ndjson) : ;;
              *) echo "::error::diff outside discovery ledger path: $f"; exit 1 ;;
            esac
          done <<< "$CHANGED"
      - name: Open update append PR
        env:
          GH_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          DISCOVERY_HEAD_SHA: ${{ steps.run_meta.outputs.head_sha }}
          DISCOVERY_RUN_ATTEMPT: ${{ steps.run_meta.outputs.run_attempt }}
          DISCOVERY_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            exit 0
          fi
          PR_BRANCH="agent-discovery-ledger-append-${RUN_ID}"
          PR_TITLE="Discovery ledger: append events run ${RUN_ID}"
          {
            echo "Work-Package: WP-DISCOVERY-LEDGER-APPEND-01"
            echo ""
            echo "## Summary"
            echo ""
            echo "Appends discovery events emitted by catalog-growth-discovery run \`$RUN_ID\`."
            echo ""
            echo "Discovery workflow attempt: \`$DISCOVERY_RUN_ATTEMPT\`"
            echo "Discovery head SHA: \`$DISCOVERY_HEAD_SHA\`"
            echo "Discovery artifact digest: \`$DISCOVERY_ARTIFACT_DIGEST\`"
            echo ""
            echo "## Authority"
            echo ""
            echo "- Lane: \`discovery_ledger_append\`"
            echo "- Paths: \`maintenance/discovery-events/*.ndjson\` only"
          } > "$RUNNER_TEMP/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PR_BRANCH" 2>/dev/null || git switch "$PR_BRANCH"
          git commit -m "$PR_TITLE"
          git push origin "$PR_BRANCH"
          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
            PR_NUMBER="$EXISTING"
          else
            PR_NUMBER=$(gh pr create --base main --head "$PR_BRANCH" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
          fi
          gh label create "discovery-ledger" \
            --description "Autonomous append-only discovery ledger update" \
            --color "1D76DB" \
            --force
          gh label create "automerge:observation" \
            --description "Eligible for the bounded observation/discovery automerge lane" \
            --color "0E8A16" \
            --force
          gh pr edit "$PR_NUMBER" --add-label "discovery-ledger" --add-label "automerge:observation"

  discovery-mesh-smoke-report:
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'discovery-mesh' &&
        (
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Capture job outcomes and optional differential
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/discovery-mesh-smoke"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "$RUNNER_TEMP/discovery-mesh-smoke/jobs.json"
          if gh run download "$RUN_ID" \
            --name openva-discovery-mesh-aggregate \
            --dir "$RUNNER_TEMP/discovery-mesh-smoke/aggregate"; then
            echo "aggregate artifact downloaded"
          else
            echo "aggregate artifact unavailable"
          fi
      - name: Publish durable discovery outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].number // empty')
          BODY_FILE="$RUNNER_TEMP/discovery-mesh-smoke-report.md"
          python - "$RUNNER_TEMP/discovery-mesh-smoke" "$BODY_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          jobs_payload = json.loads((root / "jobs.json").read_text(encoding="utf-8"))
          jobs = {
              str(row.get("name") or "unknown"): str(
                  row.get("conclusion") or row.get("status") or "unknown"
              )
              for row in jobs_payload.get("jobs", [])
          }
          differential_path = root / "aggregate" / "rendered-discovery-differential.json"
          differential = None
          if differential_path.is_file():
              differential = json.loads(differential_path.read_text(encoding="utf-8"))

          full_catalog = os.environ["RUN_EVENT"] == "workflow_dispatch"
          heading = (
              "## Rendered discovery full-catalog acceptance"
              if full_catalog
              else "## Rendered discovery hosted smoke"
          )
          profile = (
              "`default 32-shard matrix / no vendor limit`"
              if full_catalog
              else "`1 shard / 5-vendor diagnostic limit`"
          )
          mutation = (
              "`existing governed production pipeline enabled`"
              if full_catalog
              else "`disabled for push smoke`"
          )
          lines = [
              heading,
              "",
              f"- Run: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']}) "
              f"(attempt `{os.environ['RUN_ATTEMPT']}`)",
              f"- Commit: `{os.environ['HEAD_SHA']}`",
              f"- Source event: `{os.environ['RUN_EVENT']}`",
              f"- Workflow conclusion: `{os.environ['RUN_CONCLUSION']}`",
              f"- Profile: {profile}",
              f"- Candidate-intake posture: {mutation}",
              "",
              "### Job outcomes",
              "",
          ]
          for name, result in sorted(jobs.items()):
              lines.append(f"- {name}: `{result}`")
          lines.extend(["", "### Static-to-rendered differential", ""])
          if differential is None:
              lines.append("- Differential artifact: `missing`")
          else:
              lines.append(
                  f"- Shard reports: `{differential.get('shard_report_count')}`"
              )
              for key, value in (differential.get("differential") or {}).items():
                  rendered = (
                      json.dumps(value, sort_keys=True)
                      if isinstance(value, dict)
                      else value
                  )
                  lines.append(f"- {key}: `{rendered}`")
              posture = differential.get("posture") or {}
              lines.append(
                  "- Browser direct network access: "
                  f"`{posture.get('browser_direct_network_access')}`"
              )
              lines.append(
                  f"- Writes canonical sources: `{posture.get('writes_canonical_sources')}`"
              )
          lines.extend(
              [
                  "",
                  (
                      "Full-catalog production acceptance requires a successful "
                      "workflow, successful plan/discover/aggregate jobs, 32 shard "
                      "reports, and a rendered-discovery differential artifact."
                      if full_catalog
                      else
                      "Hosted deployment acceptance requires a successful workflow, "
                      "successful plan/discover/aggregate jobs, and a rendered-"
                      "discovery differential artifact. Full-catalog production "
                      "acceptance remains separate."
                  ),
              ]
          )
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
          else
            echo "No pull request associated with ${HEAD_SHA}; outcome retained in workflow summary."
          fi
      - name: Enforce discovery acceptance
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          JOBS="$RUNNER_TEMP/discovery-mesh-smoke/jobs.json"
          DIFFERENTIAL="$RUNNER_TEMP/discovery-mesh-smoke/aggregate/rendered-discovery-differential.json"
          test "$RUN_CONCLUSION" = "success"
          python - "$JOBS" "$DIFFERENTIAL" "$RUN_EVENT" <<'PY'
          import json
          import sys

          jobs = {
              str(row.get("name") or ""): str(row.get("conclusion") or "")
              for row in json.load(open(sys.argv[1], encoding="utf-8")).get("jobs", [])
          }
          required = ("plan", "discover", "aggregate")
          failures = [name for name in required if jobs.get(name) != "success"]
          if failures:
              raise SystemExit(
                  "discovery acceptance jobs not successful: " + ", ".join(failures)
              )
          differential = json.load(open(sys.argv[2], encoding="utf-8"))
          if sys.argv[3] == "workflow_dispatch":
              shard_count = int(differential.get("shard_report_count") or 0)
              if shard_count != 32:
                  raise SystemExit(
                      f"full-catalog acceptance expected 32 shard reports, got {shard_count}"
                  )
          PY
