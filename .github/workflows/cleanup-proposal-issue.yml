name: cleanup-proposal-issue

on:
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Optional number of sources to verify"
        required: false
        type: string
      vendor_limit:
        description: "Optional number of vendors to discover against"
        required: false
        type: string
  schedule:
    - cron: "23 7 * * 3"

permissions:
  contents: read
  issues: write

concurrency:
  group: cleanup-proposal-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-proposal-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build network source verification report
        run: |
          LIMIT="${{ inputs.source_limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_verification verify --limit "$LIMIT" --output source-verification-report.json
          else
            python -m tools.openva.source_verification verify --output source-verification-report.json
          fi
      - name: Build candidate source discovery report
        run: |
          LIMIT="${{ inputs.vendor_limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_discovery discover --vendor-limit "$LIMIT" --output source-discovery-report.json
          else
            python -m tools.openva.source_discovery discover --output source-discovery-report.json
          fi
      - name: Build promotion plan from maintenance reports
        run: |
          python -m tools.openva.promotion_planner plan \
            --verification-report source-verification-report.json \
            --discovery-report source-discovery-report.json \
            --output promotion-plan.json
      - name: Build cleanup proposal
        run: |
          python -m tools.openva.cleanup_proposals build \
            --promotion-plan promotion-plan.json \
            --json-output cleanup-proposal.json \
            --markdown-output cleanup-proposal.md
      - name: Prepare issue body
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = '<!-- openva-cleanup-proposal-issue -->'
          body = Path('cleanup-proposal.md').read_text(encoding='utf-8')
          preface = """{marker}

This issue is generated by the OpenVA cleanup proposal workflow.

It is non-advisory and does not make legal, procurement, compliance, risk, vendor approval, or vendor recommendation conclusions.

The workflow does not mutate catalog records. Any catalog change should be made through a separate reviewed `Catalog:` PR.

---

""".format(marker=marker)
          Path('cleanup-proposal-issue.md').write_text(preface + body, encoding='utf-8')
          PY
      - name: Create or update cleanup proposal issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="OpenVA cleanup proposal queue"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number,title --jq 'map(select(.title == "'"${TITLE}"'")) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file cleanup-proposal-issue.md
            echo "Updated cleanup proposal issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file cleanup-proposal-issue.md --label "maintenance"
          fi
      - name: Upload cleanup proposal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openva-cleanup-proposal-issue-artifacts
          path: |
            source-verification-report.json
            source-discovery-report.json
            promotion-plan.json
            cleanup-proposal.json
            cleanup-proposal.md
            cleanup-proposal-issue.md
          if-no-files-found: error
