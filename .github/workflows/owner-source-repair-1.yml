name: owner-source-repair-1

on:
  push:
    branches:
      - catalog/owner-source-repair-1

permissions:
  contents: write

concurrency:
  group: owner-source-repair-1
  cancel-in-progress: true

jobs:
  materialize-observe:
    if: ${{ !contains(github.event.head_commit.message, '[owner-repair-1-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Refresh catalog records and indexes
        run: python -m tools.openva.catalog_batch catalog-batches/owner-source-repair-1.yaml --build-indexes
      - name: Select repaired source records
        run: |
          cat > owner-source-paths.txt <<'EOF'
          data/vendors/workday/sources/workday-compliance.yaml
          data/vendors/workday/sources/workday-dpa.yaml
          data/vendors/docker/sources/docker-compliance.yaml
          data/vendors/docker/sources/docker-dpa.yaml
          data/vendors/docker/sources/docker-security.yaml
          data/vendors/zapier/sources/zapier-security.yaml
          data/vendors/freshworks/sources/freshworks-compliance.yaml
          EOF
      - name: Verify selected public sources
        run: |
          python -m tools.openva.source_verification verify \
            --source-path-file owner-source-paths.txt \
            --output owner-source-verification-report.json
      - name: Build latest observation projection
        run: |
          python -m tools.openva.observation_ledger build \
            --verification-report owner-source-verification-report.json \
            --run-id "owner-${{ github.run_id }}" \
            --baseline maintenance/source-observations/latest-observations.json \
            --output-dir owner-observation
          cp owner-observation/latest-observations.json maintenance/source-observations/latest-observations.json
      - name: Validate refreshed catalog
        run: python -m tools.openva.validate validate
      - name: Run focused catalog tests
        run: pytest -q tests/test_catalog_batch.py tests/test_catalog_guard.py tests/test_source_type_labels.py tests/test_generated_exports.py
      - name: Show observation outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          selected = {Path(line).stem for line in Path('owner-source-paths.txt').read_text().splitlines() if line.strip()}
          data = json.loads(Path('maintenance/source-observations/latest-observations.json').read_text())
          for row in data.get('sources', []):
              if row.get('source_id') in selected:
                  print(json.dumps({
                      'source_id': row.get('source_id'),
                      'http_status': row.get('http_status'),
                      'source_health_status': row.get('source_health_status'),
                      'final_url': row.get('final_url'),
                      'review_signal': row.get('review_signal'),
                  }, sort_keys=True))
          PY
      - name: Commit refreshed and observed catalog
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add \
            data/vendors/workday \
            data/vendors/docker \
            data/vendors/zapier \
            data/vendors/freshworks \
            dist/vendors/workday.json \
            dist/vendors/docker.json \
            dist/vendors/zapier.json \
            dist/vendors/freshworks.json \
            indexes \
            openva-pack.json \
            maintenance/source-observations/latest-observations.json
          git diff --cached --stat
          git commit -m 'Catalog: refresh and observe owner source repair batch 1 [owner-repair-1-complete]'
          git push
