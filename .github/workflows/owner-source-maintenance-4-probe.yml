name: owner-source-maintenance-4-probe

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-probe
  cancel-in-progress: true

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-probe-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'requests>=2.32' 'pyyaml>=6'
      - name: Probe current and official candidate URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import threading
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit

          import requests
          import yaml

          ROOT = Path('.')
          TARGETS = json.loads((ROOT / 'maintenance/reviewed/owner-source-maintenance-4-targets.json').read_text(encoding='utf-8'))['targets']
          OUT_JSON = ROOT / 'maintenance/reviewed/owner-source-maintenance-4-probes.json'
          OUT_TSV = ROOT / 'maintenance/reviewed/owner-source-maintenance-4-probes.tsv'

          TYPE_TERMS = {
              'privacy_notice': ['privacy policy', 'privacy notice', 'privacy statement', 'privacy'],
              'dpa': ['data processing addendum', 'data processing agreement', 'dpa'],
              'subprocessors_list': ['subprocessors', 'subprocessor list', 'sub-processors', 'sub processors'],
              'security_page': ['security', 'information security'],
              'compliance_page': ['compliance', 'trust center', 'trust centre'],
              'compliance_overview': ['compliance', 'trust center', 'trust centre'],
              'trust_center': ['trust center', 'trust centre', 'trust'],
              'terms_of_service': ['terms of service', 'terms of use', 'terms and conditions', 'legal terms'],
          }
          TYPE_PATHS = {
              'privacy_notice': ['/privacy', '/privacy-policy', '/privacy-notice', '/legal/privacy', '/legal/privacy-policy', '/company/privacy', '/company/privacy-policy'],
              'dpa': ['/dpa', '/legal/dpa', '/data-processing-addendum', '/legal/data-processing-addendum', '/data-processing-agreement', '/legal/data-processing-agreement', '/privacy/dpa'],
              'subprocessors_list': ['/subprocessors', '/legal/subprocessors', '/subprocessor-list', '/legal/subprocessor-list', '/trust/subprocessors', '/trust-center/subprocessors', '/privacy/subprocessors'],
              'security_page': ['/security', '/trust/security', '/company/security', '/security-and-trust', '/trust-center'],
              'compliance_page': ['/compliance', '/security/compliance', '/trust', '/trust-center', '/trust/compliance'],
              'compliance_overview': ['/compliance', '/security/compliance', '/trust', '/trust-center', '/trust/compliance'],
              'trust_center': ['/trust', '/trust-center', '/trust-centre', '/security'],
              'terms_of_service': ['/terms', '/terms-of-service', '/terms-of-use', '/legal/terms', '/legal/terms-of-service', '/legal/terms-of-use'],
          }
          BAD = re.compile(r'/(blog|news|press|events?|webinars?|customers?|case-stud|careers?|jobs?|community|forum|support|help|docs?|documentation|developer|academy|learn|resources?)(/|$)', re.I)
          TITLE_RE = re.compile(r'<title[^>]*>(.*?)</title>', re.I | re.S)
          LINK_RE = re.compile(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', re.I | re.S)
          local = threading.local()

          def session():
              if not hasattr(local, 'session'):
                  s = requests.Session()
                  s.headers.update({
                      'User-Agent': 'OpenVA-owner-source-maintenance/0.1 (+https://github.com/thedanieltan/open-vendor-assurance)',
                      'Accept': 'text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.5',
                  })
                  local.session = s
              return local.session

          def clean(value):
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', ' ', value)
              return re.sub(r'\s+', ' ', value).strip()

          def normalize(value):
              if not value:
                  return None
              try:
                  p = urlsplit(str(value).strip())
                  scheme = (p.scheme or 'https').lower()
                  host = (p.hostname or '').lower()
                  port = p.port
                  netloc = host
                  if port and not ((scheme == 'https' and port == 443) or (scheme == 'http' and port == 80)):
                      netloc = f'{host}:{port}'
                  path = p.path or '/'
                  if path != '/':
                      path = path.rstrip('/')
                  return urlunsplit((scheme, netloc, path, p.query, ''))
              except Exception:
                  return str(value).strip()

          def allowed(host, allowed_hosts):
              host = (host or '').lower().rstrip('.')
              return any(host == item or host.endswith('.' + item) for item in allowed_hosts)

          def probe(url, max_bytes=500_000):
              out = {'url': url, 'status': None, 'final_url': None, 'title': None, 'content_type': None, 'error': None, 'links': []}
              try:
                  response = session().get(url, timeout=12, allow_redirects=True, stream=True)
                  out['status'] = response.status_code
                  out['final_url'] = response.url
                  out['content_type'] = response.headers.get('content-type')
                  chunks = []
                  size = 0
                  for chunk in response.iter_content(65536):
                      if not chunk:
                          continue
                      chunks.append(chunk)
                      size += len(chunk)
                      if size >= max_bytes:
                          break
                  text = b''.join(chunks).decode(response.encoding or 'utf-8', errors='replace')
                  title = TITLE_RE.search(text)
                  out['title'] = clean(title.group(1)) if title else None
                  if 'html' in str(out['content_type']).lower() or '<html' in text[:1000].lower():
                      for href, anchor in LINK_RE.findall(text[:400000]):
                          out['links'].append({'href': href, 'anchor': clean(anchor)[:300]})
              except Exception as exc:
                  out['error'] = f'{type(exc).__name__}: {exc}'
              return out

          def score(url, title, anchor, source_type):
              path = (urlsplit(url).path or '/').lower()
              path_words = path.replace('-', ' ').replace('_', ' ').replace('/', ' ')
              title_l = (title or '').lower()
              anchor_l = (anchor or '').lower()
              points = 0
              matches = []
              for term in TYPE_TERMS.get(source_type, []):
                  if term in path_words:
                      points += 10
                      matches.append(f'path:{term}')
                  elif term in title_l:
                      points += 7
                      matches.append(f'title:{term}')
                  elif term in anchor_l:
                      points += 5
                      matches.append(f'anchor:{term}')
              if BAD.search(path + '/'):
                  points -= 15
                  matches.append('bad:editorial-support-docs')
              if path in {'', '/'}:
                  points -= 8
                  matches.append('bad:homepage')
              host = (urlsplit(url).hostname or '').lower()
              if source_type == 'security_page' and ('security' in host or 'trust' in host):
                  points += 3
                  matches.append('host:security-trust')
              if source_type in {'compliance_page', 'compliance_overview', 'trust_center'} and 'trust' in host:
                  points += 4
                  matches.append('host:trust')
              return points, matches

          vendors = {}
          targets_by_vendor = defaultdict(list)
          for row in TARGETS:
              targets_by_vendor[row['vendor_id']].append(row)

          for vendor_id in targets_by_vendor:
              path = ROOT / 'data/vendors' / vendor_id / 'vendor.yaml'
              vendor = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              domains = [str(x).lower() for x in vendor.get('official_domains') or [] if x]
              entrypoints = [str(x) for x in vendor.get('public_entrypoints') or [] if x]
              hosts = set(domains)
              for value in entrypoints + [str(r.get('source_url') or '') for r in targets_by_vendor[vendor_id]]:
                  host = urlsplit(value).hostname
                  if host:
                      hosts.add(host.lower())
              vendors[vendor_id] = {'domains': domains, 'entrypoints': entrypoints, 'allowed_hosts': sorted(hosts)}

          # Fetch a bounded set of vendor seed pages once and harvest relevant links.
          seed_jobs = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for vendor_id, info in vendors.items():
                  seeds = list(info['entrypoints'][:8])
                  for domain in info['domains'][:3]:
                      seeds.extend([f'https://{domain}/', f'https://www.{domain}/'])
                  for url in dict.fromkeys(seeds):
                      seed_jobs[pool.submit(probe, url, 700_000)] = (vendor_id, url)
              seed_results = defaultdict(list)
              for future in concurrent.futures.as_completed(seed_jobs):
                  vendor_id, _ = seed_jobs[future]
                  seed_results[vendor_id].append(future.result())

          results = []
          for vendor_id, rows in sorted(targets_by_vendor.items()):
              info = vendors[vendor_id]
              allowed_hosts = info['allowed_hosts']
              harvested = []
              for seed in seed_results.get(vendor_id, []):
                  base = seed.get('final_url') or seed.get('url')
                  for link in seed.get('links') or []:
                      absolute = normalize(urljoin(base, link['href']))
                      if not absolute or not allowed(urlsplit(absolute).hostname, allowed_hosts):
                          continue
                      harvested.append({'url': absolute, 'anchor': link.get('anchor')})

              for row in sorted(rows, key=lambda item: item['source_id']):
                  source_type = str(row.get('source_type') or '')
                  current_url = normalize(row.get('source_url'))
                  candidates = {}

                  def add_candidate(url, anchor='', origin='generated'):
                      normalized = normalize(url)
                      if not normalized or normalized == current_url:
                          return
                      if not allowed(urlsplit(normalized).hostname, allowed_hosts):
                          return
                      base_score, matches = score(normalized, '', anchor, source_type)
                      previous = candidates.get(normalized)
                      item = {'url': normalized, 'anchor': anchor, 'origin': origin, 'pre_score': base_score, 'pre_matches': matches}
                      if previous is None or item['pre_score'] > previous['pre_score']:
                          candidates[normalized] = item

                  for item in harvested:
                      add_candidate(item['url'], item.get('anchor') or '', 'harvested-link')
                  for entrypoint in info['entrypoints']:
                      add_candidate(entrypoint, '', 'vendor-entrypoint')
                  for host in allowed_hosts:
                      for candidate_path in TYPE_PATHS.get(source_type, []):
                          add_candidate(f'https://{host}{candidate_path}', '', 'source-type-path')

                  current = probe(row.get('source_url'))
                  ranked = sorted(candidates.values(), key=lambda item: (-item['pre_score'], item['url']))[:7]
                  live = []
                  if ranked:
                      with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
                          futures = {pool.submit(probe, item['url']): item for item in ranked}
                          for future in concurrent.futures.as_completed(futures):
                              item = futures[future]
                              checked = future.result()
                              status = checked.get('status')
                              if not status or not (200 <= status < 400):
                                  continue
                              final_url = normalize(checked.get('final_url') or item['url'])
                              if not final_url or not allowed(urlsplit(final_url).hostname, allowed_hosts):
                                  continue
                              final_score, matches = score(final_url, checked.get('title'), item.get('anchor'), source_type)
                              live.append({
                                  'candidate_url': item['url'],
                                  'final_url': final_url,
                                  'status': status,
                                  'title': checked.get('title'),
                                  'origin': item['origin'],
                                  'score': final_score,
                                  'matches': matches,
                              })
                  live.sort(key=lambda item: (-item['score'], item['final_url']))
                  best = live[0] if live else None
                  current_status = current.get('status')
                  current_live = bool(current_status and 200 <= current_status < 400)
                  auto_eligible = bool(
                      current_status in {404, 410}
                      and best
                      and best['score'] >= 10
                      and not any(match.startswith('bad:') for match in best['matches'])
                      and best['final_url'] != current_url
                  )
                  results.append({
                      'vendor_id': vendor_id,
                      'source_id': row['source_id'],
                      'source_type': source_type,
                      'source_url': row.get('source_url'),
                      'review_state': row.get('review_state'),
                      'current_probe': {k: current.get(k) for k in ('status', 'final_url', 'title', 'content_type', 'error')},
                      'best_candidate': best,
                      'live_candidates': live[:5],
                      'auto_eligible': auto_eligible,
                      'current_live': current_live,
                  })

          report = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_probes',
              'base_commit': '${{ github.sha }}',
              'target_count': len(results),
              'current_live_count': sum(1 for row in results if row['current_live']),
              'current_not_found_count': sum(1 for row in results if row['current_probe'].get('status') in {404, 410}),
              'auto_eligible_count': sum(1 for row in results if row['auto_eligible']),
              'results': results,
              'not_advice': True,
          }
          OUT_JSON.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          lines = ['vendor_id\tsource_id\ttype\tcurrent_status\tauto_eligible\tbest_score\tbest_final_url\tbest_title']
          for row in results:
              best = row.get('best_candidate') or {}
              lines.append('\t'.join(str(value or '').replace('\t', ' ') for value in [
                  row['vendor_id'], row['source_id'], row['source_type'], row['current_probe'].get('status'),
                  'yes' if row['auto_eligible'] else 'no', best.get('score'), best.get('final_url'), best.get('title'),
              ]))
          OUT_TSV.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps({key: report[key] for key in ('target_count', 'current_live_count', 'current_not_found_count', 'auto_eligible_count')}, indent=2))
          PY
      - name: Commit probe evidence and remove runner
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-probe.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: probe official source replacements [owner-maintenance-4-probe-complete]'
          git push
