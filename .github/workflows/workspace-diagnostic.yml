name: workspace-diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install workspace planner
        run: pip install -e ".[dev]"
      - name: Build workspace plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -m tools.openva.workspace validate
          python -m tools.openva.workspace plan \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --pretty > workspace-plan.json
          cat workspace-plan.json
      - name: Install affected dependency chain
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(Path("workspace-plan.json").read_text(encoding="utf-8"))
          for path in plan["install_paths"]:
              target = f"{path}[dev]" if path in {"services/openva_match_service", "integrations/mcp/openva_mcp"} else path
              subprocess.run([sys.executable, "-m", "pip", "install", "-e", target], check=True)
          PY
      - name: Run affected tests with full diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          python - <<'PY' > workspace-pytest.log 2>&1
          import json
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(Path("workspace-plan.json").read_text(encoding="utf-8"))
          raise SystemExit(subprocess.run([sys.executable, "-m", "pytest", "-q", *plan["test_paths"]]).returncode)
          PY
          code=$?
          grep -E "FAILED|ERROR|short test summary|^E +|^=+" workspace-pytest.log > workspace-summary.txt || true
          cat workspace-summary.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload workspace diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: workspace-diagnostic
          path: |
            workspace-plan.json
            workspace-pytest.log
            workspace-summary.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce affected-test result
        run: exit "${{ steps.tests.outputs.exit_code }}"
