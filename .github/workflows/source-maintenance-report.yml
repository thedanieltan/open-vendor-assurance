name: source-maintenance-report

on:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: "Source verification scope: scheduled_shard, full, or custom_shard"
        required: false
        default: "scheduled_shard"
        type: choice
        options:
          - scheduled_shard
          - full
          - custom_shard
      source_shard_count:
        description: "Shard count for scheduled_shard/custom_shard verification"
        required: false
        default: "4"
        type: string
      source_shard_index:
        description: "Shard index for custom_shard verification; scheduled_shard derives this from run number"
        required: false
        type: string
      source_limit:
        description: "Optional number of sources to verify after shard selection"
        required: false
        type: string
      vendor_limit:
        description: "Optional number of vendors to discover against"
        required: false
        type: string
      max_urls_per_type:
        description: "Maximum candidate URLs to probe per source type during optional discovery"
        required: false
        default: "4"
        type: string
      fetch_timeout:
        description: "Per-request source discovery timeout in seconds"
        required: false
        default: "3"
        type: string
  schedule:
    # WP35.5: twice weekly (Wed + Sun) so sharded observation coverage cycles
    # in ~2 weeks and the autonomous append loop keeps the ledger fresh.
    - cron: "29 5 * * 3"
    - cron: "29 5 * * 0"

permissions:
  contents: read

concurrency:
  group: source-maintenance-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-maintenance-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow source-maintenance-report.yml \
              --lane source_maintenance_report \
              --failure-code schema_validation_failure \
              --message "schema validation failed before source maintenance reporting" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/source-maintenance-failure-input.json
            exit 1
          }
      - name: Build source health inventory report
        run: python -m tools.openva.source_health build --output source-health-report.json
      - name: Build network source verification report
        run: |
          SCOPE="${{ inputs.verification_scope }}"
          SHARD_COUNT="${{ inputs.source_shard_count }}"
          SHARD_INDEX="${{ inputs.source_shard_index }}"
          LIMIT="${{ inputs.source_limit }}"

          if [ -z "$SCOPE" ]; then
            SCOPE="scheduled_shard"
          fi
          if [ -z "$SHARD_COUNT" ]; then
            SHARD_COUNT="4"
          fi

          VERIFY_ARGS=()
          if [ -n "$LIMIT" ]; then
            VERIFY_ARGS+=(--limit "$LIMIT")
          fi

          if [ "$SCOPE" = "full" ]; then
            echo "Running full source verification."
          elif [ "$SCOPE" = "scheduled_shard" ]; then
            SHARD_INDEX=$(( ${{ github.run_number }} % SHARD_COUNT ))
            echo "Running scheduled source verification shard ${SHARD_INDEX}/${SHARD_COUNT}."
            VERIFY_ARGS+=(--shard-count "$SHARD_COUNT" --shard-index "$SHARD_INDEX")
          elif [ "$SCOPE" = "custom_shard" ]; then
            if [ -z "$SHARD_INDEX" ]; then
              echo "source_shard_index is required when verification_scope=custom_shard" >&2
              exit 2
            fi
            echo "Running custom source verification shard ${SHARD_INDEX}/${SHARD_COUNT}."
            VERIFY_ARGS+=(--shard-count "$SHARD_COUNT" --shard-index "$SHARD_INDEX")
          else
            echo "Unknown verification_scope: $SCOPE" >&2
            exit 2
          fi

          python -m tools.openva.source_verification verify "${VERIFY_ARGS[@]}" --output source-verification-report.json
      - name: Build source quality refinement queue
        run: |
          python -m tools.openva.source_quality_refinement build \
            --source-verification-report source-verification-report.json \
            --json-output source-quality-refinement-queue.json \
            --csv-output source-quality-refinement-queue.csv \
            --markdown-output source-quality-refinement-summary.md
      - name: Build source observation ledger artifact
        run: |
          python -m tools.openva.source_observation_ledger build \
            --source-verification-report source-verification-report.json \
            --run-id "${{ github.run_id }}" \
            --output source-observation-ledger.json \
            --summary-md source-observation-ledger-summary.md
      - name: Build latest source health index artifact
        run: |
          python -m tools.openva.source_latest_health build \
            --source-observation-ledger source-observation-ledger.json \
            --output latest-source-health.json
      - name: Build public source health snapshot artifact
        run: |
          python -m tools.openva.source_health_public_snapshot build \
            --latest-source-health latest-source-health.json \
            --output public/source-health-snapshot.json
      - name: Build observation ledger v2 reports (read-only artifacts)
        run: |
          python -m tools.openva.observation_ledger build \
            --verification-report source-verification-report.json \
            --run-id "${{ github.run_id }}" \
            --output-dir observation-ledger
      - name: Upload observation continuity artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-maintenance-observation-continuity
          path: |
            source-verification-report.json
            source-observation-ledger.json
            source-observation-ledger-summary.md
            latest-source-health.json
            public/source-health-snapshot.json
            observation-ledger/observation-records.json
            observation-ledger/latest-observations.json
            observation-ledger/source-freshness-report.json
            observation-ledger/changed-since-last-observation.json
            observation-ledger/sources-requiring-review.json
            observation-ledger/observation-ledger-delta.ndjson
          if-no-files-found: error
      - name: Build candidate source discovery report
        run: |
          set -euo pipefail
          VENDOR_LIMIT="$(printf '%s' "${{ inputs.vendor_limit }}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          MAX_URLS_PER_TYPE="$(printf '%s' "${{ inputs.max_urls_per_type }}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FETCH_TIMEOUT="$(printf '%s' "${{ inputs.fetch_timeout }}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          DISCOVERY_DEADLINE="15m"

          if [ -z "$VENDOR_LIMIT" ]; then
            VENDOR_LIMIT="10"
          fi
          if [ -z "$MAX_URLS_PER_TYPE" ]; then
            MAX_URLS_PER_TYPE="4"
          fi
          if [ -z "$FETCH_TIMEOUT" ]; then
            FETCH_TIMEOUT="3"
          fi

          case "$VENDOR_LIMIT" in
            ''|*[!0-9]*) echo "vendor_limit must be a positive integer" >&2; exit 2 ;;
          esac
          case "$MAX_URLS_PER_TYPE" in
            ''|*[!0-9]*) echo "max_urls_per_type must be a positive integer" >&2; exit 2 ;;
          esac
          if [ "$VENDOR_LIMIT" -le 0 ]; then
            echo "vendor_limit must be greater than zero" >&2
            exit 2
          fi
          if [ "$MAX_URLS_PER_TYPE" -le 0 ]; then
            echo "max_urls_per_type must be greater than zero" >&2
            exit 2
          fi
          python - "$FETCH_TIMEOUT" <<'PY'
          import sys

          try:
              value = float(sys.argv[1])
          except ValueError:
              raise SystemExit("fetch_timeout must be a positive number")
          if value <= 0:
              raise SystemExit("fetch_timeout must be greater than zero")
          PY

          set +e
          timeout --signal=TERM --kill-after=30s "$DISCOVERY_DEADLINE" \
            python -m tools.openva.source_discovery discover \
              --vendor-limit "$VENDOR_LIMIT" \
              --max-urls-per-type "$MAX_URLS_PER_TYPE" \
              --fetch-timeout "$FETCH_TIMEOUT" \
              --output source-discovery-report.json
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 124 ]; then
            echo "::warning::candidate source discovery reached ${DISCOVERY_DEADLINE}; writing degraded empty discovery report"
            python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          report = {
              "schema_version": "0.1.0",
              "generated_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "report_type": "source_discovery_report",
              "partial": True,
              "degraded": True,
              "reason": "discovery_timeout",
              "posture": {
                  "network_fetch_performed": True,
                  "writes_repository_state": False,
                  "writes_canonical_sources": False,
                  "opens_pull_requests": False,
                  "public_sources_only": True,
                  "non_advisory": True,
              },
              "summary": {
                  "vendors_checked": 0,
                  "candidate_sources_written_or_reported": 0,
                  "unavailable_sources_written_or_reported": 0,
                  "partial": True,
                  "degraded": True,
                  "reason": "discovery_timeout",
              },
              "vendors": [],
          }
          Path("source-discovery-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

          python - <<'PY'
          import json

          report = json.load(open("source-discovery-report.json", encoding="utf-8"))
          if report.get("report_type") != "source_discovery_report":
              raise SystemExit("source-discovery-report.json is not a source_discovery_report")
          if "summary" not in report or "vendors" not in report:
              raise SystemExit("source-discovery-report.json is structurally incomplete")
          PY
      - name: Build source repair sweep report
        run: |
          python -m tools.openva.source_repair_sweep build \
            --source-verification-report source-verification-report.json \
            --source-discovery-report source-discovery-report.json \
            --source-quality-refinement-queue source-quality-refinement-queue.json \
            --latest-source-health latest-source-health.json \
            --json-output source-repair-sweep-report.json \
            --strict-csv-output source-repair-sweep-strict-candidates.csv \
            --human-review-csv-output source-repair-sweep-human-review.csv \
            --no-replacement-csv-output source-repair-sweep-no-replacement.csv \
            --markdown-output source-repair-sweep-summary.md
      - name: Build strict source repair batch plan
        run: |
          python -m tools.openva.source_repair_batch build \
            --sweep-report source-repair-sweep-report.json \
            --output-json source-repair-batch-plan.json \
            --output-csv source-repair-batch-plan.csv \
            --output-md source-repair-batch-summary.md \
            --max-records 10
      - name: Build source review triage plan
        run: |
          python -m tools.openva.source_review_triage build \
            --sweep-report source-repair-sweep-report.json \
            --human-review-csv source-repair-sweep-human-review.csv \
            --no-replacement-csv source-repair-sweep-no-replacement.csv \
            --sweep-summary-md source-repair-sweep-summary.md \
            --output-json source-review-triage-plan.json \
            --output-csv source-review-triage-plan.csv \
            --output-md source-review-triage-summary.md
      - name: Build source review decision sheet
        run: |
          python -m tools.openva.source_review_decisions build-sheet \
            --triage-plan source-review-triage-plan.json \
            --output-csv source-review-decision-sheet.csv \
            --output-md source-review-decision-sheet-summary.md
      - name: Build promotion plan from maintenance reports
        run: |
          python -m tools.openva.promotion_planner plan \
            --verification-report source-verification-report.json \
            --discovery-report source-discovery-report.json \
            --output promotion-plan.json
      - name: Build cleanup proposal from promotion plan
        run: |
          python -m tools.openva.cleanup_proposals build \
            --promotion-plan promotion-plan.json \
            --json-output cleanup-proposal.json \
            --markdown-output cleanup-proposal.md
      - name: Build reviewer-friendly summary and CSV exports
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          reports = Path("reports")
          reports.mkdir(exist_ok=True)

          health = json.load(open('source-health-report.json', encoding='utf-8'))
          verification = json.load(open('source-verification-report.json', encoding='utf-8'))
          quality = json.load(open('source-quality-refinement-queue.json', encoding='utf-8'))
          discovery = json.load(open('source-discovery-report.json', encoding='utf-8'))
          sweep = json.load(open('source-repair-sweep-report.json', encoding='utf-8'))
          batch = json.load(open('source-repair-batch-plan.json', encoding='utf-8'))
          triage = json.load(open('source-review-triage-plan.json', encoding='utf-8'))
          promotion = json.load(open('promotion-plan.json', encoding='utf-8'))
          cleanup = json.load(open('cleanup-proposal.json', encoding='utf-8'))
          verification_scope = verification.get('scope', {})

          lines = [
              "# OpenVA Source Maintenance Report",
              "",
              "This artifact consolidates source health, network verification, source discovery, promotion planning, and cleanup proposal outputs.",
              "",
              "It is operational metadata only. It is not legal, compliance, procurement, security, KYC, AML, audit, or vendor-risk advice.",
              "",
              "## Summary",
              "",
              f"- Source health issues: `{health['summary']['sources_with_issues']}`",
              f"- Verification sources requiring review: `{verification['summary']['sources_requiring_review']}`",
              f"- Source verification scope: `{verification_scope.get('verified_source_paths')}` of `{verification_scope.get('total_source_paths')}` source paths verified; shard `{verification_scope.get('shard_index')}` of `{verification_scope.get('shard_count')}`; partial `{verification_scope.get('is_partial')}`.",
              f"- Source quality refinement items: `{quality['summary']['total_quality_review_count']}`",
              f"- Candidate sources reported: `{discovery['summary']['candidate_sources_written_or_reported']}`",
              f"- Unavailable sources reported: `{discovery['summary']['unavailable_sources_written_or_reported']}`",
              f"- Strict repair-ready rows: `{sweep['summary']['strict_repair_ready_count']}`",
              f"- Source repair rows requiring human review: `{sweep['summary']['human_review_required_count']}`",
              f"- Source repair rows with no replacement found: `{sweep['summary']['no_replacement_found_count']}`",
              f"- Strict source repair batch plan rows: `{batch['summary']['repair_count']}`",
              f"- Source review triage rows: `{triage['summary']['triage_rows']}`",
              f"- Promotion plan actions: `{promotion['summary']['action_count']}`",
              f"- Cleanup proposal actions: `{cleanup['summary']['action_count']}`",
              f"- Blocking cleanup actions: `{cleanup['summary']['blocking_cleanup_actions']}`",
              "",
              "## Files",
              "",
              "- `summary.md`: maintainer-readable summary.",
              "- `*.json`: machine-readable source of truth.",
              "- `*.csv`: reviewer-friendly exports for scanning and sorting.",
              "- `cleanup-proposal.md`: detailed maintainer proposal generated from the promotion plan.",
              "- `source-observation-ledger-summary.md`: reviewer-readable source observation ledger summary.",
              "- `latest-source-health.json`: compact latest source health index for site/API consumption.",
              "- `public/source-health-snapshot.json`: public snapshot of latest source health for future site/API display.",
              "- `source-quality-refinement-*`: human-reviewed queue for reachable source quality issues.",
              "- `source-repair-sweep-*`: report-only partition of strict repair-ready, human-review, and no-replacement source rows.",
              "- `source-repair-batch-*`: report-only strict repair batch plan capped at 10 records.",
              "- `source-review-triage-*`: reviewer handoff for non-strict source repair sweep rows.",
              "- `source-review-decision-sheet.csv`: blank reviewer decision sheet; editing it does not mutate catalog sources.",
              "",
          ]
          Path("summary.md").write_text("\n".join(lines), encoding="utf-8")

          def write_rows(path, fields, rows):
              with open(path, "w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields, extrasaction="ignore")
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(row)

          write_rows(
              "source-health.csv",
              ["vendor_id", "source_id", "source_type", "source_url", "access_class", "source_language", "issues"],
              [
                  {**source, "issues": ";".join(source.get("issues", []))}
                  for source in health.get("sources", [])
              ],
          )
          write_rows(
              "source-verification.csv",
              ["vendor_id", "source_id", "source_type", "source_url", "verification_status", "http_status", "final_url", "requires_review"],
              verification.get("sources", []),
          )
          candidate_rows = []
          unavailable_rows = []
          for vendor in discovery.get("vendors", []):
              for candidate in vendor.get("candidates", []):
                  evidence = candidate.get("evidence", {})
                  candidate_rows.append({
                      "vendor_id": candidate.get("vendor_id"),
                      "candidate_source_id": candidate.get("candidate_source_id"),
                      "source_type_candidate": candidate.get("source_type_candidate"),
                      "candidate_url": candidate.get("candidate_url"),
                      "confidence": candidate.get("confidence"),
                      "http_status": evidence.get("http_status"),
                      "final_url": evidence.get("final_url"),
                      "matched_terms": ";".join(evidence.get("matched_terms", [])),
                  })
              for unavailable in vendor.get("unavailable_sources", []):
                  unavailable_rows.append({
                      "vendor_id": unavailable.get("vendor_id"),
                      "unavailable_source_id": unavailable.get("unavailable_source_id"),
                      "source_type": unavailable.get("source_type"),
                      "status": unavailable.get("status"),
                      "reason": unavailable.get("reason"),
                      "next_review_after": unavailable.get("next_review_after"),
                      "candidate_urls_checked": ";".join(unavailable.get("candidate_urls_checked", [])),
                  })
          write_rows(
              "source-discovery-candidates.csv",
              ["vendor_id", "candidate_source_id", "source_type_candidate", "candidate_url", "confidence", "http_status", "final_url", "matched_terms"],
              candidate_rows,
          )
          write_rows(
              "source-discovery-unavailable.csv",
              ["vendor_id", "unavailable_source_id", "source_type", "status", "reason", "next_review_after", "candidate_urls_checked"],
              unavailable_rows,
          )
          write_rows(
              "promotion-plan-actions.csv",
              ["action", "vendor_id", "source_type", "source_id", "candidate_source_id", "unavailable_source_id", "reason"],
              promotion.get("actions", []),
          )
          print(Path("summary.md").read_text(encoding="utf-8"))
          print("## JSON summaries")
          for path in [
              'source-health-report.json',
              'source-verification-report.json',
              'source-quality-refinement-queue.json',
              'source-observation-ledger.json',
              'latest-source-health.json',
              'public/source-health-snapshot.json',
              'source-discovery-report.json',
              'source-repair-sweep-report.json',
              'source-repair-batch-plan.json',
              'source-review-triage-plan.json',
              'promotion-plan.json',
              'cleanup-proposal.json',
          ]:
              report = json.load(open(path, encoding='utf-8'))
              print(f'## {path}')
              print(json.dumps(report.get('summary', {}), indent=2, sort_keys=True))
          PY
      - name: Upload source maintenance artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-maintenance-report
          path: |
            summary.md
            cleanup-proposal.md
            source-quality-refinement-summary.md
            source-health.csv
            source-verification.csv
            source-quality-refinement-queue.csv
            source-observation-ledger-summary.md
            source-repair-sweep-summary.md
            source-repair-batch-summary.md
            source-review-triage-summary.md
            source-review-decision-sheet-summary.md
            source-discovery-candidates.csv
            source-discovery-unavailable.csv
            source-repair-sweep-strict-candidates.csv
            source-repair-sweep-human-review.csv
            source-repair-sweep-no-replacement.csv
            source-repair-batch-plan.csv
            source-review-triage-plan.csv
            source-review-decision-sheet.csv
            promotion-plan-actions.csv
            source-health-report.json
            source-verification-report.json
            source-quality-refinement-queue.json
            source-observation-ledger.json
            latest-source-health.json
            public/source-health-snapshot.json
            observation-ledger/observation-records.json
            observation-ledger/latest-observations.json
            observation-ledger/source-freshness-report.json
            observation-ledger/changed-since-last-observation.json
            observation-ledger/sources-requiring-review.json
            observation-ledger/observation-ledger-delta.ndjson
            source-discovery-report.json
            source-repair-sweep-report.json
            source-repair-batch-plan.json
            source-review-triage-plan.json
            promotion-plan.json
            cleanup-proposal.json
          if-no-files-found: error
      - name: Upload source reviewer inbox artifact
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-reviewer-inbox
          path: source-review-decision-sheet.csv
          if-no-files-found: error
      - name: Build source maintenance failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow source-maintenance-report.yml \
            --lane source_maintenance_report \
            --message "source maintenance report workflow failed; inspect logs for external fetch instability, schema validation, or source-health reporting context" \
            --out reports/openva-failure-routing/source-maintenance-failure-input.json \
            --preserve-existing
      - name: Route source maintenance failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/source-maintenance-failure-input.json \
            --out reports/openva-failure-routing/source-maintenance-failure-routing-report.json \
            --out-md reports/openva-failure-routing/source-maintenance-failure-routing-report.md
      - name: Upload source maintenance failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-maintenance-failure-routing
          path: |
            reports/openva-failure-routing/source-maintenance-failure-input.json
            reports/openva-failure-routing/source-maintenance-failure-routing-report.json
            reports/openva-failure-routing/source-maintenance-failure-routing-report.md
          if-no-files-found: ignore
