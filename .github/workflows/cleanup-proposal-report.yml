name: cleanup-proposal-report

on:
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Optional number of sources to verify"
        required: false
        type: string
      vendor_limit:
        description: "Optional number of vendors to discover against"
        required: false
        type: string
  schedule:
    - cron: "11 6 * * 3"

permissions:
  contents: read

concurrency:
  group: cleanup-proposal-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-proposal-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build network source verification report
        run: |
          LIMIT="${{ inputs.source_limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_verification verify --limit "$LIMIT" --output source-verification-report.json
          else
            python -m tools.openva.source_verification verify --output source-verification-report.json
          fi
      - name: Build candidate source discovery report
        run: |
          LIMIT="${{ inputs.vendor_limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_discovery discover --vendor-limit "$LIMIT" --output source-discovery-report.json
          else
            python -m tools.openva.source_discovery discover --output source-discovery-report.json
          fi
      - name: Build promotion plan from maintenance reports
        run: |
          python -m tools.openva.promotion_planner plan \
            --verification-report source-verification-report.json \
            --discovery-report source-discovery-report.json \
            --output promotion-plan.json
      - name: Build cleanup proposal
        run: |
          python -m tools.openva.cleanup_proposals build \
            --promotion-plan promotion-plan.json \
            --json-output cleanup-proposal.json \
            --markdown-output cleanup-proposal.md
      - name: Print cleanup proposal summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('cleanup-proposal.json', encoding='utf-8'))
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          PY
      - name: Upload cleanup proposal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openva-cleanup-proposal-report
          path: |
            source-verification-report.json
            source-discovery-report.json
            promotion-plan.json
            cleanup-proposal.json
            cleanup-proposal.md
          if-no-files-found: error
