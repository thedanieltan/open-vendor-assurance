name: promotion-plan-report

on:
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * 2"

permissions:
  contents: read

concurrency:
  group: promotion-plan-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-plan-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build promotion plan report
        run: python -m tools.openva.promotion_planner plan --output promotion-plan.json
      - name: Print promotion plan summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('promotion-plan.json', encoding='utf-8'))
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          PY
      - name: Upload promotion plan report
        uses: actions/upload-artifact@v4
        with:
          name: openva-promotion-plan-report
          path: promotion-plan.json
          if-no-files-found: error
