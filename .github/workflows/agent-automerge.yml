    # schema + labels), recomputes each staged candidate's eligibility and
    # identity (never trusting the stored eligibility_state), runs the release
    # gate, and only then enables native auto-merge. Staging only: it merges a
    # non-canonical candidate record; promotion to catalogue truth still flows
    # through the independent quorum/promotion path.
    if: github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'candidate-intake') && contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:candidate-intake')
