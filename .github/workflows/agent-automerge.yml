name: agent-automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: read
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: agent-automerge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generated-catalog:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'agent-candidate-promotion-') &&
      github.event.pull_request.title == 'Catalog: apply reviewed candidate source promotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Check generated catalog circuit breaker pause
        run: >-
          python -m tools.openva.generated_catalog_pr_risk --circuit-breaker-check-pause
          --pause-file maintenance/generated/generated-catalog-circuit-breaker.json

      - name: Collect generated catalog PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" --name-only > changed-files.txt
          gh pr diff "$PR_NUMBER" --patch > generated-catalog.patch
          gh pr view "$PR_NUMBER" --json body --jq .body > pr-body.md
          for attempt in $(seq 1 30); do
            gh pr view "$PR_NUMBER" --json title,headRefName,isDraft,mergeable > pr-metadata.json
            MERGEABLE=$(python -c "import json; print(json.load(open('pr-metadata.json', encoding='utf-8')).get('mergeable') or '')")
            if [ "$MERGEABLE" != "UNKNOWN" ] && [ -n "$MERGEABLE" ]; then
              break
            fi
            sleep 10
          done

      - name: Classify generated catalog PR paths before applying patch
        run: python -m tools.openva.generated_catalog_pr_risk --paths-file changed-files.txt

      - name: Apply generated catalog PR patch as data
        run: |
          git apply --check --index --whitespace=nowarn generated-catalog.patch
          git apply --index --whitespace=nowarn generated-catalog.patch
          python -m tools.openva.generated_catalog_pr_risk \
            --paths-file changed-files.txt \
            --verify-applied-paths \
            --ignore-path changed-files.txt \
            --ignore-path generated-catalog.patch \
            --ignore-path pr-body.md \
            --ignore-path pr-metadata.json

      - name: Collect unresolved review thread state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if ! gh api graphql \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes { isResolved }
                      pageInfo { hasNextPage }
                    }
                  }
                }
              }
            ' > review-threads.json; then
            printf '{"review_threads_unavailable": true}\n' > review-threads.json
          fi

      - name: Wait for generated catalog required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          pr_number = "${{ github.event.pull_request.number }}"
          required = ("validate", "catalog-pr-guard", "agent-weighted-review")
          terminal = {"success", "failure", "skipped"}

          def workflow_status(rows, workflow):
              matches = [row for row in rows if row.get("workflow") == workflow]
              if not matches:
                  return "missing"
              states = {str(row.get("state") or "").upper() for row in matches}
              buckets = {str(row.get("bucket") or "").lower() for row in matches}
              if "fail" in buckets or states & {"FAILURE", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED"}:
                  return "failure"
              if "pending" in buckets or any(state not in {"SUCCESS", "SKIPPED"} for state in states):
                  return "pending"
              if "SUCCESS" in states:
                  return "success"
              return "skipped"

          latest_rows = []
          latest_statuses = {workflow: "missing" for workflow in required}
          for _ in range(45):
              completed = subprocess.run(
                  [
                      "gh",
                      "pr",
                      "checks",
                      pr_number,
                      "--json",
                      "name,workflow,state,bucket,link",
                  ],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              latest_rows = json.loads(completed.stdout or "[]")
              latest_statuses = {workflow: workflow_status(latest_rows, workflow) for workflow in required}
              if all(status in terminal for status in latest_statuses.values()):
                  break
              time.sleep(20)

          with open("pr-checks.json", "w", encoding="utf-8") as handle:
              json.dump(latest_rows, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Run source preflight for changed sources
        run: |
          python -m tools.openva.source_preflight check-changed-sources \
            --paths-file changed-files.txt \
            --output source-preflight-report.json || true

      - name: Run source-intelligence release gate
        run: >-
          python -m tools.openva.release_gates check --profile pr
          --out-json release-gates.json
          --out-md release-gates-summary.md || true

      - name: Rebuild generated outputs and detect drift
        run: |
          GENERATED_OUTPUTS_FRESH=true
          git diff -- openva-pack.json indexes/ dist/ > generated-outputs-before-build.patch
          python -m tools.openva.validate build-indexes || GENERATED_OUTPUTS_FRESH=false
          git diff -- openva-pack.json indexes/ dist/ > generated-outputs-after-build.patch
          cmp -s generated-outputs-before-build.patch generated-outputs-after-build.patch || GENERATED_OUTPUTS_FRESH=false
          python - <<PY
          import json

          fresh = "${GENERATED_OUTPUTS_FRESH}" == "true"
          with open("generated-outputs-fresh.json", "w", encoding="utf-8") as handle:
              json.dump({"generated_outputs_fresh": fresh}, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Check generated catalog automerge eligibility
        id: generated_catalog_eligibility
        continue-on-error: true
        run: |
          python -m tools.openva.generated_catalog_pr_risk \
            --paths-file changed-files.txt \
            --automerge-eligibility-from-files \
            --pr-body-file pr-body.md \
            --metadata-file pr-metadata.json \
            --checks-file pr-checks.json \
            --source-preflight-report source-preflight-report.json \
            --release-gates-report release-gates.json \
            --review-threads-report review-threads.json \
            --generated-outputs-fresh-file generated-outputs-fresh.json \
            --out-json generated-catalog-automerge-eligibility.json \
            --github-output-file "$GITHUB_OUTPUT"

      - name: Upload generated catalog automerge eligibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-catalog-automerge-eligibility
          path: |
            generated-catalog-automerge-eligibility.json
            generated-outputs-fresh.json
            generated-outputs-before-build.patch
            generated-outputs-after-build.patch
            source-preflight-report.json
            release-gates.json
            release-gates-summary.md
            pr-checks.json
          if-no-files-found: warn

      - name: Enable GitHub native auto-merge
        if: steps.generated_catalog_eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

  generated-catalog-rereview:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve generated catalog PR awaiting re-evaluation
        id: resolve_generated_catalog
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "generated_pr=false"
            echo "pr_number="
          } >> "$GITHUB_OUTPUT"

          gh pr list --repo "$REPO" \
            --state open \
            --limit 50 \
            --json number,title,headRefName,isDraft,mergeable \
            --jq '[.[] | select(.headRefName | startswith("agent-candidate-promotion-")) | select(.title == "Catalog: apply reviewed candidate source promotion")][0] // empty' > pr-metadata.json

          if [ ! -s pr-metadata.json ]; then
            echo "No open generated catalog PR found for scheduled re-evaluation."
            exit 0
          fi

          PR_NUMBER=$(python - <<'PY'
          import json
          print(json.load(open("pr-metadata.json", encoding="utf-8")).get("number") or "")
          PY
          )
          PR_TITLE=$(python - <<'PY'
          import json
          print(json.load(open("pr-metadata.json", encoding="utf-8")).get("title") or "")
          PY
          )
          HEAD_REF=$(python - <<'PY'
          import json
          print(json.load(open("pr-metadata.json", encoding="utf-8")).get("headRefName") or "")
          PY
          )

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Resolved generated catalog PR number is malformed; skipping."
            exit 0
          fi
          if [[ "$HEAD_REF" != agent-candidate-promotion-* ]]; then
            echo "PR #$PR_NUMBER is not on a generated candidate-promotion branch; skipping."
            exit 0
          fi
          if [ "$PR_TITLE" != "Catalog: apply reviewed candidate source promotion" ]; then
            echo "PR #$PR_NUMBER title is not the generated catalog promotion title; skipping."
            exit 0
          fi

          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body > pr-body.md

          {
            echo "generated_pr=true"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        run: pip install -e ".[dev]"

      - name: Check generated catalog circuit breaker pause
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        run: >-
          python -m tools.openva.generated_catalog_pr_risk --circuit-breaker-check-pause
          --pause-file maintenance/generated/generated-catalog-circuit-breaker.json

      - name: Collect generated catalog PR diff
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve_generated_catalog.outputs.pr_number }}
        run: |
          gh pr diff "$PR_NUMBER" --name-only > changed-files.txt
          gh pr diff "$PR_NUMBER" --patch > generated-catalog.patch

      - name: Classify generated catalog PR paths before applying patch
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        run: python -m tools.openva.generated_catalog_pr_risk --paths-file changed-files.txt

      - name: Apply generated catalog PR patch as data
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        run: |
          git apply --check --index --whitespace=nowarn generated-catalog.patch
          git apply --index --whitespace=nowarn generated-catalog.patch
          python -m tools.openva.generated_catalog_pr_risk \
            --paths-file changed-files.txt \
            --verify-applied-paths \
            --ignore-path changed-files.txt \
            --ignore-path generated-catalog.patch \
            --ignore-path pr-body.md \
            --ignore-path pr-metadata.json

      - name: Collect unresolved review thread state
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve_generated_catalog.outputs.pr_number }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if ! gh api graphql \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes { isResolved }
                      pageInfo { hasNextPage }
                    }
                  }
                }
              }
            ' > review-threads.json; then
            printf '{"review_threads_unavailable": true}\n' > review-threads.json
          fi

      - name: Collect generated catalog required checks
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve_generated_catalog.outputs.pr_number }}
        run: |
          python - <<'PY'
          import json
          import subprocess

          pr_number = "${{ steps.resolve_generated_catalog.outputs.pr_number }}"
          required = ("validate", "catalog-pr-guard", "agent-weighted-review")

          def workflow_status(rows, workflow):
              matches = [row for row in rows if row.get("workflow") == workflow]
              if not matches:
                  return "missing"
              states = {str(row.get("state") or "").upper() for row in matches}
              buckets = {str(row.get("bucket") or "").lower() for row in matches}
              if "fail" in buckets or states & {"FAILURE", "CANCELLED", "TIMED_OUT", "ACTION_REQUIRED"}:
                  return "failure"
              if "pending" in buckets or any(state not in {"SUCCESS", "SKIPPED"} for state in states):
                  return "pending"
              if "SUCCESS" in states:
                  return "success"
              return "skipped"

          completed = subprocess.run(
              [
                  "gh",
                  "pr",
                  "checks",
                  pr_number,
                  "--json",
                  "name,workflow,state,bucket,link",
              ],
              check=False,
              text=True,
              capture_output=True,
          )
          rows = json.loads(completed.stdout or "[]")
          statuses = {workflow: workflow_status(rows, workflow) for workflow in required}
          with open("pr-checks.json", "w", encoding="utf-8") as handle:
              json.dump(rows, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Run source preflight for changed sources
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        run: |
          python -m tools.openva.source_preflight check-changed-sources \
            --paths-file changed-files.txt \
            --output source-preflight-report.json || true

      - name: Run source-intelligence release gate
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        run: >-
          python -m tools.openva.release_gates check --profile pr
          --out-json release-gates.json
          --out-md release-gates-summary.md || true

      - name: Rebuild generated outputs and detect drift
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        run: |
          GENERATED_OUTPUTS_FRESH=true
          git diff -- openva-pack.json indexes/ dist/ > generated-outputs-before-build.patch
          python -m tools.openva.validate build-indexes || GENERATED_OUTPUTS_FRESH=false
          git diff -- openva-pack.json indexes/ dist/ > generated-outputs-after-build.patch
          cmp -s generated-outputs-before-build.patch generated-outputs-after-build.patch || GENERATED_OUTPUTS_FRESH=false
          python - <<PY
          import json

          fresh = "${GENERATED_OUTPUTS_FRESH}" == "true"
          with open("generated-outputs-fresh.json", "w", encoding="utf-8") as handle:
              json.dump({"generated_outputs_fresh": fresh}, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Check generated catalog automerge eligibility
        if: steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        id: generated_catalog_rereview_eligibility
        continue-on-error: true
        run: |
          python -m tools.openva.generated_catalog_pr_risk \
            --paths-file changed-files.txt \
            --automerge-eligibility-from-files \
            --pr-body-file pr-body.md \
            --metadata-file pr-metadata.json \
            --checks-file pr-checks.json \
            --source-preflight-report source-preflight-report.json \
            --release-gates-report release-gates.json \
            --review-threads-report review-threads.json \
            --generated-outputs-fresh-file generated-outputs-fresh.json \
            --out-json generated-catalog-automerge-eligibility.json \
            --github-output-file "$GITHUB_OUTPUT"

      - name: Upload generated catalog automerge eligibility report
        if: always() && steps.resolve_generated_catalog.outputs.generated_pr == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: generated-catalog-automerge-eligibility
          path: |
            generated-catalog-automerge-eligibility.json
            generated-outputs-fresh.json
            generated-outputs-before-build.patch
            generated-outputs-after-build.patch
            source-preflight-report.json
            release-gates.json
            release-gates-summary.md
            pr-checks.json
          if-no-files-found: warn

      - name: Enable GitHub native auto-merge
        if: >-
          steps.resolve_generated_catalog.outputs.generated_pr == 'true' &&
          steps.generated_catalog_rereview_eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve_generated_catalog.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

  generated-catalog-circuit-breaker:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Resolve latest merged generated catalog PR
        id: resolve_generated_catalog_merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/generated-catalog-circuit-breaker
          gh pr list \
            --state merged \
            --limit 50 \
            --json number,title,headRefName,headRefOid,mergeCommit,mergedAt \
            --jq '[.[] | select(.headRefName | startswith("agent-candidate-promotion-")) | select(.title == "Catalog: apply reviewed candidate source promotion")][0] // {}' \
            > reports/generated-catalog-circuit-breaker/source-pr.json
          python - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          data = json.load(open("reports/generated-catalog-circuit-breaker/source-pr.json", encoding="utf-8"))
          merge_commit = data.get("mergeCommit") if isinstance(data, dict) else {}
          merge_sha = ""
          if isinstance(merge_commit, dict):
              merge_sha = str(merge_commit.get("oid") or "")
          source_pr = str(data.get("number") or "") if isinstance(data, dict) else ""
          source_head_sha = str(data.get("headRefOid") or "") if isinstance(data, dict) else ""
          generated = bool(source_pr)
          merged = bool(source_pr and merge_sha)
          with open(sys.argv[1], "a", encoding="utf-8") as handle:
              handle.write(f"generated_catalog_pr={str(generated).lower()}\n")
              handle.write(f"merged={str(merged).lower()}\n")
              handle.write(f"source_pr={source_pr}\n")
              handle.write(f"source_head_sha={source_head_sha}\n")
              handle.write(f"source_merge_sha={merge_sha}\n")
              handle.write(f"merge_metadata_present={str(merged).lower()}\n")
          PY

      - name: Collect merged generated catalog affected paths
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ steps.resolve_generated_catalog_merge.outputs.source_pr }}
        run: |
          set -euo pipefail
          : > reports/generated-catalog-circuit-breaker/affected-paths.txt
          if [ -n "$SOURCE_PR" ]; then
            gh pr diff "$SOURCE_PR" --name-only > reports/generated-catalog-circuit-breaker/affected-paths.txt
          fi

      - name: Run post-merge validation
        run: |
          set -euo pipefail
          if python -m tools.openva.validate validate; then
            printf '{"validation_passed": true}\n' > reports/generated-catalog-circuit-breaker/validation-status.json
          else
            printf '{"validation_passed": false}\n' > reports/generated-catalog-circuit-breaker/validation-status.json
          fi

      - name: Rebuild generated outputs and detect post-merge drift
        run: |
          set -euo pipefail
          GENERATED_OUTPUTS_FRESH=true
          if ! python -m tools.openva.validate build-indexes; then
            GENERATED_OUTPUTS_FRESH=false
          fi
          if ! git diff --exit-code openva-pack.json indexes/ dist/; then
            GENERATED_OUTPUTS_FRESH=false
          fi
          git diff -- openva-pack.json indexes/ dist/ > reports/generated-catalog-circuit-breaker/generated-output-drift.patch
          python - "$GENERATED_OUTPUTS_FRESH" <<'PY'
          import json
          import sys

          value = sys.argv[1] == "true"
          with open("reports/generated-catalog-circuit-breaker/generated-output-status.json", "w", encoding="utf-8") as handle:
              json.dump({"generated_outputs_fresh": value}, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Run post-merge release gate
        run: |
          set -euo pipefail
          if python -m tools.openva.release_gates check --profile pr \
            --out-json reports/generated-catalog-circuit-breaker/release-gates.json \
            --out-md reports/generated-catalog-circuit-breaker/release-gates-summary.md; then
            printf '{"release_gates_passed": true}\n' > reports/generated-catalog-circuit-breaker/release-gate-status.json
          else
            printf '{"release_gates_passed": false}\n' > reports/generated-catalog-circuit-breaker/release-gate-status.json
          fi

      - name: Collect publication status for generated catalog merge
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_MERGE_SHA: ${{ steps.resolve_generated_catalog_merge.outputs.source_merge_sha }}
        run: |
          set -euo pipefail
          gh run list --branch main --limit 50 --json workflowName,headSha,conclusion,status \
            > reports/generated-catalog-circuit-breaker/publication-runs.json
          python - "$SOURCE_MERGE_SHA" <<'PY'
          import json
          import sys

          merge_sha = sys.argv[1]
          publication_workflows = {"site-pages", "release-downloads", "site-live-feed"}
          failed_conclusions = {"failure", "cancelled", "timed_out", "action_required"}
          rows = json.load(open("reports/generated-catalog-circuit-breaker/publication-runs.json", encoding="utf-8") or [])
          failures = [
              row
              for row in rows
              if row.get("headSha") == merge_sha
              and row.get("workflowName") in publication_workflows
              and row.get("status") == "completed"
              and str(row.get("conclusion") or "").lower() in failed_conclusions
          ]
          with open("reports/generated-catalog-circuit-breaker/publication-status.json", "w", encoding="utf-8") as handle:
              json.dump({"publication_passed": not failures, "failed_publication_runs": len(failures)}, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Resolve generated catalog automerge run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ steps.resolve_generated_catalog_merge.outputs.source_head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_HEAD_SHA" ]; then
            printf '{"automerge_run_resolved": false, "automerge_job_succeeded": null, "expected_artifact_present": null, "artifact_state": "unknown", "reason": "source_head_sha_missing"}\n' \
              > reports/generated-catalog-circuit-breaker/automerge-evidence.json
            exit 0
          fi
          gh run list \
            --workflow agent-automerge.yml \
            --event pull_request \
            --commit "$SOURCE_HEAD_SHA" \
            --limit 20 \
            --json databaseId,headSha,status,conclusion,event,createdAt \
            > reports/generated-catalog-circuit-breaker/automerge-runs.json
          python - "$SOURCE_HEAD_SHA" <<'PY'
          import json
          import sys

          head_sha = sys.argv[1]
          rows = json.load(open("reports/generated-catalog-circuit-breaker/automerge-runs.json", encoding="utf-8"))
          matches = [
              row for row in rows
              if row.get("headSha") == head_sha
              and row.get("event") == "pull_request"
              and row.get("status") == "completed"
          ]
          matches.sort(key=lambda row: str(row.get("createdAt") or ""), reverse=True)
          run_id = str(matches[0].get("databaseId") or "") if matches else ""
          with open("reports/generated-catalog-circuit-breaker/automerge-run-id.txt", "w", encoding="utf-8") as handle:
              handle.write(run_id)
          PY
          RUN_ID="$(cat reports/generated-catalog-circuit-breaker/automerge-run-id.txt)"
          if [ -z "$RUN_ID" ]; then
            printf '{"automerge_run_resolved": false, "automerge_job_succeeded": null, "expected_artifact_present": null, "artifact_state": "unknown", "reason": "agent_automerge_run_not_resolved"}\n' \
              > reports/generated-catalog-circuit-breaker/automerge-evidence.json
            exit 0
          fi
          gh run view "$RUN_ID" --json jobs > reports/generated-catalog-circuit-breaker/automerge-run-jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > reports/generated-catalog-circuit-breaker/automerge-run-artifacts.json
          python - "$RUN_ID" <<'PY'
          import json
          import sys

          run_id = sys.argv[1]
          jobs = json.load(open("reports/generated-catalog-circuit-breaker/automerge-run-jobs.json", encoding="utf-8")).get("jobs") or []
          generated_jobs = [job for job in jobs if job.get("name") == "generated-catalog"]
          succeeded = any(job.get("conclusion") == "success" for job in generated_jobs)
          artifacts = json.load(open("reports/generated-catalog-circuit-breaker/automerge-run-artifacts.json", encoding="utf-8"))
          artifact_rows = artifacts.get("artifacts") if isinstance(artifacts, dict) else []
          artifact_present = any(
              artifact.get("name") == "generated-catalog-automerge-eligibility"
              for artifact in artifact_rows or []
          )
          output = {
              "automerge_run_resolved": True,
              "automerge_run_id": run_id,
              "automerge_job_succeeded": succeeded,
              "expected_artifact_present": artifact_present,
              "artifact_state": "present" if artifact_present else "missing",
          }
          with open("reports/generated-catalog-circuit-breaker/automerge-evidence.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Evaluate generated catalog circuit breaker
        id: generated_catalog_circuit_breaker
        continue-on-error: true
        env:
          GENERATED_CATALOG_PR: ${{ steps.resolve_generated_catalog_merge.outputs.generated_catalog_pr }}
          MERGED: ${{ steps.resolve_generated_catalog_merge.outputs.merged }}
          SOURCE_PR: ${{ steps.resolve_generated_catalog_merge.outputs.source_pr }}
          SOURCE_MERGE_SHA: ${{ steps.resolve_generated_catalog_merge.outputs.source_merge_sha }}
          MERGE_METADATA_PRESENT: ${{ steps.resolve_generated_catalog_merge.outputs.merge_metadata_present }}
        run: |
          set -euo pipefail
          VALIDATION_PASSED="$(python -c 'import json; print(str(json.load(open("reports/generated-catalog-circuit-breaker/validation-status.json", encoding="utf-8"))["validation_passed"]).lower())')"
          GENERATED_OUTPUTS_FRESH="$(python -c 'import json; print(str(json.load(open("reports/generated-catalog-circuit-breaker/generated-output-status.json", encoding="utf-8"))["generated_outputs_fresh"]).lower())')"
          RELEASE_GATES_PASSED="$(python -c 'import json; print(str(json.load(open("reports/generated-catalog-circuit-breaker/release-gate-status.json", encoding="utf-8"))["release_gates_passed"]).lower())')"
          PUBLICATION_PASSED="$(python -c 'import json; print(str(json.load(open("reports/generated-catalog-circuit-breaker/publication-status.json", encoding="utf-8"))["publication_passed"]).lower())')"
          AUTOMERGE_JOB_SUCCEEDED="$(python -c 'import json; value=json.load(open("reports/generated-catalog-circuit-breaker/automerge-evidence.json", encoding="utf-8")).get("automerge_job_succeeded"); print("" if value is None else str(value).lower())')"
          EXPECTED_ARTIFACT_PRESENT="$(python -c 'import json; value=json.load(open("reports/generated-catalog-circuit-breaker/automerge-evidence.json", encoding="utf-8")).get("expected_artifact_present"); print("" if value is None else str(value).lower())')"
          ARGS=(
            --generated-catalog-pr "$GENERATED_CATALOG_PR"
            --merged "$MERGED"
            --source-merge-sha "$SOURCE_MERGE_SHA"
            --validation-passed "$VALIDATION_PASSED"
            --generated-outputs-fresh-circuit "$GENERATED_OUTPUTS_FRESH"
            --release-gates-passed-circuit "$RELEASE_GATES_PASSED"
            --publication-passed "$PUBLICATION_PASSED"
            --merge-metadata-present "$MERGE_METADATA_PRESENT"
            --affected-paths-file reports/generated-catalog-circuit-breaker/affected-paths.txt
            --out-json reports/generated-catalog-circuit-breaker/generated-catalog-circuit-breaker.json
            --out-md reports/generated-catalog-circuit-breaker/generated-catalog-circuit-breaker.md
            --github-output-file "$GITHUB_OUTPUT"
          )
          if [ -n "$SOURCE_PR" ]; then
            ARGS+=(--source-pr "$SOURCE_PR")
          fi
          if [ -n "$AUTOMERGE_JOB_SUCCEEDED" ]; then
            ARGS+=(--automerge-job-succeeded "$AUTOMERGE_JOB_SUCCEEDED")
          fi
          if [ -n "$EXPECTED_ARTIFACT_PRESENT" ]; then
            ARGS+=(--expected-artifact-present "$EXPECTED_ARTIFACT_PRESENT")
          fi
          python -m tools.openva.generated_catalog_pr_risk --circuit-breaker-evaluate "${ARGS[@]}"

      - name: Upload generated catalog circuit breaker artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-catalog-circuit-breaker
          path: reports/generated-catalog-circuit-breaker/
          if-no-files-found: warn

      - name: Write generated catalog circuit breaker pause file
        if: steps.generated_catalog_circuit_breaker.outputs.pause_required == 'true'
        run: |
          set -euo pipefail
          python -m tools.openva.generated_catalog_pr_risk \
            --circuit-breaker-write-pause-file \
            --incident-report-file reports/generated-catalog-circuit-breaker/generated-catalog-circuit-breaker.json \
            --pause-file maintenance/generated/generated-catalog-circuit-breaker.json

      - name: Open generated catalog circuit breaker remediation PR
        if: steps.generated_catalog_circuit_breaker.outputs.pause_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ steps.resolve_generated_catalog_merge.outputs.source_pr }}
          SOURCE_MERGE_SHA: ${{ steps.resolve_generated_catalog_merge.outputs.source_merge_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_MERGE_SHA:0:12}"
          if [ -z "$SHORT_SHA" ]; then
            SHORT_SHA="unknown"
          fi
          BRANCH="generated-catalog-circuit-breaker-pause-${SOURCE_PR:-unknown}-${SHORT_SHA}"
          EXISTING_PR="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // ""')"
          if [ -n "$EXISTING_PR" ]; then
            echo "generated catalog circuit breaker remediation PR already exists: #$EXISTING_PR"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add maintenance/generated/generated-catalog-circuit-breaker.json
          if git diff --cached --quiet; then
            echo "::error::pause_required=true but pause file had no staged change"
            exit 1
          fi
          git commit -m "Pause generated catalog automerge after circuit breaker"
          git push --set-upstream origin "$BRANCH"
          python - <<'PY'
          import json

          report = json.load(open("reports/generated-catalog-circuit-breaker/generated-catalog-circuit-breaker.json", encoding="utf-8"))
          lines = [
              "Adds durable generated-catalog circuit-breaker pause state.",
              "",
              f"- Source PR: #{report.get('source_pr')}",
              f"- Source merge SHA: `{report.get('source_merge_sha')}`",
              f"- Trigger: `{report.get('trigger')}`",
              f"- Recommended action: `{report.get('recommended_action')}`",
              "",
              "This is operational metadata only. Not advice.",
          ]
          with open("reports/generated-catalog-circuit-breaker/pause-remediation-pr.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
          gh pr create \
            --title "Pause generated catalog automerge after circuit breaker" \
            --body-file reports/generated-catalog-circuit-breaker/pause-remediation-pr.md \
            --base main \
            --head "$BRANCH"

      - name: Fail closed when generated catalog circuit breaker pauses the lane
        if: steps.generated_catalog_circuit_breaker.outputs.pause_required == 'true'
        run: |
          echo "::error::generated catalog circuit breaker requires pause and remediation"
          exit 1

  machine-canonical:
    if: github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:machine-canonical') && !contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:strict-growth')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e ".[dev]"
          pip install -e "services/openva_match_service[dev]"

      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > changed-files.txt

      - name: Check machine-canonical automerge eligibility
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python -m tools.openva.automerge_lanes \
            --paths-file changed-files.txt \
            --labels "$LABELS" \
            --policy config/automerge-policy.yaml

      - name: Check changed source record preflight
        run: |
          python -m tools.openva.source_preflight check-changed-sources \
            --paths-file changed-files.txt \
            --output source-preflight-report.json

      - name: Upload source preflight report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-preflight-report
          path: source-preflight-report.json
          if-no-files-found: warn

      - name: Validate repository
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code schema_validation_failure \
              --message "schema validation failed during machine-canonical automerge preflight" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/machine-canonical-failure-input.json
            exit 1
          }

      - name: Rebuild generated outputs
        run: |
          python -m tools.openva.validate build-indexes || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code generated_drift_failure \
              --message "generated drift detected while rebuilding machine-canonical outputs" \
              --artifact openva-build-indexes \
              --out reports/openva-failure-routing/machine-canonical-failure-input.json
            exit 1
          }

      - name: Refuse generated drift
        run: |
          git diff --exit-code openva-pack.json indexes/ || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code generated_drift_failure \
              --message "generated files are stale after machine-canonical rebuild" \
              --artifact git-diff-generated-outputs \
              --out reports/openva-failure-routing/machine-canonical-failure-input.json
            exit 1
          }

      - name: Run tests
        run: pytest -q

      - name: Build site
        run: python site/build.py --out site/dist

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Build machine-canonical failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow agent-automerge.yml \
            --lane pr_safety \
            --failure-code automerge_lane_mismatch \
            --message "automerge lane mismatch in machine-canonical lane; inspect labels, paths, source preflight, generated outputs, and required checks" \
            --source-preflight-report source-preflight-report.json \
            --out reports/openva-failure-routing/machine-canonical-failure-input.json \
            --preserve-existing
      - name: Route machine-canonical failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/machine-canonical-failure-input.json \
            --out reports/openva-failure-routing/machine-canonical-failure-routing-report.json \
            --out-md reports/openva-failure-routing/machine-canonical-failure-routing-report.md
      - name: Upload machine-canonical failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-automerge-machine-canonical-failure-routing
          path: |
            reports/openva-failure-routing/machine-canonical-failure-input.json
            reports/openva-failure-routing/machine-canonical-failure-routing-report.json
            reports/openva-failure-routing/machine-canonical-failure-routing-report.md
          if-no-files-found: ignore

