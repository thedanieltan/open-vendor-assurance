name: agent-automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: agent-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  machine-canonical:
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:machine-canonical') && !contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:strict-growth')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e ".[dev]"
          pip install -e "services/openva_match_service[dev]"

      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > changed-files.txt

      - name: Check machine-canonical automerge eligibility
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python -m tools.openva.automerge_lanes \
            --paths-file changed-files.txt \
            --labels "$LABELS" \
            --policy config/automerge-policy.yaml

      - name: Check changed source record preflight
        run: |
          python -m tools.openva.source_preflight check-changed-sources \
            --paths-file changed-files.txt \
            --output source-preflight-report.json

      - name: Upload source preflight report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-preflight-report
          path: source-preflight-report.json
          if-no-files-found: warn

      - name: Validate repository
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code schema_validation_failure \
              --message "schema validation failed during machine-canonical automerge preflight" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/machine-canonical-failure-input.json
            exit 1
          }

      - name: Rebuild generated outputs
        run: |
          python -m tools.openva.validate build-indexes || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code generated_drift_failure \
              --message "generated drift detected while rebuilding machine-canonical outputs" \
              --artifact openva-build-indexes \
              --out reports/openva-failure-routing/machine-canonical-failure-input.json
            exit 1
          }

      - name: Refuse generated drift
        run: |
          git diff --exit-code openva-pack.json indexes/ || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code generated_drift_failure \
              --message "generated files are stale after machine-canonical rebuild" \
              --artifact git-diff-generated-outputs \
              --out reports/openva-failure-routing/machine-canonical-failure-input.json
            exit 1
          }

      - name: Run tests
        run: pytest -q

      - name: Build site
        run: python site/build.py --out site/dist

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Build machine-canonical failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow agent-automerge.yml \
            --lane pr_safety \
            --failure-code automerge_lane_mismatch \
            --message "automerge lane mismatch in machine-canonical lane; inspect labels, paths, source preflight, generated outputs, and required checks" \
            --source-preflight-report source-preflight-report.json \
            --out reports/openva-failure-routing/machine-canonical-failure-input.json \
            --preserve-existing
      - name: Route machine-canonical failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/machine-canonical-failure-input.json \
            --out reports/openva-failure-routing/machine-canonical-failure-routing-report.json \
            --out-md reports/openva-failure-routing/machine-canonical-failure-routing-report.md
      - name: Upload machine-canonical failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-automerge-machine-canonical-failure-routing
          path: |
            reports/openva-failure-routing/machine-canonical-failure-input.json
            reports/openva-failure-routing/machine-canonical-failure-routing-report.json
            reports/openva-failure-routing/machine-canonical-failure-routing-report.md
          if-no-files-found: ignore

  strict-growth:
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'catalog-growth') && contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:strict-growth') && !contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:machine-canonical')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e ".[dev]"
          pip install -e "services/openva_match_service[dev]"

      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > changed-files.txt

      - name: Collect strict growth inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > pr-body.md
          python -m tools.openva.strict_growth_automerge extract-inputs \
            --body-file pr-body.md \
            --output strict-growth-inputs.env
          cat strict-growth-inputs.env >> "$GITHUB_ENV"

      - name: Check strict growth automerge eligibility
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python -m tools.openva.strict_growth_automerge check-plan \
            --promotion-plan "$PROMOTION_PLAN_PATH" \
            --eligibility-report "$ELIGIBILITY_REPORT_PATH" \
            --labels "$LABELS" \
            --current-head-sha "${{ github.event.pull_request.head.sha }}" \
            --recorded-head-sha "$STRICT_GROWTH_HEAD_SHA" \
            --current-base-sha "${{ github.event.pull_request.base.sha }}" \
            --policy config/automerge-policy.yaml

      - name: Check changed source record preflight
        run: |
          python -m tools.openva.source_preflight check-changed-sources \
            --paths-file changed-files.txt \
            --output source-preflight-report.json

      - name: Upload source preflight report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-source-preflight-report
          path: source-preflight-report.json
          if-no-files-found: warn

      - name: Validate repository
        run: python -m tools.openva.validate validate

      - name: Rebuild generated outputs
        run: python -m tools.openva.validate build-indexes

      - name: Refuse generated drift
        run: git diff --exit-code openva-pack.json indexes/ dist/

      - name: Run tests
        run: pytest -q

      - name: Build site
        run: python site/build.py --out site/dist

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Build strict-growth failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow agent-automerge.yml \
            --lane pr_safety \
            --failure-code automerge_lane_mismatch \
            --message "automerge lane mismatch in strict-growth lane; inspect labels, paths, source preflight, strict-growth evidence, generated outputs, and required checks" \
            --source-preflight-report source-preflight-report.json \
            --out reports/openva-failure-routing/strict-growth-failure-input.json \
            --preserve-existing
      - name: Route strict-growth failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/strict-growth-failure-input.json \
            --out reports/openva-failure-routing/strict-growth-failure-routing-report.json \
            --out-md reports/openva-failure-routing/strict-growth-failure-routing-report.md
      - name: Upload strict-growth failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-automerge-strict-growth-failure-routing
          path: |
            reports/openva-failure-routing/strict-growth-failure-input.json
            reports/openva-failure-routing/strict-growth-failure-routing-report.json
            reports/openva-failure-routing/strict-growth-failure-routing-report.md
          if-no-files-found: ignore

  p0-source-repair:
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'source-refinement') && contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:p0-source-repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e ".[dev]"
          pip install -e "services/openva_match_service[dev]"

      - name: Fetch base commit
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > changed-files.txt

      - name: Collect reviewed source repair inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > pr-body.md
          python -m tools.openva.source_repair_automerge extract-inputs \
            --body-file pr-body.md \
            --output source-repair-inputs.env
          cat source-repair-inputs.env >> "$GITHUB_ENV"

      - name: Check P0 source repair automerge eligibility
        run: |
          python -m tools.openva.source_repair_automerge check \
            --paths-file changed-files.txt \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --head-ref HEAD \
            --validation-report "$VALIDATION_REPORT_PATH" \
            --evidence-report "$EVIDENCE_REPORT_PATH" \
            --policy config/automerge-policy.yaml

      - name: Validate repository
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code schema_validation_failure \
              --message "schema validation failed during P0 source repair automerge preflight" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/p0-source-repair-failure-input.json
            exit 1
          }

      - name: Rebuild generated outputs
        run: |
          python -m tools.openva.validate build-indexes || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code generated_drift_failure \
              --message "generated drift detected while rebuilding P0 source repair outputs" \
              --artifact openva-build-indexes \
              --out reports/openva-failure-routing/p0-source-repair-failure-input.json
            exit 1
          }

      - name: Refuse generated drift
        run: |
          git diff --exit-code openva-pack.json indexes/ dist/ || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow agent-automerge.yml \
              --lane pr_safety \
              --failure-code generated_drift_failure \
              --message "generated files are stale after P0 source repair rebuild" \
              --artifact git-diff-generated-outputs \
              --out reports/openva-failure-routing/p0-source-repair-failure-input.json
            exit 1
          }

      - name: Run tests
        run: pytest -q

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Build P0 source repair failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow agent-automerge.yml \
            --lane pr_safety \
            --failure-code automerge_lane_mismatch \
            --message "automerge lane mismatch in P0 source repair lane; inspect labels, paths, reviewed evidence, generated outputs, and required checks" \
            --out reports/openva-failure-routing/p0-source-repair-failure-input.json \
            --preserve-existing
      - name: Route P0 source repair failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/p0-source-repair-failure-input.json \
            --out reports/openva-failure-routing/p0-source-repair-failure-routing-report.json \
            --out-md reports/openva-failure-routing/p0-source-repair-failure-routing-report.md
      - name: Upload P0 source repair failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-automerge-p0-source-repair-failure-routing
          path: |
            reports/openva-failure-routing/p0-source-repair-failure-input.json
            reports/openva-failure-routing/p0-source-repair-failure-routing-report.json
            reports/openva-failure-routing/p0-source-repair-failure-routing-report.md
          if-no-files-found: ignore
