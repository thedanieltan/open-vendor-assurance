name: agent-automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: agent-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  machine-canonical:
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:machine-canonical')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e ".[dev]"
          pip install -e "services/openva_match_service[dev]"

      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > changed-files.txt

      - name: Check machine-canonical automerge eligibility
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python -m tools.openva.automerge_lanes \
            --paths-file changed-files.txt \
            --labels "$LABELS" \
            --policy config/automerge-policy.yaml

      - name: Validate repository
        run: python -m tools.openva.validate validate

      - name: Rebuild generated outputs
        run: python -m tools.openva.validate build-indexes

      - name: Refuse generated drift
        run: git diff --exit-code openva-pack.json indexes/

      - name: Run tests
        run: pytest -q

      - name: Build site
        run: python site/build.py --out site/dist

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
