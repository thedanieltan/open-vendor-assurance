      - name: Install package
        run: pip install -e ".[dev]"

      - name: Fetch base commit
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > changed-files.txt

      - name: Check quarantine automerge eligibility
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python -m tools.openva.quarantine_automerge check \
            --paths-file changed-files.txt \
            --labels "$LABELS" \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --head-ref HEAD

      - name: Validate repository
        run: python -m tools.openva.validate validate

      - name: Rebuild generated outputs
        run: python -m tools.openva.validate build-indexes

      - name: Refuse generated drift
        run: git diff --exit-code openva-pack.json indexes/ dist/

      - name: Run source-intelligence release gate (pr profile)
        run: >-
          python -m tools.openva.release_gates check --profile pr
          --out-json "$RUNNER_TEMP/release-gates.json"
          --out-md "$RUNNER_TEMP/release-gates-summary.md"

      - name: Run quarantine tests
        run: pytest -q tests/test_source_quarantine.py tests/test_quarantine_automerge.py tests/test_machine_decisions.py

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Build quarantine failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow agent-automerge.yml \
            --lane pr_safety \
            --failure-code automerge_lane_mismatch \
            --message "automerge lane mismatch in quarantine lane; inspect labels, status-only diff, quarantine decision record, separation of duties, not_before, and the release gate" \
            --out reports/openva-failure-routing/quarantine-failure-input.json \
            --preserve-existing
      - name: Route quarantine failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/quarantine-failure-input.json \
            --out reports/openva-failure-routing/quarantine-failure-routing-report.json \
            --out-md reports/openva-failure-routing/quarantine-failure-routing-report.md
      - name: Upload quarantine failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-automerge-quarantine-failure-routing
          path: |
            reports/openva-failure-routing/quarantine-failure-input.json
            reports/openva-failure-routing/quarantine-failure-routing-report.json
            reports/openva-failure-routing/quarantine-failure-routing-report.md
          if-no-files-found: ignore

  rollback:
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'rollback') && contains(join(github.event.pull_request.labels.*.name, ','), 'automerge:rollback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Fetch base commit
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Collect changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" --name-only > changed-files.txt

      - name: Check rollback automerge eligibility
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python -m tools.openva.rollback_automerge check \
            --paths-file changed-files.txt \
            --labels "$LABELS" \
            --base-ref ${{ github.event.pull_request.base.sha }} \
            --head-ref HEAD

      - name: Validate repository
        run: python -m tools.openva.validate validate

      - name: Rebuild generated outputs
        run: python -m tools.openva.validate build-indexes

      - name: Refuse generated drift
        run: git diff --exit-code openva-pack.json indexes/ dist/

      - name: Run source-intelligence release gate (pr profile)
        run: >-
          python -m tools.openva.release_gates check --profile pr
          --out-json "$RUNNER_TEMP/release-gates.json"
          --out-md "$RUNNER_TEMP/release-gates-summary.md"

      - name: Run rollback tests
        run: pytest -q tests/test_rollback.py tests/test_rollback_automerge.py tests/test_machine_decisions.py

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Build rollback failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow agent-automerge.yml \
            --lane pr_safety \
            --failure-code automerge_lane_mismatch \
            --message "automerge lane mismatch in rollback lane; inspect labels, reversal diff, append-only decision history, reverser-not-author, not_before, and the release gate" \
            --out reports/openva-failure-routing/rollback-failure-input.json \
