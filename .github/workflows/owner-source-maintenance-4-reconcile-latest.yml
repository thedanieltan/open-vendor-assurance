name: owner-source-maintenance-4-reconcile-latest

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-reconcile-latest
  cancel-in-progress: true

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-latest-reconciled]') && !contains(github.event.head_commit.message, '[owner-maintenance-4-latest-reconcile-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Merge current main and rebuild combined projections
        id: transaction
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG=/tmp/owner-source-maintenance-4-latest-reconcile.log
          : > "$LOG"
          {
            git config user.name 'openva-owner-catalog'
            git config user.email 'openva-owner-catalog@users.noreply.github.com'
            git fetch origin main
            git show HEAD:maintenance/source-observations/latest-observations.json > /tmp/maintenance-observations.json
            git show origin/main:maintenance/source-observations/latest-observations.json > /tmp/main-observations.json

            set +e
            git merge --no-commit --no-ff origin/main
            MERGE_RC=$?
            set -e
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            if [ -n "$CONFLICTS" ]; then
              echo 'Merge conflicts:'
              printf '%s\n' "$CONFLICTS"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  indexes/*|dist/vendors/*|openva-pack.json|maintenance/source-observations/latest-observations.json)
                    ;;
                  *)
                    echo "Unexpected canonical conflict: $path" >&2
                    exit 1
                    ;;
                esac
              done <<< "$CONFLICTS"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                if [ "$path" != 'maintenance/source-observations/latest-observations.json' ]; then
                  git checkout --ours -- "$path"
                  git add "$path"
                fi
              done <<< "$CONFLICTS"
            elif [ "$MERGE_RC" -ne 0 ]; then
              echo "Merge failed without listed conflicts (status $MERGE_RC)." >&2
              exit 1
            fi

            python - <<'PY'
          import json
          from pathlib import Path

          ours = json.loads(Path('/tmp/maintenance-observations.json').read_text(encoding='utf-8'))
          main = json.loads(Path('/tmp/main-observations.json').read_text(encoding='utf-8'))
          merged = {
              str(row['source_id']): row
              for row in main.get('sources', [])
              if row.get('source_id')
          }
          merged.update({
              str(row['source_id']): row
              for row in ours.get('sources', [])
              if row.get('source_id')
          })
          rows = sorted(
              merged.values(),
              key=lambda row: (str(row.get('vendor_id') or ''), str(row.get('source_id') or '')),
          )
          result = dict(ours)
          result['generated_at'] = max(str(ours.get('generated_at') or ''), str(main.get('generated_at') or ''))
          result['sources'] = rows
          observed = int((ours.get('summary') or {}).get('observed_this_run') or 0)
          result['summary'] = {
              'source_count': len(rows),
              'observed_this_run': observed,
              'carried_forward': len(rows) - observed,
          }
          Path('maintenance/source-observations/latest-observations.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'main_observations': len(main.get('sources', [])),
              'maintenance_observations': len(ours.get('sources', [])),
              'combined_observations': len(rows),
              'maintenance_observations_refreshed': observed,
          }, indent=2, sort_keys=True))
          PY
            git add maintenance/source-observations/latest-observations.json
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved conflicts remain:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi

            python -m tools.openva.validate build-indexes
            git add data/vendors dist/vendors indexes openva-pack.json maintenance/source-observations/latest-observations.json
            python -m tools.openva.validate validate
            python -m tools.openva.catalog_audit audit --enforce
            python -m tools.openva.release_gates check --profile pr --out-json /tmp/release-gates.json --out-md /tmp/release-gates.md
            pytest -q tests/test_catalog_guard.py tests/test_generated_exports.py tests/test_observation_ledger.py tests/test_catalog_audit.py
            git diff --check
          } 2>&1 | tee "$LOG"
      - name: Commit reconciled catalog
        if: steps.transaction.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-reconcile-latest.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Merge latest main catalog expansion into source maintenance [owner-maintenance-4-latest-reconciled]'
          git push
      - name: Preserve reconciliation diagnostic
        if: steps.transaction.outcome == 'failure'
        run: |
          set -euo pipefail
          git merge --abort 2>/dev/null || true
          git reset --hard HEAD
          cp /tmp/owner-source-maintenance-4-latest-reconcile.log maintenance/reviewed/owner-source-maintenance-4-latest-reconcile-diagnostic.log
          rm -f .github/workflows/owner-source-maintenance-4-reconcile-latest.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -f maintenance/reviewed/owner-source-maintenance-4-latest-reconcile-diagnostic.log
          git add .github/workflows/owner-source-maintenance-4-reconcile-latest.yml
          git commit -m 'Catalog: preserve latest reconciliation diagnostic [owner-maintenance-4-latest-reconcile-diagnostic]'
          git push
          exit 1
