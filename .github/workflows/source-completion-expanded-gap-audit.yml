name: source-completion-expanded-gap-audit

on:
  pull_request:
    branches:
      - catalog/source-completion-audit-control
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'catalog/owner-source-completion-1-builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Build expanded completion report
        run: |
          python -m tools.openva.catalog_source_completion build \
            --as-of 2026-07-14 \
            --output expanded-source-completion.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('expanded-source-completion.json').read_text())
          summary = report['summary']
          lines = [
              '## Expanded whole-catalog source gap audit',
              '',
              f"- Vendors: **{summary['vendor_count']}**",
              f"- Group cells: **{summary['group_cell_count']}**",
              f"- Complete vendors: **{summary['complete_vendor_count']}**",
              f"- Incomplete vendors: **{summary['incomplete_vendor_count']}**",
              f"- Unresolved groups: **{summary['unresolved_group_count']}**",
              '',
              '### Unresolved by group',
          ]
          for group, vendor_ids in report['unresolved_by_group'].items():
              lines.append(f"- `{group}`: **{len(vendor_ids)}**")
              if vendor_ids:
                  lines.append('  - ' + ', '.join(f'`{vendor_id}`' for vendor_id in vendor_ids))
          Path('expanded-source-completion.md').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-source-completion-gap-audit
          path: |
            expanded-source-completion.json
            expanded-source-completion.md
      - name: Post gap audit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file expanded-source-completion.md
