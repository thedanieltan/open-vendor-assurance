name: owner-source-maintenance-3-optimize

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-optimize
  cancel-in-progress: true

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-optimized]') && !contains(github.event.head_commit.message, '[owner-maintenance-3-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Limit network verification to changed and recovered source URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/owner-source-maintenance-3-materialize.yml')
          content = path.read_text(encoding='utf-8')
          old = "verification_ids = sorted(set(mutation_ids) | refresh_observation_ids)"
          new = "verification_ids = sorted(set(replacements) | refresh_observation_ids)"
          if old not in content:
              raise SystemExit('expected verification scope expression not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit optimized transaction runner
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add .github/workflows/owner-source-maintenance-3-materialize.yml
          git commit -m 'CI: verify only changed and recovered source URLs [owner-maintenance-3-optimized]'
          git push
