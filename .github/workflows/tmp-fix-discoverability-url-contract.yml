name: tmp-fix-discoverability-url-contract

on:
  push:
    branches:
      - agent/fix-discoverability-url-contract

permissions:
  contents: write

concurrency:
  group: tmp-fix-discoverability-url-contract
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore full test and apply decoded-link patch
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- tests/test_discoverability.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_discoverability.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'import xml.etree.ElementTree as ET\nfrom pathlib import Path\n',
              'import xml.etree.ElementTree as ET\nfrom html.parser import HTMLParser\nfrom pathlib import Path\n',
              1,
          )
          marker = 'def build_site(out: Path) -> Path:\n'
          helper = '''class _HrefCollector(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.hrefs: set[str] = set()

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  if tag != "a":
                      return
                  for name, value in attrs:
                      if name == "href" and value:
                          self.hrefs.add(value)


          def page_hrefs(page: str) -> set[str]:
              parser = _HrefCollector()
              parser.feed(page)
              return parser.hrefs


          '''
          if marker not in text:
              raise SystemExit('build_site marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = '''        page = (site / "vendors" / vendor_id / "index.html").read_text(encoding="utf-8")
              for url in urls:
                  assert url in page, f"{vendor_id} page missing source URL {url}"
          '''
          new = '''        page = (site / "vendors" / vendor_id / "index.html").read_text(encoding="utf-8")
              hrefs = page_hrefs(page)
              for url in urls:
                  assert url in hrefs, f"{vendor_id} page missing source link {url}"
          '''
          if old not in text:
              raise SystemExit('source URL assertion block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tests/test_discoverability.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_discoverability.py
          git commit -m "Restore full discoverability suite with decoded-link validation"
          git push origin HEAD:agent/fix-discoverability-url-contract
