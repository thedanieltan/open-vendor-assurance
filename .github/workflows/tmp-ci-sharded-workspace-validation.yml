name: tmp-ci-sharded-workspace-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/ci-sharded-workspace-validation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ci-sharded-workspace-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install repository
        run: pip install -e ".[dev]"
      - name: Apply bounded CI rationalization
        run: python .github/tmp_apply_ci_rationalization.py
      - name: Capture focused workflow contract results
        run: |
          set +e
          pytest -q \
            tests/test_workflow_workspace_ci.py \
            tests/test_ci_readiness.py \
            tests/test_workflow_operating_model.py \
            tests/test_workflow_contracts.py \
            > .github/ci-rationalization-test.log 2>&1
          status=$?
          cat .github/ci-rationalization-test.log
          printf '\nexit_status=%s\n' "$status" >> .github/ci-rationalization-test.log
          exit 0
      - name: Commit implementation, diagnostics, and remove executor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "Delegate full workspace validation to regression shards"
          git push origin HEAD:agent/ci-sharded-workspace-validation
