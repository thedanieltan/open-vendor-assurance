name: tmp-ci-sharded-workspace-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  generate-object:
    if: github.head_ref == 'agent/ci-sharded-workspace-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ci-sharded-workspace-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install repository
        run: pip install -e ".[dev]"
      - name: Generate final validation workflow
        run: |
          python .github/tmp_fix_ci_generator.py
          python .github/tmp_apply_ci_rationalization.py
      - name: Validate final workflow and contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          payload = yaml.safe_load(Path('.github/workflows/validate.yml').read_text(encoding='utf-8'))
          assert isinstance(payload, dict)
          assert 'workspace-plan' in payload['jobs']
          assert 'workspace-component-tests' in payload['jobs']
          assert 'workspace-affected-tests' in payload['jobs']
          PY
          pytest -q \
            tests/test_workflow_workspace_ci.py \
            tests/test_ci_readiness.py \
            tests/test_workflow_operating_model.py \
            tests/test_workflow_contracts.py \
            | tee .github/ci-rationalization-test.log
      - name: Create Git blob and tree metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          head_sha = os.environ['HEAD_SHA']
          api = f'https://api.github.com/repos/{repo}'

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'openva-ci-rationalization',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          commit = request('GET', f'/git/commits/{head_sha}')
          content = Path('.github/workflows/validate.yml').read_bytes()
          blob = request('POST', '/git/blobs', {
              'content': base64.b64encode(content).decode('ascii'),
              'encoding': 'base64',
          })
          metadata = {
              'head_sha': head_sha,
              'base_tree_sha': commit['tree']['sha'],
              'validate_blob_sha': blob['sha'],
          }
          Path('.github/ci-object-metadata.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(metadata, indent=2))
          PY
      - name: Upload validated Git object metadata
        uses: actions/upload-artifact@v6
        with:
          name: ci-sharded-workspace-git-object
          path: |
            .github/ci-object-metadata.json
            .github/ci-rationalization-test.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
