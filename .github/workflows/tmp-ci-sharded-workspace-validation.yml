name: tmp-ci-sharded-workspace-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  apply-scope-policy:
    if: github.head_ref == 'agent/ci-sharded-workspace-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ci-sharded-workspace-scope-policy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Grant WP-02E ownership-manifest scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('docs/operations/contracts/work-package-scope.yaml')
          text = path.read_text(encoding='utf-8')
          start = text.index('  WP-02E-SUPPLY-CHAIN:\n')
          end = text.index('  WP-02F-STAGING:\n', start)
          block = text[start:end]
          workflow_line = '      - .github/workflows/*\n'
          ownership_line = '      - .github/validation-ownership.yaml\n'
          if ownership_line in block:
              raise SystemExit('ownership manifest already granted')
          if block.count(workflow_line) != 1:
              raise SystemExit(f'unexpected workflow-line count in WP-02E: {block.count(workflow_line)}')
          block = block.replace(workflow_line, workflow_line + ownership_line, 1)
          updated = text[:start] + block + text[end:]
          yaml.safe_load(updated)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit scope policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/contracts/work-package-scope.yaml
          git commit -m "Grant workspace CI ownership-manifest scope"
          git push origin HEAD:agent/ci-sharded-workspace-scope-policy
