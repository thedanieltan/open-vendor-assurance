name: tmp-ci-sharded-workspace-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/ci-sharded-workspace-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ci-sharded-workspace-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install repository
        run: pip install -e ".[dev]"
      - name: Correct generator indentation
        run: python .github/tmp_fix_ci_generator.py
      - name: Apply bounded CI rationalization
        run: python .github/tmp_apply_ci_rationalization.py
      - name: Run focused workflow contracts
        run: |
          set +e
          pytest -q \
            tests/test_workflow_workspace_ci.py \
            tests/test_ci_readiness.py \
            tests/test_workflow_operating_model.py \
            tests/test_workflow_contracts.py \
            > .github/ci-rationalization-test.log 2>&1
          status=$?
          cat .github/ci-rationalization-test.log
          printf '\nexit_status=%s\n' "$status" >> .github/ci-rationalization-test.log
          exit 0
      - name: Upload generated implementation and diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: ci-sharded-workspace-validation
          path: |
            .github/workflows/validate.yml
            docs/operations/OPENVA_WORKSPACE.md
            tests/test_workflow_workspace_ci.py
            .github/ci-rationalization-test.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
