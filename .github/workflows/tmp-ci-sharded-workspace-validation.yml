name: tmp-ci-sharded-workspace-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  apply-scope-policy:
    if: github.head_ref == 'agent/ci-sharded-workspace-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ci-sharded-workspace-scope-policy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Grant WP-02E ownership-manifest scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('docs/operations/contracts/work-package-scope.yaml')
          text = path.read_text(encoding='utf-8')
          anchor = "              - .github/workflows/*\n              - docs/operations/*\n"
          replacement = (
              "              - .github/workflows/*\n"
              "              - .github/validation-ownership.yaml\n"
              "              - docs/operations/*\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'unexpected WP-02E anchor count: {text.count(anchor)}')
          updated = text.replace(anchor, replacement, 1)
          yaml.safe_load(updated)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit scope policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/contracts/work-package-scope.yaml
          git commit -m "Grant workspace CI ownership-manifest scope"
          git push origin HEAD:agent/ci-sharded-workspace-scope-policy
