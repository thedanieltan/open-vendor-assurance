name: tmp-ci-sharded-workspace-validation

on:
  push:
    branches:
      - agent/ci-sharded-workspace-validation

permissions:
  contents: write

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install repository
        run: pip install -e ".[dev]"
      - name: Apply bounded CI rationalization
        run: python .github/tmp_apply_ci_rationalization.py
      - name: Validate focused workflow contracts
        run: >-
          pytest -q
          tests/test_workflow_workspace_ci.py
          tests/test_ci_readiness.py
          tests/test_workflow_operating_model.py
          tests/test_workflow_contracts.py
      - name: Commit implementation and remove executor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate.yml docs/operations/OPENVA_WORKSPACE.md tests/test_workflow_workspace_ci.py
          git add -u .github/tmp_apply_ci_rationalization.py .github/workflows/tmp-ci-sharded-workspace-validation.yml
          git commit -m "Delegate full workspace validation to regression shards"
          git push origin HEAD:agent/ci-sharded-workspace-validation
