name: tmp-ci-sharded-workspace-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  apply-scope-policy:
    if: github.head_ref == 'agent/ci-sharded-workspace-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ci-sharded-workspace-scope-policy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: pip install "pyyaml>=6"
      - name: Grant WP-02E ownership-manifest scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('docs/operations/contracts/work-package-scope.yaml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line.strip() == 'WP-02E-SUPPLY-CHAIN:')
          end = next(
              i for i in range(start + 1, len(lines))
              if lines[i].startswith('  WP-')
          )
          block = lines[start:end]
          if any(line.strip() == '- .github/validation-ownership.yaml' for line in block):
              raise SystemExit('ownership manifest already granted')
          matches = [i for i, line in enumerate(block) if line.strip() == '- .github/workflows/*']
          if len(matches) != 1:
              raise SystemExit(f'unexpected workflow-line count in WP-02E: {len(matches)}')
          index = matches[0]
          indentation = block[index][: len(block[index]) - len(block[index].lstrip())]
          newline = '\r\n' if block[index].endswith('\r\n') else '\n'
          block.insert(index + 1, f'{indentation}- .github/validation-ownership.yaml{newline}')
          updated = ''.join(lines[:start] + block + lines[end:])
          yaml.safe_load(updated)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit scope policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/contracts/work-package-scope.yaml
          git commit -m "Grant workspace CI ownership-manifest scope"
          git push origin HEAD:agent/ci-sharded-workspace-scope-policy
