name: tmp-ci-sharded-workspace-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tmp-ci-sharded-workspace-validation
  cancel-in-progress: true

jobs:
  apply-scope-policy:
    if: github.head_ref == 'agent/ci-sharded-workspace-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ci-sharded-workspace-scope-policy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Grant WP-02E ownership-manifest scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('docs/operations/contracts/work-package-scope.yaml')
          text = path.read_text(encoding='utf-8')
          anchor = '''  WP-02E-SUPPLY-CHAIN:
            description: Deployment artifact and supply-chain slice.
            slice_id: WP-02E-artifact-and-supply-chain
            depends_on:
              - WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP
            allowed_paths:
              - services/openva_match_service/*
              - .github/workflows/*
          '''
          replacement = '''  WP-02E-SUPPLY-CHAIN:
            description: Deployment artifact and supply-chain slice.
            slice_id: WP-02E-artifact-and-supply-chain
            depends_on:
              - WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP
            allowed_paths:
              - services/openva_match_service/*
              - .github/workflows/*
              - .github/validation-ownership.yaml
          '''
          if anchor not in text:
              raise SystemExit('WP-02E scope anchor not found')
          updated = text.replace(anchor, replacement, 1)
          yaml.safe_load(updated)
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit scope policy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/contracts/work-package-scope.yaml
          git commit -m "Grant workspace CI ownership-manifest scope"
          git push origin HEAD:agent/ci-sharded-workspace-scope-policy
