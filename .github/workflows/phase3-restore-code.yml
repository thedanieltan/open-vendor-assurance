name: phase3-restore-code

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase3-restore-code
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore exact generated blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source_commit = "4bd9674329703bf4bfde20eae28fd75fe23ca6cb"
          raw = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/phase3-materialize.yml"],
              text=True,
          )

          def extract(start_marker: str, end_marker: str) -> str:
              start = raw.index(start_marker) + len(start_marker)
              end = raw.index(end_marker, start)
              return raw[start:end].rstrip() + "\n"

          discovery_block = extract(
              "          cat >> tools/openva/site_discovery.py <<'PY'\n",
              "\nPY\n\n      - name: Add discoverability acceptance tests",
          )
          test_block = extract(
              "          cat >> tests/test_discoverability.py <<'PY'\n",
              "\nPY\n\n          git rm .github/workflows/phase3-materialize.yml",
          )

          discovery_path = Path("tools/openva/site_discovery.py")
          discovery = discovery_path.read_text(encoding="utf-8")
          marker = "\n\n# Phase 3 SEO, answer-engine, and generative-engine discovery surface."
          discovery = discovery.split(marker, 1)[0].rstrip() + "\n\n" + discovery_block
          discovery_path.write_text(discovery, encoding="utf-8")

          tests_path = Path("tests/test_discoverability.py")
          tests = tests_path.read_text(encoding="utf-8")
          marker = "\n\n# Phase 3 SEO, answer-engine, and generative-engine acceptance."
          tests = tests.split(marker, 1)[0].rstrip() + "\n\n" + test_block
          tests_path.write_text(tests, encoding="utf-8")
          PY
          python -m py_compile tools/openva/site_discovery.py tests/test_discoverability.py
          git rm .github/workflows/phase3-restore-code.yml
      - name: Commit restored implementation
        run: |
          git config user.name 'openva-publication-maintainer'
          git config user.email 'openva-publication-maintainer@users.noreply.github.com'
          git add tools/openva/site_discovery.py tests/test_discoverability.py
          git commit -m 'Site: restore syntax-correct Phase 3 discovery implementation'
          git push origin HEAD:site/seo-aeo-geo-phase3
