name: pr-scope-guard

# Enforce the PR work-package scope guard (docs/operations/pr-scope-guard.md): every
# changed path must fall within the PR's declared work package. The guard CODE and
# MANIFEST are taken from the BASE revision (trusted), so a PR cannot weaken its own
# gate or expand its own allowlist in the same change (the new policy only applies to
# later PRs, after human review). The PR declares its work package with a single
# `Work-Package: WP-...` line in its body; zero/multiple/unknown fails closed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-scope-guard:
    name: pr-scope-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install "pyyaml>=6"
      - name: Run scope guard from the trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Trusted policy: run the guard + manifest exactly as they exist at the base,
          # so the PR under evaluation cannot modify the policy that judges it.
          git worktree add /tmp/base-guard "$BASE_SHA"
          if [ ! -f /tmp/base-guard/tools/openva/pr_scope_guard.py ]; then
            echo "scope guard not present at the base revision yet; skipping (self-bootstrap)."
            exit 0
          fi
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-paths.txt
          echo "Changed paths:"; sed 's/^/  /' /tmp/changed-paths.txt
          cd /tmp/base-guard
          python -m tools.openva.pr_scope_guard \
            --declaration-file /tmp/pr-body.txt \
            --changed-paths-file /tmp/changed-paths.txt
