name: source-refinement-queue

on:
  workflow_dispatch:
    inputs:
      observation_report_json:
        description: "Path to observation report JSON in the checked-out repository"
        required: false
        default: "reports/observation-report.json"
        type: string

permissions:
  contents: read

concurrency:
  group: source-refinement-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-refinement-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Check observation report path
        run: test -f "${{ inputs.observation_report_json }}"
      - name: Generate source refinement queue
        run: |
          mkdir -p reports
          python -m tools.openva.source_refinement_queue "${{ inputs.observation_report_json }}" \
            --markdown-out reports/source-refinement-queue.md \
            --json-out reports/source-refinement-queue.json
      - name: Build source refinement CSV export
        run: |
          python - <<'PY'
          import csv
          import json

          report = json.load(open("reports/source-refinement-queue.json", encoding="utf-8"))
          with open("reports/source-refinement-queue.csv", "w", encoding="utf-8", newline="") as handle:
              fields = [
                  "vendor_id",
                  "source_id",
                  "result",
                  "http_status",
                  "final_url",
                  "observed_at",
                  "suggested_action",
                  "notes",
              ]
              writer = csv.DictWriter(handle, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              for item in report.get("items", []):
                  writer.writerow(item)
          PY
      - name: Print source refinement queue
        run: cat reports/source-refinement-queue.md
      - name: Upload source refinement queue artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openva-source-refinement-queue
          path: |
            reports/source-refinement-queue.md
            reports/source-refinement-queue.json
            reports/source-refinement-queue.csv
          if-no-files-found: error
