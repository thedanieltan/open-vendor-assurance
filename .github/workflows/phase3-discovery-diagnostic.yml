name: phase3-discovery-diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: phase3-discovery-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Run discoverability tests
        id: tests
        shell: bash
        run: |
          set +e
          pytest -q tests/test_discoverability.py -vv --tb=short > phase3-discovery.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 220 phase3-discovery.log > phase3-discovery-tail.log
          cat phase3-discovery-tail.log
          exit 0
      - name: Post diagnostic to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- phase3-discovery-diagnostic -->'
            echo '### Phase 3 focused discovery diagnostic'
            echo '```text'
            cat phase3-discovery-tail.log
            echo '```'
          } > phase3-discovery-comment.md
          gh pr comment 660 --body-file phase3-discovery-comment.md
      - name: Enforce result
        run: exit "${{ steps.tests.outputs.exit_code }}"
