name: tmp-pr716-full-suite-diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/pr716-full-suite-diagnostic

permissions:
  contents: write

concurrency:
  group: tmp-pr716-main-comparison
  cancel-in-progress: true

jobs:
  compare-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Run failing tests against current main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          pip install -e ".[dev]"
          pip install -e adapters/python/openva_pack_reader
          pip install -e adapters/python/openva_vendor_inventory_matcher

          set +e
          python -m pytest -q \
            tests/test_openva_vendor_inventory_matcher.py::test_google_domain_collision_matches_specific_subdomain \
            > "$RUNNER_TEMP/matcher.txt" 2>&1
          MATCHER_STATUS=$?
          python -m pytest -q \
            tests/test_discoverability.py::test_every_vendor_page_retains_original_source_urls \
            > "$RUNNER_TEMP/discoverability.txt" 2>&1
          DISCOVERABILITY_STATUS=$?
          set -e

          git checkout agent/pr716-full-suite-diagnostic
          {
            echo "PR #716 failing-test comparison against current main"
            echo "main_commit=$(git rev-parse origin/main)"
            echo
            echo "===== matcher status=$MATCHER_STATUS ====="
            cat "$RUNNER_TEMP/matcher.txt"
            echo
            echo "===== discoverability status=$DISCOVERABILITY_STATUS ====="
            cat "$RUNNER_TEMP/discoverability.txt"
          } > tmp-pr716-main-comparison.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-pr716-main-comparison.txt
          git commit -m "Record PR 716 failing-test comparison against main"
          git push origin HEAD:agent/pr716-full-suite-diagnostic

          if [ "$MATCHER_STATUS" -ne 0 ] || [ "$DISCOVERABILITY_STATUS" -ne 0 ]; then
            exit 1
          fi
