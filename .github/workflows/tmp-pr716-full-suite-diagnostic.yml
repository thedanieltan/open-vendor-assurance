name: tmp-pr716-full-suite-diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/pr716-full-suite-diagnostic

permissions:
  contents: write

concurrency:
  group: tmp-pr716-full-suite-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install workspace planner
        run: pip install -e ".[dev]"
      - name: Build current affected-test plan
        run: |
          git fetch origin main
          python -m tools.openva.workspace validate
          python -m tools.openva.workspace plan \
            --base-ref origin/main \
            --head-ref HEAD \
            --pretty > "$RUNNER_TEMP/workspace-plan.json"
          cat "$RUNNER_TEMP/workspace-plan.json"
      - name: Install affected local dependency chain
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(Path(os.environ['RUNNER_TEMP'], 'workspace-plan.json').read_text(encoding='utf-8'))
          for path in plan['install_paths']:
              target = f"{path}[dev]" if path in {'services/openva_match_service', 'integrations/mcp/openva_mcp'} else path
              subprocess.run([sys.executable, '-m', 'pip', 'install', '-e', target], check=True)
          PY
      - name: Run exact affected tests with first-failure stop
        run: |
          set +e
          python - <<'PY' > "$RUNNER_TEMP/pytest-output.txt" 2>&1
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          plan = json.loads(Path(os.environ['RUNNER_TEMP'], 'workspace-plan.json').read_text(encoding='utf-8'))
          command = [sys.executable, '-m', 'pytest', '-q', '--maxfail=1', *plan['test_paths']]
          raise SystemExit(subprocess.run(command).returncode)
          PY
          STATUS=$?
          set -e
          {
            echo "PR #716 exact workspace diagnostic"
            echo
            echo "Workspace plan:"
            cat "$RUNNER_TEMP/workspace-plan.json"
            echo
            echo "Pytest output:"
            cat "$RUNNER_TEMP/pytest-output.txt"
            echo
            echo "exit_status=$STATUS"
          } > tmp-pr716-full-suite-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-pr716-full-suite-diagnostic.txt
          git commit -m "Record PR 716 full-suite diagnostic"
          git push origin HEAD:agent/pr716-full-suite-diagnostic
          exit "$STATUS"
