name: source-verification-report

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional number of sources to verify"
        required: false
        type: string
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: source-verification-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-verification-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build network source verification report
        run: |
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_verification verify --limit "$LIMIT" --output source-verification-report.json
          else
            python -m tools.openva.source_verification verify --output source-verification-report.json
          fi
      - name: Print source verification report summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open('source-verification-report.json', encoding='utf-8'))
          print(json.dumps(report['summary'], indent=2, sort_keys=True))
          print(json.dumps(report['breakdowns'].get('verification_statuses', {}), indent=2, sort_keys=True))
          PY
      - name: Upload source verification report
        uses: actions/upload-artifact@v4
        with:
          name: openva-source-verification-report
          path: source-verification-report.json
          if-no-files-found: error
