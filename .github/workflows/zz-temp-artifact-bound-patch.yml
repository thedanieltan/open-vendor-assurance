name: temporary-artifact-bound-promotion-patch

on:
  push:
    branches:
      - agent/catalog-growth-artifact-bound-promotion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/catalog-growth-artifact-bound-promotion
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact artifact-bound promotion patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def insert_before(path: str, marker: str, addition: str, count: int = 1) -> None:
              replace_exact(path, marker, addition + marker, count)

          candidate = ".github/workflows/candidate-promotion-pr.yml"
          bridge = ".github/workflows/catalog-growth-promotion-bridge.yml"
          module = "tools/openva/discovery_promotion_bridge.py"
          module_test = "tests/test_discovery_promotion_bridge.py"

          replace_exact(
              candidate,
              '        description: "reviewed-path, strict-growth-latest generation, strict-growth-shortlist generation, or sitemap-source-latest generation"\n',
              '        description: "reviewed-path, strict-growth-latest generation, strict-growth-artifact binding, strict-growth-shortlist generation, or sitemap-source-latest generation"\n',
          )
          replace_exact(
              candidate,
              '          - strict-growth-latest\n          - strict-growth-shortlist\n',
              '          - strict-growth-latest\n          - strict-growth-artifact\n          - strict-growth-shortlist\n',
          )
          replace_exact(
              candidate,
              '          - rollback\n      rollback_decision_id:\n',
              '''          - rollback
      discovery_run_id:
        description: "strict-growth-artifact mode: exact successful catalog-growth-discovery run id."
        required: false
        type: string
        default: ""
      discovery_artifact_id:
        description: "strict-growth-artifact mode: exact discovery artifact id selected by the bridge."
        required: false
        type: string
        default: ""
      discovery_plan_digest:
        description: "strict-growth-artifact mode: SHA-256 of the source strict-growth plan in that artifact."
        required: false
        type: string
        default: ""
      rollback_decision_id:
''',
          )
          replace_exact(
              candidate,
              'permissions:\n  contents: write\n  pull-requests: write\n',
              'permissions:\n  actions: read\n  contents: write\n  pull-requests: write\n',
          )
          replace_exact(
              candidate,
              'contains(fromJson(\'["reviewed-path","strict-growth-latest","strict-growth-shortlist","sitemap-source-latest","machine-provisional-from-queue"]\')',
              'contains(fromJson(\'["reviewed-path","strict-growth-latest","strict-growth-artifact","strict-growth-shortlist","sitemap-source-latest","machine-provisional-from-queue"]\')',
          )
          replace_exact(
              candidate,
              '      PR_TITLE: "${{ inputs.pr_title || \'Catalog: apply reviewed candidate source promotion\' }}"\n',
              '''      PR_TITLE: "${{ inputs.pr_title || 'Catalog: apply reviewed candidate source promotion' }}"
      SOURCE_DISCOVERY_RUN_ID: "${{ inputs.discovery_run_id || '' }}"
      SOURCE_DISCOVERY_ARTIFACT_ID: "${{ inputs.discovery_artifact_id || '' }}"
      SOURCE_DISCOVERY_PLAN_DIGEST: "${{ inputs.discovery_plan_digest || '' }}"
''',
          )

          artifact_step = r'''      - name: Load artifact-bound strict-growth evidence
        if: env.PROMOTION_PLAN_MODE == 'strict-growth-artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SOURCE_DISCOVERY_RUN_ID" in ''|*[!0-9]*) echo "::error::discovery_run_id must be numeric"; exit 1 ;; esac
          case "$SOURCE_DISCOVERY_ARTIFACT_ID" in ''|*[!0-9]*) echo "::error::discovery_artifact_id must be numeric"; exit 1 ;; esac
          if ! printf '%s' "$SOURCE_DISCOVERY_PLAN_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::discovery_plan_digest must be sha256:<64 lowercase hex>"
            exit 1
          fi

          META="$(gh run view "$SOURCE_DISCOVERY_RUN_ID" --json attempt,conclusion,event,headBranch,headSha,workflowName)"
          DISCOVERY_WORKFLOW="$(printf '%s' "$META" | jq -r '.workflowName // ""')"
          DISCOVERY_CONCLUSION="$(printf '%s' "$META" | jq -r '.conclusion // ""')"
          DISCOVERY_EVENT="$(printf '%s' "$META" | jq -r '.event // ""')"
          DISCOVERY_BRANCH="$(printf '%s' "$META" | jq -r '.headBranch // ""')"
          DISCOVERY_HEAD_SHA="$(printf '%s' "$META" | jq -r '.headSha // ""')"
          DISCOVERY_ATTEMPT="$(printf '%s' "$META" | jq -r '.attempt // ""')"
          [ "$DISCOVERY_WORKFLOW" = "catalog-growth-discovery" ] || { echo "::error::foreign discovery workflow"; exit 1; }
          [ "$DISCOVERY_CONCLUSION" = "success" ] || { echo "::error::discovery run did not succeed"; exit 1; }
          [ "$DISCOVERY_EVENT" = "schedule" ] || { echo "::error::artifact-bound automatic promotion requires a scheduled discovery run"; exit 1; }
          [ "$DISCOVERY_BRANCH" = "main" ] || { echo "::error::discovery run was not on main"; exit 1; }
          case "$DISCOVERY_ATTEMPT" in ''|*[!0-9]*) echo "::error::invalid discovery attempt"; exit 1 ;; esac
          if ! printf '%s' "$DISCOVERY_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::invalid discovery head SHA"
            exit 1
          fi

          git fetch origin main
          git merge-base --is-ancestor "$DISCOVERY_HEAD_SHA" origin/main || {
            echo "::error::discovery head is no longer an ancestor of current main"
            exit 1
          }

          ARTIFACT_META="$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_DISCOVERY_ARTIFACT_ID}")"
          ARTIFACT_NAME="$(printf '%s' "$ARTIFACT_META" | jq -r '.name // ""')"
          ARTIFACT_EXPIRED="$(printf '%s' "$ARTIFACT_META" | jq -r '.expired // true')"
          ARTIFACT_RUN_ID="$(printf '%s' "$ARTIFACT_META" | jq -r '.workflow_run.id // 0')"
          ARTIFACT_HEAD_SHA="$(printf '%s' "$ARTIFACT_META" | jq -r '.workflow_run.head_sha // ""')"
          [ "$ARTIFACT_NAME" = "openva-catalog-growth-discovery-artifacts" ] || { echo "::error::unexpected discovery artifact name"; exit 1; }
          [ "$ARTIFACT_EXPIRED" = "false" ] || { echo "::error::discovery artifact is expired"; exit 1; }
          [ "$ARTIFACT_RUN_ID" = "$SOURCE_DISCOVERY_RUN_ID" ] || { echo "::error::artifact is not bound to the requested discovery run"; exit 1; }
          [ "$ARTIFACT_HEAD_SHA" = "$DISCOVERY_HEAD_SHA" ] || { echo "::error::artifact head SHA does not match discovery run"; exit 1; }

          ARTIFACT_DIR="$RUNNER_TEMP/artifact-bound-discovery"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_DISCOVERY_ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/artifact-bound-discovery.zip"
          unzip -q "$RUNNER_TEMP/artifact-bound-discovery.zip" -d "$ARTIFACT_DIR"
          for REQUIRED in \
            strict-growth-promotion-plan.json \
            vendor-candidate-discovery-report.json \
            vendor-candidate-source-discovery-report.json \
            catalog-growth-eligibility-report.json; do
            test -f "$ARTIFACT_DIR/$REQUIRED" || { echo "::error::discovery artifact missing $REQUIRED"; exit 1; }
          done

          ACTUAL_PLAN_DIGEST="sha256:$(sha256sum "$ARTIFACT_DIR/strict-growth-promotion-plan.json" | awk '{print $1}')"
          [ "$ACTUAL_PLAN_DIGEST" = "$SOURCE_DISCOVERY_PLAN_DIGEST" ] || {
            echo "::error::source strict-growth plan digest mismatch"
            exit 1
          }
          SOURCE_EVIDENCE_GENERATED_AT="$(jq -r '.generated_at // empty' "$ARTIFACT_DIR/catalog-growth-eligibility-report.json")"
          [ -n "$SOURCE_EVIDENCE_GENERATED_AT" ] || { echo "::error::source eligibility timestamp missing"; exit 1; }

          cp "$ARTIFACT_DIR/strict-growth-promotion-plan.json" strict-growth-source-plan.json
          cp "$ARTIFACT_DIR/catalog-growth-eligibility-report.json" catalog-growth-source-eligibility-report.json
          cp "$ARTIFACT_DIR/vendor-candidate-discovery-report.json" vendor-candidate-discovery-report.json
          cp "$ARTIFACT_DIR/vendor-candidate-source-discovery-report.json" vendor-candidate-source-discovery-report.json

          python -m tools.openva.catalog_growth_eligibility classify \
            --vendor-candidates vendor-candidate-discovery-report.json \
            --source-discovery vendor-candidate-source-discovery-report.json \
            --output-json catalog-growth-eligibility-report.json \
            --output-strict catalog-growth-strict-promotions.json \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.sha }}"

          export SOURCE_EVIDENCE_GENERATED_AT SOURCE_DISCOVERY_RUN_ID SOURCE_DISCOVERY_ARTIFACT_ID SOURCE_DISCOVERY_PLAN_DIGEST
          python - <<'PY_EVIDENCE'
          import json
          import os
          from pathlib import Path

          source_time = os.environ["SOURCE_EVIDENCE_GENERATED_AT"]
          binding = {
              "source_discovery_run_id": os.environ["SOURCE_DISCOVERY_RUN_ID"],
              "source_discovery_artifact_id": os.environ["SOURCE_DISCOVERY_ARTIFACT_ID"],
              "source_plan_digest": os.environ["SOURCE_DISCOVERY_PLAN_DIGEST"],
          }
          for name in ("catalog-growth-eligibility-report.json", "catalog-growth-strict-promotions.json"):
              path = Path(name)
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["generated_at"] = source_time
              payload["artifact_bound_source"] = binding
              path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY_EVIDENCE

          mkdir -p reports
          python -m tools.openva.catalog_growth_backlog build \
            --eligibility-report catalog-growth-eligibility-report.json \
            --output-json catalog-growth-backlog-report.json \
            --output-csv reports/catalog-growth-backlog.csv \
            --output-md reports/catalog-growth-backlog-summary.md
          python -m tools.openva.strict_growth_shortlist build \
            --eligibility-report catalog-growth-eligibility-report.json \
            --backlog-report catalog-growth-backlog-report.json \
            --output-json strict-growth-shortlist.json \
            --output-csv reports/strict-growth-shortlist.csv \
            --output-md reports/strict-growth-shortlist-summary.md \
            --max-vendors 5 \
            --max-actions "$MAX_PROMOTION_ACTIONS_PER_PR"
          python -m tools.openva.strict_growth_shortlist plan \
            --shortlist strict-growth-shortlist.json \
            --output strict-growth-promotion-plan.json \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.sha }}" \
            --max-actions "$MAX_PROMOTION_ACTIONS_PER_PR"
          python -m tools.openva.materialization_envelope attach \
            --promotion-plan strict-growth-promotion-plan.json \
            --vendor-candidate-report vendor-candidate-discovery-report.json \
            --source-discovery-report vendor-candidate-source-discovery-report.json \
            --eligibility-report catalog-growth-eligibility-report.json \
            --output strict-growth-promotion-plan.json \
            --discovery-run-id "${SOURCE_DISCOVERY_RUN_ID}-${DISCOVERY_ATTEMPT}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-attempt "${{ github.run_attempt }}" \
            --source-commit-sha "$DISCOVERY_HEAD_SHA" \
            --base-sha "${{ github.sha }}"

          {
            echo "### Artifact-bound strict-growth source"
            echo "- Discovery run: \`$SOURCE_DISCOVERY_RUN_ID\` attempt \`$DISCOVERY_ATTEMPT\`"
            echo "- Artifact id: \`$SOURCE_DISCOVERY_ARTIFACT_ID\`"
            echo "- Source plan digest: \`$SOURCE_DISCOVERY_PLAN_DIGEST\`"
            echo "- Source evidence timestamp: \`$SOURCE_EVIDENCE_GENERATED_AT\`"
            echo "- Revalidated against main: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
'''
          insert_before(candidate, '      - name: Regenerate strict-growth promotion plan\n', artifact_step)

          replace_exact(
              candidate,
              '            reviewed-path|strict-growth-latest|strict-growth-shortlist|sitemap-source-latest|machine-provisional-from-queue) ;;\n',
              '            reviewed-path|strict-growth-latest|strict-growth-artifact|strict-growth-shortlist|sitemap-source-latest|machine-provisional-from-queue) ;;\n',
          )
          replace_exact(
              candidate,
              '            *) echo "promotion_plan_mode must be reviewed-path, strict-growth-latest, strict-growth-shortlist, sitemap-source-latest, or machine-provisional-from-queue" >&2; exit 1 ;;\n',
              '            *) echo "promotion_plan_mode must be reviewed-path, strict-growth-latest, strict-growth-artifact, strict-growth-shortlist, sitemap-source-latest, or machine-provisional-from-queue" >&2; exit 1 ;;\n',
          )
          replace_exact(
              candidate,
              '          if [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ] || [ "$PROMOTION_PLAN_MODE" = "machine-provisional-from-queue" ]; then\n',
              '          if [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-artifact" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ] || [ "$PROMOTION_PLAN_MODE" = "machine-provisional-from-queue" ]; then\n',
          )
          replace_exact(
              candidate,
              '            if { [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ] || [ "$PROMOTION_PLAN_MODE" = "sitemap-source-latest" ] || [ "$PROMOTION_PLAN_MODE" = "machine-provisional-from-queue" ]; } && [ "$PLAN_ACTION_COUNT" = "0" ]; then\n',
              '            if { [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-artifact" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ] || [ "$PROMOTION_PLAN_MODE" = "sitemap-source-latest" ] || [ "$PROMOTION_PLAN_MODE" = "machine-provisional-from-queue" ]; } && [ "$PLAN_ACTION_COUNT" = "0" ]; then\n',
          )
          replace_exact(
              candidate,
              "        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')\n",
              "        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-artifact' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')\n",
              count=2,
          )
          replace_exact(
              candidate,
              "        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')\n",
              "        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-artifact' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')\n",
          )
          insert_before(
              candidate,
              "          if os.environ.get('ELIGIBILITY_REPORT_PATH'):\n",
              '''          if os.environ.get('SOURCE_DISCOVERY_RUN_ID'):
              insert_at = lines.index('## Counts') - 1
              lines[insert_at:insert_at] = [
                  f"- Source discovery run: `{os.environ['SOURCE_DISCOVERY_RUN_ID']}`",
                  f"- Source discovery artifact: `{os.environ['SOURCE_DISCOVERY_ARTIFACT_ID']}`",
                  f"- Source discovery plan SHA-256: `{os.environ['SOURCE_DISCOVERY_PLAN_DIGEST']}`",
              ]
''',
          )
          insert_before(
              candidate,
              '      - name: Build catalog promotion failure routing input\n',
              '''      - name: Upload artifact-bound source evidence
        if: always() && env.PROMOTION_PLAN_MODE == 'strict-growth-artifact'
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-pr-artifact-bound-source
          path: |
            strict-growth-source-plan.json
            catalog-growth-source-eligibility-report.json
            vendor-candidate-discovery-report.json
            vendor-candidate-source-discovery-report.json
            catalog-growth-backlog-report.json
            strict-growth-shortlist.json
          if-no-files-found: warn
''',
          )

          replace_exact(
              bridge,
              '#   --name openva-catalog-growth-discovery-artifacts\n',
              '#   --name openva-catalog-growth-discovery-artifacts\n#   strict-growth-latest\n',
          )
          replace_exact(
              bridge,
              '# strict-growth-latest mode. If that mutation workflow is already queued/in progress,\n',
              '# strict-growth-artifact mode, binding it to this exact run/artifact/plan digest. If that mutation workflow is already queued/in progress,\n',
          )
          replace_exact(
              bridge,
              '# not final merge authority: candidate-promotion-pr.yml regenerates and re-validates\n# current evidence and remains the sole catalog write authority, gated by its own\n',
              '# not final merge authority: candidate-promotion-pr.yml reclassifies the captured source\n# evidence against current main, rebuilds the bounded shortlist, and remains the sole catalog write authority, gated by its own\n',
          )
          replace_exact(
              bridge,
              '          MODE: ${{ steps.decide.outputs.mode }}\n          CAP: ${{ steps.decide.outputs.cap }}\n',
              '          MODE: ${{ steps.decide.outputs.mode }}\n          CAP: ${{ steps.decide.outputs.cap }}\n          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}\n          PLAN_DIGEST: ${{ steps.artifact.outputs.plan_digest }}\n',
          )
          replace_exact(
              bridge,
              '          ARGS=(-f "promotion_plan_mode=$MODE" -f "pr_title=Catalog: apply reviewed candidate source promotion")\n',
              '          ARGS=(-f "promotion_plan_mode=$MODE" -f "pr_title=Catalog: apply reviewed candidate source promotion" -f "discovery_run_id=$RUN_ID" -f "discovery_artifact_id=$ARTIFACT_ID" -f "discovery_plan_digest=$PLAN_DIGEST")\n',
          )
          replace_exact(
              bridge,
              '          REQUESTED_AT: ${{ steps.dispatch.outputs.requested_at }}\n',
              '          REQUESTED_AT: ${{ steps.dispatch.outputs.requested_at }}\n          SOURCE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}\n          SOURCE_PLAN_DIGEST: ${{ steps.artifact.outputs.plan_digest }}\n',
          )
          replace_exact(
              bridge,
              '              "source_discovery_run_id": os.environ["RUN_ID"],\n              "downstream_candidate_promotion_run_id": os.environ["DOWNSTREAM_RUN_ID"],\n',
              '              "source_discovery_run_id": os.environ["RUN_ID"],\n              "source_discovery_artifact_id": os.environ["SOURCE_ARTIFACT_ID"],\n              "source_discovery_plan_digest": os.environ["SOURCE_PLAN_DIGEST"],\n              "downstream_candidate_promotion_run_id": os.environ["DOWNSTREAM_RUN_ID"],\n',
          )
          replace_exact(
              bridge,
              '            echo "Source discovery run: \\`$RUN_ID\\`"\n            echo "Candidate-promotion run: \\`$DOWNSTREAM_RUN_ID\\`"\n',
              '            echo "Source discovery run: \\`$RUN_ID\\`"\n            echo "Source artifact: \\`$SOURCE_ARTIFACT_ID\\`"\n            echo "Source plan digest: \\`$SOURCE_PLAN_DIGEST\\`"\n            echo "Candidate-promotion run: \\`$DOWNSTREAM_RUN_ID\\`"\n',
          )

          replace_exact(module, '``strict-growth-latest`` mode.\n', '``strict-growth-artifact`` mode.\n')
          replace_exact(
              module,
              'The discovery plan is a dispatch **signal** only:\nthe dispatched promotion workflow regenerates and re-validates current evidence and\nremains the sole catalog write authority.\n',
              'The discovery plan is a dispatch **signal** rather than merge authority. The\ndispatched promotion workflow binds the exact discovery artifact, reclassifies its\ncaptured source evidence against current main, rebuilds the bounded shortlist, and\nremains the sole catalog write authority.\n',
          )
          replace_exact(module, 'DISPATCH_MODE = "strict-growth-latest"\n', 'DISPATCH_MODE = "strict-growth-artifact"\n')

          replace_exact(module_test, 'strict-growth-latest mode; this module never opens a PR or writes catalog state.\n', 'strict-growth-artifact mode; this module never opens a PR or writes catalog state.\n')
          replace_exact(module_test, 'assert decision["mode"] == DISPATCH_MODE == "strict-growth-latest"\n', 'assert decision["mode"] == DISPATCH_MODE == "strict-growth-artifact"\n')
          replace_exact(module_test, 'assert decision["mode"] == "strict-growth-latest"\n', 'assert decision["mode"] == "strict-growth-artifact"\n')

          focused = Path("tests/test_catalog_growth_artifact_bound_promotion.py")
          focused.write_text(r'''from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]
CANDIDATE = ROOT / ".github" / "workflows" / "candidate-promotion-pr.yml"
BRIDGE = ROOT / ".github" / "workflows" / "catalog-growth-promotion-bridge.yml"


def candidate_text() -> str:
    return CANDIDATE.read_text(encoding="utf-8")


def bridge_text() -> str:
    return BRIDGE.read_text(encoding="utf-8")


def artifact_step() -> str:
    body = candidate_text()
    start = body.index("- name: Load artifact-bound strict-growth evidence")
    end = body.index("- name: Regenerate strict-growth promotion plan", start)
    return body[start:end]


def test_artifact_bound_mode_is_explicit_and_has_read_only_actions_access():
    body = candidate_text()
    assert "- strict-growth-artifact" in body
    assert "actions: read" in body
    assert "SOURCE_DISCOVERY_RUN_ID" in body
    assert "SOURCE_DISCOVERY_ARTIFACT_ID" in body
    assert "SOURCE_DISCOVERY_PLAN_DIGEST" in body


def test_artifact_bound_mode_binds_exact_run_artifact_and_plan_digest():
    step = artifact_step()
    assert "gh run view \"$SOURCE_DISCOVERY_RUN_ID\"" in step
    assert "actions/artifacts/${SOURCE_DISCOVERY_ARTIFACT_ID}" in step
    assert '.workflow_run.id // 0' in step
    assert 'ACTUAL_PLAN_DIGEST="sha256:' in step
    assert '[ "$ACTUAL_PLAN_DIGEST" = "$SOURCE_DISCOVERY_PLAN_DIGEST" ]' in step
    assert 'DISCOVERY_EVENT" = "schedule"' in step
    assert 'DISCOVERY_BRANCH" = "main"' in step
    assert "git merge-base --is-ancestor" in step


def test_artifact_bound_mode_does_not_repeat_network_discovery():
    step = artifact_step()
    assert "source_discovery discover-vendor-candidates" not in step
    assert "vendor_candidate_discovery discover" not in step
    assert "catalog_growth_eligibility classify" in step
    assert "catalog_growth_backlog build" in step
    assert "strict_growth_shortlist build" in step
    assert "--max-vendors 5" in step
    assert "strict_growth_shortlist plan" in step


def test_artifact_bound_revalidation_preserves_original_evidence_clock():
    step = artifact_step()
    assert "SOURCE_EVIDENCE_GENERATED_AT" in step
    assert 'payload["generated_at"] = source_time' in step
    assert 'payload["artifact_bound_source"] = binding' in step


def test_existing_strict_growth_and_source_preflight_gates_cover_artifact_mode():
    body = candidate_text()
    assert "env.PROMOTION_PLAN_MODE == 'strict-growth-artifact'" in body
    assert "strict_growth_automerge check-plan" in body
    assert "source_preflight check-changed-sources" in body
    assert "release_gates check --profile pr" in body


def test_bridge_dispatches_exact_artifact_binding_to_single_mutation_workflow():
    body = bridge_text()
    assert 'promotion_plan_mode=$MODE' in body
    assert 'discovery_run_id=$RUN_ID' in body
    assert 'discovery_artifact_id=$ARTIFACT_ID' in body
    assert 'discovery_plan_digest=$PLAN_DIGEST' in body
    assert "candidate-promotion-pr.yml" in body
    assert "gh pr create" not in body
    assert "git push" not in body


def test_bridge_receipt_records_source_binding():
    body = bridge_text()
    assert '"source_discovery_artifact_id": os.environ["SOURCE_ARTIFACT_ID"]' in body
    assert '"source_discovery_plan_digest": os.environ["SOURCE_PLAN_DIGEST"]' in body
''', encoding="utf-8")

          temp = Path(".github/workflows/zz-temp-artifact-bound-patch.yml")
          temp.unlink()
          PY
