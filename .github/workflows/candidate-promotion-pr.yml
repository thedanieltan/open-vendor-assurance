name: candidate-promotion-pr

on:
  workflow_dispatch:
    inputs:
      promotion_plan_path:
        description: "Optional reviewed or generated strict-growth promotion plan. If blank, selects the first unapplied reviewed candidate promotion plan."
        required: false
        type: string
        default: ""
      promotion_plan_mode:
        description: "reviewed-path, strict-growth-latest generation, strict-growth-shortlist generation, or sitemap-source-latest generation"
        required: false
        type: choice
        default: "reviewed-path"
        options:
          - reviewed-path
          - strict-growth-latest
          - strict-growth-shortlist
          - sitemap-source-latest
          - machine-provisional-from-queue
          - candidate-bound
          - quorum-promotion
          - quarantine
          - rollback
      rollback_decision_id:
        description: "Target machine decision id to roll back (required for rollback mode)"
        required: false
        type: string
        default: ""
      vendor_limit:
        description: "Optional number of candidate vendors to discover when regenerating strict-growth candidate evidence"
        required: false
        type: string
      max_urls_per_type:
        description: "Maximum candidate URLs to probe per source type when regenerating strict-growth candidate evidence"
        required: false
        type: string
        default: "4"
      fetch_timeout:
        description: "Per-URL source discovery timeout in seconds when regenerating strict-growth candidate evidence"
        required: false
        type: string
        default: "3"
      max_promotion_actions_per_pr:
        description: "Maximum selected promotion actions to apply in one generated Catalog PR."
        required: false
        type: string
        default: ""
      max_actions_per_plan:
        description: "Deprecated compatibility alias for max_promotion_actions_per_pr. Leave blank for new runs."
        required: false
        type: string
        default: ""
      pr_branch:
        description: "Optional branch for generated Catalog PR. Must start with agent-. If blank, derived from selected plan."
        required: false
        type: string
        default: ""
      pr_title:
        description: "Generated PR title. Must start with Catalog:"
        required: false
        type: string
        default: "Catalog: apply reviewed candidate source promotion"
      candidate_id:
        description: "candidate-bound mode: the bound candidate id selected by the growth controller."
        required: false
        type: string
        default: ""
      candidate_path:
        description: "candidate-bound mode: maintenance/candidates/<id>.json path of the bound candidate."
        required: false
        type: string
        default: ""
      content_digest:
        description: "candidate-bound mode: SHA-256 content digest binding the exact candidate state."
        required: false
        type: string
        default: ""
      selected_vendor:
        description: "candidate-bound mode: the vendor id the bound candidate resolves to (mutated == selected)."
        required: false
        type: string
        default: ""
      candidate_origin:
        description: "candidate-bound mode: the bound candidate origin."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "47 8 * * 3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: candidate-promotion-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-promotion-pr:
    # The reviewed / strict-growth / quorum / coverage-queue paths. The
    # candidate-bound mutation runs in its own job below.
    if: ${{ github.event_name == 'schedule' || contains(fromJson('["reviewed-path","strict-growth-latest","strict-growth-shortlist","sitemap-source-latest","machine-provisional-from-queue"]'), inputs.promotion_plan_mode || 'reviewed-path') }}
    runs-on: ubuntu-latest
    env:
      REQUESTED_PROMOTION_PLAN_PATH: "${{ inputs.promotion_plan_path || '' }}"
      PROMOTION_PLAN_MODE: "${{ inputs.promotion_plan_mode || 'reviewed-path' }}"
      VENDOR_LIMIT: "${{ inputs.vendor_limit || '' }}"
      MAX_URLS_PER_TYPE: "${{ inputs.max_urls_per_type || '4' }}"
      FETCH_TIMEOUT: "${{ inputs.fetch_timeout || '3' }}"
      REQUESTED_MAX_PROMOTION_ACTIONS_PER_PR: "${{ inputs.max_promotion_actions_per_pr || '' }}"
      REQUESTED_MAX_ACTIONS_PER_PLAN: "${{ inputs.max_actions_per_plan || '' }}"
      REQUESTED_PR_BRANCH: "${{ inputs.pr_branch || '' }}"
      PR_TITLE: "${{ inputs.pr_title || 'Catalog: apply reviewed candidate source promotion' }}"
      OPENVA_WEB_BOT_AUTH_DIRECTORY_URL: ${{ secrets.OPENVA_WEB_BOT_AUTH_DIRECTORY_URL }}
      OPENVA_WEB_BOT_AUTH_PUBLIC_JWK_JSON: ${{ secrets.OPENVA_WEB_BOT_AUTH_PUBLIC_JWK_JSON }}
      OPENVA_WEB_BOT_AUTH_PRIVATE_KEY_PEM_B64: ${{ secrets.OPENVA_WEB_BOT_AUTH_PRIVATE_KEY_PEM_B64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Resolve promotion action cap
        run: |
          set -euo pipefail
          PREFERRED="$(printf '%s' "$REQUESTED_MAX_PROMOTION_ACTIONS_PER_PR" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          LEGACY="$(printf '%s' "$REQUESTED_MAX_ACTIONS_PER_PLAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$PREFERRED" ] && [ -z "$LEGACY" ]; then
            PREFERRED="50"
          fi
          for VALUE in "$PREFERRED" "$LEGACY"; do
            if [ -n "$VALUE" ]; then
              case "$VALUE" in
                *[!0-9]*) echo "max_promotion_actions_per_pr must be a non-negative integer" >&2; exit 1 ;;
              esac
            fi
          done
          if [ -n "$PREFERRED" ] && [ -n "$LEGACY" ] && [ "$PREFERRED" != "$LEGACY" ]; then
            echo "max_promotion_actions_per_pr and deprecated max_actions_per_plan differ" >&2
            exit 1
          fi
          RESOLVED="${PREFERRED:-$LEGACY}"
          echo "MAX_PROMOTION_ACTIONS_PER_PR=$RESOLVED" >> "$GITHUB_ENV"
      - name: Regenerate strict-growth promotion plan
        if: env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist' || env.PROMOTION_PLAN_MODE == 'machine-provisional-from-queue'
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.openva.catalog_growth_discovery_queue validate \
            --output catalog-growth-discovery-queue-summary.json
          python - <<'PY' > strict-growth-discovery.env
          import json

          queue = json.load(open('catalog-growth-discovery-queue-summary.json', encoding='utf-8'))
          source_types = ','.join(queue.get('source_types', []))
          print(f"QUEUE_VENDOR_LIMIT={queue['max_vendors_per_discovery_run']}")
          print(f"QUEUE_SOURCE_TYPES={source_types}")
          PY
          cat strict-growth-discovery.env >> "$GITHUB_ENV"
          source strict-growth-discovery.env
          if [ "$PROMOTION_PLAN_MODE" = "machine-provisional-from-queue" ]; then
            # WP36b queue-bound entry: derive candidates from the coverage-growth
            # missing_vendor queue via the bridge instead of seed-cohort discovery.
            python -m tools.openva.coverage_growth build \
              --output coverage-growth-report.json
            python -m tools.openva.missing_vendor_bridge build \
              --coverage-report coverage-growth-report.json \
              --output vendor-candidate-discovery-report.json
          else
            python -m tools.openva.vendor_candidate_discovery discover \
              --output vendor-candidate-discovery-report.json
          fi
          LIMIT="$(printf '%s' "$VENDOR_LIMIT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$LIMIT" ]; then
            LIMIT="$QUEUE_VENDOR_LIMIT"
          fi
          python -m tools.openva.source_discovery discover-vendor-candidates \
            --vendor-candidates vendor-candidate-discovery-report.json \
            --vendor-limit "$LIMIT" \
            --source-types "$QUEUE_SOURCE_TYPES" \
            --max-urls-per-type "$MAX_URLS_PER_TYPE" \
            --fetch-timeout "$FETCH_TIMEOUT" \
            --output vendor-candidate-source-discovery-report.json
          python -m tools.openva.catalog_growth_eligibility classify \
            --vendor-candidates vendor-candidate-discovery-report.json \
            --source-discovery vendor-candidate-source-discovery-report.json \
            --output-json catalog-growth-eligibility-report.json \
            --output-strict catalog-growth-strict-promotions.json \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.sha }}"
          if [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ]; then
            python -m tools.openva.catalog_growth_backlog build \
              --eligibility-report catalog-growth-eligibility-report.json \
              --output-json catalog-growth-backlog-report.json \
              --output-csv reports/catalog-growth-backlog.csv \
              --output-md reports/catalog-growth-backlog-summary.md
            python -m tools.openva.strict_growth_shortlist build \
              --eligibility-report catalog-growth-eligibility-report.json \
              --backlog-report catalog-growth-backlog-report.json \
              --output-json strict-growth-shortlist.json \
              --output-csv reports/strict-growth-shortlist.csv \
              --output-md reports/strict-growth-shortlist-summary.md \
              --max-vendors 5 \
              --max-actions "$MAX_PROMOTION_ACTIONS_PER_PR"
            python -m tools.openva.strict_growth_shortlist plan \
              --shortlist strict-growth-shortlist.json \
              --output strict-growth-promotion-plan.json \
              --head-sha "${{ github.sha }}" \
              --base-sha "${{ github.sha }}" \
              --max-actions "$MAX_PROMOTION_ACTIONS_PER_PR"
          else
            python -m tools.openva.promotion_planner plan-strict-growth \
              --eligibility-report catalog-growth-eligibility-report.json \
              --output strict-growth-promotion-plan.json \
              --head-sha "${{ github.sha }}" \
              --base-sha "${{ github.sha }}" \
              --max-promotion-actions-per-pr "$MAX_PROMOTION_ACTIONS_PER_PR"
          fi
          python -m tools.openva.materialization_envelope attach \
            --promotion-plan strict-growth-promotion-plan.json \
            --vendor-candidate-report vendor-candidate-discovery-report.json \
            --source-discovery-report vendor-candidate-source-discovery-report.json \
            --eligibility-report catalog-growth-eligibility-report.json \
            --output strict-growth-promotion-plan.json \
            --discovery-run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-attempt "${{ github.run_attempt }}" \
            --source-commit-sha "${{ github.sha }}" \
            --base-sha "${{ github.sha }}"
      - name: Regenerate sitemap source promotion plan
        if: env.PROMOTION_PLAN_MODE == 'sitemap-source-latest'
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.openva.catalog_growth_discovery_queue validate \
            --output catalog-growth-discovery-queue-summary.json
          python -m tools.openva.catalog_growth_discovery_queue run-sitemap-discovery \
            --queue maintenance/queues/catalog-growth-discovery.json \
            --discovery-run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --discovered-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output sitemap-source-discovery-events.json
          python - <<'PY'
          import json
          from pathlib import Path

          from tools.openva.source_discovery import write_discovery_outputs

          source = json.load(open("sitemap-source-discovery-events.json", encoding="utf-8"))
          vendors = list((source.get("verification") or {}).get("vendors") or [])
          report = {
              "schema_version": "0.1.0",
              "generated_at": source.get("discovered_at"),
              "report_type": "source_discovery_report",
              "discovery_context": "sitemap_source_discovery",
              "posture": {
                  "network_fetch_performed": True,
                  "writes_repository_state": True,
                  "writes_canonical_sources": False,
                  "opens_pull_requests": False,
                  "public_sources_only": True,
                  "non_advisory": True,
              },
              "summary": {
                  "vendors_checked": len(vendors),
                  "candidate_sources_written_or_reported": sum(len(v.get("candidates") or []) for v in vendors),
                  "unavailable_sources_written_or_reported": 0,
              },
              "vendors": vendors,
          }
          Path("sitemap-source-discovery-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          candidate_ids = []
          temporary_paths = []
          for vendor in vendors:
              vendor_id = str(vendor.get("vendor_id") or "")
              if not vendor_id:
                  continue
              new_candidates = []
              for candidate in vendor.get("candidates") or []:
                  candidate_id = str(candidate.get("candidate_source_id") or "")
                  if not candidate_id:
                      continue
                  candidate_ids.append(candidate_id)
                  candidate_path = Path("data") / "vendors" / vendor_id / "candidate_sources" / f"{candidate_id}.yaml"
                  if not candidate_path.exists():
                      new_candidates.append(candidate)
                      temporary_paths.append(candidate_path.as_posix())
              if new_candidates:
                  write_discovery_outputs(
                      {
                          "vendor_id": vendor_id,
                          "candidates": new_candidates,
                          "unavailable_sources": [],
                      }
                  )
          manifest = {
              "candidate_source_ids": sorted(set(candidate_ids)),
              "temporary_candidate_paths": sorted(set(temporary_paths)),
          }
          Path("sitemap-source-candidate-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report["summary"], indent=2, sort_keys=True))
          PY
          python -m tools.openva.promotion_planner plan \
            --discovery-report sitemap-source-discovery-report.json \
            --output sitemap-source-promotion-plan.raw.json
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          raw = json.load(open("sitemap-source-promotion-plan.raw.json", encoding="utf-8"))
          manifest = json.load(open("sitemap-source-candidate-manifest.json", encoding="utf-8"))
          sitemap_candidate_ids = set(manifest.get("candidate_source_ids") or [])
          promote_actions = [
              action
              for action in raw.get("actions", []) or []
              if action.get("action") == "promote_candidate_source_for_review"
              and action.get("candidate_source_id") in sitemap_candidate_ids
          ]
          max_actions = int(os.environ.get("MAX_PROMOTION_ACTIONS_PER_PR") or "0")
          counts = Counter(action["action"] for action in promote_actions)
          plan = {
              **raw,
              "report_type": "sitemap_source_promotion_plan",
              "inputs": {
                  **(raw.get("inputs") or {}),
                  "sitemap_source_discovery_report_path": "sitemap-source-discovery-events.json",
                  "sitemap_candidate_manifest_path": "sitemap-source-candidate-manifest.json",
              },
              "summary": {
                  **(raw.get("summary") or {}),
                  "action_count": len(promote_actions),
                  "selected_promotion_action_count": len(promote_actions),
                  "candidate_source_ids_from_sitemap": len(sitemap_candidate_ids),
                  "uncapped_action_count": len(promote_actions),
                  "batch_deferred_action_count": 0,
                  "max_promotion_actions_per_pr": max_actions,
                  "viability_filter_pending": True,
                  "action_types": dict(sorted(counts.items())),
              },
              "actions": promote_actions,
          }
          Path("sitemap-source-promotion-plan.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(plan["summary"], indent=2, sort_keys=True))
          PY
      - name: Filter sitemap source promotion viability
        if: env.PROMOTION_PLAN_MODE == 'sitemap-source-latest'
        run: |
          python -m tools.openva.candidate_promotion_actions filter-reviewed-plan \
            --promotion-plan sitemap-source-promotion-plan.json \
            --output sitemap-source-promotion-plan.json \
            --viability-report sitemap-source-promotion-viability-report.json \
            --max-actions "$MAX_PROMOTION_ACTIONS_PER_PR"
      - name: Stash temporary sitemap candidate-source records
        if: env.PROMOTION_PLAN_MODE == 'sitemap-source-latest'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest = json.load(open("sitemap-source-candidate-manifest.json", encoding="utf-8"))
          stash_root = Path("reports") / "sitemap-source-temporary-candidates"
          stashed_paths = []
          for item in manifest.get("temporary_candidate_paths") or []:
              path = Path(item)
              if not path.exists():
                  continue
              stash_path = stash_root / path
              stash_path.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(path.as_posix(), stash_path.as_posix())
              stashed_paths.append(path.as_posix())
              parent = path.parent
              if parent.name == "candidate_sources" and parent.exists() and not any(parent.iterdir()):
                  parent.rmdir()
          manifest["stashed_candidate_paths"] = sorted(set(stashed_paths))
          manifest["temporary_candidate_stash_root"] = stash_root.as_posix()
          Path("sitemap-source-candidate-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"stashed_temporary_candidate_sources": len(stashed_paths)}, sort_keys=True))
          PY
      - name: Select candidate promotion plan
        id: reviewed_plan
        run: |
          set -euo pipefail
          REQUESTED_PROMOTION_PLAN_PATH="$(printf '%s' "$REQUESTED_PROMOTION_PLAN_PATH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          case "$PROMOTION_PLAN_MODE" in
            reviewed-path|strict-growth-latest|strict-growth-shortlist|sitemap-source-latest|machine-provisional-from-queue) ;;
            *) echo "promotion_plan_mode must be reviewed-path, strict-growth-latest, strict-growth-shortlist, sitemap-source-latest, or machine-provisional-from-queue" >&2; exit 1 ;;
          esac
          if [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ] || [ "$PROMOTION_PLAN_MODE" = "machine-provisional-from-queue" ]; then
            REQUESTED_PROMOTION_PLAN_PATH="strict-growth-promotion-plan.json"
          elif [ "$PROMOTION_PLAN_MODE" = "sitemap-source-latest" ]; then
            REQUESTED_PROMOTION_PLAN_PATH="sitemap-source-promotion-plan.json"
          fi
          if [ -n "$REQUESTED_PROMOTION_PLAN_PATH" ]; then
            if [ ! -f "$REQUESTED_PROMOTION_PLAN_PATH" ]; then
              echo "Requested promotion plan file not found: $REQUESTED_PROMOTION_PLAN_PATH" >&2
              exit 1
            fi
            PLAN_SHA256=$(sha256sum "$REQUESTED_PROMOTION_PLAN_PATH" | awk '{print $1}')
            PLAN_ACTION_COUNT=$(python -c "import json, sys; data = json.load(open(sys.argv[1], encoding='utf-8')); print(len(data.get('actions', []) or []))" "$REQUESTED_PROMOTION_PLAN_PATH")
            if { [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ] || [ "$PROMOTION_PLAN_MODE" = "sitemap-source-latest" ] || [ "$PROMOTION_PLAN_MODE" = "machine-provisional-from-queue" ]; } && [ "$PLAN_ACTION_COUNT" = "0" ]; then
              echo "HAS_REVIEWED_PLAN=false" >> "$GITHUB_ENV"
              echo "GENERATED_PROMOTION_NO_ACTIONS=true" >> "$GITHUB_ENV"
              echo "HAS_REVIEWED_PLAN=false" >> "$GITHUB_OUTPUT"
              echo "GENERATED_PROMOTION_NO_ACTIONS=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "HAS_REVIEWED_PLAN=true" >> "$GITHUB_ENV"
            echo "SELECTED_PLAN_PATH=$REQUESTED_PROMOTION_PLAN_PATH" >> "$GITHUB_ENV"
            echo "SELECTED_PLAN_SHA256=sha256:$PLAN_SHA256" >> "$GITHUB_ENV"
            echo "SELECTED_PLAN_ACTION_COUNT=$PLAN_ACTION_COUNT" >> "$GITHUB_ENV"
            echo "SELECTED_PR_BRANCH=agent-candidate-promotion-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            echo "HAS_REVIEWED_PLAN=true" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PLAN_PATH=$REQUESTED_PROMOTION_PLAN_PATH" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PLAN_SHA256=sha256:$PLAN_SHA256" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PLAN_ACTION_COUNT=$PLAN_ACTION_COUNT" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PR_BRANCH=agent-candidate-promotion-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            python -m tools.openva.candidate_promotion_lifecycle select \
              --promotion-plan "$REQUESTED_PROMOTION_PLAN_PATH" \
              --max-promotion-actions-per-pr "$MAX_PROMOTION_ACTIONS_PER_PR" \
              --output reviewed-candidate-promotion.env
            cat reviewed-candidate-promotion.env >> "$GITHUB_ENV"
            cat reviewed-candidate-promotion.env >> "$GITHUB_OUTPUT"
          fi
      - name: Stop when no unapplied reviewed candidate promotion plan exists
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.reviewed_plan.outputs.GENERATED_PROMOTION_NO_ACTIONS }}" = "true" ]; then
            echo "Generated promotion plan completed with zero selected promotion actions."
          elif [ "${{ steps.reviewed_plan.outputs.REVIEWED_PLAN_ALREADY_APPLIED }}" = "true" ]; then
            echo "Reviewed candidate promotion plan already applied."
          else
            echo "No unapplied reviewed candidate promotion plans found."
          fi
      - name: Validate workflow inputs
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          set -euo pipefail
          PR_BRANCH="$(printf '%s' "$REQUESTED_PR_BRANCH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PR_TITLE="$(printf '%s' "$PR_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$PR_BRANCH" ]; then
            PR_BRANCH="$SELECTED_PR_BRANCH"
          fi
          echo "PROMOTION_PLAN_PATH=$SELECTED_PLAN_PATH" >> "$GITHUB_ENV"
          echo "PROMOTION_PLAN_SHA256=$SELECTED_PLAN_SHA256" >> "$GITHUB_ENV"
          echo "PROMOTION_PLAN_ACTION_COUNT=$SELECTED_PLAN_ACTION_COUNT" >> "$GITHUB_ENV"
          echo "MAX_PROMOTION_ACTIONS_PER_PR=$MAX_PROMOTION_ACTIONS_PER_PR" >> "$GITHUB_ENV"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"
          case "$SELECTED_PLAN_PATH" in
            maintenance/reviewed/*.json|strict-growth-promotion-plan.json|sitemap-source-promotion-plan.json|maintenance/generated/strict-growth-*.json) ;;
            *) echo "promotion_plan_path must be under maintenance/reviewed/, strict-growth-promotion-plan.json, sitemap-source-promotion-plan.json, or maintenance/generated/strict-growth-*.json" >&2; exit 1 ;;
          esac
          test -f "$SELECTED_PLAN_PATH" || { echo "promotion plan file not found: $SELECTED_PLAN_PATH" >&2; exit 1; }
          case "$PR_BRANCH" in
            agent-*) ;;
            *) echo "pr_branch must start with agent-" >&2; exit 1 ;;
          esac
          case "$PR_TITLE" in
            Catalog:*) ;;
            *) echo "pr_title must start with Catalog:" >&2; exit 1 ;;
          esac
      - name: Preflight strict-growth promotion plan
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')
        run: |
          python -m tools.openva.strict_growth_automerge check-plan \
            --promotion-plan strict-growth-promotion-plan.json \
            --eligibility-report catalog-growth-eligibility-report.json \
            --labels catalog-growth,automerge:strict-growth \
            --current-head-sha "${{ github.sha }}" \
            --current-base-sha "${{ github.sha }}" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Prepare strict-growth evidence files
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')
        run: |
          set -euo pipefail
          mkdir -p maintenance/generated
          cp strict-growth-promotion-plan.json maintenance/generated/strict-growth-promotion-plan.json
          cp catalog-growth-eligibility-report.json maintenance/generated/strict-growth-eligibility-report.json
          if [ -f strict-growth-shortlist.json ]; then
            cp strict-growth-shortlist.json maintenance/generated/strict-growth-shortlist.json
          fi
          echo "PROMOTION_PLAN_PATH=maintenance/generated/strict-growth-promotion-plan.json" >> "$GITHUB_ENV"
          echo "ELIGIBILITY_REPORT_PATH=maintenance/generated/strict-growth-eligibility-report.json" >> "$GITHUB_ENV"
      - name: Validate current records
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow candidate-promotion-pr.yml \
              --lane catalog_growth_promotion \
              --failure-code schema_validation_failure \
              --message "schema validation failed before catalog promotion actions" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/catalog-promotion-failure-input.json
            exit 1
          }
      - name: Restore temporary sitemap candidate-source records for apply
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && env.PROMOTION_PLAN_MODE == 'sitemap-source-latest'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest = json.load(open("sitemap-source-candidate-manifest.json", encoding="utf-8"))
          plan = json.load(open("sitemap-source-promotion-plan.json", encoding="utf-8"))
          viable_candidate_ids = {
              str(action.get("candidate_source_id") or "")
              for action in plan.get("actions", []) or []
              if action.get("candidate_source_id")
          }
          stash_root = Path(manifest.get("temporary_candidate_stash_root") or "reports/sitemap-source-temporary-candidates")
          restored_paths = []
          for item in manifest.get("stashed_candidate_paths") or []:
              path = Path(item)
              if path.stem not in viable_candidate_ids:
                  continue
              stash_path = stash_root / path
              if not stash_path.exists():
                  continue
              path.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(stash_path, path)
              restored_paths.append(path.as_posix())
          print(json.dumps({"restored_temporary_candidate_sources": len(restored_paths)}, sort_keys=True))
          PY
      - name: Apply candidate promotions
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          python -m tools.openva.candidate_promotion_actions apply \
            --promotion-plan "$PROMOTION_PLAN_PATH" \
            --output candidate-promotion-report.json
      - name: Remove temporary sitemap candidate-source records
        if: always() && env.PROMOTION_PLAN_MODE == 'sitemap-source-latest'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("sitemap-source-candidate-manifest.json")
          if not manifest_path.exists():
              print(json.dumps({"temporary_candidate_sources_cleaned": 0, "manifest_missing": True}, sort_keys=True))
              raise SystemExit(0)
          manifest = json.load(open(manifest_path, encoding="utf-8"))
          cleaned = 0
          for item in manifest.get("temporary_candidate_paths") or []:
              path = Path(item)
              if path.exists():
                  path.unlink()
                  cleaned += 1
              parent = path.parent
              if parent.name == "candidate_sources" and parent.exists() and not any(parent.iterdir()):
                  parent.rmdir()
          print(json.dumps({"temporary_candidate_sources_cleaned": cleaned}, sort_keys=True))
          PY
      - name: Rebuild generated outputs
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: python -m tools.openva.validate build-indexes
      - name: Validate generated catalog promotion
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow candidate-promotion-pr.yml \
              --lane catalog_growth_promotion \
              --failure-code schema_validation_failure \
              --message "schema validation failed after catalog promotion actions" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/catalog-promotion-failure-input.json
            exit 1
          }
      - name: Check whether catalog changes were produced
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        id: catalog_changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data indexes dist maintenance/generated maintenance/machine-decisions openva-pack.json; then
            echo "No candidate promotion changes produced."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Candidate promotion changes produced."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build catalog promotion queue state
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          mkdir -p reports/openva-queue
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          plan_path = Path(os.environ["PROMOTION_PLAN_PATH"])
          generated_at = datetime.fromtimestamp(plan_path.stat().st_mtime, UTC).replace(microsecond=0)
          plan_digest = hashlib.sha256(plan_path.read_bytes()).hexdigest()
          state = {
              "version": 1,
              "lane_id": "catalog_growth_promotion",
              "state_source": "workflow_local_fallback",
              "fallback_state": True,
              "live_state_checks_report_only": [
                  "max_open_prs",
                  "recent_bot_prs_per_day",
                  "recent_bot_prs_per_week",
                  "duplicate_pr_policy",
                  "source_host_rate_limit",
                  "vendor_domain_concurrency_limit",
              ],
              "open_prs": [],
              "recent_bot_prs": {"day_count": 0, "week_count": 0},
              "pause": {"active": False, "source": "workflow fallback; maintainer pause label not fetched"},
              "evidence": {
                  "generated_at": generated_at.isoformat().replace("+00:00", "Z"),
                  "source": plan_path.as_posix(),
              },
              "requested_action": {
                  "duplicate_key": f"{plan_path.as_posix()}:{plan_digest}",
                  "vendor_domain": "",
                  "source_host": "",
                  "base_sha": os.environ["GITHUB_SHA"],
                  "head_sha": os.environ["GITHUB_SHA"],
              },
          }
          Path("reports/openva-queue/catalog-promotion-queue-state.json").write_text(
              json.dumps(state, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Evaluate catalog promotion queue gate
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          python -m tools.openva.bot_queue evaluate \
            --lane catalog_growth_promotion \
            --state reports/openva-queue/catalog-promotion-queue-state.json \
            --out reports/openva-queue/catalog-promotion-queue-report.json \
            --out-md reports/openva-queue/catalog-promotion-queue-report.md
      - name: Enforce catalog promotion queue gate
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          report = json.load(open("reports/openva-queue/catalog-promotion-queue-report.json", encoding="utf-8"))
          state = json.load(open("reports/openva-queue/catalog-promotion-queue-state.json", encoding="utf-8"))
          reasons = set(report.get("reasons", []))
          hard_stop_reasons = {
              "unknown_lane",
              "lane_missing_queue_policy",
              "lane_not_deny_by_default",
              "lane_not_write_capable",
              "missing_evidence",
              "stale_evidence",
              "pause_switch_active",
          }
          if state.get("state_source") != "workflow_local_fallback":
              hard_stop_reasons.update(
                  {
                      "max_open_prs_exceeded",
                      "max_bot_prs_per_day_exceeded",
                      "max_bot_prs_per_week_exceeded",
                  }
              )
          blocked = report.get("decision") in {"deny", "pause"} or bool(reasons & hard_stop_reasons)
          if blocked:
              raise SystemExit(
                  "catalog_growth_promotion queue gate blocked PR creation: "
                  + ", ".join(report.get("reasons", []))
              )
          print("catalog_growth_promotion queue gate passed; fallback live-state checks remain report-only.")
          PY
      - name: Upload catalog promotion queue gate artifacts
        if: always() && steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openva-catalog-promotion-queue-report
          path: |
            reports/openva-queue/catalog-promotion-queue-state.json
            reports/openva-queue/catalog-promotion-queue-report.json
            reports/openva-queue/catalog-promotion-queue-report.md
          if-no-files-found: warn
      - name: Run source preflight for changed sources
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        id: source_preflight
        continue-on-error: true
        run: |
          {
            git diff --name-only HEAD -- data/vendors
            git ls-files --others --exclude-standard -- data/vendors
          } | sort -u > changed-paths.txt
          python -m tools.openva.source_preflight check-changed-sources \
            --paths-file changed-paths.txt \
            --output source-preflight-report.json
      - name: Upload source preflight report
        if: always() && steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-source-preflight-report
          path: source-preflight-report.json
          if-no-files-found: warn
      - name: Fail if source preflight failed
        if: steps.source_preflight.outcome == 'failure'
        run: exit 1
      - name: Prepare compact PR body
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.load(open('candidate-promotion-report.json', encoding='utf-8'))
          preflight = json.load(open('source-preflight-report.json', encoding='utf-8'))
          promotion_plan = json.load(open(os.environ['PROMOTION_PLAN_PATH'], encoding='utf-8'))
          plan_summary = promotion_plan.get('summary', {})
          selected_actions = plan_summary.get('selected_promotion_action_count', os.environ['PROMOTION_PLAN_ACTION_COUNT'])
          lines = [
              '## Summary',
              '',
              'Applies OpenVA candidate promotions from a selected promotion plan.',
              '',
              '## Input',
              '',
              f"- Promotion plan: `{os.environ['PROMOTION_PLAN_PATH']}`",
              f"- Promotion plan SHA-256: `{os.environ['PROMOTION_PLAN_SHA256']}`",
              f"- Promotion actions selected for this PR: `{selected_actions}`",
              f"- Max promotion actions per generated PR: `{os.environ['MAX_PROMOTION_ACTIONS_PER_PR']}`",
              '',
              '## Counts',
              '',
              f"- Promotion actions seen: `{report['summary']['promotion_actions_seen']}`",
              f"- Canonical vendors written: `{report['summary'].get('canonical_vendors_written', 0)}`",
              f"- Canonical sources written: `{report['summary']['canonical_sources_written']}`",
              f"- Skipped actions: `{report['summary']['skipped_actions']}`",
              f"- Source preflight failures: `{preflight['failed_count']}`",
              '',
              '## Guardrails',
              '',
              '- Applies only selected candidate promotion actions.',
              '- Runs source preflight over changed canonical source files.',
              '- Does not mirror raw documents.',
              '- Does not merge automatically.',
              '',
          ]
          if os.environ.get('ELIGIBILITY_REPORT_PATH'):
              insert_at = lines.index('## Counts') - 1
              lines[insert_at:insert_at] = [
                  f"- Strict-growth eligibility report: `{os.environ['ELIGIBILITY_REPORT_PATH']}`",
                  f"- Base SHA: `{os.environ['GITHUB_SHA']}`",
              ]
              counts_at = lines.index('## Counts') + 2
              lines[counts_at:counts_at] = [
                  f"- Strict-growth uncapped promotion actions: `{plan_summary.get('uncapped_action_count', report['summary']['promotion_actions_seen'])}`",
                  f"- Strict-growth source-health screened promotion actions: `{plan_summary.get('source_health_screened_action_count', report['summary']['promotion_actions_seen'])}`",
                  f"- Strict-growth policy-capped promotion actions: `{plan_summary.get('policy_capped_action_count', report['summary']['promotion_actions_seen'])}`",
                  f"- Strict-growth batch-deferred promotion actions: `{plan_summary.get('batch_deferred_action_count', 0)}`",
                  f"- Deferred actions: `{plan_summary.get('deferred_action_count', 0)}`",
                  f"- Redirects detected: `{plan_summary.get('redirect_count', 0)}`",
                  f"- Redirects canonicalized: `{plan_summary.get('redirect_canonicalized_count', 0)}`",
                  f"- Redirects deferred: `{plan_summary.get('redirect_deferred_count', 0)}`",
                  f"- Cross-authority redirects: `{plan_summary.get('cross_authority_redirect_count', 0)}`",
                  f"- Generic redirects rejected: `{plan_summary.get('generic_redirect_rejected_count', 0)}`",
                  f"- Unresolved redirects: `{plan_summary.get('unresolved_redirect_count', 0)}`",
              ]
          Path('candidate-promotion-pr-body.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit and push promotion branch
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PR_BRANCH"
          git add data indexes dist openva-pack.json
          if [ -d maintenance/generated ]; then
            git add maintenance/generated
          fi
          # WP36b: the machine decision record must be committed so the
          # machine-provisional automerge gate can verify the linked decision.
          if [ -d maintenance/machine-decisions ]; then
            git add maintenance/machine-decisions
          fi
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Create or update pull request
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        env:
          # Workflow-triggering token so the opened PR can trigger the automerge
          # lane; falls back to github.token (current behaviour) until set.
          GH_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          cp candidate-promotion-pr-body.md candidate-promotion-pr-body-final.md
          {
            echo ""
            echo "- Head SHA: \`$HEAD_SHA\`"
          } >> candidate-promotion-pr-body-final.md
          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body-file candidate-promotion-pr-body-final.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "$PR_TITLE" \
              --body-file candidate-promotion-pr-body-final.md
          fi
      - name: Label machine-provisional materialization PR
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true' && env.PROMOTION_PLAN_MODE == 'machine-provisional-from-queue'
        env:
          # WP36b: mark the PR as a machine-provisional materialization. The
          # not_before controller applies automerge:machine-provisional later,
          # once the decision's delay window has passed.
          GH_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --add-label machine-provisional
          fi
      - name: Release machine-provisional PRs past not_before
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Controller: open machine-provisional PRs not yet cleared for automerge.
          gh pr list --state open --label machine-provisional \
            --json number,headRefName,labels \
            --jq '.[] | select([.labels[].name] | index("automerge:machine-provisional") | not) | [.number, .headRefName] | @tsv' \
            > provisional-prs.tsv || true
          while IFS=$'\t' read -r PR_NUMBER HEAD_REF; do
            [ -z "${PR_NUMBER:-}" ] && continue
            git fetch origin "$HEAD_REF" --quiet || continue
            if [ "$(python -m tools.openva.machine_provisional_controller ready --ref "origin/$HEAD_REF" --now "$NOW")" = "true" ]; then
              gh pr edit "$PR_NUMBER" --add-label automerge:machine-provisional
              echo "Released PR #$PR_NUMBER (not_before passed)."
            else
              echo "PR #$PR_NUMBER still within not_before delay; leaving for a later run."
            fi
          done < provisional-prs.tsv
      - name: Upload promotion artifacts
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-pr-artifacts
          path: |
            ${{ env.PROMOTION_PLAN_PATH }}
            candidate-promotion-report.json
            source-preflight-report.json
            candidate-promotion-pr-body.md
            candidate-promotion-pr-body-final.md
          if-no-files-found: error
      - name: Upload sitemap source promotion evidence artifacts
        if: always() && env.PROMOTION_PLAN_MODE == 'sitemap-source-latest'
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-pr-sitemap-source-evidence
          path: |
            sitemap-source-discovery-events.json
            sitemap-source-discovery-report.json
            sitemap-source-candidate-manifest.json
            sitemap-source-promotion-plan.raw.json
            sitemap-source-promotion-plan.json
            sitemap-source-promotion-viability-report.json
          if-no-files-found: warn
      - name: Upload strict-growth evidence artifacts
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-pr-strict-growth-evidence
          path: |
            ${{ env.ELIGIBILITY_REPORT_PATH }}
            maintenance/generated/strict-growth-promotion-plan.json
            maintenance/generated/strict-growth-eligibility-report.json
            maintenance/generated/strict-growth-shortlist.json
          if-no-files-found: error
      - name: Build catalog promotion failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow candidate-promotion-pr.yml \
            --lane catalog_growth_promotion \
            --message "catalog growth controlled promotion workflow failed; inspect logs for workflow input compatibility, schema validation, queue denial, source preflight, redirect, or promotion action context" \
            --queue-report reports/openva-queue/catalog-promotion-queue-report.json \
            --source-preflight-report source-preflight-report.json \
            --out reports/openva-failure-routing/catalog-promotion-failure-input.json \
            --preserve-existing
      - name: Route catalog promotion failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/catalog-promotion-failure-input.json \
            --out reports/openva-failure-routing/catalog-promotion-failure-routing-report.json \
            --out-md reports/openva-failure-routing/catalog-promotion-failure-routing-report.md
      - name: Upload catalog promotion failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-catalog-promotion-failure-routing
          path: |
            reports/openva-failure-routing/catalog-promotion-failure-input.json
            reports/openva-failure-routing/catalog-promotion-failure-routing-report.json
            reports/openva-failure-routing/catalog-promotion-failure-routing-report.md
          if-no-files-found: ignore

  candidate-bound-materialization:
    # WP-OPENVA-CANDIDATE-ACTIVATION-01 candidate-bound mutation boundary.
    # Materializes the EXACT candidate the autonomous growth controller selected,
    # verified by id / path / content digest / origin / selected vendor against
    # the candidate on the checked-out main head, into a NEW machine_provisional
    # vendor plus an append-only decision, then opens a PR. It fails closed on any
    # binding drift; it never re-derives the vendor from a queue, never promotes to
    # a terminal status (that is the independent WP37 quorum), and never merges.
    if: github.event_name == 'workflow_dispatch' && inputs.promotion_plan_mode == 'candidate-bound'
    runs-on: ubuntu-latest
    env:
      CANDIDATE_ID: "${{ inputs.candidate_id }}"
      CANDIDATE_PATH: "${{ inputs.candidate_path }}"
      CONTENT_DIGEST: "${{ inputs.content_digest }}"
      SELECTED_VENDOR: "${{ inputs.selected_vendor }}"
      CANDIDATE_ORIGIN: "${{ inputs.candidate_origin }}"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate candidate binding inputs
        run: |
          set -euo pipefail
          for v in CANDIDATE_ID CANDIDATE_PATH CONTENT_DIGEST SELECTED_VENDOR CANDIDATE_ORIGIN; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then echo "::error::missing candidate binding input: $v"; exit 1; fi
          done
          case "$CANDIDATE_PATH" in
            maintenance/candidates/*.json) : ;;
            *) echo "::error::candidate_path must be under maintenance/candidates/"; exit 1 ;;
          esac
          test -f "$CANDIDATE_PATH" || { echo "::error::bound candidate not found on the head: $CANDIDATE_PATH"; exit 1; }
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Materialize the bound candidate (fail closed)
        run: |
          set -euo pipefail
          python -m tools.openva.candidate_activation materialize \
            --candidate "$CANDIDATE_PATH" \
            --candidate-path "$CANDIDATE_PATH" \
            --candidate-id "$CANDIDATE_ID" \
            --content-digest "$CONTENT_DIGEST" \
            --selected-vendor "$SELECTED_VENDOR" \
            --origin "$CANDIDATE_ORIGIN" \
            --root . \
            --output candidate-bound-materialization-report.json
      - name: Validate generated catalog
        run: python -m tools.openva.validate validate
      - name: Rebuild generated outputs
        run: python -m tools.openva.validate build-indexes
      - name: Re-verify the binding on the produced state
        run: |
          set -euo pipefail
          python -m tools.openva.candidate_activation verify \
            --candidate "$CANDIDATE_PATH" \
            --candidate-path "$CANDIDATE_PATH" \
            --candidate-id "$CANDIDATE_ID" \
            --content-digest "$CONTENT_DIGEST" \
            --selected-vendor "$SELECTED_VENDOR" \
            --origin "$CANDIDATE_ORIGIN" \
            --root .
      - name: Run source-intelligence release gate (pr profile)
        run: python -m tools.openva.release_gates check --profile pr
      - name: Prepare PR body
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.load(open("candidate-bound-materialization-report.json", encoding="utf-8"))
          lines = [
              "## Summary",
              "",
              f"Candidate-bound materialization of `{report['mutated_vendor']}` as machine_provisional",
              "from the exact candidate the autonomous growth controller selected.",
              "",
              "## Binding",
              "",
              f"- Candidate id: `{report['candidate_id']}`",
              f"- Candidate path: `{report['candidate_path']}`",
              f"- Content digest: `{report['content_digest']}`",
              f"- Selected vendor: `{report['selected_vendor']}`",
              f"- Mutated vendor: `{report['mutated_vendor']}`",
              f"- Materialization decision: `{report['decision_id']}`",
              "",
              "## Guardrails",
              "",
              "- Selected candidate == mutated candidate (verified id/path/digest/origin/vendor); identity is never re-derived from a queue.",
              "- Writes a NEW machine_provisional vendor only, linked to an append-only decision; promotion to active is the independent WP37 quorum.",
              "- Does not merge automatically; the not_before controller releases the automerge label after the delay and the existing machine-provisional policy governs the merge.",
              "- Operational metadata only; not legal, compliance, procurement, security, or vendor-risk advice.",
              "",
          ]
          Path("candidate-bound-pr-body.md").write_text("\n".join(lines), encoding="utf-8")
          PY
      - name: Commit and push materialization branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PR_BRANCH="agent-candidate-bound-${SELECTED_VENDOR}-${GITHUB_RUN_ID}"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"
          git switch -c "$PR_BRANCH"
          git add data indexes dist openva-pack.json maintenance/machine-decisions
          git commit -m "Catalog: materialize machine-provisional ${SELECTED_VENDOR} from bound candidate"
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Create pull request
        env:
          # Workflow-triggering token so the opened PR can trigger the merge lane;
          # falls back to github.token until the secret is set.
          GH_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          cp candidate-bound-pr-body.md candidate-bound-pr-body-final.md
          { echo ""; echo "- Head SHA: \`$HEAD_SHA\`"; } >> candidate-bound-pr-body-final.md
          gh pr create \
            --base main \
            --head "$PR_BRANCH" \
            --title "Catalog: materialize machine-provisional ${SELECTED_VENDOR} from bound candidate" \
            --body-file candidate-bound-pr-body-final.md
      - name: Label machine-provisional materialization PR
        env:
          # WP36b: mark the PR as a machine-provisional materialization. The
          # not_before controller applies automerge:machine-provisional later,
          # once the decision's delay window has passed, and the existing
          # machine-provisional policy governs the merge.
          GH_TOKEN: ${{ secrets.OPENVA_AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --add-label machine-provisional
          fi
      - name: Upload candidate-bound materialization artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
