name: candidate-promotion-pr

on:
  workflow_dispatch:
    inputs:
      promotion_plan_path:
        description: "Optional reviewed or generated strict-growth promotion plan. If blank, selects the first unapplied reviewed candidate promotion plan."
        required: false
        type: string
        default: ""
      promotion_plan_mode:
        description: "reviewed-path, strict-growth-latest generation, strict-growth-artifact binding, strict-growth-shortlist generation, or sitemap-source-latest generation"
        required: false
        type: choice
        default: "reviewed-path"
        options:
          - reviewed-path
          - strict-growth-latest
          - strict-growth-artifact
          - strict-growth-shortlist
          - sitemap-source-latest
          - machine-provisional-from-queue
          - candidate-bound
          - quorum-promotion
          - quarantine
          - rollback
      discovery_run_id:
        description: "strict-growth-artifact mode: exact successful catalog-growth-discovery run id."
        required: false
        type: string
        default: ""
      discovery_artifact_id:
        description: "strict-growth-artifact mode: exact discovery artifact id selected by the bridge."
        required: false
        type: string
        default: ""
      discovery_plan_digest:
        description: "strict-growth-artifact mode: SHA-256 of the source strict-growth plan in that artifact."
        required: false
        type: string
        default: ""
      rollback_decision_id:
        description: "Target machine decision id to roll back (required for rollback mode)"
        required: false
        type: string
        default: ""
      vendor_limit:
        description: "Optional number of candidate vendors to discover when regenerating strict-growth candidate evidence"
        required: false
        type: string
      max_urls_per_type:
        description: "Maximum candidate URLs to probe per source type when regenerating strict-growth candidate evidence"
        required: false
        type: string
        default: "4"
      fetch_timeout:
        description: "Per-URL source discovery timeout in seconds when regenerating strict-growth candidate evidence"
        required: false
        type: string
        default: "3"
      max_promotion_actions_per_pr:
        description: "Maximum selected promotion actions to apply in one generated Catalog PR."
        required: false
        type: string
        default: ""
      max_actions_per_plan:
        description: "Deprecated compatibility alias for max_promotion_actions_per_pr. Leave blank for new runs."
        required: false
        type: string
        default: ""
      pr_branch:
        description: "Optional branch for generated Catalog PR. Must start with agent-. If blank, derived from selected plan."
        required: false
        type: string
        default: ""
      pr_title:
        description: "Generated PR title. Must start with Catalog:"
        required: false
        type: string
        default: "Catalog: apply reviewed candidate source promotion"
      candidate_id:
        description: "candidate-bound mode: the bound candidate id selected by the growth controller."
        required: false
        type: string
        default: ""
      candidate_path:
        description: "candidate-bound mode: maintenance/candidates/<id>.json path of the bound candidate."
        required: false
        type: string
        default: ""
      content_digest:
        description: "candidate-bound mode: SHA-256 content digest binding the exact candidate state."
        required: false
        type: string
        default: ""
      selected_vendor:
        description: "candidate-bound mode: the vendor id the bound candidate resolves to (mutated == selected)."
        required: false
        type: string
        default: ""
      candidate_origin:
        description: "candidate-bound mode: the bound candidate origin."
        required: false
        type: string
        default: ""
  schedule:
    - cron: "47 8 * * 3"

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: candidate-promotion-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-promotion-pr:
    # The reviewed / strict-growth / quorum / coverage-queue paths. The
    # candidate-bound mutation runs in its own job below.
    if: ${{ github.event_name == 'schedule' || contains(fromJson('["reviewed-path","strict-growth-latest","strict-growth-artifact","strict-growth-shortlist","sitemap-source-latest","machine-provisional-from-queue"]'), inputs.promotion_plan_mode || 'reviewed-path') }}
    runs-on: ubuntu-latest
    env:
      REQUESTED_PROMOTION_PLAN_PATH: "${{ inputs.promotion_plan_path || '' }}"
      PROMOTION_PLAN_MODE: "${{ inputs.promotion_plan_mode || 'reviewed-path' }}"
      VENDOR_LIMIT: "${{ inputs.vendor_limit || '' }}"
      MAX_URLS_PER_TYPE: "${{ inputs.max_urls_per_type || '4' }}"
      FETCH_TIMEOUT: "${{ inputs.fetch_timeout || '3' }}"
      REQUESTED_MAX_PROMOTION_ACTIONS_PER_PR: "${{ inputs.max_promotion_actions_per_pr || '' }}"
      REQUESTED_MAX_ACTIONS_PER_PLAN: "${{ inputs.max_actions_per_plan || '' }}"
      REQUESTED_PR_BRANCH: "${{ inputs.pr_branch || '' }}"
      PR_TITLE: "${{ inputs.pr_title || 'Catalog: apply reviewed candidate source promotion' }}"
      SOURCE_DISCOVERY_RUN_ID: "${{ inputs.discovery_run_id || '' }}"
      SOURCE_DISCOVERY_ARTIFACT_ID: "${{ inputs.discovery_artifact_id || '' }}"
      SOURCE_DISCOVERY_PLAN_DIGEST: "${{ inputs.discovery_plan_digest || '' }}"
      OPENVA_WEB_BOT_AUTH_DIRECTORY_URL: ${{ secrets.OPENVA_WEB_BOT_AUTH_DIRECTORY_URL }}
      OPENVA_WEB_BOT_AUTH_PUBLIC_JWK_JSON: ${{ secrets.OPENVA_WEB_BOT_AUTH_PUBLIC_JWK_JSON }}
      OPENVA_WEB_BOT_AUTH_PRIVATE_KEY_PEM_B64: ${{ secrets.OPENVA_WEB_BOT_AUTH_PRIVATE_KEY_PEM_B64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Resolve promotion action cap
        run: |
          set -euo pipefail
          PREFERRED="$(printf '%s' "$REQUESTED_MAX_PROMOTION_ACTIONS_PER_PR" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          LEGACY="$(printf '%s' "$REQUESTED_MAX_ACTIONS_PER_PLAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$PREFERRED" ] && [ -z "$LEGACY" ]; then
            PREFERRED="50"
          fi
          for VALUE in "$PREFERRED" "$LEGACY"; do
            if [ -n "$VALUE" ]; then
              case "$VALUE" in
                *[!0-9]*) echo "max_promotion_actions_per_pr must be a non-negative integer" >&2; exit 1 ;;
              esac
            fi
          done
          if [ -n "$PREFERRED" ] && [ -n "$LEGACY" ] && [ "$PREFERRED" != "$LEGACY" ]; then
            echo "max_promotion_actions_per_pr and deprecated max_actions_per_plan differ" >&2
            exit 1
          fi
          RESOLVED="${PREFERRED:-$LEGACY}"
          echo "MAX_PROMOTION_ACTIONS_PER_PR=$RESOLVED" >> "$GITHUB_ENV"
      - name: Load artifact-bound strict-growth evidence
        if: env.PROMOTION_PLAN_MODE == 'strict-growth-artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SOURCE_DISCOVERY_RUN_ID" in ''|*[!0-9]*) echo "::error::discovery_run_id must be numeric"; exit 1 ;; esac
          case "$SOURCE_DISCOVERY_ARTIFACT_ID" in ''|*[HMT0-9]*) echo "::error::discovery_artifact_id must be numeric"; exit 1 ;; esac
          if ! printf '%s' "$SOURCE_DISCOVERY_PLAN_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::dMÄ