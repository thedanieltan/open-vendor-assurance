name: candidate-promotion-pr

on:
  workflow_dispatch:
    inputs:
      promotion_plan_path:
        description: "Optional reviewed or generated strict-growth promotion plan. If blank, selects the first unapplied reviewed candidate promotion plan."
        required: false
        type: string
        default: ""
      promotion_plan_mode:
        description: "reviewed-path, strict-growth-latest, or strict-growth-shortlist"
        required: false
        type: choice
        default: "reviewed-path"
        options:
          - reviewed-path
          - strict-growth-latest
          - strict-growth-shortlist
      vendor_limit:
        description: "Optional number of vendors/candidates to discover when regenerating strict growth"
        required: false
        type: string
      max_urls_per_type:
        description: "Maximum candidate URLs to probe per source type when regenerating strict growth"
        required: false
        type: string
        default: "4"
      fetch_timeout:
        description: "Per-URL source discovery timeout in seconds when regenerating strict growth"
        required: false
        type: string
        default: "3"
      max_actions_per_plan:
        description: "Maximum reviewed candidate promotion actions to apply in one generated Catalog PR."
        required: false
        type: string
        default: "50"
      pr_branch:
        description: "Optional branch for generated Catalog PR. Must start with agent-. If blank, derived from selected plan."
        required: false
        type: string
        default: ""
      pr_title:
        description: "Generated PR title. Must start with Catalog:"
        required: false
        type: string
        default: "Catalog: apply reviewed candidate source promotion"
  schedule:
    - cron: "47 8 * * 3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: candidate-promotion-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-promotion-pr:
    runs-on: ubuntu-latest
    env:
      REQUESTED_PROMOTION_PLAN_PATH: "${{ inputs.promotion_plan_path || '' }}"
      PROMOTION_PLAN_MODE: "${{ inputs.promotion_plan_mode || 'reviewed-path' }}"
      VENDOR_LIMIT: "${{ inputs.vendor_limit || '' }}"
      MAX_URLS_PER_TYPE: "${{ inputs.max_urls_per_type || '4' }}"
      FETCH_TIMEOUT: "${{ inputs.fetch_timeout || '3' }}"
      REQUESTED_MAX_ACTIONS_PER_PLAN: "${{ inputs.max_actions_per_plan || '50' }}"
      REQUESTED_PR_BRANCH: "${{ inputs.pr_branch || '' }}"
      PR_TITLE: "${{ inputs.pr_title || 'Catalog: apply reviewed candidate source promotion' }}"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Regenerate strict growth promotion plan
        if: env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist'
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.openva.catalog_growth_discovery_queue validate \
            --output catalog-growth-discovery-queue-summary.json
          python - <<'PY' > strict-growth-discovery.env
          import json

          queue = json.load(open('catalog-growth-discovery-queue-summary.json', encoding='utf-8'))
          source_types = ','.join(queue.get('source_types', []))
          print(f"QUEUE_VENDOR_LIMIT={queue['max_vendors_per_discovery_run']}")
          print(f"QUEUE_SOURCE_TYPES={source_types}")
          PY
          cat strict-growth-discovery.env >> "$GITHUB_ENV"
          source strict-growth-discovery.env
          python -m tools.openva.vendor_candidate_discovery discover \
            --output vendor-candidate-discovery-report.json
          LIMIT="$(printf '%s' "$VENDOR_LIMIT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$LIMIT" ]; then
            LIMIT="$QUEUE_VENDOR_LIMIT"
          fi
          python -m tools.openva.source_discovery discover-vendor-candidates \
            --vendor-candidates vendor-candidate-discovery-report.json \
            --vendor-limit "$LIMIT" \
            --source-types "$QUEUE_SOURCE_TYPES" \
            --max-urls-per-type "$MAX_URLS_PER_TYPE" \
            --fetch-timeout "$FETCH_TIMEOUT" \
            --output vendor-candidate-source-discovery-report.json
          python -m tools.openva.catalog_growth_eligibility classify \
            --vendor-candidates vendor-candidate-discovery-report.json \
            --source-discovery vendor-candidate-source-discovery-report.json \
            --output-json catalog-growth-eligibility-report.json \
            --output-strict catalog-growth-strict-promotions.json \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.sha }}"
          if [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ]; then
            python -m tools.openva.catalog_growth_backlog build \
              --eligibility-report catalog-growth-eligibility-report.json \
              --output-json catalog-growth-backlog-report.json \
              --output-csv reports/catalog-growth-backlog.csv \
              --output-md reports/catalog-growth-backlog-summary.md
            python -m tools.openva.strict_growth_shortlist build \
              --eligibility-report catalog-growth-eligibility-report.json \
              --backlog-report catalog-growth-backlog-report.json \
              --output-json strict-growth-shortlist.json \
              --output-csv reports/strict-growth-shortlist.csv \
              --output-md reports/strict-growth-shortlist-summary.md \
              --max-vendors 5 \
              --max-actions "$REQUESTED_MAX_ACTIONS_PER_PLAN"
            python -m tools.openva.strict_growth_shortlist plan \
              --shortlist strict-growth-shortlist.json \
              --output strict-growth-promotion-plan.json \
              --head-sha "${{ github.sha }}" \
              --base-sha "${{ github.sha }}" \
              --max-actions "$REQUESTED_MAX_ACTIONS_PER_PLAN"
          else
            python -m tools.openva.promotion_planner plan-strict-growth \
              --eligibility-report catalog-growth-eligibility-report.json \
              --output strict-growth-promotion-plan.json \
              --head-sha "${{ github.sha }}" \
              --base-sha "${{ github.sha }}" \
              --max-actions-per-plan "$REQUESTED_MAX_ACTIONS_PER_PLAN"
          fi
      - name: Select candidate promotion plan
        id: reviewed_plan
        run: |
          set -euo pipefail
          REQUESTED_PROMOTION_PLAN_PATH="$(printf '%s' "$REQUESTED_PROMOTION_PLAN_PATH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          REQUESTED_MAX_ACTIONS_PER_PLAN="$(printf '%s' "$REQUESTED_MAX_ACTIONS_PER_PLAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          case "$REQUESTED_MAX_ACTIONS_PER_PLAN" in
            ''|*[!0-9]*) echo "max_actions_per_plan must be a non-negative integer" >&2; exit 1 ;;
          esac
          case "$PROMOTION_PLAN_MODE" in
            reviewed-path|strict-growth-latest|strict-growth-shortlist) ;;
            *) echo "promotion_plan_mode must be reviewed-path, strict-growth-latest, or strict-growth-shortlist" >&2; exit 1 ;;
          esac
          if [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ]; then
            REQUESTED_PROMOTION_PLAN_PATH="strict-growth-promotion-plan.json"
          fi
          if [ -n "$REQUESTED_PROMOTION_PLAN_PATH" ]; then
            if [ ! -f "$REQUESTED_PROMOTION_PLAN_PATH" ]; then
              echo "Requested promotion plan file not found: $REQUESTED_PROMOTION_PLAN_PATH" >&2
              exit 1
            fi
            PLAN_SHA256=$(sha256sum "$REQUESTED_PROMOTION_PLAN_PATH" | awk '{print $1}')
            PLAN_ACTION_COUNT=$(python -c "import json, sys; data = json.load(open(sys.argv[1], encoding='utf-8')); print(len(data.get('actions', []) or []))" "$REQUESTED_PROMOTION_PLAN_PATH")
            if { [ "$PROMOTION_PLAN_MODE" = "strict-growth-latest" ] || [ "$PROMOTION_PLAN_MODE" = "strict-growth-shortlist" ]; } && [ "$PLAN_ACTION_COUNT" = "0" ]; then
              echo "HAS_REVIEWED_PLAN=false" >> "$GITHUB_ENV"
              echo "STRICT_GROWTH_NO_ACTIONS=true" >> "$GITHUB_ENV"
              echo "HAS_REVIEWED_PLAN=false" >> "$GITHUB_OUTPUT"
              echo "STRICT_GROWTH_NO_ACTIONS=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "HAS_REVIEWED_PLAN=true" >> "$GITHUB_ENV"
            echo "SELECTED_PLAN_PATH=$REQUESTED_PROMOTION_PLAN_PATH" >> "$GITHUB_ENV"
            echo "SELECTED_PLAN_SHA256=sha256:$PLAN_SHA256" >> "$GITHUB_ENV"
            echo "SELECTED_PLAN_ACTION_COUNT=$PLAN_ACTION_COUNT" >> "$GITHUB_ENV"
            echo "SELECTED_PR_BRANCH=agent-candidate-promotion-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            echo "HAS_REVIEWED_PLAN=true" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PLAN_PATH=$REQUESTED_PROMOTION_PLAN_PATH" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PLAN_SHA256=sha256:$PLAN_SHA256" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PLAN_ACTION_COUNT=$PLAN_ACTION_COUNT" >> "$GITHUB_OUTPUT"
            echo "SELECTED_PR_BRANCH=agent-candidate-promotion-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            python -m tools.openva.candidate_promotion_lifecycle select \
              --promotion-plan "$REQUESTED_PROMOTION_PLAN_PATH" \
              --max-actions-per-plan "$REQUESTED_MAX_ACTIONS_PER_PLAN" \
              --output reviewed-candidate-promotion.env
            cat reviewed-candidate-promotion.env >> "$GITHUB_ENV"
            cat reviewed-candidate-promotion.env >> "$GITHUB_OUTPUT"
          fi
      - name: Stop when no unapplied reviewed candidate promotion plan exists
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.reviewed_plan.outputs.STRICT_GROWTH_NO_ACTIONS }}" = "true" ]; then
            echo "Strict growth plan regenerated successfully with zero promotion actions."
          elif [ "${{ steps.reviewed_plan.outputs.REVIEWED_PLAN_ALREADY_APPLIED }}" = "true" ]; then
            echo "Reviewed candidate promotion plan already applied."
          else
            echo "No unapplied reviewed candidate promotion plans found."
          fi
      - name: Validate workflow inputs
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          set -euo pipefail
          PR_BRANCH="$(printf '%s' "$REQUESTED_PR_BRANCH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PR_TITLE="$(printf '%s' "$PR_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$PR_BRANCH" ]; then
            PR_BRANCH="$SELECTED_PR_BRANCH"
          fi
          echo "PROMOTION_PLAN_PATH=$SELECTED_PLAN_PATH" >> "$GITHUB_ENV"
          echo "PROMOTION_PLAN_SHA256=$SELECTED_PLAN_SHA256" >> "$GITHUB_ENV"
          echo "PROMOTION_PLAN_ACTION_COUNT=$SELECTED_PLAN_ACTION_COUNT" >> "$GITHUB_ENV"
          echo "MAX_ACTIONS_PER_PLAN=$REQUESTED_MAX_ACTIONS_PER_PLAN" >> "$GITHUB_ENV"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"
          case "$SELECTED_PLAN_PATH" in
            maintenance/reviewed/*.json|strict-growth-promotion-plan.json|maintenance/generated/strict-growth-*.json) ;;
            *) echo "promotion_plan_path must be under maintenance/reviewed/, strict-growth-promotion-plan.json, or maintenance/generated/strict-growth-*.json" >&2; exit 1 ;;
          esac
          test -f "$SELECTED_PLAN_PATH" || { echo "promotion plan file not found: $SELECTED_PLAN_PATH" >&2; exit 1; }
          case "$PR_BRANCH" in
            agent-*) ;;
            *) echo "pr_branch must start with agent-" >&2; exit 1 ;;
          esac
          case "$PR_TITLE" in
            Catalog:*) ;;
            *) echo "pr_title must start with Catalog:" >&2; exit 1 ;;
          esac
      - name: Preflight strict growth promotion plan
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')
        run: |
          python -m tools.openva.strict_growth_automerge check-plan \
            --promotion-plan strict-growth-promotion-plan.json \
            --eligibility-report catalog-growth-eligibility-report.json \
            --labels catalog-growth,automerge:strict-growth \
            --current-head-sha "${{ github.sha }}" \
            --current-base-sha "${{ github.sha }}" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Prepare strict growth evidence files
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')
        run: |
          set -euo pipefail
          mkdir -p maintenance/generated
          cp strict-growth-promotion-plan.json maintenance/generated/strict-growth-promotion-plan.json
          cp catalog-growth-eligibility-report.json maintenance/generated/strict-growth-eligibility-report.json
          if [ -f strict-growth-shortlist.json ]; then
            cp strict-growth-shortlist.json maintenance/generated/strict-growth-shortlist.json
          fi
          echo "PROMOTION_PLAN_PATH=maintenance/generated/strict-growth-promotion-plan.json" >> "$GITHUB_ENV"
          echo "ELIGIBILITY_REPORT_PATH=maintenance/generated/strict-growth-eligibility-report.json" >> "$GITHUB_ENV"
      - name: Validate current records
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: python -m tools.openva.validate validate
      - name: Apply candidate promotions
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          python -m tools.openva.candidate_promotion_actions apply \
            --promotion-plan "$PROMOTION_PLAN_PATH" \
            --output candidate-promotion-report.json
      - name: Validate generated catalog promotion
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: python -m tools.openva.validate validate
      - name: Rebuild generated outputs
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: python -m tools.openva.validate build-indexes
      - name: Check whether catalog changes were produced
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        id: catalog_changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data indexes dist maintenance/generated openva-pack.json; then
            echo "No candidate promotion changes produced."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Candidate promotion changes produced."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run source preflight for changed sources
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        id: source_preflight
        continue-on-error: true
        run: |
          {
            git diff --name-only HEAD -- data/vendors
            git ls-files --others --exclude-standard -- data/vendors
          } | sort -u > changed-paths.txt
          python -m tools.openva.source_preflight check-changed-sources \
            --paths-file changed-paths.txt \
            --output source-preflight-report.json
      - name: Upload source preflight report
        if: always() && steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-source-preflight-report
          path: source-preflight-report.json
          if-no-files-found: warn
      - name: Fail if source preflight failed
        if: steps.source_preflight.outcome == 'failure'
        run: exit 1
      - name: Prepare compact PR body
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.load(open('candidate-promotion-report.json', encoding='utf-8'))
          preflight = json.load(open('source-preflight-report.json', encoding='utf-8'))
          promotion_plan = json.load(open(os.environ['PROMOTION_PLAN_PATH'], encoding='utf-8'))
          plan_summary = promotion_plan.get('summary', {})
          lines = [
              '## Summary',
              '',
              'Applies OpenVA candidate promotions from a selected promotion plan.',
              '',
              '## Input',
              '',
              f"- Promotion plan: `{os.environ['PROMOTION_PLAN_PATH']}`",
              f"- Promotion plan SHA-256: `{os.environ['PROMOTION_PLAN_SHA256']}`",
              f"- Action count: `{os.environ['PROMOTION_PLAN_ACTION_COUNT']}`",
              f"- Max actions per generated PR: `{os.environ['MAX_ACTIONS_PER_PLAN']}`",
              '',
              '## Counts',
              '',
              f"- Promotion actions seen: `{report['summary']['promotion_actions_seen']}`",
              f"- Canonical vendors written: `{report['summary'].get('canonical_vendors_written', 0)}`",
              f"- Canonical sources written: `{report['summary']['canonical_sources_written']}`",
              f"- Skipped actions: `{report['summary']['skipped_actions']}`",
              f"- Source preflight failures: `{preflight['failed_count']}`",
              '',
              '## Guardrails',
              '',
              '- Applies only selected candidate promotion actions.',
              '- Runs source preflight over changed canonical source files.',
              '- Does not mirror raw documents.',
              '- Does not merge automatically.',
              '',
          ]
          if os.environ.get('ELIGIBILITY_REPORT_PATH'):
              insert_at = lines.index('## Counts') - 1
              lines[insert_at:insert_at] = [
                  f"- Strict-growth eligibility report: `{os.environ['ELIGIBILITY_REPORT_PATH']}`",
                  f"- Base SHA: `{os.environ['GITHUB_SHA']}`",
              ]
              counts_at = lines.index('## Counts') + 2
              lines[counts_at:counts_at] = [
                  f"- Strict-growth uncapped actions: `{plan_summary.get('uncapped_action_count', report['summary']['promotion_actions_seen'])}`",
                  f"- Strict-growth shortlist actions: `{plan_summary.get('shortlist_action_count', plan_summary.get('source_health_screened_action_count', report['summary']['promotion_actions_seen']))}`",
                  f"- Strict-growth policy-capped actions: `{plan_summary.get('policy_capped_action_count', report['summary']['promotion_actions_seen'])}`",
                  f"- Strict-growth batch-deferred actions: `{plan_summary.get('batch_deferred_action_count', 0)}`",
              ]
          Path('candidate-promotion-pr-body.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit and push promotion branch
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PR_BRANCH"
          git add data indexes dist openva-pack.json
          if [ -d maintenance/generated ]; then
            git add maintenance/generated
          fi
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Create or update pull request
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          cp candidate-promotion-pr-body.md candidate-promotion-pr-body-final.md
          {
            echo ""
            echo "- Head SHA: \`$HEAD_SHA\`"
          } >> candidate-promotion-pr-body-final.md
          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body-file candidate-promotion-pr-body-final.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "$PR_TITLE" \
              --body-file candidate-promotion-pr-body-final.md
          fi
      - name: Upload promotion artifacts
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-pr-artifacts
          path: |
            ${{ env.PROMOTION_PLAN_PATH }}
            candidate-promotion-report.json
            source-preflight-report.json
            candidate-promotion-pr-body.md
            candidate-promotion-pr-body-final.md
          if-no-files-found: error
      - name: Upload strict growth evidence artifacts
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true' && (env.PROMOTION_PLAN_MODE == 'strict-growth-latest' || env.PROMOTION_PLAN_MODE == 'strict-growth-shortlist')
        uses: actions/upload-artifact@v6
        with:
          name: openva-candidate-promotion-pr-strict-growth-evidence
          path: |
            ${{ env.ELIGIBILITY_REPORT_PATH }}
            maintenance/generated/strict-growth-promotion-plan.json
            maintenance/generated/strict-growth-eligibility-report.json
            maintenance/generated/strict-growth-shortlist.json
          if-no-files-found: error
