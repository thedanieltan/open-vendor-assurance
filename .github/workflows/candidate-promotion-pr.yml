name: candidate-promotion-pr

on:
  workflow_dispatch:
    inputs:
      promotion_plan_path:
        description: "Reviewed candidate promotion plan under maintenance/reviewed/"
        required: true
        type: string
      pr_branch:
        description: "Branch for generated Catalog PR. Must start with agent-."
        required: false
        type: string
        default: "agent-candidate-promotion"
      pr_title:
        description: "Generated PR title. Must start with Catalog:"
        required: false
        type: string
        default: "Catalog: apply reviewed candidate source promotion"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: candidate-promotion-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-promotion-pr:
    runs-on: ubuntu-latest
    env:
      PROMOTION_PLAN_PATH: "${{ inputs.promotion_plan_path }}"
      PR_BRANCH: "${{ inputs.pr_branch || 'agent-candidate-promotion' }}"
      PR_TITLE: "${{ inputs.pr_title || 'Catalog: apply reviewed candidate source promotion' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          PROMOTION_PLAN_PATH="$(printf '%s' "$PROMOTION_PLAN_PATH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PR_BRANCH="$(printf '%s' "$PR_BRANCH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PR_TITLE="$(printf '%s' "$PR_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "PROMOTION_PLAN_PATH=$PROMOTION_PLAN_PATH" >> "$GITHUB_ENV"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"
          case "$PROMOTION_PLAN_PATH" in
            maintenance/reviewed/*.json) ;;
            *) echo "promotion_plan_path must be under maintenance/reviewed/ and end with .json" >&2; exit 1 ;;
          esac
          test -f "$PROMOTION_PLAN_PATH" || { echo "promotion plan file not found: $PROMOTION_PLAN_PATH" >&2; exit 1; }
          case "$PR_BRANCH" in
            agent-*) ;;
            *) echo "pr_branch must start with agent-" >&2; exit 1 ;;
          esac
          case "$PR_TITLE" in
            Catalog:*) ;;
            *) echo "pr_title must start with Catalog:" >&2; exit 1 ;;
          esac
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Apply reviewed candidate promotions
        run: |
          python -m tools.openva.candidate_promotion_actions apply \
            --promotion-plan "$PROMOTION_PLAN_PATH" \
            --output candidate-promotion-report.json
      - name: Validate generated catalog promotion
        run: python -m tools.openva.validate validate
      - name: Check whether catalog changes were produced
        id: catalog_changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data indexes openva-pack.json; then
            echo "No candidate promotion changes produced."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Candidate promotion changes produced."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare compact PR body
        if: steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.load(open('candidate-promotion-report.json', encoding='utf-8'))
          lines = [
              '## Summary',
              '',
              'Applies reviewed OpenVA candidate source promotions from a committed promotion plan.',
              '',
              '## Reviewed input',
              '',
              f"- Promotion plan: `{os.environ['PROMOTION_PLAN_PATH']}`",
              '',
              '## Counts',
              '',
              f"- Promotion actions seen: `{report['summary']['promotion_actions_seen']}`",
              f"- Canonical sources written: `{report['summary']['canonical_sources_written']}`",
              f"- Skipped actions: `{report['summary']['skipped_actions']}`",
              '',
              '## Guardrails',
              '',
              '- Applies only reviewed candidate promotion actions.',
              '- Does not run live verification or discovery.',
              '- Does not mirror raw documents.',
              '- Does not merge automatically.',
              '',
          ]
          Path('candidate-promotion-pr-body.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit and push promotion branch
        if: steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PR_BRANCH"
          git add data indexes openva-pack.json
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Create or update pull request
        if: steps.catalog_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body-file candidate-promotion-pr-body.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "$PR_TITLE" \
              --body-file candidate-promotion-pr-body.md
          fi
      - name: Upload promotion artifacts
        if: steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openva-candidate-promotion-pr-artifacts
          path: |
            ${{ env.PROMOTION_PLAN_PATH }}
            candidate-promotion-report.json
            candidate-promotion-pr-body.md
          if-no-files-found: error
