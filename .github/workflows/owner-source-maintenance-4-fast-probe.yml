name: owner-source-maintenance-4-fast-probe

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-probe
  cancel-in-progress: true

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-fast-probe-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'requests>=2.32' 'pyyaml>=6'
      - name: Probe current URLs and strongest official path candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import threading
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          import requests
          import yaml

          ROOT = Path('.')
          targets = json.loads((ROOT / 'maintenance/reviewed/owner-source-maintenance-4-targets.json').read_text(encoding='utf-8'))['targets']
          local = threading.local()
          TITLE_RE = re.compile(r'<title[^>]*>(.*?)</title>', re.I | re.S)
          BAD = re.compile(r'/(blog|news|press|events?|webinars?|customers?|case-stud|careers?|jobs?|community|forum|support|help|docs?|documentation|developer|academy|learn|resources?)(/|$)', re.I)

          TERMS = {
              'privacy_notice': ['privacy policy', 'privacy notice', 'privacy statement', 'privacy'],
              'dpa': ['data processing addendum', 'data processing agreement', 'dpa'],
              'subprocessors_list': ['subprocessors', 'subprocessor list', 'sub-processors'],
              'security_page': ['security', 'information security'],
              'compliance_page': ['compliance', 'trust center', 'trust centre'],
              'terms_of_service': ['terms of service', 'terms of use', 'terms and conditions'],
          }
          PATHS = {
              'privacy_notice': ['/privacy-policy', '/privacy', '/legal/privacy-policy', '/legal/privacy'],
              'dpa': ['/data-processing-addendum', '/legal/data-processing-addendum', '/data-processing-agreement', '/legal/data-processing-agreement', '/dpa', '/legal/dpa'],
              'subprocessors_list': ['/subprocessors', '/legal/subprocessors', '/subprocessor-list', '/legal/subprocessor-list'],
              'security_page': ['/security', '/trust-center', '/trust/security', '/company/security'],
              'compliance_page': ['/compliance', '/trust-center', '/trust', '/security/compliance'],
              'terms_of_service': ['/terms-of-service', '/terms-of-use', '/legal/terms', '/terms'],
          }

          def get_session():
              if not hasattr(local, 'session'):
                  s = requests.Session()
                  s.headers.update({
                      'User-Agent': 'OpenVA-owner-source-maintenance/0.1 (+https://github.com/thedanieltan/open-vendor-assurance)',
                      'Accept': 'text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.5',
                  })
                  local.session = s
              return local.session

          def clean(value):
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', ' ', value)
              return re.sub(r'\s+', ' ', value).strip()

          def normalize(value):
              if not value:
                  return None
              try:
                  p = urlsplit(str(value).strip())
                  scheme = (p.scheme or 'https').lower()
                  host = (p.hostname or '').lower()
                  path = p.path or '/'
                  if path != '/':
                      path = path.rstrip('/')
                  return urlunsplit((scheme, host, path, p.query, ''))
              except Exception:
                  return str(value).strip()

          def allowed(host, allowed_hosts):
              host = (host or '').lower()
              return any(host == item or host.endswith('.' + item) for item in allowed_hosts)

          def probe(url):
              out = {'requested_url': url, 'status': None, 'final_url': None, 'title': None, 'content_type': None, 'error': None}
              try:
                  r = get_session().get(url, timeout=10, allow_redirects=True, stream=True)
                  out['status'] = r.status_code
                  out['final_url'] = r.url
                  out['content_type'] = r.headers.get('content-type')
                  chunks = []
                  size = 0
                  for chunk in r.iter_content(65536):
                      if not chunk:
                          continue
                      chunks.append(chunk)
                      size += len(chunk)
                      if size >= 250000:
                          break
                  text = b''.join(chunks).decode(r.encoding or 'utf-8', errors='replace')
                  match = TITLE_RE.search(text)
                  out['title'] = clean(match.group(1)) if match else None
              except Exception as exc:
                  out['error'] = f'{type(exc).__name__}: {exc}'
              return out

          def score(url, title, source_type):
              path = (urlsplit(url).path or '/').lower()
              words = path.replace('-', ' ').replace('_', ' ').replace('/', ' ')
              title_l = (title or '').lower()
              value = 0
              matches = []
              for term in TERMS.get(source_type, []):
                  if term in words:
                      value += 10
                      matches.append(f'path:{term}')
                  elif term in title_l:
                      value += 7
                      matches.append(f'title:{term}')
              if BAD.search(path + '/'):
                  value -= 15
                  matches.append('bad:editorial-support-docs')
              if path in {'', '/'}:
                  value -= 8
                  matches.append('bad:homepage')
              host = (urlsplit(url).hostname or '').lower()
              if source_type in {'security_page', 'compliance_page'} and 'trust' in host:
                  value += 3
                  matches.append('host:trust')
              return value, matches

          metadata = {}
          jobs = {}
          for row in targets:
              vendor_id = row['vendor_id']
              vendor = yaml.safe_load((ROOT / 'data/vendors' / vendor_id / 'vendor.yaml').read_text(encoding='utf-8')) or {}
              domains = [str(x).lower() for x in vendor.get('official_domains') or [] if x]
              entrypoints = [str(x) for x in vendor.get('public_entrypoints') or [] if x]
              allowed_hosts = set(domains)
              for value in entrypoints + [str(row.get('source_url') or '')]:
                  host = urlsplit(value).hostname
                  if host:
                      allowed_hosts.add(host.lower())
              source_type = str(row.get('source_type') or '')
              current_url = normalize(row.get('source_url'))
              candidate_urls = set()
              for entrypoint in entrypoints:
                  normalized = normalize(entrypoint)
                  if normalized and normalized != current_url:
                      candidate_urls.add(normalized)
              for host in allowed_hosts:
                  for path in PATHS.get(source_type, []):
                      candidate_urls.add(normalize(f'https://{host}{path}'))
              ranked = []
              for url in candidate_urls:
                  if not url or not allowed(urlsplit(url).hostname, allowed_hosts):
                      continue
                  pre, _ = score(url, '', source_type)
                  ranked.append((pre, url))
              ranked.sort(key=lambda item: (-item[0], item[1]))
              selected = [url for _, url in ranked[:5]]
              metadata[row['source_id']] = {
                  'row': row,
                  'allowed_hosts': sorted(allowed_hosts),
                  'current_url': current_url,
                  'candidates': selected,
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as pool:
              for source_id, info in metadata.items():
                  jobs[pool.submit(probe, info['row']['source_url'])] = (source_id, 'current', info['row']['source_url'])
                  for url in info['candidates']:
                      jobs[pool.submit(probe, url)] = (source_id, 'candidate', url)
              fetched = defaultdict(lambda: {'current': None, 'candidates': []})
              for future in concurrent.futures.as_completed(jobs):
                  source_id, kind, requested = jobs[future]
                  result = future.result()
                  if kind == 'current':
                      fetched[source_id]['current'] = result
                  else:
                      fetched[source_id]['candidates'].append(result)

          results = []
          for source_id, info in sorted(metadata.items()):
              row = info['row']
              current = fetched[source_id]['current'] or {}
              live = []
              for candidate in fetched[source_id]['candidates']:
                  status = candidate.get('status')
                  if not status or not (200 <= status < 400):
                      continue
                  final_url = normalize(candidate.get('final_url') or candidate.get('requested_url'))
                  if not final_url or not allowed(urlsplit(final_url).hostname, info['allowed_hosts']):
                      continue
                  candidate_score, matches = score(final_url, candidate.get('title'), str(row.get('source_type') or ''))
                  live.append({
                      'requested_url': candidate.get('requested_url'),
                      'final_url': final_url,
                      'status': status,
                      'title': candidate.get('title'),
                      'score': candidate_score,
                      'matches': matches,
                  })
              live.sort(key=lambda item: (-item['score'], item['final_url']))
              best = live[0] if live else None
              current_status = current.get('status')
              auto = bool(
                  current_status in {404, 410}
                  and best
                  and best['score'] >= 10
                  and not any(match.startswith('bad:') for match in best['matches'])
                  and best['final_url'] != info['current_url']
              )
              results.append({
                  'vendor_id': row['vendor_id'],
                  'source_id': source_id,
                  'source_type': row.get('source_type'),
                  'source_url': row.get('source_url'),
                  'review_state': row.get('review_state'),
                  'current_probe': current,
                  'best_candidate': best,
                  'live_candidates': live,
                  'auto_eligible': auto,
              })

          report = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_fast_probes',
              'base_commit': '${{ github.sha }}',
              'target_count': len(results),
              'current_live_count': sum(1 for r in results if (r['current_probe'].get('status') or 0) in range(200, 400)),
              'current_not_found_count': sum(1 for r in results if r['current_probe'].get('status') in {404, 410}),
              'auto_eligible_count': sum(1 for r in results if r['auto_eligible']),
              'results': results,
              'not_advice': True,
          }
          (ROOT / 'maintenance/reviewed/owner-source-maintenance-4-probes.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          lines = ['vendor_id\tsource_id\ttype\tcurrent_status\tauto_eligible\tbest_score\tbest_final_url\tbest_title']
          for row in results:
              best = row.get('best_candidate') or {}
              lines.append('\t'.join(str(value or '').replace('\t', ' ') for value in [
                  row['vendor_id'], row['source_id'], row['source_type'], row['current_probe'].get('status'),
                  'yes' if row['auto_eligible'] else 'no', best.get('score'), best.get('final_url'), best.get('title'),
              ]))
          (ROOT / 'maintenance/reviewed/owner-source-maintenance-4-probes.tsv').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps({k: report[k] for k in ('target_count', 'current_live_count', 'current_not_found_count', 'auto_eligible_count')}, indent=2))
          PY
      - name: Commit evidence and remove runner
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-fast-probe.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: complete concurrent source probes [owner-maintenance-4-fast-probe-complete]'
          git push
