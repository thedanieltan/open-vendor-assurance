name: owner-source-maintenance-4-builder

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4-builder

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-builder
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-builder-complete]') && !contains(github.event.head_commit.message, '[owner-maintenance-4-builder-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Merge latest main and regenerate catalog
        id: transaction
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG=/tmp/owner-source-maintenance-4-builder.log
          : > "$LOG"
          {
            git config user.name 'openva-owner-catalog'
            git config user.email 'openva-owner-catalog@users.noreply.github.com'
            git fetch origin main
            git show HEAD:maintenance/source-observations/latest-observations.json > /tmp/staged-observations.json
            git show origin/main:maintenance/source-observations/latest-observations.json > /tmp/main-observations.json

            set +e
            git merge --no-commit --no-ff origin/main
            MERGE_RC=$?
            set -e
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            if [ -n "$CONFLICTS" ]; then
              echo 'Merge conflicts:'
              printf '%s\n' "$CONFLICTS"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                case "$path" in
                  indexes/*|dist/vendors/*|openva-pack.json|maintenance/source-observations/latest-observations.json)
                    ;;
                  *)
                    echo "Unexpected canonical conflict: $path" >&2
                    exit 1
                    ;;
                esac
              done <<< "$CONFLICTS"
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                if [ "$path" != 'maintenance/source-observations/latest-observations.json' ]; then
                  git checkout --ours -- "$path"
                  git add "$path"
                fi
              done <<< "$CONFLICTS"
            elif [ "$MERGE_RC" -ne 0 ]; then
              echo "Merge failed without listed conflicts (status $MERGE_RC)." >&2
              exit 1
            fi

            python - <<'PY'
          import json
          from pathlib import Path

          maintenance_ids = {
              'aliyun-compliance',
              'aliyun-security',
              'darwinbox-security',
              'okta-inc-terms',
              'qualtrics-subprocessors',
              'scrut-automation-dpa',
              'secureframe-subprocessors',
              'shift-technology-security',
              'snowflake-security',
              'weaviate-privacy',
              'weaviate-subprocessors',
              'mistral-ai-dpa',
              'retool-privacy',
          }
          staged = json.loads(Path('/tmp/staged-observations.json').read_text(encoding='utf-8'))
          main = json.loads(Path('/tmp/main-observations.json').read_text(encoding='utf-8'))
          staged_by_id = {
              str(row['source_id']): row
              for row in staged.get('sources', [])
              if row.get('source_id')
          }
          merged = {
              str(row['source_id']): row
              for row in main.get('sources', [])
              if row.get('source_id')
          }
          missing = sorted(maintenance_ids - set(staged_by_id))
          if missing:
              raise SystemExit(f'maintenance observation rows missing: {missing}')
          for source_id in maintenance_ids:
              merged[source_id] = staged_by_id[source_id]
          rows = sorted(
              merged.values(),
              key=lambda row: (str(row.get('vendor_id') or ''), str(row.get('source_id') or '')),
          )
          result = dict(main)
          result['generated_at'] = max(str(main.get('generated_at') or ''), str(staged.get('generated_at') or ''))
          result['sources'] = rows
          result['summary'] = {
              'source_count': len(rows),
              'observed_this_run': len(maintenance_ids),
              'carried_forward': len(rows) - len(maintenance_ids),
          }
          Path('maintenance/source-observations/latest-observations.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'main_source_count': len(main.get('sources', [])),
              'combined_source_count': len(rows),
              'maintenance_overrides': len(maintenance_ids),
          }, indent=2, sort_keys=True))
          PY
            git add maintenance/source-observations/latest-observations.json
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved conflicts remain:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi

            python -m tools.openva.validate build-indexes
            git add data/vendors dist/vendors indexes openva-pack.json maintenance/source-observations/latest-observations.json
            python -m tools.openva.validate validate
            python -m tools.openva.catalog_audit audit --enforce
            python -m tools.openva.release_gates check --profile pr --out-json /tmp/release-gates.json --out-md /tmp/release-gates.md
            pytest -q \
              tests/test_catalog_guard.py \
              tests/test_source_type_labels.py \
              tests/test_generated_exports.py \
              tests/test_source_verification.py \
              tests/test_observation_ledger.py \
              tests/test_catalog_audit.py
            git diff --check
          } 2>&1 | tee "$LOG"
      - name: Commit regenerated builder result
        if: steps.transaction.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-builder.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: regenerate latest-main maintenance result [owner-maintenance-4-builder-complete]'
          git push
      - name: Preserve builder diagnostic
        if: steps.transaction.outcome == 'failure'
        run: |
          set -euo pipefail
          git merge --abort 2>/dev/null || true
          git reset --hard HEAD
          cp /tmp/owner-source-maintenance-4-builder.log maintenance/reviewed/owner-source-maintenance-4-builder-diagnostic.log
          rm -f .github/workflows/owner-source-maintenance-4-builder.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -f maintenance/reviewed/owner-source-maintenance-4-builder-diagnostic.log
          git add .github/workflows/owner-source-maintenance-4-builder.yml
          git commit -m 'Catalog: preserve builder diagnostic [owner-maintenance-4-builder-diagnostic]'
          git push
          exit 1
