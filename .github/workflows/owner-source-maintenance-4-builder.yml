name: owner-source-maintenance-4-builder

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4-builder

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-builder
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-current-builder-complete]') && !contains(github.event.head_commit.message, '[owner-maintenance-4-current-builder-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Merge observation state and regenerate outputs
        id: transaction
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG=/tmp/owner-source-maintenance-4-builder.log
          : > "$LOG"
          {
            git fetch origin main
            git show HEAD:maintenance/source-observations/latest-observations.json > /tmp/maintenance-observations.json
            git show origin/main:maintenance/source-observations/latest-observations.json > /tmp/main-observations.json
            python - <<'PY'
          import json
          from pathlib import Path

          source_ids = {
              'aliyun-compliance', 'aliyun-security', 'darwinbox-security',
              'okta-inc-terms', 'qualtrics-subprocessors', 'scrut-automation-dpa',
              'secureframe-subprocessors', 'shift-technology-security',
              'snowflake-security', 'weaviate-privacy', 'weaviate-subprocessors',
              'mistral-ai-dpa', 'retool-privacy',
          }
          maintenance = json.loads(Path('/tmp/maintenance-observations.json').read_text(encoding='utf-8'))
          main = json.loads(Path('/tmp/main-observations.json').read_text(encoding='utf-8'))
          maintenance_by_id = {
              str(row['source_id']): row
              for row in maintenance.get('sources', [])
              if row.get('source_id')
          }
          missing = sorted(source_ids - set(maintenance_by_id))
          if missing:
              raise SystemExit(f'missing maintenance observation rows: {missing}')
          combined = {
              str(row['source_id']): row
              for row in main.get('sources', [])
              if row.get('source_id')
          }
          for source_id in source_ids:
              combined[source_id] = maintenance_by_id[source_id]
          rows = sorted(
              combined.values(),
              key=lambda row: (str(row.get('vendor_id') or ''), str(row.get('source_id') or '')),
          )
          result = dict(main)
          result['generated_at'] = max(str(main.get('generated_at') or ''), str(maintenance.get('generated_at') or ''))
          result['sources'] = rows
          result['summary'] = {
              'source_count': len(rows),
              'observed_this_run': len(source_ids),
              'carried_forward': len(rows) - len(source_ids),
          }
          Path('maintenance/source-observations/latest-observations.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'main_source_count': len(main.get('sources', [])),
              'combined_source_count': len(rows),
              'maintenance_overrides': len(source_ids),
          }, indent=2, sort_keys=True))
          PY
            python -m tools.openva.validate build-indexes
            python -m tools.openva.validate validate
            python -m tools.openva.catalog_audit audit --enforce
            python -m tools.openva.release_gates check --profile pr --out-json /tmp/release-gates.json --out-md /tmp/release-gates.md
            pytest -q tests/test_catalog_guard.py tests/test_source_type_labels.py tests/test_generated_exports.py tests/test_source_verification.py tests/test_observation_ledger.py tests/test_catalog_audit.py
            git diff --check
          } 2>&1 | tee "$LOG"
      - name: Commit validated builder result
        if: steps.transaction.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-builder.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: regenerate maintenance on current main [owner-maintenance-4-current-builder-complete]'
          git push
      - name: Preserve builder diagnostic
        if: steps.transaction.outcome == 'failure'
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/owner-source-maintenance-4-builder.log maintenance/reviewed/owner-source-maintenance-4-current-builder-diagnostic.log
          rm -f .github/workflows/owner-source-maintenance-4-builder.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -f maintenance/reviewed/owner-source-maintenance-4-current-builder-diagnostic.log
          git add .github/workflows/owner-source-maintenance-4-builder.yml
          git commit -m 'Catalog: preserve current builder diagnostic [owner-maintenance-4-current-builder-diagnostic]'
          git push
          exit 1
