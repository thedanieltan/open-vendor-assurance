name: owner-source-maintenance-4-audit

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-audit-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: pip install 'pyyaml>=6'
      - name: Build unresolved-link inventory
        run: |
          set -euo pipefail
          mkdir -p maintenance/reviewed
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          import yaml

          root = Path('.')

          def load_yaml(path: Path):
              try:
                  return yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              except Exception as exc:
                  return {'_load_error': str(exc)}

          def normalize_url(value):
              if not isinstance(value, str) or not value.strip():
                  return None
              text = value.strip()
              try:
                  parts = urlsplit(text)
              except ValueError:
                  return text
              scheme = parts.scheme.lower()
              host = (parts.hostname or '').lower()
              port = parts.port
              netloc = host
              if port and not ((scheme == 'https' and port == 443) or (scheme == 'http' and port == 80)):
                  netloc = f'{host}:{port}'
              path = parts.path or '/'
              if path != '/':
                  path = path.rstrip('/')
              return urlunsplit((scheme, netloc, path, parts.query, ''))

          sources = []
          source_by_id = {}
          for path in sorted(root.glob('data/vendors/*/sources/*.yaml')):
              rec = load_yaml(path)
              sid = str(rec.get('source_id') or path.stem)
              row = {
                  'source_id': sid,
                  'vendor_id': str(rec.get('vendor_id') or path.parts[-3]),
                  'source_type': rec.get('source_type'),
                  'source_url': rec.get('source_url'),
                  'review_state': rec.get('review_state'),
                  'path': path.as_posix(),
                  'load_error': rec.get('_load_error'),
              }
              sources.append(row)
              source_by_id[sid] = row

          artifacts = []
          artifacts_by_source = defaultdict(list)
          for path in sorted(root.glob('data/vendors/*/artifacts/*.yaml')):
              rec = load_yaml(path)
              row = {
                  'artifact_id': str(rec.get('artifact_id') or path.stem),
                  'source_id': str(rec.get('source_id') or ''),
                  'vendor_id': str(rec.get('vendor_id') or path.parts[-3]),
                  'canonical_url': rec.get('canonical_url'),
                  'path': path.as_posix(),
                  'load_error': rec.get('_load_error'),
              }
              artifacts.append(row)
              if row['source_id']:
                  artifacts_by_source[row['source_id']].append(row)

          latest_path = root / 'maintenance/source-observations/latest-observations.json'
          latest = json.loads(latest_path.read_text(encoding='utf-8')) if latest_path.exists() else {}
          observations = {
              str(row.get('source_id')): row
              for row in latest.get('sources', [])
              if row.get('source_id')
          }

          candidates = []
          duplicate_groups = []
          by_vendor_url = defaultdict(list)

          for source in sources:
              sid = source['source_id']
              vendor_id = source['vendor_id']
              url = source.get('source_url')
              normalized = normalize_url(url)
              observation = observations.get(sid)
              linked_artifacts = artifacts_by_source.get(sid, [])
              reasons = []

              if source.get('load_error'):
                  reasons.append('source_yaml_load_error')
              if not url:
                  reasons.append('missing_source_url')
              if not linked_artifacts:
                  reasons.append('missing_same_id_artifact')
              elif any(normalize_url(a.get('canonical_url')) != normalized for a in linked_artifacts):
                  reasons.append('source_artifact_url_mismatch')
              if source.get('review_state') == 'quarantined':
                  reasons.append('quarantined_source')
              if observation is None:
                  reasons.append('missing_latest_observation')
              else:
                  status = observation.get('http_status')
                  health = observation.get('source_health_status')
                  if status in (404, 410):
                      reasons.append('observed_not_found')
                  elif health == 'unreachable':
                      reasons.append('observed_unreachable')
                  final_url = normalize_url(observation.get('final_url'))
                  if normalized and final_url and final_url != normalized:
                      reasons.append('observed_redirect_target_differs')

              if normalized:
                  by_vendor_url[(vendor_id, normalized)].append(sid)

              if reasons:
                  candidates.append({
                      **source,
                      'normalized_source_url': normalized,
                      'artifact_records': linked_artifacts,
                      'observation': observation,
                      'reasons': sorted(set(reasons)),
                  })

          for (vendor_id, normalized), source_ids in sorted(by_vendor_url.items()):
              if len(source_ids) > 1:
                  duplicate_groups.append({
                      'vendor_id': vendor_id,
                      'normalized_url': normalized,
                      'source_ids': sorted(source_ids),
                  })
                  for sid in source_ids:
                      if not any(c['source_id'] == sid for c in candidates):
                          source = source_by_id[sid]
                          candidates.append({
                              **source,
                              'normalized_source_url': normalized,
                              'artifact_records': artifacts_by_source.get(sid, []),
                              'observation': observations.get(sid),
                              'reasons': ['same_vendor_duplicate_url'],
                          })
                      else:
                          for c in candidates:
                              if c['source_id'] == sid:
                                  c['reasons'] = sorted(set(c['reasons']) | {'same_vendor_duplicate_url'})

          counts = defaultdict(int)
          for candidate in candidates:
              for reason in candidate['reasons']:
                  counts[reason] += 1

          report = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_audit',
              'base_commit': '${{ github.sha }}',
              'source_count': len(sources),
              'artifact_count': len(artifacts),
              'observation_count': len(observations),
              'candidate_count': len(candidates),
              'reason_counts': dict(sorted(counts.items())),
              'duplicate_groups': duplicate_groups,
              'candidates': sorted(candidates, key=lambda row: (row['vendor_id'], row['source_id'])),
              'not_advice': True,
          }
          out = root / 'maintenance/reviewed/owner-source-maintenance-4-audit.json'
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({k: report[k] for k in ('source_count', 'artifact_count', 'observation_count', 'candidate_count', 'reason_counts')}, indent=2, sort_keys=True))
          PY
      - name: Commit audit and remove runner
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-audit.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: inventory unresolved source links [owner-maintenance-4-audit-complete]'
          git push
