name: catalog-maintenance-pr

on:
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Optional number of sources to verify"
        required: false
        type: string
      vendor_limit:
        description: "Optional number of vendors to discover against"
        required: false
        type: string
      pr_branch:
        description: "Branch name for the generated cleanup PR. Must start with agent-"
        required: false
        type: string
        default: "agent-catalog-maintenance-cleanup"
      pr_title:
        description: "Cleanup PR title. Must start with Catalog:"
        required: false
        type: string
        default: "Catalog: apply reviewed source maintenance cleanup"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-maintenance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-maintenance-pr:
    runs-on: ubuntu-latest
    env:
      PR_BRANCH: "${{ inputs.pr_branch || 'agent-catalog-maintenance-cleanup' }}"
      PR_TITLE: "${{ inputs.pr_title || 'Catalog: apply reviewed source maintenance cleanup' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          PR_BRANCH="$(printf '%s' "$PR_BRANCH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PR_TITLE="$(printf '%s' "$PR_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"
          case "$PR_BRANCH" in
            agent-*) ;;
            *) echo "pr_branch must start with agent-" >&2; exit 1 ;;
          esac
          case "$PR_TITLE" in
            Catalog:*) ;;
            *) echo "pr_title must start with Catalog:" >&2; exit 1 ;;
          esac
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Build network source verification report
        run: |
          LIMIT="${{ inputs.source_limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_verification verify --limit "$LIMIT" --output source-verification-report.json
          else
            python -m tools.openva.source_verification verify --output source-verification-report.json
          fi
      - name: Build candidate source discovery report
        run: |
          LIMIT="${{ inputs.vendor_limit }}"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_discovery discover --vendor-limit "$LIMIT" --output source-discovery-report.json
          else
            python -m tools.openva.source_discovery discover --output source-discovery-report.json
          fi
      - name: Build promotion plan
        run: |
          python -m tools.openva.promotion_planner plan \
            --verification-report source-verification-report.json \
            --discovery-report source-discovery-report.json \
            --output promotion-plan.json
      - name: Apply maintenance actions
        run: |
          python -m tools.openva.maintenance_actions apply \
            --promotion-plan promotion-plan.json \
            --output maintenance-action-report.json
      - name: Validate generated catalog cleanup
        run: python -m tools.openva.validate validate
      - name: Stop if no catalog changes were produced
        run: |
          set -euo pipefail
          if git diff --quiet -- data indexes openva-pack.json; then
            echo "No catalog maintenance changes produced."
            exit 1
          fi
      - name: Build cleanup proposal for PR body
        run: |
          python -m tools.openva.cleanup_proposals build \
            --promotion-plan promotion-plan.json \
            --json-output cleanup-proposal.json \
            --markdown-output cleanup-proposal.md
      - name: Prepare PR body
        run: |
          cat > catalog-maintenance-pr-body.md <<'MARKDOWN'
          ## Summary

          Applies reviewed OpenVA source maintenance cleanup generated from the maintenance pipeline.

          This PR is non-advisory. It does not make legal, procurement, compliance, risk, vendor approval, or vendor recommendation conclusions.

          ## What changed

          - Removes canonical source records selected by `promotion-plan.json` cleanup actions.
          - Removes dependent artifact records and change records referencing those sources.
          - Adds unavailable-source ledger entries for cleaned-up source types.
          - Rebuilds indexes and `openva-pack.json`.

          ## Guardrails

          - Generated from `python -m tools.openva.maintenance_actions apply`.
          - Does not promote candidate sources.
          - Does not mirror raw documents.
          - Does not merge automatically.

          ## Cleanup proposal

          MARKDOWN
          cat cleanup-proposal.md >> catalog-maintenance-pr-body.md
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.PR_BRANCH }}
          delete-branch: false
          title: ${{ env.PR_TITLE }}
          body-path: catalog-maintenance-pr-body.md
          commit-message: ${{ env.PR_TITLE }}
          add-paths: |
            data
            indexes
            openva-pack.json
      - name: Upload maintenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openva-catalog-maintenance-pr-artifacts
          path: |
            source-verification-report.json
            source-discovery-report.json
            promotion-plan.json
            maintenance-action-report.json
            cleanup-proposal.json
            cleanup-proposal.md
            catalog-maintenance-pr-body.md
          if-no-files-found: error
