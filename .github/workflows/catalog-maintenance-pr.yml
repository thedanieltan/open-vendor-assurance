name: catalog-maintenance-pr

on:
  workflow_dispatch:
    inputs:
      promotion_plan_path:
        description: "Optional reviewed promotion plan JSON. If blank, the workflow selects the first unapplied reviewed plan."
        required: false
        type: string
        default: ""
      pr_branch:
        description: "Optional branch name for the generated cleanup PR. Must start with agent-. If blank, derived from the selected plan."
        required: false
        type: string
        default: ""
      pr_title:
        description: "Cleanup PR title. Must start with Catalog:"
        required: false
        type: string
        default: "Catalog: apply reviewed source maintenance cleanup"
  schedule:
    - cron: "41 7 * * 3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-maintenance-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-maintenance-pr:
    runs-on: ubuntu-latest
    env:
      REQUESTED_PROMOTION_PLAN_PATH: "${{ inputs.promotion_plan_path || '' }}"
      REQUESTED_PR_BRANCH: "${{ inputs.pr_branch || '' }}"
      PR_TITLE: "${{ inputs.pr_title || 'Catalog: apply reviewed source maintenance cleanup' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Select reviewed maintenance plan
        id: reviewed_plan
        run: |
          set -euo pipefail
          REQUESTED_PROMOTION_PLAN_PATH="$(printf '%s' "$REQUESTED_PROMOTION_PLAN_PATH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          python -m tools.openva.maintenance_lifecycle select \
            --promotion-plan "$REQUESTED_PROMOTION_PLAN_PATH" \
            --output reviewed-plan.env
          cat reviewed-plan.env >> "$GITHUB_ENV"
          cat reviewed-plan.env >> "$GITHUB_OUTPUT"
      - name: Stop when no unapplied reviewed plan exists
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.reviewed_plan.outputs.REVIEWED_PLAN_ALREADY_APPLIED }}" = "true" ]; then
            echo "Reviewed plan already applied."
          else
            echo "No unapplied reviewed maintenance plans found."
          fi
      - name: Validate workflow inputs
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          set -euo pipefail
          PR_BRANCH="$(printf '%s' "$REQUESTED_PR_BRANCH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PR_TITLE="$(printf '%s' "$PR_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$PR_BRANCH" ]; then
            PR_BRANCH="$SELECTED_PR_BRANCH"
          fi
          echo "PROMOTION_PLAN_PATH=$SELECTED_PLAN_PATH" >> "$GITHUB_ENV"
          echo "PROMOTION_PLAN_SHA256=$SELECTED_PLAN_SHA256" >> "$GITHUB_ENV"
          echo "PR_BRANCH=$PR_BRANCH" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"
          case "$SELECTED_PLAN_PATH" in
            maintenance/reviewed/*.json) ;;
            *) echo "promotion_plan_path must be under maintenance/reviewed/ and end with .json" >&2; exit 1 ;;
          esac
          test -f "$SELECTED_PLAN_PATH" || { echo "promotion plan file not found: $SELECTED_PLAN_PATH" >&2; exit 1; }
          case "$PR_BRANCH" in
            agent-*) ;;
            *) echo "pr_branch must start with agent-" >&2; exit 1 ;;
          esac
          case "$PR_TITLE" in
            Catalog:*) ;;
            *) echo "pr_title must start with Catalog:" >&2; exit 1 ;;
          esac
      - name: Apply reviewed maintenance actions
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: |
          python -m tools.openva.maintenance_actions apply \
            --promotion-plan "$PROMOTION_PLAN_PATH" \
            --output maintenance-action-report.json
      - name: Validate generated catalog cleanup
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        run: python -m tools.openva.validate validate
      - name: Check whether catalog changes were produced
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true'
        id: catalog_changes
        run: |
          set -euo pipefail
          if git diff --quiet -- data indexes openva-pack.json; then
            echo "No catalog maintenance changes produced."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Catalog maintenance changes produced."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build cleanup proposal artifact
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          python -m tools.openva.cleanup_proposals build \
            --promotion-plan "$PROMOTION_PLAN_PATH" \
            --json-output cleanup-proposal.json \
            --markdown-output cleanup-proposal.md
      - name: Prepare compact PR body
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          maintenance = json.load(open('maintenance-action-report.json', encoding='utf-8'))
          proposal = json.load(open('cleanup-proposal.json', encoding='utf-8'))
          plan_path = os.environ['PROMOTION_PLAN_PATH']
          plan_sha256 = os.environ['PROMOTION_PLAN_SHA256']
          lines = [
              '## Summary',
              '',
              'Applies reviewed OpenVA source maintenance cleanup from a committed promotion plan.',
              '',
              'This PR is non-advisory. It does not make legal, procurement, compliance, risk, vendor approval, or vendor recommendation conclusions.',
              '',
              '## Reviewed input',
              '',
              f'- Promotion plan: `{plan_path}`',
              f'- Promotion plan SHA-256: `{plan_sha256}`',
              '',
              '## What changed',
              '',
              '- Removes canonical source records selected by reviewed cleanup actions.',
              '- Removes dependent artifact records and change records referencing those sources.',
              '- Adds unavailable-source ledger entries for cleaned-up source types.',
              '- Rebuilds indexes and `openva-pack.json`.',
              '',
              '## Counts',
              '',
              f"- Cleanup actions selected: `{maintenance['summary']['cleanup_actions_selected']}`",
              f"- File actions applied: `{maintenance['summary']['file_actions_applied']}`",
              f"- Skipped actions: `{maintenance['summary']['skipped_actions']}`",
              f"- Blocking cleanup actions: `{proposal['summary']['blocking_cleanup_actions']}`",
              f"- Promotable candidate actions, not applied: `{proposal['summary']['promotable_candidate_actions']}`",
              '',
              '## Guardrails',
              '',
              '- Selected automatically only from committed reviewed plans under `maintenance/reviewed/` that are not registered as applied.',
              '- Does not perform live source verification.',
              '- Does not perform live source discovery.',
              '- Does not promote candidate sources.',
              '- Does not mirror raw documents.',
              '- Does not merge automatically.',
              '- Full cleanup proposal is available in the workflow artifact `cleanup-proposal.md`.',
              '',
          ]
          Path('catalog-maintenance-pr-body.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit and push maintenance branch
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$PR_BRANCH"
          git add data indexes openva-pack.json
          git commit -m "$PR_TITLE"
          git push --force-with-lease origin "$PR_BRANCH"
      - name: Create or update pull request
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body-file catalog-maintenance-pr-body.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "$PR_TITLE" \
              --body-file catalog-maintenance-pr-body.md
          fi
      - name: Upload maintenance artifacts
        if: steps.reviewed_plan.outputs.HAS_REVIEWED_PLAN == 'true' && steps.catalog_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openva-catalog-maintenance-pr-artifacts
          path: |
            ${{ env.PROMOTION_PLAN_PATH }}
            maintenance-action-report.json
            cleanup-proposal.json
            cleanup-proposal.md
            catalog-maintenance-pr-body.md
          if-no-files-found: error
