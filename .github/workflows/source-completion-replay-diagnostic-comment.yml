name: source-completion-replay-diagnostic-comment

on:
  pull_request:
    branches:
      - catalog/source-completion-audit-control
    types: [opened, synchronize, reopened]

permissions:
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: '29276262664'
    steps:
      - name: Extract and print failed replay diagnostic
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-completion-diagnostic/logs
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" > /tmp/source-completion-diagnostic/jobs.json
          jq -r '.jobs[] | select(.conclusion == "failure") | .id' /tmp/source-completion-diagnostic/jobs.json > /tmp/source-completion-diagnostic/failed-job-ids.txt
          while read -r job_id; do
            [ -n "$job_id" ] || continue
            gh api "repos/$REPO/actions/jobs/$job_id/logs" > "/tmp/source-completion-diagnostic/logs/job-$job_id.log" || true
          done < /tmp/source-completion-diagnostic/failed-job-ids.txt
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/source-completion-diagnostic')
          jobs = json.loads((root / 'jobs.json').read_text())
          print('SOURCE_COMPLETION_REPLAY_DIAGNOSTIC_BEGIN')
          print(f"run_id=29276262664 job_count={len(jobs.get('jobs', []))}")
          failed_count = 0
          for job in jobs.get('jobs', []):
              if job.get('conclusion') != 'failure':
                  continue
              failed_count += 1
              job_id = job.get('id')
              log_path = root / 'logs' / f'job-{job_id}.log'
              log_text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
              log_lines = log_text.splitlines()
              signal = [
                  line for line in log_lines
                  if any(token in line.lower() for token in ('error', 'failed', 'failure', 'traceback', 'exception', 'assert', 'invalid', 'conflict', 'rejected', 'keyerror', 'valueerror', 'typeerror'))
              ]
              failed_steps = [
                  str(step.get('name'))
                  for step in job.get('steps') or []
                  if step.get('conclusion') == 'failure'
              ]
              print(f"FAILED_JOB id={job_id} name={job.get('name')!r}")
              print('FAILED_STEPS ' + ' | '.join(failed_steps))
              print('SIGNAL_BEGIN')
              for line in signal[-160:]:
                  print(line)
              print('SIGNAL_END')
              print('TAIL_BEGIN')
              for line in log_lines[-220:]:
                  print(line)
              print('TAIL_END')
          print(f'failed_job_count={failed_count}')
          print('SOURCE_COMPLETION_REPLAY_DIAGNOSTIC_END')
          PY
