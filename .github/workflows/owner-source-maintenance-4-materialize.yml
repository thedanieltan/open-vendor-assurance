name: owner-source-maintenance-4-materialize

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Apply reviewed source and artifact replacements
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          root = Path('.')
          plan = json.loads((root / 'maintenance/reviewed/owner-source-maintenance-4-plan.json').read_text(encoding='utf-8'))
          detected_at = '2026-07-13T16:00:00Z'
          source_paths = []

          def load_yaml(path: Path):
              value = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path}: expected mapping')
              return value

          def write_yaml(path: Path, value):
              path.write_text(
                  yaml.safe_dump(value, sort_keys=False, allow_unicode=True, width=1000),
                  encoding='utf-8',
              )

          for item in plan['replacements']:
              vendor_id = item['vendor_id']
              source_id = item['source_id']
              source_path = root / 'data' / 'vendors' / vendor_id / 'sources' / f'{source_id}.yaml'
              if not source_path.exists():
                  raise SystemExit(f'missing source record: {source_path}')
              source = load_yaml(source_path)
              if str(source.get('vendor_id')) != vendor_id or str(source.get('source_id')) != source_id:
                  raise SystemExit(f'identity mismatch in {source_path}')
              if str(source.get('source_type')) != item['source_type']:
                  raise SystemExit(f'source type mismatch in {source_path}')
              if str(source.get('source_url')).rstrip('/') != str(item['old_url']).rstrip('/'):
                  raise SystemExit(f'old URL drift in {source_path}: {source.get("source_url")}')

              source['source_url'] = item['new_url']
              provenance = source.get('provenance') if isinstance(source.get('provenance'), dict) else {}
              provenance['publisher'] = provenance.get('publisher') or 'vendor'
              provenance['collected_at'] = detected_at
              provenance['observer'] = 'human'
              provenance['confidence'] = item['confidence']
              source['provenance'] = provenance
              write_yaml(source_path, source)
              source_paths.append(source_path.as_posix())

              artifacts = sorted((root / 'data' / 'vendors' / vendor_id / 'artifacts').glob('*.yaml'))
              matched_artifacts = []
              for artifact_path in artifacts:
                  artifact = load_yaml(artifact_path)
                  if str(artifact.get('source_id') or '') != source_id:
                      continue
                  artifact['canonical_url'] = item['new_url']
                  write_yaml(artifact_path, artifact)
                  matched_artifacts.append(artifact_path)
              if not matched_artifacts:
                  raise SystemExit(f'no artifact linked to replacement source {source_id}')

              change_path = root / 'data' / 'vendors' / vendor_id / 'changes' / f'owner-source-maintenance-4-{source_id}.yaml'
              if change_path.exists():
                  raise SystemExit(f'change event already exists: {change_path}')
              change = {
                  'schema_version': '0.1.0',
                  'change_id': f'owner-source-maintenance-4-{source_id}',
                  'vendor_id': vendor_id,
                  'source_id': source_id,
                  'artifact_id': source_id,
                  'change_type': 'updated',
                  'detected_at': detected_at,
                  'from_hash': 'sha256:TBD',
                  'to_hash': 'sha256:TBD',
                  'catalog_change_significance': 'unknown',
                  'materiality': 'unknown',
                  'review_state': 'proposed',
                  'summary': 'Owner-led catalog maintenance replaced a confirmed broken public source URL and aligned its artifact metadata.',
                  'not_advice': True,
              }
              write_yaml(change_path, change)

          for item in plan['refresh_only']:
              source_path = root / 'data' / 'vendors' / item['vendor_id'] / 'sources' / f"{item['source_id']}.yaml"
              source = load_yaml(source_path)
              if str(source.get('source_url')).rstrip('/') != str(item['url']).rstrip('/'):
                  raise SystemExit(f'refresh-only URL drift in {source_path}')
              source_paths.append(source_path.as_posix())

          source_paths = sorted(set(source_paths))
          (root / 'maintenance/reviewed/owner-source-maintenance-4-source-paths.txt').write_text(
              '\n'.join(source_paths) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'replacement_count': len(plan['replacements']),
              'refresh_only_count': len(plan['refresh_only']),
              'verification_source_count': len(source_paths),
          }, indent=2, sort_keys=True))
          PY
      - name: Verify changed and refreshed sources through authority-bound verifier
        run: |
          set -euo pipefail
          python -m tools.openva.source_verification verify \
            --source-path-file maintenance/reviewed/owner-source-maintenance-4-source-paths.txt \
            --fail-on-review \
            --output /tmp/owner-source-maintenance-4-verification.json
      - name: Project verified observations and rebuild generated outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          verification = json.loads(Path('/tmp/owner-source-maintenance-4-verification.json').read_text(encoding='utf-8'))
          latest_path = root / 'maintenance/source-observations/latest-observations.json'
          latest = json.loads(latest_path.read_text(encoding='utf-8'))
          observed_at = '2026-07-13T16:00:00Z'

          failures = verification.get('failures') or []
          if failures:
              raise SystemExit(f'verification pipeline failures: {failures}')
          sources = verification.get('sources') or []
          if len(sources) != 16:
              raise SystemExit(f'expected 16 verified sources, got {len(sources)}')
          bad = [row for row in sources if row.get('verification_status') not in {'ok', 'redirected'}]
          if bad:
              raise SystemExit('non-acceptable verification statuses: ' + json.dumps(bad, sort_keys=True))

          by_id = {
              str(row['source_id']): row
              for row in latest.get('sources', [])
              if row.get('source_id')
          }
          for row in sources:
              source_id = str(row['source_id'])
              content_type = str(row.get('content_type') or '').lower()
              by_id[source_id] = {
                  'observation_id': f'owner-source-maintenance-4-{source_id}-2026-07-13',
                  'vendor_id': row.get('vendor_id'),
                  'source_id': source_id,
                  'source_url': row.get('source_url'),
                  'final_url': row.get('final_url'),
                  'observed_at': observed_at,
                  'http_status': row.get('http_status'),
                  'retrieval_method': 'pdf_document' if 'pdf' in content_type else 'html_page',
                  'raw_sample_sha256': row.get('raw_sample_sha256') or 'sha256:TBD',
                  'normalized_text_sample_sha256': row.get('normalized_text_sample_sha256') or 'sha256:TBD',
                  'change_class': 'non_material',
                  'source_health_status': 'reachable',
                  'review_signal': {'required': False, 'reason': None},
                  'carried_forward': False,
              }

          projected = sorted(
              by_id.values(),
              key=lambda row: (str(row.get('vendor_id') or ''), str(row.get('source_id') or '')),
          )
          latest['generated_at'] = observed_at
          latest['sources'] = projected
          latest['summary'] = {
              'source_count': len(projected),
              'observed_this_run': len(sources),
              'carried_forward': len(projected) - len(sources),
          }
          latest_path.write_text(json.dumps(latest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m tools.openva.validate build-indexes
      - name: Validate transaction
        run: |
          set -euo pipefail
          python -m tools.openva.validate validate
          python -m tools.openva.catalog_audit audit --enforce
          python -m tools.openva.release_gates check --profile pr \
            --out-json /tmp/release-gates.json \
            --out-md /tmp/release-gates.md
          pytest -q \
            tests/test_catalog_guard.py \
            tests/test_source_type_labels.py \
            tests/test_generated_exports.py \
            tests/test_source_verification.py \
            tests/test_observation_ledger.py \
            tests/test_catalog_audit.py
          git diff --check
      - name: Commit materialized catalog transaction
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-materialize.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add data/vendors dist/vendors indexes openva-pack.json maintenance/source-observations/latest-observations.json maintenance/reviewed/owner-source-maintenance-4-source-paths.txt .github/workflows/owner-source-maintenance-4-materialize.yml
          git commit -m 'Catalog: materialize reviewed source repairs [owner-maintenance-4-materialized]'
          git push
