name: owner-source-maintenance-4-materialize

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-materialize
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-verification-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Prepare reviewed URLs for non-mutating verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path('.')
          plan = json.loads((root / 'maintenance/reviewed/owner-source-maintenance-4-plan.json').read_text(encoding='utf-8'))
          paths = []
          for item in plan['replacements']:
              path = root / 'data' / 'vendors' / item['vendor_id'] / 'sources' / f"{item['source_id']}.yaml"
              source = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              if str(source.get('source_url')).rstrip('/') != str(item['old_url']).rstrip('/'):
                  raise SystemExit(f'old URL drift in {path}: {source.get("source_url")}')
              source['source_url'] = item['new_url']
              path.write_text(yaml.safe_dump(source, sort_keys=False, allow_unicode=True, width=1000), encoding='utf-8')
              paths.append(path.as_posix())
          for item in plan['refresh_only']:
              path = root / 'data' / 'vendors' / item['vendor_id'] / 'sources' / f"{item['source_id']}.yaml"
              paths.append(path.as_posix())
          Path('/tmp/owner-source-maintenance-4-source-paths.txt').write_text('\n'.join(sorted(set(paths))) + '\n', encoding='utf-8')
          PY
      - name: Run authority-bound verifier without mutation
        run: |
          set -euo pipefail
          python -m tools.openva.source_verification verify \
            --source-path-file /tmp/owner-source-maintenance-4-source-paths.txt \
            --output /tmp/owner-source-maintenance-4-verification.json
      - name: Commit diagnostic and retire runner
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/owner-source-maintenance-4-verification.json maintenance/reviewed/owner-source-maintenance-4-verification-diagnostic.json
          rm -f .github/workflows/owner-source-maintenance-4-materialize.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add maintenance/reviewed/owner-source-maintenance-4-verification-diagnostic.json .github/workflows/owner-source-maintenance-4-materialize.yml
          git commit -m 'Catalog: preserve authority-bound verification diagnostic [owner-maintenance-4-verification-diagnostic]'
          git push
