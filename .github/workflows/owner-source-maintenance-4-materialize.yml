name: owner-source-maintenance-4-materialize

on:
  push:
    branches:
      - catalog/owner-source-maintenance-4

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-4-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-4-materialized]') && !contains(github.event.head_commit.message, '[owner-maintenance-4-materialize-diagnostic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Replay reviewed maintenance transaction
        id: transaction
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG=/tmp/owner-source-maintenance-4-materialize.log
          : > "$LOG"
          {
            echo 'STAGE apply-reviewed-records'
            python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          import yaml

          root = Path('.')
          plan = json.loads((root / 'maintenance/reviewed/owner-source-maintenance-4-plan.json').read_text(encoding='utf-8'))
          verification = json.loads((root / 'maintenance/reviewed/owner-source-maintenance-4-verification-diagnostic.json').read_text(encoding='utf-8'))
          timestamp = '2026-07-13T15:50:00Z'

          def load_yaml(path: Path):
              value = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path}: expected mapping')
              return value

          def write_yaml(path: Path, value):
              path.write_text(yaml.safe_dump(value, sort_keys=False, allow_unicode=True, width=1000), encoding='utf-8')

          expected = {item['source_id']: item['new_url'] for item in plan['replacements']}
          expected.update({item['source_id']: item['url'] for item in plan['refresh_only']})
          exceptions = {item['source_id']: item for item in plan.get('verification_exceptions', [])}
          diagnostic_rows = {
              str(row['source_id']): row
              for row in verification.get('sources', [])
              if str(row.get('source_id') or '') in expected
          }
          if set(diagnostic_rows) != set(expected):
              raise SystemExit(f'diagnostic source set mismatch: expected {sorted(expected)}, got {sorted(diagnostic_rows)}')

          def canonical_parts(url):
              parsed = urlsplit(str(url or ''))
              return ((parsed.hostname or '').lower(), (parsed.path or '/').rstrip('/') or '/')

          accepted = []
          for source_id, row in sorted(diagnostic_rows.items()):
              status = str(row.get('verification_status') or '')
              if status in {'ok', 'redirected'}:
                  accepted.append(row)
                  continue
              exception = exceptions.get(source_id)
              if not exception or status not in set(exception.get('allowed_statuses') or []):
                  raise SystemExit(f'{source_id}: unaccepted diagnostic status {status}')
              http_status = row.get('http_status')
              if not isinstance(http_status, int) or not (200 <= http_status < 400):
                  raise SystemExit(f'{source_id}: exception requires HTTP 2xx/3xx')
              if row.get('fetch_error') or row.get('soft_404_detected'):
                  raise SystemExit(f'{source_id}: exception cannot accept fetch error or soft 404')
              expected_host, expected_path = canonical_parts(expected[source_id])
              final_host, final_path = canonical_parts(row.get('final_url'))
              if (expected_host, expected_path) != (final_host, final_path):
                  raise SystemExit(f'{source_id}: authority/path drift {row.get("final_url")}')
              title = str(row.get('title_detected') or '').lower()
              final_path_lower = final_path.lower()
              title_terms = [str(value).lower() for value in exception.get('expected_title_terms') or []]
              path_terms = [str(value).lower() for value in exception.get('expected_path_terms') or []]
              if title_terms and not any(term in title for term in title_terms):
                  raise SystemExit(f'{source_id}: title exception evidence absent')
              if path_terms and not any(term in final_path_lower for term in path_terms):
                  raise SystemExit(f'{source_id}: path exception evidence absent')
              accepted.append(row)

          for item in plan['replacements']:
              vendor_id = item['vendor_id']
              source_id = item['source_id']
              source_path = root / 'data' / 'vendors' / vendor_id / 'sources' / f'{source_id}.yaml'
              source = load_yaml(source_path)
              if str(source.get('source_url')).rstrip('/') != str(item['old_url']).rstrip('/'):
                  raise SystemExit(f'old URL drift in {source_path}: {source.get("source_url")}')
              if str(source.get('source_type')) != item['source_type']:
                  raise SystemExit(f'source type drift in {source_path}')
              source['source_url'] = item['new_url']
              provenance = source.get('provenance') if isinstance(source.get('provenance'), dict) else {}
              provenance['publisher'] = provenance.get('publisher') or 'vendor'
              provenance['collected_at'] = timestamp
              provenance['observer'] = 'human'
              provenance['confidence'] = item['confidence']
              source['provenance'] = provenance
              write_yaml(source_path, source)

              matched = 0
              for artifact_path in sorted((root / 'data' / 'vendors' / vendor_id / 'artifacts').glob('*.yaml')):
                  artifact = load_yaml(artifact_path)
                  if str(artifact.get('source_id') or '') != source_id:
                      continue
                  artifact['canonical_url'] = item['new_url']
                  write_yaml(artifact_path, artifact)
                  matched += 1
              if matched == 0:
                  raise SystemExit(f'no same-source artifact for {source_id}')

              change_path = root / 'data' / 'vendors' / vendor_id / 'changes' / f'owner-source-maintenance-4-{source_id}.yaml'
              if change_path.exists():
                  raise SystemExit(f'change event already exists: {change_path}')
              write_yaml(change_path, {
                  'schema_version': '0.1.0',
                  'change_id': f'owner-source-maintenance-4-{source_id}',
                  'vendor_id': vendor_id,
                  'source_id': source_id,
                  'artifact_id': source_id,
                  'change_type': 'updated',
                  'detected_at': timestamp,
                  'from_hash': 'sha256:TBD',
                  'to_hash': 'sha256:TBD',
                  'catalog_change_significance': 'unknown',
                  'materiality': 'unknown',
                  'review_state': 'proposed',
                  'summary': 'Owner-led catalog maintenance replaced a confirmed broken public source URL and aligned its artifact metadata.',
                  'not_advice': True,
              })

          latest_path = root / 'maintenance/source-observations/latest-observations.json'
          latest = json.loads(latest_path.read_text(encoding='utf-8'))
          by_id = {str(row['source_id']): row for row in latest.get('sources', []) if row.get('source_id')}
          for row in accepted:
              source_id = str(row['source_id'])
              content_type = str(row.get('content_type') or '').lower()
              by_id[source_id] = {
                  'observation_id': f'owner-source-maintenance-4-{source_id}-2026-07-13',
                  'vendor_id': row.get('vendor_id'),
                  'source_id': source_id,
                  'source_url': expected[source_id],
                  'final_url': row.get('final_url'),
                  'observed_at': timestamp,
                  'http_status': row.get('http_status'),
                  'retrieval_method': 'pdf_document' if 'pdf' in content_type else 'html_page',
                  'raw_sample_sha256': row.get('raw_sample_sha256') or 'sha256:TBD',
                  'normalized_text_sample_sha256': row.get('normalized_text_sample_sha256') or 'sha256:TBD',
                  'change_class': 'non_material',
                  'source_health_status': 'reachable',
                  'review_signal': {'required': False, 'reason': None},
                  'carried_forward': False,
              }
          projected = sorted(by_id.values(), key=lambda row: (str(row.get('vendor_id') or ''), str(row.get('source_id') or '')))
          latest['generated_at'] = timestamp
          latest['sources'] = projected
          latest['summary'] = {
              'source_count': len(projected),
              'observed_this_run': len(accepted),
              'carried_forward': len(projected) - len(accepted),
          }
          latest_path.write_text(json.dumps(latest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'replacements': len(plan['replacements']), 'refreshed_observations': len(accepted), 'exceptions': len(exceptions)}, indent=2))
          PY

            echo 'STAGE build-indexes'
            python -m tools.openva.validate build-indexes
            echo 'STAGE validate'
            python -m tools.openva.validate validate
            echo 'STAGE catalog-audit'
            python -m tools.openva.catalog_audit audit --enforce
            echo 'STAGE release-gates'
            python -m tools.openva.release_gates check --profile pr --out-json /tmp/release-gates.json --out-md /tmp/release-gates.md
            echo 'STAGE focused-tests'
            pytest -q tests/test_catalog_guard.py tests/test_source_type_labels.py tests/test_generated_exports.py tests/test_source_verification.py tests/test_observation_ledger.py tests/test_catalog_audit.py
            echo 'STAGE diff-check'
            git diff --check
          } 2>&1 | tee "$LOG"
      - name: Commit successful transaction
        if: steps.transaction.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-source-maintenance-4-materialize.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add data/vendors dist/vendors indexes openva-pack.json maintenance/source-observations/latest-observations.json .github/workflows/owner-source-maintenance-4-materialize.yml
          git commit -m 'Catalog: materialize reviewed source repairs [owner-maintenance-4-materialized]'
          git push
      - name: Preserve failure diagnostic
        if: steps.transaction.outcome == 'failure'
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/owner-source-maintenance-4-materialize.log maintenance/reviewed/owner-source-maintenance-4-materialize-diagnostic.log
          rm -f .github/workflows/owner-source-maintenance-4-materialize.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -f maintenance/reviewed/owner-source-maintenance-4-materialize-diagnostic.log
          git add .github/workflows/owner-source-maintenance-4-materialize.yml
          git commit -m 'Catalog: preserve materialization diagnostic [owner-maintenance-4-materialize-diagnostic]'
          git push
          exit 1
