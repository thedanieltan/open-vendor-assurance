name: catalog-pr-guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: catalog-pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  catalog-pr-guard:
    if: startsWith(github.event.pull_request.title, 'Catalog:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > /tmp/catalog-pr-files.txt
          cat /tmp/catalog-pr-files.txt
      - name: Enforce catalog-agent file boundary
        run: python -m tools.openva.catalog_guard $(cat /tmp/catalog-pr-files.txt)
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Run tests
        run: pytest -q
