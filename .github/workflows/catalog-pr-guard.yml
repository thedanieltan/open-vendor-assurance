name: catalog-pr-guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: catalog-pr-guard-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  catalog-pr-guard:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Catalog:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > /tmp/catalog-pr-files.txt
          cat /tmp/catalog-pr-files.txt
      - name: Enforce catalog-agent file boundary
        run: python -m tools.openva.catalog_guard $(cat /tmp/catalog-pr-files.txt)
      - name: Classify generated catalog fast path
        id: generated_catalog_fast_path
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json title,headRefName,body > /tmp/catalog-pr-metadata.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.openva.generated_catalog_pr_risk import (
              GENERATED_CATALOG_WORK_PACKAGE,
              GeneratedCatalogPrRiskClass,
              classify_generated_catalog_pr_risk,
              extract_work_package,
              is_generated_candidate_promotion_pr,
          )

          metadata = json.loads(Path("/tmp/catalog-pr-metadata.json").read_text(encoding="utf-8"))
          changed_paths = [
              line.strip()
              for line in Path("/tmp/catalog-pr-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          branch = metadata.get("headRefName") or ""
          title = metadata.get("title") or ""
          body = metadata.get("body") or ""
          generated_shape = is_generated_candidate_promotion_pr(branch, title)
          output_path = Path(os.environ["GITHUB_OUTPUT"])

          if not generated_shape:
              with output_path.open("a", encoding="utf-8") as handle:
                  handle.write("fast_path=false\n")
              print("Catalog PR is not a generated candidate-promotion PR; using full guard path.")
              raise SystemExit(0)

          work_package = extract_work_package(body)
          if work_package != GENERATED_CATALOG_WORK_PACKAGE:
              raise SystemExit(
                  "Generated catalog PR must declare "
                  f"{GENERATED_CATALOG_WORK_PACKAGE}; got {work_package or 'missing'}"
              )

          risk = classify_generated_catalog_pr_risk(changed_paths)
          if risk.risk_class != GeneratedCatalogPrRiskClass.LOW_RISK:
              raise SystemExit(
                  "Generated catalog PR is not LOW_RISK: " + ", ".join(risk.reasons)
              )

          with output_path.open("a", encoding="utf-8") as handle:
              handle.write("fast_path=true\n")
          print("Generated catalog PR LOW_RISK fast path accepted.")
          PY
      - name: Classify quarantine fast path
        id: quarantine_fast_path
        if: steps.generated_catalog_fast_path.outputs.fast_path != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json title,headRefName,body > /tmp/catalog-pr-metadata.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.openva.quarantine_automerge import check_quarantine_pr_shape

          metadata = json.loads(Path("/tmp/catalog-pr-metadata.json").read_text(encoding="utf-8"))
          changed_paths = [
              line.strip()
              for line in Path("/tmp/catalog-pr-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          result = check_quarantine_pr_shape(
              changed_paths,
              head_branch=metadata.get("headRefName") or "",
              title=metadata.get("title") or "",
              body=metadata.get("body") or "",
          )
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"fast_path={str(result.eligible).lower()}\n")

          if result.eligible:
              print("Source quarantine PR shape accepted; deferring deep status-only checks to quarantine lane.")
          else:
              print("Catalog PR is not a source quarantine PR; catalog-pr-guard remains limited to boundary checks.")
              for reason in result.reasons:
                  print(f"quarantine_fast_path_reason={reason}")
          PY
      - name: Defer heavy validation to validate workflow
        if: steps.generated_catalog_fast_path.outputs.fast_path != 'true' && steps.quarantine_fast_path.outputs.fast_path != 'true'
        run: |
          echo "catalog-pr-guard completed boundary checks."
          echo "Heavy validation, generated-output freshness, release gates, and tests are enforced by validate.yml."

  owner-catalog-executor:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.label.name == 'owner-catalog-execute' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'catalog/owner-')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact owner branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reject stale or substituted head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}.git"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Execute owner catalog work package
        run: |
          set -euo pipefail
          test -f maintenance/generated/owner_catalog_executor.py
          python maintenance/generated/owner_catalog_executor.py
      - name: Verify new canonical sources
        run: |
          set -euo pipefail
          git ls-files --others --modified --exclude-standard \
            | grep '/sources/.*\.yaml$' \
            | sort -u > /tmp/owner-catalog-new-source-paths.txt || true
          if [ -s /tmp/owner-catalog-new-source-paths.txt ]; then
            python -m tools.openva.source_verification verify \
              --source-path-file /tmp/owner-catalog-new-source-paths.txt \
              --output /tmp/owner-catalog-verification.json
            python -m tools.openva.observation_ledger build \
              --verification-report /tmp/owner-catalog-verification.json \
              --output-dir /tmp/owner-catalog-observations \
              --run-id "owner-catalog-pr-${PR_NUMBER}" \
              --baseline maintenance/source-observations/latest-observations.json
            python -m tools.openva.observation_ledger install-latest \
              --latest /tmp/owner-catalog-observations/latest-observations.json
          fi
      - name: Validate completed catalog state
        run: |
          set -euo pipefail
          python -m tools.openva.validate validate
          python -m pytest -q \
            tests/test_catalog_guard.py \
            tests/test_source_discovery.py \
            tests/test_generated_exports.py \
            tests/test_source_observation_ledger.py
      - name: Remove executor controls
        run: |
          rm -f maintenance/generated/owner_catalog_executor.py
          rm -f maintenance/generated/owner-catalog-executor-state.json
          rm -f maintenance/generated/owner-catalog-executor-diagnostic.md
      - name: Commit completed work package
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Owner catalog executor produced no changes.'
            exit 1
          fi
          git commit -m 'Catalog: materialize owner-led completeness and expansion work package'
          git push origin "HEAD:${HEAD_REF}"
      - name: Remove execution label
        if: always()
        run: |
          gh api --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/owner-catalog-execute" \
            >/dev/null 2>&1 || true
