name: materialize batches PR

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Materialization lane from config/materialization-lanes.yaml"
        required: true
        default: "infra-data-ai-devtools"
        type: choice
        options:
          - infra-data-ai-devtools
          - payments-kyc-fintech
          - hr-health-education-logistics
          - collaboration-commerce-grc
          - regional-apac-china
      branch_name:
        description: "Branch name for the generated PR"
        required: true
        default: "agent-materialize-infra-data-ai-devtools"
      pr_title:
        description: "Pull request title. Must start with Catalog:"
        required: true
        default: "Catalog: materialize infra data AI devtools batch manifests"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: materialize-batches-pr-${{ github.event.inputs.lane }}
  cancel-in-progress: false

jobs:
  materialize-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow inputs
        run: |
          case "${{ github.event.inputs.branch_name }}" in
            agent-*) ;;
            *) echo "branch_name must start with agent-" >&2; exit 1 ;;
          esac
          case "${{ github.event.inputs.pr_title }}" in
            Catalog:*) ;;
            *) echo "pr_title must start with Catalog:" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Plan materialization lane
        run: python -m tools.openva.materialize_batches plan --lane "${{ github.event.inputs.lane }}" --output materialization-plan.json
      - name: Run materialization lane
        run: python -m tools.openva.materialize_batches run --lane "${{ github.event.inputs.lane }}" --output materialization-report.json
      - name: Validate records
        run: python -m tools.openva.validate validate
      - name: Run tests
        run: pytest -q
      - name: Create materialization PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ github.event.inputs.branch_name }}
          title: ${{ github.event.inputs.pr_title }}
          commit-message: ${{ github.event.inputs.pr_title }}
          body: |
            ## Summary

            Materializes pending catalog-batch manifests for lane:

            ```text
            ${{ github.event.inputs.lane }}
            ```

            This PR was generated by the manual materialize batches workflow.

            ## Workflow behavior

            - Converts pending merged batch manifests into `data/vendors/**` records.
            - Skips vendors already materialized under `data/vendors/{vendor_id}/vendor.yaml`.
            - Rebuilds generated indexes and `openva-pack.json`.
            - Runs validation and tests before opening the PR.
            - Does not fetch live vendor content.
            - Does not use gated/private materials.
            - Does not mirror raw documents.
            - Does not provide legal, compliance, procurement, audit, security, or vendor-risk advice.

            ## Reports

            The workflow generated local reports during the run:

            ```text
            materialization-plan.json
            materialization-report.json
            ```

            These are run artifacts only and are not committed unless intentionally added in a later workflow.

            ## Review checklist

            - Confirm generated records are public-source-only metadata.
            - Confirm no duplicate or semantic-duplicate vendors were introduced.
            - Confirm generated indexes changed consistently.
            - Confirm no raw documents, screenshots, private reports, portal materials, or gated materials were committed.
          labels: catalog,materialization,agent-generated
