name: owner-source-maintenance-3-release-log

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-release-log
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Capture gate output
        run: |
          set -uo pipefail
          mkdir -p maintenance/reviewed
          set +e
          python -m tools.openva.release_gates check --profile pr \
            --out-json /tmp/release-gates.json \
            --out-md /tmp/release-gates.md \
            > maintenance/reviewed/owner-source-maintenance-3-release-gates.log 2>&1
          STATUS=$?
          set -e
          {
            echo
            echo "exit_status=$STATUS"
            if [ -f /tmp/release-gates.json ]; then
              echo
              echo '--- release-gates.json ---'
              cat /tmp/release-gates.json
            fi
            if [ -f /tmp/release-gates.md ]; then
              echo
              echo '--- release-gates.md ---'
              cat /tmp/release-gates.md
            fi
          } >> maintenance/reviewed/owner-source-maintenance-3-release-gates.log
          rm -f .github/workflows/owner-source-maintenance-3-release-log.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -f maintenance/reviewed/owner-source-maintenance-3-release-gates.log
          git add -A .github/workflows/owner-source-maintenance-3-release-log.yml
          git commit -m 'Catalog: capture final release-gate output [owner-maintenance-3-release-log]'
          git push
          exit "$STATUS"
