name: catalog-growth-discovery

on:
  workflow_dispatch:
    inputs:
      vendor_limit:
        description: "Optional number of vendors/candidates to discover against"
        required: false
        type: string
      max_urls_per_type:
        description: "Maximum candidate URLs to probe per source type"
        required: false
        type: string
        default: "4"
      fetch_timeout:
        description: "Per-URL source discovery timeout in seconds"
        required: false
        type: string
        default: "3"
      max_promotion_actions_per_pr:
        description: "Preferred. Maximum selected promotion actions applied by one generated Catalog PR."
        required: false
        type: string
        default: ""
      max_actions_per_plan:
        description: "Deprecated alias. Prefer max_promotion_actions_per_pr."
        required: false
        type: string
        default: ""
  schedule:
    # Mon/Wed/Fri at 08:17 UTC / 16:17 Asia/Singapore. The bridge owns mutation handoff.
    - cron: "17 8 * * 1,3,5"

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-growth-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-growth-discovery:
    runs-on: ubuntu-latest
    env:
      VENDOR_LIMIT: "${{ inputs.vendor_limit || '' }}"
      MAX_URLS_PER_TYPE: "${{ inputs.max_urls_per_type || '4' }}"
      FETCH_TIMEOUT: "${{ inputs.fetch_timeout || '3' }}"
      REQUESTED_MAX_PROMOTION_ACTIONS_PER_PR: "${{ inputs.max_promotion_actions_per_pr || '' }}"
      REQUESTED_MAX_ACTIONS_PER_PLAN: "${{ inputs.max_actions_per_plan || '' }}"
      OPENVA_WEB_BOT_AUTH_DIRECTORY_URL: ${{ secrets.OPENVA_WEB_BOT_AUTH_DIRECTORY_URL }}
      OPENVA_WEB_BOT_AUTH_PUBLIC_JWK_JSON: ${{ secrets.OPENVA_WEB_BOT_AUTH_PUBLIC_JWK_JSON }}
      OPENVA_WEB_BOT_AUTH_PRIVATE_KEY_PEM_B64: ${{ secrets.OPENVA_WEB_BOT_AUTH_PRIVATE_KEY_PEM_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Resolve promotion action cap
        run: |
          set -euo pipefail
          PREFERRED="$(printf '%s' "$REQUESTED_MAX_PROMOTION_ACTIONS_PER_PR" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          LEGACY="$(printf '%s' "$REQUESTED_MAX_ACTIONS_PER_PLAN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$PREFERRED" ] && [ -z "$LEGACY" ]; then
            PREFERRED="50"
          fi
          for VALUE in "$PREFERRED" "$LEGACY"; do
            if [ -n "$VALUE" ]; then
              case "$VALUE" in
                *[!0-9]*) echo "max_promotion_actions_per_pr must be a non-negative integer" >&2; exit 1 ;;
              esac
            fi
          done
          if [ -n "$PREFERRED" ] && [ -n "$LEGACY" ] && [ "$PREFERRED" != "$LEGACY" ]; then
            echo "max_promotion_actions_per_pr and deprecated max_actions_per_plan differ" >&2
            exit 1
          fi
          RESOLVED="${PREFERRED:-$LEGACY}"
          echo "MAX_PROMOTION_ACTIONS_PER_PR=$RESOLVED" >> "$GITHUB_ENV"
      - name: Validate current records
        run: |
          python -m tools.openva.validate validate || {
            python -m tools.openva.bot_workflow_failure build \
              --workflow catalog-growth-discovery.yml \
              --lane catalog_growth_discovery \
              --failure-code schema_validation_failure \
              --message "schema validation failed before catalog growth discovery" \
              --artifact openva-validate \
              --out reports/openva-failure-routing/catalog-growth-discovery-failure-input.json
            exit 1
          }
      - name: Validate catalog growth discovery queue
        run: |
          python -m tools.openva.catalog_growth_discovery_queue validate \
            --output catalog-growth-discovery-queue-summary.json
      - name: Run bounded sitemap source discovery
        run: |
          set -euo pipefail
          python -m tools.openva.catalog_growth_discovery_queue run-sitemap-discovery \
            --queue maintenance/queues/catalog-growth-discovery.json \
            --discovery-run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --discovered-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output sitemap-source-discovery-events.json
      - name: Configure bounded source discovery
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json

          queue = json.load(open('catalog-growth-discovery-queue-summary.json', encoding='utf-8'))
          source_types = ','.join(queue.get('source_types', []))
          print(f"QUEUE_VENDOR_LIMIT={queue['max_vendors_per_discovery_run']}")
          print(f"QUEUE_SOURCE_TYPES={source_types}")
          PY
      - name: Build vendor candidate discovery report
        run: |
          python -m tools.openva.vendor_candidate_discovery discover \
            --output vendor-candidate-discovery-report.json
      - name: Discover sources for vendor candidates
        run: |
          set -euo pipefail
          LIMIT="$(printf '%s' "$VENDOR_LIMIT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$LIMIT" ]; then
            LIMIT="$QUEUE_VENDOR_LIMIT"
          fi
          python -m tools.openva.source_discovery discover-vendor-candidates \
            --vendor-candidates vendor-candidate-discovery-report.json \
            --vendor-limit "$LIMIT" \
            --source-types "$QUEUE_SOURCE_TYPES" \
            --max-urls-per-type "$MAX_URLS_PER_TYPE" \
            --fetch-timeout "$FETCH_TIMEOUT" \
            --output vendor-candidate-source-discovery-report.json
      - name: Build existing vendor source discovery report
        run: |
          set -euo pipefail
          LIMIT="$(printf '%s' "$VENDOR_LIMIT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$LIMIT" ]; then
            LIMIT="$QUEUE_VENDOR_LIMIT"
          fi
          python -m tools.openva.source_discovery discover \
            --vendor-limit "$LIMIT" \
            --source-types "$QUEUE_SOURCE_TYPES" \
            --max-urls-per-type "$MAX_URLS_PER_TYPE" \
            --fetch-timeout "$FETCH_TIMEOUT" \
            --output source-discovery-report.json
      - name: Build promotion plan from existing vendor discovery report
        run: |
          python -m tools.openva.promotion_planner plan \
            --discovery-report source-discovery-report.json \
            --output promotion-plan.json
      - name: Build catalog growth eligibility report
        run: |
          mkdir -p reports
          python -m tools.openva.catalog_growth_eligibility classify \
            --vendor-candidates vendor-candidate-discovery-report.json \
            --source-discovery vendor-candidate-source-discovery-report.json \
            --output-json catalog-growth-eligibility-report.json \
            --output-strict catalog-growth-strict-promotions.json \
            --output-review-csv reports/catalog-growth-review-required.csv \
            --output-rejected-csv reports/catalog-growth-rejected.csv \
            --output-md reports/catalog-growth-eligibility-summary.md \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.sha }}"
      - name: Build catalog growth backlog report
        run: |
          python -m tools.openva.catalog_growth_backlog build \
            --eligibility-report catalog-growth-eligibility-report.json \
            --output-json catalog-growth-backlog-report.json \
            --output-csv reports/catalog-growth-backlog.csv \
            --output-md reports/catalog-growth-backlog-summary.md
      - name: Build strict growth shortlist
        run: |
          python -m tools.openva.strict_growth_shortlist build \
            --eligibility-report catalog-growth-eligibility-report.json \
            --backlog-report catalog-growth-backlog-report.json \
            --output-json strict-growth-shortlist.json \
            --output-csv reports/strict-growth-shortlist.csv \
            --output-md reports/strict-growth-shortlist-summary.md \
            --max-vendors 5 \
            --max-actions "$MAX_PROMOTION_ACTIONS_PER_PR"
      - name: Build strict growth promotion plan
        run: |
          python -m tools.openva.promotion_planner plan-strict-growth \
            --eligibility-report catalog-growth-eligibility-report.json \
            --output strict-growth-promotion-plan.json \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ github.sha }}"
      - name: Build batched candidate promotion plan proposals
        run: |
          set -euo pipefail
          python -m tools.openva.promotion_plan_batcher batch \
            --promotion-plan promotion-plan.json \
            --output-dir maintenance/generated \
            --summary-output promotion-plan-batch-summary.json \
            --max-actions "$MAX_PROMOTION_ACTIONS_PER_PR"
      - name: Prepare discovery issue body
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          Path('reports').mkdir(exist_ok=True)
          queue = json.load(open('catalog-growth-discovery-queue-summary.json', encoding='utf-8'))
          vendors = json.load(open('vendor-candidate-discovery-report.json', encoding='utf-8'))
          enrichment = json.load(open('vendor-candidate-source-discovery-report.json', encoding='utf-8'))
          discovery = json.load(open('source-discovery-report.json', encoding='utf-8'))
          promotion = json.load(open('promotion-plan.json', encoding='utf-8'))
          strict_growth = json.load(open('strict-growth-promotion-plan.json', encoding='utf-8'))
          shortlist = json.load(open('strict-growth-shortlist.json', encoding='utf-8'))
          backlog = json.load(open('catalog-growth-backlog-report.json', encoding='utf-8'))
          batches = json.load(open('promotion-plan-batch-summary.json', encoding='utf-8'))
          eligibility = json.load(open('catalog-growth-eligibility-report.json', encoding='utf-8'))
          sitemap = json.load(open('sitemap-source-discovery-events.json', encoding='utf-8'))
          sitemap_rotation = sitemap.get('rotation', {}) or {}
          sitemap_verification = sitemap.get('verification', {}) or {}
          sitemap_outcomes = sitemap_verification.get('provisional_eligibility_outcomes', {}) or {}
          sitemap_vendor_lines = [
              f"- `{pv['vendor_id']}` ({pv['official_domain']}): robots `{pv['robots_state']}`"
              f" via `{pv['robots_parser']}`, sitemaps attempted `{pv['sitemaps_attempted']}`,"
              f" locators `{pv['candidate_count']}`, verified `{pv['verified_candidate_count']}`,"
              f" provisional `{pv.get('provisional_eligibility')}`, rejected `{pv['rejected_count']}`"
              for pv in sitemap.get('per_vendor', [])[:10]
          ] or ['- none']
          lines = [
              '<!-- openva-catalog-growth-discovery -->',
              '',
              '# OpenVA catalog growth discovery queue',
              '',
              'This issue is generated by the taxonomy-driven catalog growth discovery workflow.',
              '',
              'It is non-advisory and does not mutate canonical catalog records.',
              '',
              '## Queue summary',
              '',
              f"- Cohorts: `{queue['cohort_count']}`",
              f"- Queued cohorts: `{queue['queued_cohort_count']}`",
              f"- Target vendor candidates: `{queue['target_vendor_candidates']}`",
              '',
              '## Vendor candidate discovery',
              '',
              f"- New vendor candidates reported: `{vendors['summary']['candidate_vendor_count']}`",
              f"- Known vendors skipped from candidate report: `{vendors['summary']['known_vendor_count']}`",
              '',
              '## Vendor candidate source discovery',
              '',
              f"- Vendor candidates checked: `{enrichment['summary']['vendor_candidates_checked']}`",
              f"- Candidate sources reported: `{enrichment['summary']['candidate_sources_written_or_reported']}`",
              f"- Unavailable sources reported: `{enrichment['summary']['unavailable_sources_written_or_reported']}`",
              '',
              '## Existing vendor source discovery summary',
              '',
              f"- Existing vendors checked: `{discovery['summary']['vendors_checked']}`",
              f"- Candidate sources reported: `{discovery['summary']['candidate_sources_written_or_reported']}`",
              f"- Unavailable sources reported: `{discovery['summary']['unavailable_sources_written_or_reported']}`",
              '',
              '## Sitemap source discovery',
              '',
              f"- Mode enabled: `{sitemap.get('mode_enabled')}`",
              f"- Robots parser: `{sitemap.get('robots_parser')}`",
              f"- Rotation shard: `{sitemap_rotation.get('shard_index')}` of `{sitemap_rotation.get('shard_count')}`"
              f" (ISO week `{sitemap_rotation.get('iso_week')}`, eligible vendors `{sitemap_rotation.get('eligible_vendor_count')}`)",
              f"- Vendors inspected this cycle: `{len(sitemap.get('per_vendor', []))}`",
              f"- Zero-weight locator events: `{sitemap.get('event_count')}`",
              f"- Verified candidate sources: `{sitemap_verification.get('verified_candidate_count')}`",
              f"- Provisional eligibility (source-quality only; identity/materialization gates apply downstream): `{sitemap_outcomes}`",
              '',
              '### Per-vendor sitemap execution',
              '',
              *sitemap_vendor_lines,
              '',
              '## Growth eligibility summary',
              '',
              f"- Candidate vendors classified: `{eligibility['summary']['candidate_count']}`",
              f"- Strict promote ready: `{eligibility['summary']['strict_promote_ready_count']}`",
              f"- Review required: `{eligibility['summary']['review_required_count']}`",
              f"- Rejected or deferred: `{eligibility['summary']['rejected_or_deferred_count']}`",
              '',
              '## Catalog growth backlog summary',
              '',
              f"- Backlog candidates: `{backlog['summary']['candidate_count']}`",
              f"- Strict PR candidates: `{backlog['summary']['strict_pr_candidate_count']}`",
              f"- Human review required: `{backlog['summary']['human_review_required_count']}`",
              f"- Rejected: `{backlog['summary']['rejected_count']}`",
              '',
              '## Strict growth shortlist summary',
              '',
              f"- Strict-growth shortlist count: `{shortlist['summary']['shortlisted_action_count']}`",
              f"- Shortlisted vendors: `{shortlist['summary']['shortlisted_vendor_count']}`",
              f"- Excluded candidates/actions: `{shortlist['summary']['excluded_count']}`",
              '',
              '### Shortlisted vendors',
              '',
              *(
                  [
                      f"- `{item['candidate_vendor_id']}` / `{item['source_type_candidate']}` / `{item['candidate_source_id']}`"
                      for item in shortlist.get('items', [])[:10]
                  ]
                  or ['- none']
              ),
              '',
              '### Excluded candidates by reason',
              '',
              *(
                  [
                      f"- `{reason}`: `{count}`"
                      for reason, count in sorted(shortlist['summary'].get('excluded_by_reason', {}).items())
                  ]
                  or ['- none']
              ),
              '',
              '## Strict growth planning summary',
              '',
              f"- Strict growth actions: `{strict_growth['summary']['action_count']}`",
              '',
              '## Existing vendor promotion planning summary',
              '',
              f"- Plan actions: `{promotion['summary']['action_count']}`",
              f"- Candidate promotion batches: `{batches['summary']['batch_count']}`",
              f"- Candidate promotion actions: `{batches['summary']['candidate_promotion_actions']}`",
              '',
              '## Next step',
              '',
              'Use strict growth promotion plans through the existing candidate-promotion apply path; do not bypass validation or source preflight.',
              '',
          ]
          Path('catalog-growth-discovery-issue.md').write_text('\n'.join(lines), encoding='utf-8')
          Path('reports/catalog-growth-discovery-summary.md').write_text('\n'.join(lines), encoding='utf-8')

          with open('reports/vendor-candidates.csv', 'w', encoding='utf-8', newline='') as handle:
              fields = ['candidate_vendor_id', 'display_name_candidate', 'official_domain_candidate', 'coverage_lane', 'cohort_id', 'source_index_url']
              writer = csv.DictWriter(handle, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              for candidate in vendors.get('vendor_candidates', []):
                  writer.writerow(candidate)

          def write_candidate_rows(report, path):
              rows = []
              for vendor in report.get('vendors', []):
                  for candidate in vendor.get('candidates', []):
                      evidence = candidate.get('evidence', {})
                      rows.append({
                          'vendor_id': candidate.get('vendor_id'),
                          'candidate_source_id': candidate.get('candidate_source_id'),
                          'source_type_candidate': candidate.get('source_type_candidate'),
                          'candidate_url': candidate.get('candidate_url'),
                          'confidence': candidate.get('confidence'),
                          'http_status': evidence.get('http_status'),
                          'final_url': evidence.get('final_url'),
                          'matched_terms': ';'.join(evidence.get('matched_terms', [])),
                      })
              with open(path, 'w', encoding='utf-8', newline='') as handle:
                  fields = ['vendor_id', 'candidate_source_id', 'source_type_candidate', 'candidate_url', 'confidence', 'http_status', 'final_url', 'matched_terms']
                  writer = csv.DictWriter(handle, fieldnames=fields, extrasaction='ignore')
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(row)

          def write_unavailable_rows(report, path):
              rows = []
              for vendor in report.get('vendors', []):
                  for unavailable in vendor.get('unavailable_sources', []):
                      rows.append({
                          'vendor_id': unavailable.get('vendor_id'),
                          'unavailable_source_id': unavailable.get('unavailable_source_id'),
                          'source_type': unavailable.get('source_type'),
                          'status': unavailable.get('status'),
                          'reason': unavailable.get('reason'),
                          'next_review_after': unavailable.get('next_review_after'),
                      })
              with open(path, 'w', encoding='utf-8', newline='') as handle:
                  fields = ['vendor_id', 'unavailable_source_id', 'source_type', 'status', 'reason', 'next_review_after']
                  writer = csv.DictWriter(handle, fieldnames=fields, extrasaction='ignore')
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(row)

          write_candidate_rows(enrichment, 'reports/vendor-candidate-source-candidates.csv')
          write_unavailable_rows(enrichment, 'reports/vendor-candidate-source-unavailable.csv')
          write_candidate_rows(discovery, 'reports/source-discovery-candidates.csv')
          write_unavailable_rows(discovery, 'reports/source-discovery-unavailable.csv')

          with open('reports/promotion-plan-actions.csv', 'w', encoding='utf-8', newline='') as handle:
              fields = ['action', 'vendor_id', 'source_type', 'source_id', 'candidate_source_id', 'unavailable_source_id', 'reason']
              writer = csv.DictWriter(handle, fieldnames=fields, extrasaction='ignore')
              writer.writeheader()
              for action in promotion.get('actions', []):
                  writer.writerow(action)
          PY
      - name: Create or update catalog growth discovery issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="OpenVA catalog growth discovery queue"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number,title --jq 'map(select(.title == "'"${TITLE}"'")) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file catalog-growth-discovery-issue.md
            echo "Updated catalog growth discovery issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file catalog-growth-discovery-issue.md
          fi
      - name: Upload catalog growth discovery artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openva-catalog-growth-discovery-artifacts
          path: |
            reports/catalog-growth-discovery-summary.md
            reports/catalog-growth-eligibility-summary.md
            reports/catalog-growth-backlog-summary.md
            reports/strict-growth-shortlist-summary.md
            reports/catalog-growth-review-required.csv
            reports/catalog-growth-rejected.csv
            reports/catalog-growth-backlog.csv
            reports/strict-growth-shortlist.csv
            reports/vendor-candidates.csv
            reports/vendor-candidate-source-candidates.csv
            reports/vendor-candidate-source-unavailable.csv
            reports/source-discovery-candidates.csv
            reports/source-discovery-unavailable.csv
            reports/promotion-plan-actions.csv
            catalog-growth-discovery-queue-summary.json
            sitemap-source-discovery-events.json
            vendor-candidate-discovery-report.json
            vendor-candidate-source-discovery-report.json
            source-discovery-report.json
            promotion-plan.json
            strict-growth-promotion-plan.json
            strict-growth-shortlist.json
            promotion-plan-batch-summary.json
            catalog-growth-eligibility-report.json
            catalog-growth-strict-promotions.json
            catalog-growth-backlog-report.json
            catalog-growth-discovery-issue.md
            maintenance/generated/*.json
          if-no-files-found: warn
      - name: Build catalog growth discovery failure routing input
        if: failure()
        run: |
          python -m tools.openva.bot_workflow_failure build \
            --workflow catalog-growth-discovery.yml \
            --lane catalog_growth_discovery \
            --message "catalog growth discovery workflow failed; inspect logs for external fetch instability, schema validation, redirect canonicalization, or discovery context" \
            --out reports/openva-failure-routing/catalog-growth-discovery-failure-input.json \
            --preserve-existing
      - name: Route catalog growth discovery failure
        if: failure()
        run: |
          python -m tools.openva.bot_failure_router classify \
            --input reports/openva-failure-routing/catalog-growth-discovery-failure-input.json \
            --out reports/openva-failure-routing/catalog-growth-discovery-failure-routing-report.json \
            --out-md reports/openva-failure-routing/catalog-growth-discovery-failure-routing-report.md
      - name: Upload catalog growth discovery failure routing artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openva-catalog-growth-discovery-failure-routing
          path: |
            reports/openva-failure-routing/catalog-growth-discovery-failure-input.json
            reports/openva-failure-routing/catalog-growth-discovery-failure-routing-report.json
            reports/openva-failure-routing/catalog-growth-discovery-failure-routing-report.md
          if-no-files-found: ignore
