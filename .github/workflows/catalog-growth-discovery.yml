name: catalog-growth-discovery

on:
  workflow_dispatch:
    inputs:
      vendor_limit:
        description: "Optional number of existing vendors to discover against"
        required: false
        type: string
      max_actions_per_plan:
        description: "Maximum candidate promotion actions per generated plan proposal"
        required: false
        type: string
        default: "50"
  schedule:
    - cron: "17 8 * * 3"

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-growth-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-growth-discovery:
    runs-on: ubuntu-latest
    env:
      VENDOR_LIMIT: "${{ inputs.vendor_limit || '' }}"
      MAX_ACTIONS_PER_PLAN: "${{ inputs.max_actions_per_plan || '50' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Validate catalog growth discovery queue
        run: |
          python -m tools.openva.catalog_growth_discovery_queue validate \
            --output catalog-growth-discovery-queue-summary.json
      - name: Build vendor candidate discovery report
        run: |
          python -m tools.openva.vendor_candidate_discovery discover \
            --output vendor-candidate-discovery-report.json
      - name: Build source discovery report
        run: |
          set -euo pipefail
          LIMIT="$(printf '%s' "$VENDOR_LIMIT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$LIMIT" ]; then
            python -m tools.openva.source_discovery discover --vendor-limit "$LIMIT" --output source-discovery-report.json
          else
            python -m tools.openva.source_discovery discover --output source-discovery-report.json
          fi
      - name: Build promotion plan from discovery report
        run: |
          python -m tools.openva.promotion_planner plan \
            --discovery-report source-discovery-report.json \
            --output promotion-plan.json
      - name: Build batched candidate promotion plan proposals
        run: |
          set -euo pipefail
          case "$MAX_ACTIONS_PER_PLAN" in
            ''|*[!0-9]*) echo "max_actions_per_plan must be a non-negative integer" >&2; exit 1 ;;
          esac
          python -m tools.openva.promotion_plan_batcher batch \
            --promotion-plan promotion-plan.json \
            --output-dir maintenance/generated \
            --summary-output promotion-plan-batch-summary.json \
            --max-actions "$MAX_ACTIONS_PER_PLAN"
      - name: Prepare discovery issue body
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          queue = json.load(open('catalog-growth-discovery-queue-summary.json', encoding='utf-8'))
          vendors = json.load(open('vendor-candidate-discovery-report.json', encoding='utf-8'))
          discovery = json.load(open('source-discovery-report.json', encoding='utf-8'))
          promotion = json.load(open('promotion-plan.json', encoding='utf-8'))
          batches = json.load(open('promotion-plan-batch-summary.json', encoding='utf-8'))
          lines = [
              '<!-- openva-catalog-growth-discovery -->',
              '',
              '# OpenVA catalog growth discovery queue',
              '',
              'This issue is generated by the taxonomy-driven catalog growth discovery workflow.',
              '',
              'It is non-advisory and does not mutate canonical catalog records.',
              '',
              '## Queue summary',
              '',
              f"- Cohorts: `{queue['cohort_count']}`",
              f"- Queued cohorts: `{queue['queued_cohort_count']}`",
              f"- Target vendor candidates: `{queue['target_vendor_candidates']}`",
              '',
              '## Vendor candidate discovery',
              '',
              f"- New vendor candidates reported: `{vendors['summary']['candidate_vendor_count']}`",
              f"- Known vendors skipped from candidate report: `{vendors['summary']['known_vendor_count']}`",
              '',
              '## Source discovery summary',
              '',
              f"- Existing vendors checked: `{discovery['summary']['vendors_checked']}`",
              f"- Candidate sources reported: `{discovery['summary']['candidate_sources_written_or_reported']}`",
              f"- Unavailable sources reported: `{discovery['summary']['unavailable_sources_written_or_reported']}`",
              '',
              '## Promotion planning summary',
              '',
              f"- Plan actions: `{promotion['summary']['action_count']}`",
              f"- Candidate promotion batches: `{batches['summary']['batch_count']}`",
              f"- Candidate promotion actions: `{batches['summary']['candidate_promotion_actions']}`",
              '',
              '## Next step',
              '',
              'Review vendor-candidate and candidate-promotion artifacts before copying approved plans into `maintenance/reviewed/`.',
              '',
          ]
          Path('catalog-growth-discovery-issue.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Create or update catalog growth discovery issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="OpenVA catalog growth discovery queue"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number,title --jq 'map(select(.title == "'"${TITLE}"'")) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file catalog-growth-discovery-issue.md
            echo "Updated catalog growth discovery issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file catalog-growth-discovery-issue.md --label "maintenance"
          fi
      - name: Upload catalog growth discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openva-catalog-growth-discovery-artifacts
          path: |
            catalog-growth-discovery-queue-summary.json
            vendor-candidate-discovery-report.json
            source-discovery-report.json
            promotion-plan.json
            promotion-plan-batch-summary.json
            catalog-growth-discovery-issue.md
            maintenance/generated/*.json
          if-no-files-found: warn
