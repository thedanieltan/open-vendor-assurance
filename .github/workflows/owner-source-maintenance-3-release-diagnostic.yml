name: owner-source-maintenance-3-release-diagnostic

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-release-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Run and preserve release-gate report
        run: |
          set -uo pipefail
          mkdir -p maintenance/reviewed
          set +e
          python -m tools.openva.release_gates check \
            --profile pr \
            --out-json maintenance/reviewed/owner-source-maintenance-3-release-gates.json \
            --out-md maintenance/reviewed/owner-source-maintenance-3-release-gates.md
          STATUS=$?
          set -e
          rm -f .github/workflows/owner-source-maintenance-3-release-diagnostic.yml
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog: preserve final release-gate diagnostic [owner-maintenance-3-release-diagnostic]'
          git push
          exit "$STATUS"
