name: validate-pr-metadata

# PR metadata (title/body/base) edits do not change code, so they must not rerun the
# full validate.yml suite. They CAN change the PR-body `Work-Package:` declaration that
# the scope guard evaluates, so this dedicated workflow reruns ONLY pr-scope-guard on
# `edited`. A PR-body edit therefore still cannot leave a stale-green scope-guard result,
# while costing one short job instead of the entire validation matrix. Because this
# companion only runs on `edited` (and validate.yml drops `edited`), no validate job is
# ever skipped on an edit — so a metadata edit cannot mask a prior failing check.

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: validate-pr-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-scope-guard:
    name: pr-scope-guard
    runs-on: ubuntu-latest
    # Identical trusted-base evaluation to validate.yml's pr-scope-guard: the guard CODE
    # and MANIFEST are read from the BASE revision so a PR cannot weaken the policy that
    # judges it; the PR declares its work package with a single `Work-Package: WP-...`
    # line in its body; zero/multiple/unknown fails closed.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install "pyyaml>=6"
      - name: Run scope guard from the trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Trusted policy: run the guard + manifest exactly as they exist at the base,
          # so the PR under evaluation cannot modify the policy that judges it.
          git worktree add /tmp/base-guard "$BASE_SHA"
          if [ ! -f /tmp/base-guard/tools/openva/pr_scope_guard.py ]; then
            echo "scope guard not present at the base revision yet; skipping (self-bootstrap)."
            exit 0
          fi
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-paths.txt
          echo "Changed paths:"; sed 's/^/  /' /tmp/changed-paths.txt
          cd /tmp/base-guard
          python -m tools.openva.pr_scope_guard --declaration-file /tmp/pr-body.txt --changed-paths-file /tmp/changed-paths.txt
