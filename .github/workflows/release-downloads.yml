name: release-downloads

on:
  push:
    tags:
      - "v*"

# This workflow is the only release asset publishing lane. It needs contents: write
# so it can attach generated non-technical download assets to the GitHub Release for
# the pushed v* tag. Catalog, validation, and maintenance workflows should remain
# read-only or PR-gated unless a separate maintainer-reviewed exception is added.
permissions:
  contents: write

concurrency:
  group: release-downloads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Authoritative OCI gate: a failed image build or container verification blocks
  # release publication (release-downloads needs this job).
  mcp-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Build agent-export fixture
        run: python -m tools.openva.agent_export build --out image-fixture/public --commit-sha "${{ github.sha }}"
      - name: Build MCP OCI image
        run: |
          docker build \
            -f integrations/mcp/openva_mcp/Dockerfile \
            --build-arg SOURCE_COMMIT="${{ github.sha }}" \
            -t openva-mcp:"${{ github.ref_name }}" .
      - name: Verify snapshot in container (non-root, read-only)
        run: |
          docker run --rm --read-only --user 10001 \
            -v "$PWD/image-fixture:/snapshot:ro" \
            openva-mcp:"${{ github.ref_name }}" --snapshot /snapshot --verify

  release-downloads:
    runs-on: ubuntu-latest
    needs: mcp-image
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install match service test dependencies
        run: pip install -e "services/openva_match_service[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Rebuild generated indexes
        run: python -m tools.openva.validate build-indexes
      - name: Refuse generated drift
        run: git diff --exit-code openva-pack.json indexes/ dist/
      - name: Run tests
        run: pytest -q
      - name: Build compiled site distribution
        run: python site/build.py --out site/dist
      - name: Build release artifact manifest
        run: python -m tools.openva.release_artifacts build
      - name: Check release artifact manifest
        run: python -m tools.openva.release_artifacts check
      - name: Build non-technical release downloads
        run: python -m tools.openva.release_downloads build --out release-downloads
      - name: Build release download checksum manifest
        run: python -m tools.openva.release_downloads manifest --out release-downloads > release-downloads/openva-release-downloads-manifest.json
      - name: Check non-technical release downloads
        run: python -m tools.openva.release_downloads check --out release-downloads
      # Deterministic from committed state: timestamp derived from the tagged
      # commit; no --latest-observations, so observation input is
      # committed_events_fallback (or none).
      - name: Build deterministic agent-export bundle
        run: |
          EXPORT_GENERATED_AT="$(git show -s --format=%cI "${{ github.sha }}")"
          mkdir -p "$RUNNER_TEMP/agent-exports/public"
          python -m tools.openva.agent_export build \
            --out "$RUNNER_TEMP/agent-exports/public" \
            --commit-sha "${{ github.sha }}" \
            --generated-at "$EXPORT_GENERATED_AT"
          python -m tools.openva.deterministic_zip \
            "$RUNNER_TEMP/agent-exports/public" \
            release-downloads/openva-agent-exports.zip \
            --arcname-root public \
            --generated-at "$EXPORT_GENERATED_AT"
      - name: Build MCP packages and resolve wheelhouse (Linux x86_64, CPython 3.12)
        run: |
          python -m pip install build
          mkdir -p "$RUNNER_TEMP/mcp-wheelhouse"
          python -m build adapters/python/openva_pack_reader --outdir "$RUNNER_TEMP/mcp-wheelhouse"
          python -m build adapters/python/openva_vendor_inventory_matcher --outdir "$RUNNER_TEMP/mcp-wheelhouse"
          python -m build integrations/mcp/openva_mcp --outdir "$RUNNER_TEMP/mcp-wheelhouse"
          python -m pip download --dest "$RUNNER_TEMP/mcp-wheelhouse" "mcp>=1.27,<2" "jsonschema>=4.0"
      - name: Clean-environment wheelhouse install and verify
        run: |
          python -m venv "$RUNNER_TEMP/openva-mcp-test"
          "$RUNNER_TEMP/openva-mcp-test/bin/pip" install --no-index \
            --find-links "$RUNNER_TEMP/mcp-wheelhouse" openva-mcp==0.1.0
          "$RUNNER_TEMP/openva-mcp-test/bin/openva-mcp" \
            --snapshot "$RUNNER_TEMP/agent-exports" --verify
      - name: Package wheelhouse archive
        run: |
          EXPORT_GENERATED_AT="$(git show -s --format=%cI "${{ github.sha }}")"
          python -m tools.openva.deterministic_zip \
            "$RUNNER_TEMP/mcp-wheelhouse" \
            release-downloads/openva-mcp-wheelhouse-linux-x86_64-py312.zip \
            --generated-at "$EXPORT_GENERATED_AT"
      - name: Verify wheelhouse archive installs after extraction
        run: |
          mkdir -p "$RUNNER_TEMP/wh-extract"
          (cd "$RUNNER_TEMP/wh-extract" && unzip -q "$GITHUB_WORKSPACE/release-downloads/openva-mcp-wheelhouse-linux-x86_64-py312.zip")
          python -m venv "$RUNNER_TEMP/openva-mcp-test2"
          "$RUNNER_TEMP/openva-mcp-test2/bin/pip" install --no-index \
            --find-links "$RUNNER_TEMP/wh-extract" openva-mcp==0.1.0
          "$RUNNER_TEMP/openva-mcp-test2/bin/openva-mcp" \
            --snapshot "$RUNNER_TEMP/agent-exports" --verify
      # Authoritative check on the actual downloadable artifact: extract the
      # published ZIP and verify it with the wheelhouse-installed command.
      - name: Verify the extracted agent-export bundle ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bundle-extract"
          (cd "$RUNNER_TEMP/agent-bundle-extract" && unzip -q "$GITHUB_WORKSPACE/release-downloads/openva-agent-exports.zip")
          "$RUNNER_TEMP/openva-mcp-test2/bin/openva-mcp" \
            --snapshot "$RUNNER_TEMP/agent-bundle-extract" --verify
      - name: Stage MCP Registry metadata
        run: cp integrations/mcp/openva_mcp/manifest/server.json release-downloads/
      - name: Build release coherence manifest from root-level assets
        run: |
          python -m tools.openva.release_coherence build \
            --asset-dir release-downloads \
            --agent-archive release-downloads/openva-agent-exports.zip \
            --release-tag "${{ github.ref_name }}" \
            --commit-sha "${{ github.sha }}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Verify release coherence manifest and agent-export archive
        run: |
          python -m tools.openva.release_coherence check \
            --asset-dir release-downloads \
            --manifest release-downloads/openva-release-manifest.json
      - name: Upload release downloads
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts.json
            release-downloads/openva-csv.zip
            release-downloads/openva-sample-inventory.csv
            release-downloads/openva-inventory-template.csv
            release-downloads/openva-release-downloads-manifest.json
            release-downloads/openva-release-manifest.json
            release-downloads/openva-agent-exports.zip
            release-downloads/openva-mcp-wheelhouse-linux-x86_64-py312.zip
            release-downloads/server.json
            release-downloads/SHA256SUMS