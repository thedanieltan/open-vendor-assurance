name: owner-source-maintenance-3-discovery

on:
  push:
    branches:
      - catalog/owner-source-maintenance-3

permissions:
  contents: write

concurrency:
  group: owner-source-maintenance-3-discovery
  cancel-in-progress: true

jobs:
  discover:
    if: ${{ !contains(github.event.head_commit.message, '[owner-maintenance-3-discovered]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Discover replacements from official public surfaces
        run: |
          python - <<'PY'
          from __future__ import annotations

          import gzip
          import html
          import json
          import re
          import ssl
          import threading
          import time
          import xml.etree.ElementTree as ET
          from collections import defaultdict, deque
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urljoin, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          import yaml

          root = Path('.')
          classification = json.loads(
              (root / 'maintenance/reviewed/owner-source-maintenance-3-classification.json').read_text(encoding='utf-8')
          )
          targets = [
              item for item in classification.get('candidates', [])
              if item.get('recommended_action') == 'discover_replacement'
          ]

          USER_AGENT = 'OpenVA owner-led catalog maintenance/0.1 (+https://github.com/thedanieltan/open-vendor-assurance)'
          LIVE = {200, 203, 206}
          deadline = time.monotonic() + 17 * 60
          byte_budget = 90 * 1024 * 1024
          bytes_read = 0
          byte_lock = threading.Lock()
          tls = ssl.create_default_context()

          title_re = re.compile(r'<title[^>]*>(.*?)</title>', re.I | re.S)
          href_re = re.compile(r'href=["\']([^"\']+)["\']', re.I)
          token_re = re.compile(r'[a-z0-9]+')
          ws_re = re.compile(r'\s+')

          TYPE_TERMS = {
              'dpa': [('data-processing', 14), ('data_processing', 14), ('data processing', 12), ('dpa', 9), ('addendum', 5)],
              'subprocessors': [('subprocessor', 15), ('sub-processor', 15), ('sub processor', 13)],
              'privacy_notice': [('privacy-policy', 13), ('privacy-notice', 13), ('privacy policy', 11), ('privacy notice', 11), ('privacy', 5)],
              'security_page': [('security', 11), ('trust-center', 9), ('trust center', 9), ('data-security', 9)],
              'compliance_page': [('compliance', 12), ('trust-center', 9), ('trust center', 9), ('assurance', 6)],
              'trust_center': [('trust-center', 15), ('trust center', 15), ('trust', 9), ('security', 4), ('compliance', 4)],
              'terms_of_service': [('terms-of-service', 13), ('terms-of-use', 13), ('service-terms', 11), ('terms of service', 11), ('terms of use', 11), ('terms', 5)],
              'status_page': [('service-status', 15), ('system-status', 15), ('status', 13)],
              'transparency_report': [('transparency-report', 15), ('transparency report', 15)],
              'accessibility_statement': [('accessibility-statement', 15), ('accessibility', 13)],
              'other_public_source': [('legal', 4), ('trust', 4), ('security', 4), ('privacy', 4)],
          }
          STOP = {
              'the','and','for','of','to','a','an','public','page','policy','notice','agreement','vendor','data',
              'service','services','security','privacy','compliance','trust','center','terms','addendum','subprocessors',
              'subprocessor','processing','official','metadata','reference'
          }

          def normalise(value: str) -> str:
              try:
                  parts = urlsplit((value or '').strip())
              except Exception:
                  return ''
              if parts.scheme.lower() not in {'http', 'https'} or not parts.hostname:
                  return ''
              host = parts.hostname.lower()
              scheme = parts.scheme.lower()
              port = parts.port
              netloc = host
              if port and not ((scheme == 'https' and port == 443) or (scheme == 'http' and port == 80)):
                  netloc = f'{host}:{port}'
              path = re.sub(r'/+', '/', parts.path or '/')
              if path != '/':
                  path = path.rstrip('/')
              return urlunsplit((scheme, netloc, path, parts.query, ''))

          def allowed(url: str, domains: set[str]) -> bool:
              host = (urlsplit(url).hostname or '').lower()
              return any(host == domain or host.endswith('.' + domain) for domain in domains)

          def fetch(url: str, max_bytes: int = 1_500_000) -> dict:
              nonlocal bytes_read
              result = {'url': url, 'status': None, 'final_url': url, 'content_type': None, 'body': b'', 'error': None}
              with byte_lock:
                  exhausted = bytes_read >= byte_budget
              if time.monotonic() >= deadline or exhausted:
                  result['error'] = 'global_safety_budget_exhausted'
                  return result
              request = Request(
                  url,
                  headers={
                      'User-Agent': USER_AGENT,
                      'Accept': 'text/html,application/xhtml+xml,application/xml,text/xml,*/*;q=0.3',
                  },
                  method='GET',
              )
              try:
                  with urlopen(request, timeout=15, context=tls) as response:
                      body = response.read(max_bytes)
                      with byte_lock:
                          bytes_read += len(body)
                      result.update({
                          'status': response.getcode(),
                          'final_url': response.geturl(),
                          'content_type': response.headers.get_content_type(),
                          'content_encoding': response.headers.get('Content-Encoding'),
                          'body': body,
                      })
              except HTTPError as exc:
                  result.update({
                      'status': exc.code,
                      'final_url': exc.geturl() or url,
                      'content_type': exc.headers.get_content_type() if exc.headers else None,
                      'error': f'HTTPError: {exc.code}',
                  })
              except (URLError, TimeoutError, ssl.SSLError, ValueError) as exc:
                  result['error'] = f'{type(exc).__name__}: {exc}'[:400]
              except Exception as exc:
                  result['error'] = f'{type(exc).__name__}: {exc}'[:400]
              return result

          def text(result: dict) -> str:
              body = result.get('body') or b''
              if result.get('content_encoding') == 'gzip' or str(result.get('final_url', '')).endswith('.gz'):
                  try:
                      body = gzip.decompress(body)
                  except Exception:
                      pass
              return body.decode('utf-8', errors='replace')

          def title(result: dict) -> str | None:
              if result.get('content_type') not in {'text/html', 'application/xhtml+xml'}:
                  return None
              match = title_re.search(text(result))
              return ws_re.sub(' ', html.unescape(match.group(1))).strip()[:300] if match else None

          def sitemap_content(result: dict) -> tuple[list[str], list[str]]:
              try:
                  node = ET.fromstring(text(result))
              except ET.ParseError:
                  return [], []
              kind = node.tag.rsplit('}', 1)[-1].lower()
              locs = [
                  (child.text or '').strip()
                  for child in node.iter()
                  if child.tag.rsplit('}', 1)[-1].lower() == 'loc' and (child.text or '').strip()
              ]
              return (locs, []) if kind == 'sitemapindex' else ([], locs if kind == 'urlset' else [])

          def candidate_score(url: str, candidate_title: str, source: dict, vendor_name: str) -> tuple[int, list[str]]:
              haystack = f'{url} {candidate_title}'.lower()
              score = 0
              reasons = []
              source_type = source.get('source_type') or 'other_public_source'
              for term, weight in TYPE_TERMS.get(source_type, TYPE_TERMS['other_public_source']):
                  if term in haystack:
                      score += weight
                      reasons.append(term)
              vendor_tokens = {token for token in token_re.findall(vendor_name.lower()) if len(token) >= 3}
              title_tokens = {
                  token for token in token_re.findall((source.get('title_en') or source.get('title_native') or '').lower())
                  if token not in STOP and len(token) >= 3
              }
              for token in title_tokens - vendor_tokens:
                  if token in haystack:
                      score += 2
                      reasons.append('title:' + token)
              old_tokens = set(token_re.findall(urlsplit(source.get('source_url') or '').path.lower())) - STOP
              new_tokens = set(token_re.findall(urlsplit(url).path.lower())) - STOP
              overlap = len(old_tokens & new_tokens)
              if overlap:
                  score += min(2 * overlap, 8)
                  reasons.append(f'path_overlap:{overlap}')
              if normalise(url) == normalise(source.get('source_url') or ''):
                  score -= 60
                  reasons.append('same_as_broken')
              return score, sorted(set(reasons))

          grouped = defaultdict(list)
          for item in targets:
              grouped[item['vendor_id']].append(item)

          def crawl_vendor(vendor_id: str, items: list[dict]) -> tuple[str, dict]:
              vendor = yaml.safe_load((root / 'data/vendors' / vendor_id / 'vendor.yaml').read_text(encoding='utf-8')) or {}
              domains = {str(value).lower().strip() for value in vendor.get('official_domains', []) if str(value).strip()}
              for item in items:
                  old_host = (urlsplit(item.get('source_url') or '').hostname or '').lower()
                  if old_host and any(old_host == domain or old_host.endswith('.' + domain) for domain in domains):
                      domains.add(old_host)
              vendor_name = str(vendor.get('display_name') or vendor_id)
              pages = set()
              seeds = set()
              queue = deque()
              seen_sitemaps = set()

              for entrypoint in vendor.get('public_entrypoints', []) or []:
                  value = normalise(str(entrypoint))
                  if value and allowed(value, domains):
                      seeds.add(value)

              for domain in sorted(domains):
                  hosts = [domain] if domain.startswith('www.') else [domain, 'www.' + domain]
                  for host in hosts:
                      base = f'https://{host}'
                      seeds.add(base + '/')
                      robots = fetch(base + '/robots.txt', 350_000)
                      if robots.get('status') in LIVE:
                          for line in text(robots).splitlines():
                              if line.lower().startswith('sitemap:'):
                                  found = normalise(line.split(':', 1)[1].strip())
                                  if found and allowed(found, domains):
                                      queue.append(found)
                      for suffix in ('/sitemap.xml', '/sitemap_index.xml', '/sitemap-index.xml', '/wp-sitemap.xml'):
                          queue.append(base + suffix)

              while queue and time.monotonic() < deadline:
                  sitemap = normalise(queue.popleft())
                  if not sitemap or sitemap in seen_sitemaps or not allowed(sitemap, domains):
                      continue
                  seen_sitemaps.add(sitemap)
                  result = fetch(sitemap)
                  if result.get('status') not in LIVE:
                      continue
                  children, locs = sitemap_content(result)
                  for child in children:
                      child = normalise(child)
                      if child and allowed(child, domains) and child not in seen_sitemaps:
                          queue.append(child)
                  for loc in locs:
                      loc = normalise(loc)
                      if loc and allowed(loc, domains):
                          pages.add(loc)

              for seed in sorted(seeds):
                  result = fetch(seed, 750_000)
                  if result.get('status') not in LIVE or result.get('content_type') not in {'text/html', 'application/xhtml+xml'}:
                      continue
                  for href in href_re.findall(text(result)):
                      found = normalise(urljoin(result.get('final_url') or seed, html.unescape(href)))
                      if found and allowed(found, domains):
                          pages.add(found)

              target_results = []
              for item in sorted(items, key=lambda value: value['source_id']):
                  source = yaml.safe_load((root / item['source_path']).read_text(encoding='utf-8')) or {}
                  scored = []
                  for page in pages | seeds:
                      score, reasons = candidate_score(page, '', source, vendor_name)
                      if score >= 8:
                          scored.append((score, page, reasons))
                  scored.sort(key=lambda value: (-value[0], value[1]))

                  # Per-source verification budget: probe strongest semantic candidates, never cap vendor breadth.
                  probe_set = [page for _, page, _ in scored[:8]]
                  probed = {}
                  with ThreadPoolExecutor(max_workers=4) as pool:
                      futures = {pool.submit(fetch, page, 500_000): page for page in probe_set}
                      for future in as_completed(futures):
                          probed[futures[future]] = future.result()

                  live_candidates = {}
                  for page in probe_set:
                      result = probed.get(page) or {}
                      if result.get('status') not in LIVE:
                          continue
                      final_url = normalise(result.get('final_url') or page)
                      if not final_url or not allowed(final_url, domains):
                          continue
                      candidate_title = title(result) or ''
                      score, reasons = candidate_score(final_url, candidate_title, source, vendor_name)
                      if score < 8:
                          continue
                      candidate = {
                          'url': final_url,
                          'status': result.get('status'),
                          'content_type': result.get('content_type'),
                          'title': candidate_title or None,
                          'score': score,
                          'reasons': reasons,
                      }
                      previous = live_candidates.get(final_url)
                      if previous is None or score > previous['score']:
                          live_candidates[final_url] = candidate

                  ordered = sorted(live_candidates.values(), key=lambda value: (-value['score'], value['url']))
                  best = ordered[0] if ordered else None
                  second = ordered[1] if len(ordered) > 1 else None
                  auto_eligible = bool(
                      best
                      and best['score'] >= 12
                      and (second is None or best['score'] >= second['score'] + 3)
                      and normalise(best['url']) != normalise(source.get('source_url') or '')
                  )
                  target_results.append({
                      'source_id': item['source_id'],
                      'vendor_id': vendor_id,
                      'source_type': source.get('source_type'),
                      'title_en': source.get('title_en'),
                      'current_url': source.get('source_url'),
                      'official_domains': sorted(domains),
                      'sitemaps_examined': len(seen_sitemaps),
                      'official_pages_discovered': len(pages),
                      'candidate_count': len(ordered),
                      'auto_eligible': auto_eligible,
                      'recommended_url': best['url'] if auto_eligible else None,
                      'recommended_title': best.get('title') if auto_eligible else None,
                      'candidates': ordered,
                  })

              return vendor_id, {
                  'vendor_id': vendor_id,
                  'official_domains': sorted(domains),
                  'target_count': len(target_results),
                  'targets': target_results,
              }

          results = {}
          with ThreadPoolExecutor(max_workers=7) as pool:
              futures = {pool.submit(crawl_vendor, vendor_id, items): vendor_id for vendor_id, items in sorted(grouped.items())}
              for future in as_completed(futures):
                  vendor_id = futures[future]
                  try:
                      key, value = future.result()
                      results[key] = value
                  except Exception as exc:
                      results[vendor_id] = {
                          'vendor_id': vendor_id,
                          'target_count': len(grouped[vendor_id]),
                          'targets': [],
                          'error': f'{type(exc).__name__}: {exc}'[:500],
                      }

          flat = [target for vendor in results.values() for target in vendor.get('targets', [])]
          summary = {
              'target_count': len(targets),
              'vendors_scanned': len(grouped),
              'targets_processed': len(flat),
              'auto_eligible': sum(bool(item.get('auto_eligible')) for item in flat),
              'with_live_candidates': sum(item.get('candidate_count', 0) > 0 for item in flat),
              'without_live_candidates': sum(item.get('candidate_count', 0) == 0 for item in flat),
              'bytes_read': bytes_read,
              'safety_budget_exhausted': time.monotonic() >= deadline or bytes_read >= byte_budget,
          }
          output = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_maintenance_official_discovery',
              'base_sha': '${{ github.sha }}',
              'summary': summary,
              'vendors': [results[key] for key in sorted(results)],
              'guardrails': {
                  'official_vendor_domains_only': True,
                  'public_unauthenticated_sources_only': True,
                  'no_antibot_bypass': True,
                  'no_raw_documents_committed': True,
                  'breadth_vendor_cap': None,
                  'safety_budget_type': 'global_time_bytes_and_per_source_verification',
              },
              'not_advice': True,
          }
          path = root / 'maintenance/reviewed/owner-source-maintenance-3-discovery.json'
          path.write_text(json.dumps(output, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Commit discovery evidence
        run: |
          set -euo pipefail
          git config user.name 'openva-owner-catalog'
          git config user.email 'openva-owner-catalog@users.noreply.github.com'
          git add maintenance/reviewed/owner-source-maintenance-3-discovery.json
          git commit -m 'Catalog: record official replacement discovery [owner-maintenance-3-discovered]'
          git push
