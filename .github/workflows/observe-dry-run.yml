name: observe-dry-run

on:
  workflow_dispatch:
    inputs:
      emit_yaml:
        description: "Print raw observation YAML after the compact summary"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: observe-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Validate current records
        run: python -m tools.openva.validate validate
      - name: Run public-source observation pilot dry run
        run: |
          if [ "${{ inputs.emit_yaml }}" = "true" ]; then
            python -m tools.openva.observe observe-pilot --dry-run --emit-yaml
          else
            python -m tools.openva.observe observe-pilot --dry-run
          fi
