name: source-completion-registry-and-replay

on:
  push:
    branches:
      - catalog/source-completion-audit-control

permissions:
  contents: write
  actions: read

concurrency:
  group: source-completion-registry-and-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Align terms and status source roles with current catalog contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/openva/source_discovery.py')
          text = path.read_text(encoding='utf-8')
          if '"terms_of_service": {' not in text:
              marker = '    "status_page": {\n'
              block = '''    "terms_of_service": {
        "candidate_paths": (
            "/terms",
            "/terms-of-service",
            "/terms-of-use",
            "/legal/terms",
            "/legal/terms-of-service",
            "/legal/terms-of-use",
            "/terms-and-conditions",
            "/legal/terms-and-conditions",
            "/service-terms",
            "/legal/service-terms",
            "/user-agreement",
            "/legal/user-agreement",
            "/terms.html",
        ),
        "known_subdomain_patterns": ("legal",),
        "qualifies_for_coverage": True,
        "qualifies_for_vendor_materialization": True,
        "qualifies_as_promotion_source_role": True,
    },
'''
              if marker not in text:
                  raise SystemExit('status_page registry marker not found')
              text = text.replace(marker, block + marker, 1)
          old_status = '''    "status_page": {
        "candidate_paths": (
            "/status",
            "/statuspage",
            "/system-status",
            "/service-status",
            "/uptime",
        ),
        "known_subdomain_patterns": ("status",),
        "qualifies_for_coverage": True,
        "qualifies_for_vendor_materialization": False,
        "qualifies_as_promotion_source_role": False,
    },'''
          new_status = '''    "status_page": {
        "candidate_paths": (
            "/status",
            "/statuspage",
            "/system-status",
            "/service-status",
            "/uptime",
        ),
        "known_subdomain_patterns": ("status",),
        "qualifies_for_coverage": True,
        "qualifies_for_vendor_materialization": True,
        "qualifies_as_promotion_source_role": True,
    },'''
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit('unexpected status_page registry shape')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_source_discovery.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'test_completion_source_roles_are_promotable'
          if marker not in tests:
              tests += '''


def test_completion_source_roles_are_promotable() -> None:
    from tools.openva.source_discovery import source_type_role

    for source_type in ("terms_of_service", "status_page"):
        assert source_type_role(source_type, "qualifies_for_coverage") is True
        assert source_type_role(source_type, "qualifies_for_vendor_materialization") is True
        assert source_type_role(source_type, "qualifies_as_promotion_source_role") is True
'''
              test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Validate source-role alignment
        run: |
          python - <<'PY'
          from tools.openva.source_discovery import parse_source_types, source_type_role
          assert parse_source_types('terms_of_service,status_page') == ('terms_of_service', 'status_page')
          for source_type in ('terms_of_service', 'status_page'):
              assert source_type_role(source_type, 'qualifies_for_vendor_materialization')
              assert source_type_role(source_type, 'qualifies_as_promotion_source_role')
          PY
          pytest -q tests/test_source_discovery.py tests/test_candidate_promotion_actions.py
      - uses: actions/download-artifact@v4
        with:
          pattern: expanded-source-*
          path: .owner-source-completion-1/expanded-discovery
          merge-multiple: true
          run-id: 29274927672
          github-token: ${{ github.token }}
      - name: Replay completed discovery artifacts
        run: |
          test -f .owner-source-completion-1/expanded_completion.py
          test "$(find .owner-source-completion-1/expanded-discovery -name '*.json' | wc -l)" -eq 15
          python .owner-source-completion-1/expanded_completion.py aggregate \
            --reports-dir .owner-source-completion-1/expanded-discovery \
            --output-dir .owner-source-completion-1/results
      - name: Rebuild and validate catalog transaction
        run: |
          python -m tools.openva.validate build-indexes
          python -m tools.openva.catalog_source_completion build \
            --as-of 2026-07-14 \
            --output .owner-source-completion-1/results/expanded-completion-report.json
          python -m tools.openva.validate validate
          pytest -q \
            tests/test_catalog_source_completion.py \
            tests/test_catalog_guard.py \
            tests/test_source_discovery.py \
            tests/test_source_verification.py \
            tests/test_candidate_promotion_actions.py \
            tests/test_coverage_audit.py
      - name: Commit validated replay transaction
        run: |
          rm -f .owner-source-completion-1/expanded_completion.py
          rm -f .owner-source-completion-1/registry-replay-trigger.txt
          rm -rf .owner-source-completion-1/expanded-discovery
          git config user.name 'openva-owner-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Catalog: complete residual source coverage automatically'
          git push origin HEAD:catalog/owner-source-completion-1-builder
