name: source-completion-registry-and-replay

on:
  push:
    branches:
      - catalog/source-completion-audit-control

permissions:
  contents: write
  actions: read

concurrency:
  group: source-completion-registry-and-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: catalog/owner-source-completion-1-builder
          fetch-depth: 0
      - name: Reconcile current main before mutation
        run: |
          git config user.name 'openva-owner-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Align terms and status source roles with current catalog contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/openva/source_discovery.py')
          text = path.read_text(encoding='utf-8')
          if '"terms_of_service": {' not in text:
              marker = '    "status_page": {\n'
              block = '''    "terms_of_service": {
        "candidate_paths": (
            "/terms",
            "/terms-of-service",
            "/terms-of-use",
            "/legal/terms",
            "/legal/terms-of-service",
            "/legal/terms-of-use",
            "/terms-and-conditions",
            "/legal/terms-and-conditions",
            "/service-terms",
            "/legal/service-terms",
            "/user-agreement",
            "/legal/user-agreement",
            "/terms.html",
        ),
        "known_subdomain_patterns": ("legal",),
        "qualifies_for_coverage": True,
        "qualifies_for_vendor_materialization": True,
        "qualifies_as_promotion_source_role": True,
    },
'''
              if marker not in text:
                  raise SystemExit('status_page registry marker not found')
              text = text.replace(marker, block + marker, 1)
          old_status = '''    "status_page": {
        "candidate_paths": (
            "/status",
            "/statuspage",
            "/system-status",
            "/service-status",
            "/uptime",
        ),
        "known_subdomain_patterns": ("status",),
        "qualifies_for_coverage": True,
        "qualifies_for_vendor_materialization": False,
        "qualifies_as_promotion_source_role": False,
    },'''
          new_status = '''    "status_page": {
        "candidate_paths": (
            "/status",
            "/statuspage",
            "/system-status",
            "/service-status",
            "/uptime",
        ),
        "known_subdomain_patterns": ("status",),
        "qualifies_for_coverage": True,
        "qualifies_for_vendor_materialization": True,
        "qualifies_as_promotion_source_role": True,
    },'''
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit('unexpected status_page registry shape')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_source_discovery.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'test_completion_source_roles_are_promotable'
          if marker not in tests:
              tests += '''


def test_completion_source_roles_are_promotable() -> None:
    from tools.openva.source_discovery import source_type_role

    for source_type in ("terms_of_service", "status_page"):
        assert source_type_role(source_type, "qualifies_for_coverage") is True
        assert source_type_role(source_type, "qualifies_for_vendor_materialization") is True
        assert source_type_role(source_type, "qualifies_as_promotion_source_role") is True
'''
              test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Validate source-role alignment
        run: |
          python - <<'PY'
          from tools.openva.source_discovery import parse_source_types, source_type_role
          assert parse_source_types('terms_of_service,status_page') == ('terms_of_service', 'status_page')
          for source_type in ('terms_of_service', 'status_page'):
              assert source_type_role(source_type, 'qualifies_for_vendor_materialization')
              assert source_type_role(source_type, 'qualifies_as_promotion_source_role')
          PY
          pytest -q tests/test_source_discovery.py tests/test_candidate_promotion_actions.py
      - uses: actions/download-artifact@v4
        with:
          pattern: expanded-source-*
          path: .owner-source-completion-1/expanded-discovery
          merge-multiple: true
          run-id: 29274927672
          github-token: ${{ github.token }}
      - name: Replay completed discovery artifacts
        run: |
          test -f .owner-source-completion-1/expanded_completion.py
          test "$(find .owner-source-completion-1/expanded-discovery -name '*.json' | wc -l)" -eq 15
          python .owner-source-completion-1/expanded_completion.py aggregate \
            --reports-dir .owner-source-completion-1/expanded-discovery \
            --output-dir .owner-source-completion-1/results
      - name: Record honest unavailable states for unresolved non-privacy groups
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import date, timedelta
          from pathlib import Path

          import yaml

          from tools.openva.catalog_source_completion import EXPECTED_GROUPS, build_report
          from tools.openva.source_discovery import unavailable_record

          root = Path('.')
          reports_dir = root / '.owner-source-completion-1/expanded-discovery'
          checked = {}
          for path in sorted(reports_dir.glob('*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              for row in payload.get('vendors') or []:
                  checked[(str(row.get('vendor_id')), str(row.get('group')))] = list(row.get('checked_urls') or [])

          report = build_report(root, today=date(2026, 7, 14), generated_at='2026-07-14T00:00:00Z')
          reviewed_at = '2026-07-14T00:00:00Z'
          next_review = (date(2026, 7, 14) + timedelta(days=90)).isoformat()
          preferred_type = {
              'terms_of_service': 'terms_of_service',
              'security_assurance': 'security_page',
              'dpa': 'dpa',
              'subprocessors_list': 'subprocessors_list',
              'status_page': 'status_page',
              'compliance': 'compliance_page',
          }
          written = []
          for vendor in report['vendors']:
              vendor_id = str(vendor['vendor_id'])
              vendor_path = root / 'data/vendors' / vendor_id / 'vendor.yaml'
              vendor_record = yaml.safe_load(vendor_path.read_text(encoding='utf-8')) or {}
              official = [str(item) for item in vendor_record.get('public_entrypoints') or [] if item]
              official.extend(f"https://{domain}" for domain in vendor_record.get('official_domains') or [] if domain)
              for group in vendor['unresolved_groups']:
                  if group == 'privacy_notice':
                      continue
                  source_type = preferred_type.get(group)
                  if not source_type:
                      source_type = sorted(EXPECTED_GROUPS[group])[0]
                  evidence_urls = list(dict.fromkeys([
                      *checked.get((vendor_id, group), []),
                      *official,
                  ]))
                  record = unavailable_record(
                      vendor_id,
                      source_type,
                      evidence_urls,
                      reviewed_at,
                      next_review,
                  )
                  record['notes'] = (
                      'No source-type-correct canonical public source was retained after bounded official-path, '
                      'official-link, legal-page, trust/status-subdomain, sitemap, HTTP, semantic, redirect, and '
                      'page-purpose review. This records discovery state only and does not assert that a document '
                      'does not exist or express any vendor quality, compliance, security, availability, or risk conclusion.'
                  )
                  path = root / 'data/vendors' / vendor_id / 'unavailable_sources' / f"{record['unavailable_source_id']}.yaml"
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(yaml.safe_dump(record, sort_keys=False, allow_unicode=True), encoding='utf-8')
                  written.append({'vendor_id': vendor_id, 'group': group, 'source_type': source_type, 'path': str(path)})

          final = build_report(root, today=date(2026, 7, 14), generated_at=reviewed_at)
          summary = {
              'schema_version': '0.1.0',
              'report_type': 'owner_source_completion_residual_unavailable_summary',
              'unavailable_records_written': len(written),
              'records': written,
              'completion_summary': final['summary'],
              'missing_live_privacy': final['missing_live_privacy'],
              'insufficient_live_breadth': final['insufficient_live_breadth'],
              'unresolved_by_group': final['unresolved_by_group'],
              'not_advice': True,
          }
          output = root / '.owner-source-completion-1/results/residual-unavailable-summary.json'
          output.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'unavailable_records_written': len(written),
              'completion_summary': final['summary'],
              'missing_live_privacy': final['missing_live_privacy'],
              'insufficient_live_breadth': final['insufficient_live_breadth'],
          }, indent=2, sort_keys=True))
          PY
      - name: Rebuild and enforce zero-incomplete-vendor acceptance
        run: |
          python -m tools.openva.validate build-indexes
          python -m tools.openva.catalog_source_completion check \
            --as-of 2026-07-14 \
            --output .owner-source-completion-1/results/expanded-completion-report.json
          python -m tools.openva.validate validate
          pytest -q \
            tests/test_catalog_source_completion.py \
            tests/test_catalog_guard.py \
            tests/test_source_discovery.py \
            tests/test_source_verification.py \
            tests/test_candidate_promotion_actions.py \
            tests/test_coverage_audit.py
      - name: Commit validated current-main replay transaction
        run: |
          rm -f .owner-source-completion-1/expanded_completion.py
          rm -f .owner-source-completion-1/registry-replay-trigger.txt
          rm -rf .owner-source-completion-1/expanded-discovery
          git config user.name 'openva-owner-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Catalog: complete residual source coverage under current policy'
          git push origin HEAD:catalog/owner-source-completion-1-builder
