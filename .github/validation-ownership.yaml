version: 1
workflow: .github/workflows/validate.yml
required_status_contexts:
  - validate / pr-change-classifier
  - validate / repository-integrity
  - validate / workspace-plan
  - validate / workspace-component-tests
  - validate / workspace-affected-tests
  - validate / workflow-operating-model
  - validate / catalog-growth
  - validate / source-maintenance
  - validate / catalog-quality
  - validate / release-site
  - validate / full-regression-shards
  - validate / mcp-integration
  - validate / google-sheets-integration
  - validate / pr-scope-guard
jobs:
  pr-change-classifier:
    owner_loop: pr_safety
    purpose: Classify PR changed paths into validation lanes so low-risk PRs keep fast checks while catalog, workflow, source-maintenance, release/site, MCP, and Sheets changes retain targeted coverage.
    commands:
      - git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
    protects:
      - .github/workflows/validate.yml
      - .github/validation-ownership.yaml
  repository-integrity:
    owner_loop: repository_integrity
    purpose: Validate canonical records, deterministic generated outputs, and the source-intelligence release gates for authority-sensitive changes; always preserve the repository hygiene check.
    commands:
      - python -m tools.openva.validate validate
      - python -m tools.openva.validate build-indexes
      - git diff --exit-code openva-pack.json indexes/ dist/
      - python -m tools.openva.release_gates check --profile pr
    protects:
      - schemas/openva/**
      - data/vendors/**
      - openva-pack.json
      - indexes/**
      - dist/**
      - config/bot-constitution.yaml
      - config/release-gates.yaml
      - tools/openva/release_gates.py
  workspace-plan:
    owner_loop: workspace_control_plane
    purpose: Validate the workspace manifest, calculate reverse-dependent impact from the exact PR diff, and publish whether the selected plan requires full regression coverage.
    commands:
      - python -m tools.openva.workspace validate
      - python -m tools.openva.workspace plan
    protects:
      - tools/openva/workspace.py
      - tools/openva/workspace.yaml
      - adapters/python/**
      - integrations/mcp/**
      - services/openva_match_service/**
      - integrations/google-sheets/**
  workspace-component-tests:
    owner_loop: workspace_control_plane
    purpose: Install the dependency chain and run only the selected Python tests when the workspace plan is component-scoped.
    commands:
      - python -m tools.openva.workspace validate
      - python -m tools.openva.workspace plan
      - subprocess.run([sys.executable, '-m', 'pytest', '-q', *plan['test_paths']], check=True)
    protects:
      - adapters/python/**
      - integrations/mcp/**
      - services/openva_match_service/**
      - integrations/google-sheets/**
  workspace-affected-tests:
    owner_loop: workspace_control_plane
    purpose: Preserve the required workspace status context and fail unless the delegated component tests or parallel full-regression shards succeed.
    commands:
      - echo "Full-suite plan validated by parallel regression shards."
      - echo "Targeted plan validated by component-scoped tests."
    protects:
      - tools/openva/workspace.py
      - tools/openva/workspace.yaml
      - adapters/python/**
      - integrations/mcp/**
      - services/openva_match_service/**
      - integrations/google-sheets/**
  workflow-operating-model:
    owner_loop: workflow_control_plane
    purpose: Validate workflow inventory, operating model, future-operation specs, and structured contracts.
    commands:
      - pytest -q tests/test_ci_readiness.py tests/test_workflow_operating_model.py tests/test_workflow_workspace_ci.py tests/test_workflow_retirement_evidence.py tests/test_future_operations_specs.py tests/test_workflow_contracts.py
    protects:
      - .github/workflows/**
      - .github/validation-ownership.yaml
      - docs/operations/**
      - docs/architecture/**
  catalog-growth:
    owner_loop: catalog_growth
    purpose: Validate taxonomy-driven discovery, seed/candidate posture, and reviewed promotion handoff.
    commands:
      - pytest -q tests/test_catalog_growth_discovery_queue.py tests/test_vendor_candidate_discovery.py tests/test_reviewed_candidate_promotion_doc.py tests/test_candidate_promotion_actions.py tests/test_promotion_planner.py
    protects:
      - maintenance/seeds/vendors/**
      - maintenance/queues/catalog-growth-discovery.json
      - docs/maintenance/catalog-growth-discovery.md
      - docs/maintenance/reviewed-candidate-promotion.md
  source-maintenance:
    owner_loop: source_maintenance
    purpose: Validate source health, reviewer handoff, source repair, source preflight, and release source-health readiness.
    commands:
      - pytest -q tests/test_source_*.py tests/test_p0_repair_automerge_workflow.py tests/test_release_candidate_workflow.py
    protects:
      - .github/workflows/source-maintenance-report.yml
      - .github/workflows/source-refinement-scan.yml
      - .github/workflows/source-repair-pr.yml
      - .github/workflows/source-repair-pr-cleanup.yml
      - tools/openva/source_*.py
  catalog-quality:
    owner_loop: catalog_quality
    purpose: Validate catalog guardrails, catalog-facing tests, and advisory automation rules.
    commands:
      - pytest -q tests/test_catalog*.py tests/test_automation_rules.py
    protects:
      - config/category-taxonomy.yaml
      - config/controlled-vocabulary.yaml
      - tests/test_catalog*.py
      - tools/openva/automation_rules.py
  release-site:
    owner_loop: publication
    purpose: Validate release assets, site build expectations, and consumer adapter contract tests.
    commands:
      - pytest -q tests/test_release_*.py tests/test_site.py tests/test_adapter_contract.py
    protects:
      - docs/release-downloads.md
      - docs/adapter-contract.md
      - public/**
      - site/**
      - tools/openva/release_*.py
  full-regression-shards:
    owner_loop: regression
    purpose: Preserve broad regression coverage without a single monolithic pytest invocation that can hit the platform timeout.
    commands:
      - pytest -q ${{ matrix.pytest_args }}
    protects:
      - tests/**
      - tools/**
      - services/**
      - adapters/**
      - integrations/**
  mcp-integration:
    owner_loop: publication
    purpose: Run the MCP server protocol, hardening, conformance, and release-coherence tests with the real MCP SDK and local dependency chain installed, so the protocol tests are authoritative and never skipped.
    commands:
      - pip install -e adapters/python/openva_pack_reader
      - pip install -e adapters/python/openva_vendor_inventory_matcher
      - pip install -e "integrations/mcp/openva_mcp[dev]"
      - pytest -q tests/test_openva_mcp.py tests/test_openva_mcp_protocol.py tests/test_openva_mcp_hardening.py tests/test_openva_mcp_metadata.py tests/test_openva_mcp_enrich.py tests/test_openva_mcp_streamable_http.py tests/test_openva_mcp_authority_boundaries.py tests/test_matching_conformance.py tests/test_release_coherence.py tests/test_agent_bundle_verification.py
    protects:
      - integrations/mcp/**
      - adapters/python/openva_vendor_inventory_matcher/**
      - adapters/python/openva_pack_reader/**
      - tools/openva/release_coherence.py
  google-sheets-integration:
    owner_loop: publication
    purpose: Run the Google Sheets integration pure-function tests on the Node runtime so the manual-install Apps Script client's input mapping, batching, response validation, write isolation, and formula-injection behavior are covered.
    commands:
      - node --test integrations/google-sheets/test/*.test.mjs
    protects:
      - integrations/google-sheets/**
      - tests/test_google_sheets_integration.py
  pr-scope-guard:
    owner_loop: pr_safety
    purpose: Enforce the PR work-package scope guard — every changed path must fall within the PR's declared work package, evaluated with the guard code and manifest from the trusted base revision so a PR cannot weaken its own gate. PR-only.
    commands:
      - python -m tools.openva.pr_scope_guard --declaration-file /tmp/pr-body.txt --changed-paths-file /tmp/changed-paths.txt
    protects:
      - docs/operations/contracts/work-package-scope.yaml
      - tools/openva/pr_scope_guard.py
      - docs/operations/pr-scope-guard.md
