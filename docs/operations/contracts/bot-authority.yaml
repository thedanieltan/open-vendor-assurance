version: 1
contract: bot-authority
source_document: docs/operations/BOT_OPERATING_MODEL.md
default_posture:
  undeclared_lanes_are_denied: true
  undeclared_write_paths_are_denied: true
  report_only_lanes_may_write_catalog_truth: false
  discovery_lanes_may_write_catalog_truth: false
  # WP37: no single bot may hold discovery + decision + merge. Authority is
  # tiered (see authority_levels); separation of duty is enforced across tiers,
  # not by trusting any one bot.
  no_single_bot_holds_discovery_decision_and_merge: true
# WP37 explicit authority levels 0-5. A level is a ROLE ceiling, not a lane:
# several reviewer roles share level 2 inside one workflow step, and some
# levels (5) are reserved for a later work package. Every lane declares the
# highest level it may exercise; a lane may never act above its declared level.
authority_levels:
  - level: 0
    name: report_only
    description: >-
      Observation, discovery, quality, dashboards, chatops, and submission
      verification. May produce reports, issues, comments, or operational
      labels. Holds no catalog-truth, decision, or merge authority.
    may_write_catalog_truth: false
    may_record_decision: false
    may_merge: false
  - level: 1
    name: evidence_authorship
    description: >-
      May open a pull request that proposes catalog or publication state from
      linked evidence. Cannot record an autonomous promotion/materialization
      decision, and cannot merge.
    may_write_catalog_truth: true
    may_record_decision: false
    may_merge: false
  - level: 2
    name: independent_reviewer
    description: >-
      An independent quorum reviewer (identity, domain-authority, source,
      duplicate/fuzzy-match, adversarial, release-gate). Casts a clear/challenge
      verdict over committed evidence. Holds no write, decision, or merge
      authority on its own; two reviewers built from the same module are not
      independent.
    may_write_catalog_truth: false
    may_record_decision: false
    may_merge: false
  - level: 3
    name: deciding
    description: >-
      Records an append-only machine decision (materialize_provisional /
      promote) once an independent quorum supports it. May never be the
      discovery bot for the same subject and may never be the sole supporter of
      its own decision.
    may_write_catalog_truth: true
    may_record_decision: true
    may_merge: false
  - level: 4
    name: merge_authority
    description: >-
      May enable native auto-merge and apply merge labels after path checks,
      gates, and required checks pass. Merges only already-reviewable PR state;
      never discovers, decides, or authors catalog truth.
    may_write_catalog_truth: false
    may_record_decision: false
    may_merge: true
  - level: 5
    name: reversal_authority
    description: >-
      Rollback / quarantine reversal (reserved for WP38). May revert recent
      machine-created state through a pull request; never rewrites the ledger or
      decision history, and must not be the component that authored the state it
      reverts. No active lane operates at this level yet.
    may_write_catalog_truth: true
    may_record_decision: true
    may_merge: false
lanes:
  - id: pr_safety
    status: active
    authority_level: 4
    workflows: [validate.yml, catalog-pr-guard.yml, agent-weighted-review.yml, agent-automerge.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: true
    may_enable_auto_merge: true
    may_merge_prs: true
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: Merges only already-reviewable PR state after strict-growth labels, path checks, and required checks pass.
    required_labels_for_write_authority: [agent-automerge]
    token_permissions: {contents: write, pull-requests: write, checks: read, statuses: read}
    audit_artifacts: [automerge preflight output]
    deny_by_default: true
  - id: source_maintenance_report
    status: active
    authority_level: 0
    workflows: [source-maintenance-report.yml, source-refinement-scan.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: read}
    audit_artifacts: [openva-source-maintenance-report, openva-source-reviewer-inbox, confirmed P0 scan artifacts]
    deny_by_default: true
  - id: source_repair
    status: active
    authority_level: 1
    workflows: [source-repair-pr.yml, source-repair-pr-cleanup.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    allowed_paths: [data/vendors/**, maintenance/reviewed/**]
    required_labels_for_write_authority: [reviewed-source-repair]
    token_permissions: {contents: write, pull-requests: write, issues: write}
    audit_artifacts: [reviewed repair evidence, repair action report, stale PR cleanup report]
    deny_by_default: true
  - id: source_quarantine
    status: active
    authority_level: 3
    workflows: [candidate-promotion-pr.yml, agent-automerge.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: true
    allowed_labels: [quarantine, automerge:quarantine]
    allowed_label_actions: [add]
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    write_authority_explanation: >-
      WP38a quarantine writes ONLY the status-only fields of a SINGLE existing
      source (review_state -> quarantined plus the quarantine block: reason,
      quarantined_by, quarantined_at, the linked decision id, and a
      revert_quarantine reversal) plus its linked append-only quarantine decision
      record under maintenance/machine-decisions/** and the deterministic
      generated outputs. It quarantines a source only when it is persistently
      not-found/gone in the committed observation ledger and no safe replacement
      has been applied; it never fabricates a replacement, never quarantines or
      bypasses a gated/bot-protected source, and never interprets the meaning of
      a material change. Separation of duties: the deciding bot differs from the
      observation/discovery bot. Reversible through a pull request.
    allowed_paths: [data/vendors/**, maintenance/machine-decisions/**]
    required_labels_for_write_authority: [reviewed-evidence]
    token_permissions: {contents: write, pull-requests: write}
    audit_artifacts: [quarantine eligibility report, quarantine decision record, quarantine application report, PR body]
    deny_by_default: true
  - id: source_rollback
    status: active
    authority_level: 5
    workflows: [candidate-promotion-pr.yml, agent-automerge.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: true
    allowed_labels: [rollback, automerge:rollback]
    allowed_label_actions: [add]
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    write_authority_explanation: >-
      WP38b Level-5 rollback reverts recent machine-created state for a SINGLE
      target decision: a promotion (restore catalog_status machine_provisional),
      a materialization (remove the machine-created vendor), or a quarantine
      (restore the prior review_state). It APPENDS a rollback decision record
      under maintenance/machine-decisions/** linking the original and never
      rewrites the committed observation ledger or decision history. The rollback
      bot must NOT be the bot that authored the state it reverts (reverser !=
      author), enforced by the append-time separation-of-duty check and the
      release gate. Reversible by re-running the forward lane (reapply).
    allowed_paths: [data/vendors/**, maintenance/machine-decisions/**]
    required_labels_for_write_authority: [reviewed-evidence]
    token_permissions: {contents: write, pull-requests: write}
    audit_artifacts: [rollback plan, rollback decision record, rollback application report, PR body]
    deny_by_default: true
  - id: observation_ledger_append
    status: active
    authority_level: 1
    workflows: [observation-ledger-append-pr.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: true
    allowed_labels: [observation-ledger, automerge:observation]
    allowed_label_actions: [add]
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    write_authority_explanation: >-
      May open a PR that appends append-only observation events under
      maintenance/source-observations/events/** and apply only the two
      observation automerge labels. Never rewrites existing ledger lines and
      never writes catalog truth. The autonomy boundary is enforced by path
      restriction, append-only verification, and the WP35 release gate rather
      than by a human label; merge is enabled by the agent-automerge
      observation job after that gate passes.
    allowed_paths: [maintenance/source-observations/events/**]
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: write, pull-requests: write}
    audit_artifacts: [observation ledger append plan summary, observation-ledger-delta.ndjson, append PR body]
    deny_by_default: true
  - id: catalog_quality
    status: active
    authority_level: 0
    workflows: [coverage-audit.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    required_labels_for_write_authority: []
    token_permissions: {contents: read, actions: read}
    audit_artifacts: [coverage audit report, coverage growth report]
    deny_by_default: true
  - id: catalog_growth_discovery
    status: active
    authority_level: 0
    workflows: [catalog-growth-discovery.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May create or update issues for reporting only; discovery may propose but controlled promotion writes.
    required_labels_for_write_authority: []
    token_permissions: {contents: read, issues: write}
    audit_artifacts: [candidate discovery reports, proposal plans]
    deny_by_default: true
  - id: catalog_growth_quorum_promotion
    status: active
    authority_level: 3
    workflows: [candidate-promotion-pr.yml, agent-automerge.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: true
    allowed_labels: [quorum-promotion, automerge:quorum-promotion]
    allowed_label_actions: [add]
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    write_authority_explanation: >-
      WP37 quorum promotion writes ONLY the lifecycle/provenance fields of a
      SINGLE existing machine_provisional vendor (catalog_status -> active, the
      promotion machine_decision_id, and the reversal reference -> revert_promotion)
      plus its linked append-only promotion decision record under
      maintenance/machine-decisions/** and the deterministic generated outputs.
      It is status-only: it may not add, remove, or edit any source, artifact, or
      change record, and may not touch any other vendor. Promotion requires an
      independent machine quorum (separate identity, domain-authority, source,
      duplicate, and adversarial reviewers plus the release gate), separation of
      duties (the deciding bot is never the discovery bot and never the sole
      supporter), a minimum stable-observation age and observation count, no open
      duplicate/adversarial/domain-drift challenge, and a promotion delay. The
      autonomy boundary is enforced by the quorum, the decision record, the
      status-only automerge gate, and the WP35 release gate, not by a human label.
    allowed_paths: [data/vendors/**, maintenance/machine-decisions/**]
    required_labels_for_write_authority: [reviewed-evidence]
    token_permissions: {contents: write, pull-requests: write}
    audit_artifacts: [quorum review report, promotion decision record, promotion application report, PR body]
    deny_by_default: true
  - id: catalog_growth_promotion
    status: active
    authority_level: 3
    workflows: [candidate-promotion-pr.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: true
    allowed_labels: [machine-provisional, automerge:machine-provisional]
    allowed_label_actions: [add]
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    write_authority_explanation: >-
      Reviewed-path promotion writes reviewed source evidence. WP36 machine
      materialization (strict-growth path) writes only a NEW vendor directory as
      catalog_status: machine_provisional plus its linked append-only machine
      decision record under maintenance/machine-decisions/**; it may not modify
      an existing vendor directory and may not promote provisional to a terminal
      status (that is WP37 quorum). It may apply only the machine-provisional
      marker and, after the not_before delay, the automerge:machine-provisional
      label. The autonomy boundary is enforced by the decision record,
      separation of duties, the not_before delay, and the WP35 release gate, not
      by a human label.
    allowed_paths: [data/vendors/**, maintenance/reviewed/**, maintenance/machine-decisions/**]
    required_labels_for_write_authority: [reviewed-evidence]
    token_permissions: {contents: write, pull-requests: write}
    audit_artifacts: [reviewed promotion plan, promotion application report, machine decision record, PR body]
    deny_by_default: true
  - id: publication
    status: active
    authority_level: 1
    workflows: [release-candidate.yml, site-pages.yml, release-downloads.yml, site-live-feed.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: Writes only Pages deployments or GitHub release assets; it must not generate catalog truth.
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: write, pages: write, id-token: write}
    audit_artifacts: [release artifacts, source-health readiness report, Pages deployment artifact, release download assets]
    deny_by_default: true
  - id: bot_dashboard_issue_sync
    status: active
    authority_level: 0
    workflows: [bot-dashboard-issue.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May create or update only the persistent OpenVA Bot Dashboard issue when a maintainer explicitly disables dry-run/report-only mode.
    required_labels_for_write_authority: []
    token_permissions: {contents: read, issues: write}
    audit_artifacts: [maintenance/bot-dashboard.md, maintenance/bot-dashboard-issue-sync-report.json]
    deny_by_default: true
  - id: bot_chatops_hold
    status: active
    authority_level: 0
    workflows: [bot-chatops.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: true
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May add or remove only the openva-hold label on the current issue or pull request after maintainer authorization and command validation.
    required_labels_for_write_authority: []
    allowed_labels: [openva-hold]
    allowed_label_actions: [add, remove]
    token_permissions: {contents: read, issues: write, pull-requests: read}
    audit_artifacts: [chatops decision comment]
    deny_by_default: true
  - id: submission_verification
    status: active
    authority_level: 0
    workflows: [submitted-source-verification.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: true
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May post or update one verification comment and apply or remove only candidate triage labels on submission issues (issue-state mutation only, no Git or catalog state); never writes catalog truth, never opens branches or PRs, never probes declared-gated sources, and respects the openva-hold label on all trigger paths including manual dispatch.
    required_labels_for_write_authority: []
    allowed_labels: ["candidate:verified", "candidate:needs-review", "candidate:duplicate", "candidate:gated", "candidate:ambiguous", "candidate:rejected", "candidate:fetch-failed"]
    allowed_label_actions: [add, remove]
    token_permissions: {contents: read, issues: write}
    audit_artifacts: [submission verification report, verification comment]
    deny_by_default: true
  - id: support_agent_pr
    status: active
    authority_level: 1
    workflows: [catalog-agent-pr.yml, catalog-maintenance-pr.yml, contribution-intake-agent.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    strict_growth_authority: false
    allowed_paths: [data/vendors/**, docs/**, maintenance/**, tools/**, tests/**]
    required_labels_for_write_authority: [maintainer-approved]
    token_permissions: {contents: write, pull-requests: write, issues: write}
    audit_artifacts: [support PR branch, support PR body, intake issue link]
    deny_by_default: true
  - id: legacy_report
    status: shadow_report_only
    authority_level: 0
    workflows: [catalog-maintenance.yml, source-refinement-queue.yml, observe-report.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: read}
    audit_artifacts: [catalog maintenance report, source refinement queue, observation report]
    deny_by_default: true
