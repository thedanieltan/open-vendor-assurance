version: 1
contract: bot-authority
source_document: docs/operations/BOT_OPERATING_MODEL.md
default_posture:
  undeclared_lanes_are_denied: true
  undeclared_write_paths_are_denied: true
  report_only_lanes_may_write_catalog_truth: false
  discovery_lanes_may_write_catalog_truth: false
lanes:
  - id: pr_safety
    status: active
    workflows: [validate.yml, catalog-pr-guard.yml, agent-weighted-review.yml, agent-automerge.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: true
    may_enable_auto_merge: true
    may_merge_prs: true
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: Merges only already-reviewable PR state after strict-growth labels, path checks, and required checks pass.
    required_labels_for_write_authority: [agent-automerge]
    token_permissions: {contents: write, pull-requests: write, checks: read, statuses: read}
    audit_artifacts: [automerge preflight output]
    deny_by_default: true
  - id: source_maintenance_report
    status: active
    workflows: [source-maintenance-report.yml, source-refinement-scan.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: read}
    audit_artifacts: [openva-source-maintenance-report, openva-source-reviewer-inbox, confirmed P0 scan artifacts]
    deny_by_default: true
  - id: source_repair
    status: active
    workflows: [source-repair-pr.yml, source-repair-pr-cleanup.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    allowed_paths: [data/vendors/**, maintenance/reviewed/**]
    required_labels_for_write_authority: [reviewed-source-repair]
    token_permissions: {contents: write, pull-requests: write, issues: write}
    audit_artifacts: [reviewed repair evidence, repair action report, stale PR cleanup report]
    deny_by_default: true
  - id: observation_ledger_append
    status: active
    workflows: [observation-ledger-append-pr.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: true
    allowed_labels: [observation-ledger, automerge:observation]
    allowed_label_actions: [add]
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    write_authority_explanation: >-
      May open a PR that appends append-only observation events under
      maintenance/source-observations/events/** and apply only the two
      observation automerge labels. Never rewrites existing ledger lines and
      never writes catalog truth. The autonomy boundary is enforced by path
      restriction, append-only verification, and the WP35 release gate rather
      than by a human label; merge is enabled by the agent-automerge
      observation job after that gate passes.
    allowed_paths: [maintenance/source-observations/events/**]
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: write, pull-requests: write}
    audit_artifacts: [observation ledger append plan summary, observation-ledger-delta.ndjson, append PR body]
    deny_by_default: true
  - id: catalog_quality
    status: active
    workflows: [coverage-audit.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    required_labels_for_write_authority: []
    token_permissions: {contents: read, actions: read}
    audit_artifacts: [coverage audit report, coverage growth report]
    deny_by_default: true
  - id: catalog_growth_discovery
    status: active
    workflows: [catalog-growth-discovery.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May create or update issues for reporting only; discovery may propose but controlled promotion writes.
    required_labels_for_write_authority: []
    token_permissions: {contents: read, issues: write}
    audit_artifacts: [candidate discovery reports, proposal plans]
    deny_by_default: true
  - id: catalog_growth_promotion
    status: active
    workflows: [candidate-promotion-pr.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: true
    allowed_labels: [machine-provisional, automerge:machine-provisional]
    allowed_label_actions: [add]
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    write_authority_explanation: >-
      Reviewed-path promotion writes reviewed source evidence. WP36 machine
      materialization (strict-growth path) writes only a NEW vendor directory as
      catalog_status: machine_provisional plus its linked append-only machine
      decision record under maintenance/machine-decisions/**; it may not modify
      an existing vendor directory and may not promote provisional to a terminal
      status (that is WP37 quorum). It may apply only the machine-provisional
      marker and, after the not_before delay, the automerge:machine-provisional
      label. The autonomy boundary is enforced by the decision record,
      separation of duties, the not_before delay, and the WP35 release gate, not
      by a human label.
    allowed_paths: [data/vendors/**, maintenance/reviewed/**, maintenance/machine-decisions/**]
    required_labels_for_write_authority: [reviewed-evidence]
    token_permissions: {contents: write, pull-requests: write}
    audit_artifacts: [reviewed promotion plan, promotion application report, machine decision record, PR body]
    deny_by_default: true
  - id: publication
    status: active
    workflows: [release-candidate.yml, site-pages.yml, release-downloads.yml, site-live-feed.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: Writes only Pages deployments or GitHub release assets; it must not generate catalog truth.
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: write, pages: write, id-token: write}
    audit_artifacts: [release artifacts, source-health readiness report, Pages deployment artifact, release download assets]
    deny_by_default: true
  - id: bot_dashboard_issue_sync
    status: active
    workflows: [bot-dashboard-issue.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May create or update only the persistent OpenVA Bot Dashboard issue when a maintainer explicitly disables dry-run/report-only mode.
    required_labels_for_write_authority: []
    token_permissions: {contents: read, issues: write}
    audit_artifacts: [maintenance/bot-dashboard.md, maintenance/bot-dashboard-issue-sync-report.json]
    deny_by_default: true
  - id: bot_chatops_hold
    status: active
    workflows: [bot-chatops.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: true
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May add or remove only the openva-hold label on the current issue or pull request after maintainer authorization and command validation.
    required_labels_for_write_authority: []
    allowed_labels: [openva-hold]
    allowed_label_actions: [add, remove]
    token_permissions: {contents: read, issues: write, pull-requests: read}
    audit_artifacts: [chatops decision comment]
    deny_by_default: true
  - id: submission_verification
    status: active
    workflows: [submitted-source-verification.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: true
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    write_authority_explanation: May post or update one verification comment and apply or remove only candidate triage labels on submission issues (issue-state mutation only, no Git or catalog state); never writes catalog truth, never opens branches or PRs, never probes declared-gated sources, and respects the openva-hold label on all trigger paths including manual dispatch.
    required_labels_for_write_authority: []
    allowed_labels: ["candidate:verified", "candidate:needs-review", "candidate:duplicate", "candidate:gated", "candidate:ambiguous", "candidate:rejected", "candidate:fetch-failed"]
    allowed_label_actions: [add, remove]
    token_permissions: {contents: read, issues: write}
    audit_artifacts: [submission verification report, verification comment]
    deny_by_default: true
  - id: support_agent_pr
    status: active
    workflows: [catalog-agent-pr.yml, catalog-maintenance-pr.yml, contribution-intake-agent.yml]
    may_write_branches: true
    may_open_prs: true
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: true
    strict_growth_authority: false
    allowed_paths: [data/vendors/**, docs/**, maintenance/**, tools/**, tests/**]
    required_labels_for_write_authority: [maintainer-approved]
    token_permissions: {contents: write, pull-requests: write, issues: write}
    audit_artifacts: [support PR branch, support PR body, intake issue link]
    deny_by_default: true
  - id: legacy_report
    status: shadow_report_only
    workflows: [catalog-maintenance.yml, source-refinement-queue.yml, observe-report.yml]
    may_write_branches: false
    may_open_prs: false
    may_label_prs: false
    may_enable_auto_merge: false
    may_merge_prs: false
    may_write_catalog_truth: false
    allowed_paths: []
    required_labels_for_write_authority: []
    token_permissions: {actions: read, contents: read}
    audit_artifacts: [catalog maintenance report, source refinement queue, observation report]
    deny_by_default: true
