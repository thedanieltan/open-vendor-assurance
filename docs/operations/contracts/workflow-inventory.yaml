    creates_prs: true
    merges_prs: false
  - name: catalog-maintenance.yml
    loop: legacy_report
    status: consolidation_candidate
    triggers: [workflow_dispatch, schedule]
    permissions: {contents: read, actions: read}
    writes_repository_state: false
    creates_prs: false
    merges_prs: false
  - name: source-refinement-queue.yml
    loop: legacy_report
    status: quarantined
    triggers: [workflow_dispatch]
    permissions: {contents: read}
    writes_repository_state: false
    creates_prs: false
    merges_prs: false
  - name: observe-report.yml
    loop: legacy_report
    status: quarantined
    triggers: [workflow_dispatch]
    permissions: {contents: read}
    writes_repository_state: false
    creates_prs: false
    merges_prs: false
