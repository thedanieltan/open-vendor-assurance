  WP-02L-POSITIONING:
    description: Positioning reconciliation across docs and READMEs for the hosted launch (WP-02L). DECOMPOSED/historical — the first positioning reconciliation lands in lockstep with the transport via WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP; not independently mergeable for that activation.
