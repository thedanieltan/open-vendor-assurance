# Work-package path-scope manifest.
#
# A PR declares its work package; the scope guard (tools/openva/pr_scope_guard.py)
# asserts every changed path matches that work package's allowed globs. This prevents
# an unrelated ANCESTOR branch's commits from silently entering a PR via a
# squash/rebase — the exact failure behind PR #400, which inherited the legal-entity
# commit (26b2922) and bundled it into the candidate-activation squash without
# independent review of that change set.
#
# Globs use fnmatch case-sensitive semantics where `*` spans `/` (so `dir/*` matches
# everything beneath `dir/`). Add a new work package here (with its allowed_paths)
# before opening a PR that declares it; an undeclared work package fails the guard.
#
# Trusted-base evaluation: CI reads this manifest (and the guard) from the trusted
# BASE revision, so a PR cannot weaken the policy that judges its own diff. Adding or
# widening a scope is therefore a two-PR process: land the manifest change under
# WP-PR-SCOPE-POLICY-01 first, then open the implementation PR. See
# docs/operations/pr-scope-guard.md.
version: 1

# Fail-closed: there are NO globally-exempt paths. The scope-policy machinery (this
# manifest, the guard, its doc and tests, the CI workflow and its ownership map) is
# governed SOLELY by WP-PR-SCOPE-POLICY-01 below — it is not shared, so no unrelated
# work package can edit the policy that judges it.
shared_allowed: []

work_packages:
  WP-PR-SCOPE-POLICY-01:
    description: The PR scope-policy machinery itself (manifest, guard, doc, tests, and the CI enforcement workflow + its ownership map). Changes here go through an independent policy PR before any implementation PR may rely on them.
    allowed_paths:
      - docs/operations/contracts/work-package-scope.yaml
      - docs/operations/pr-scope-guard.md
      - tools/openva/pr_scope_guard.py
      - tests/test_pr_scope_guard.py
      - .github/workflows/validate.yml
      - .github/validation-ownership.yaml

  WP-LEGAL-ENTITY-EXPORT-RATIFICATION-01:
    description: Retrospective ratification of the legal-entity export/matching change set bundled into PR #400 (audit evidence, required corrections, and regression tests). Scope-policy files are NOT included here — they live in WP-PR-SCOPE-POLICY-01.
    allowed_paths:
      - docs/operations/legal-entity-export-ratification.md
      - tests/test_legal_entity_export_ratification.py
      # Required corrections found by the audit (finding 2 conflict fail-closed;
      # finding 3 verified-only export; non-blocking stale docstring) and their tests.
      - adapters/python/openva_vendor_inventory_matcher/openva_vendor_inventory_matcher/core.py
      - tools/openva/agent_export.py
      - integrations/mcp/openva_mcp/openva_mcp/matching.py
      - tests/test_agent_export.py

  WP-OPENVA-AI-NATIVE-DISTRIBUTION-LEGAL-ENTITY:
    description: Legal-entity export projection + shared registration-number matching (the change set bundled into PR #400).
    allowed_paths:
      - tools/openva/agent_export.py
      - schemas/openva/agent-export.schema.json
      - schemas/openva/agent-enrichment-row.schema.json
      - adapters/python/openva_vendor_inventory_matcher/*
      - integrations/mcp/openva_mcp/*
      - docs/architecture/decisions/ADR-0003-remote-mcp-product-surface.md
      - docs/agent-workspace-composition.md
      - tests/test_agent_export.py
      - tests/test_matching_conformance.py
      - tests/test_openva_enrichment_parity.py
      - tests/test_openva_mcp_*.py

  WP-OPENVA-CANDIDATE-ACTIVATION-01:
    description: Candidate-bound autonomous catalogue promotion (#393 / merged as PR #400).
    allowed_paths:
      - tools/openva/candidate_record.py
      - tools/openva/vendor_resolution.py
      - tools/openva/autonomous_growth_controller.py
      - tools/openva/candidate_intake_guard.py
      - config/automerge-policy.yaml
      - .github/workflows/agent-automerge.yml
      - docs/candidate-intake.md
      - docs/operations/contracts/bot-authority.yaml
      - tests/test_candidate_*.py
      - tests/test_automerge_lanes.py

  # ADR-0006 acceptance precedes WP-02A. The WP-OPENVA-AI-NATIVE-DISTRIBUTION-02 family
  # (a programme umbrella in the decision docs) is decomposed here into one governance
  # work package (the ADR status flip) plus the WP-02A..L implementation slices. Each
  # slice carries a `slice_id` linking to hosted-deployment.yaml `implementation_slices`
  # and a `depends_on` of manifest WP keys; for every WP-02 slice the `depends_on`
  # MINUS the WP-ADR-0006-STATUS-CHANGE governance edge mirrors that slice's
  # `depends_on` in hosted-deployment.yaml.
  WP-ADR-0006-STATUS-CHANGE:
    description: >-
      Flip ADR-0006 (hosted public-read deployment) from Proposed to Accepted — the
      decision-record status change, its index row, the acceptance-count/lifecycle
      tests, and the narrative docs that state the ADR's status (so none keeps saying
      "Proposed" after acceptance). Status reconciliation ONLY — no service, schema,
      worker, persistence, deployment-artifact, or infrastructure paths, and the
      decision-only deployment contract's posture flags are NOT flipped here
      (acceptance authorises the architecture, not provisioning).
    depends_on: []
    allowed_paths:
      - docs/architecture/decisions/ADR-0006-hosted-public-read-deployment.md
      - docs/architecture/decisions/README.md
      - tests/test_ai_native_distribution_docs.py
      # Lifecycle test that pins ADR-0006's Proposed status (must flip on acceptance).
      - tests/test_hosted_deployment_docs.py
      # Narrative docs that state "ADR-0006 is Proposed" — reconciled to Accepted
      # without changing the decision-only posture they describe.
      - docs/roadmap.md
      - docs/public-launch-checklist.md
      - docs/operations/hosted-deployment-runbook.md
      - docs/operations/contracts/hosted-deployment.yaml

  # Composite LOCKSTEP work package for the FIRST hosted-transport activation. ADR-0001
  # requires the seven positioning files to be reconciled in the SAME merge as the first
  # hosted transport ("not afterward"), so that activation is THIS one atomic, narrowly-
  # scoped composite — never a standalone WP-02A or WP-02L PR. WP-02A and WP-02L below are
  # retained only as decomposed/historical definitions and are NOT independently mergeable
  # for that first activation. No slice_id: this is a manifest-only lockstep wrapper, not a
  # hosted-deployment.yaml slice; for the dependency mirror it stands in for WP-02A's slice.
  WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP:
    description: Atomic first hosted-transport activation bundled with ADR-0001 positioning reconciliation (the WP-02A transport surface + the seven positioning files, in one merge). Supersedes standalone WP-02A/WP-02L for this one activation; exact path union, no broad docs/** access.
    depends_on:
      - WP-ADR-0006-STATUS-CHANGE
    allowed_paths:
      # WP-02A transport surface
      - services/openva_match_service/*
      - docs/resolver-api.md
      - tests/*
      # The seven ADR-0001 positioning files (exact paths, NOT docs/**)
      - README.md
      - docs/openva-match-service-contract.md
      - docs/openva-match-service-deployment.md
      - docs/public-launch-checklist.md
      - docs/release-downloads.md
      - docs/v0.1.0-public-launch-readiness.md
      - docs/agent-export-contract.md

  WP-02A-HOSTED-TRANSPORT:
    description: Hosted transport/API for the match service (WP-02A). DECOMPOSED/historical — NOT independently mergeable for the first hosted-transport activation (that lands via WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP per ADR-0001's positioning lockstep). Retained for decomposition reference.
    slice_id: WP-02A-hosted-transport-api
    depends_on:
      - WP-ADR-0006-STATUS-CHANGE
    allowed_paths:
      - services/openva_match_service/*
      - docs/openva-match-service-contract.md
      - docs/resolver-api.md
      - tests/*

  WP-02B-ASYNC-PERSISTENCE:
    description: Async job persistence for the match service (WP-02B).
    slice_id: WP-02B-async-job-persistence
    depends_on:
      - WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP
    allowed_paths:
      - services/openva_match_service/*
      - schemas/openva/*
      - tests/*

  WP-02C-WORKER-QUEUE:
    description: Worker and queue for asynchronous match jobs (WP-02C).
    slice_id: WP-02C-worker-and-queue
    depends_on:
      - WP-02B-ASYNC-PERSISTENCE
    allowed_paths:
      - services/openva_match_service/*
      - tools/openva/*
      - tests/*

  WP-02D-CANDIDATE-INGRESS:
    description: Candidate-ingress integration into the hosted match service (WP-02D).
    slice_id: WP-02D-candidate-ingress-integration
    depends_on:
      - WP-02C-WORKER-QUEUE
    allowed_paths:
      - services/openva_match_service/*
      - tools/openva/*
      - tests/*

  WP-02E-SUPPLY-CHAIN:
    description: Artifact build and supply-chain controls for the hosted service (WP-02E). Includes tests/* (consistent with the other WP-02 application slices) so the supply-chain gate's pytest proofs and the workflow-inventory registration test land with the slice.
    slice_id: WP-02E-artifact-and-supply-chain
    depends_on:
      - WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP
    allowed_paths:
      - services/openva_match_service/*
      - .github/workflows/*
      - docs/operations/*
      - tests/*

  WP-02F-STAGING:
    description: Staging environment for the hosted service (WP-02F). Provider-specific edge enforcement, alert routing, dashboards, and cloud configuration are accepted HERE (moved from WP-02H, which is now provider-neutral application hardening). Maintainer-gated.
    slice_id: WP-02F-staging-environment
    depends_on:
      - WP-02E-SUPPLY-CHAIN
      - WP-02J-LIVE-CHECK
    allowed_paths:
      - infra/*
      - docs/operations/*

  WP-02G-PRODUCTION-INFRA:
    description: Production infrastructure for the hosted service (WP-02G). Production edge enforcement, alert routing, dashboards, and cloud configuration (regional log buckets + _Default sink, cost ceiling) are accepted here. Maintainer-gated.
    slice_id: WP-02G-production-infrastructure
    depends_on:
      - WP-02F-STAGING
    allowed_paths:
      - infra/*

  WP-02H-OBSERVABILITY:
    description: Provider-NEUTRAL application hardening for the hosted service (WP-02H) — telemetry-field prohibition + redaction, structured logging/metrics interfaces, application request + concurrency limits, rate-limit/abuse-control policy, cost-exhaustion protection behaviour, kill-switch behaviour, and leakage + negative tests. Lands BEFORE staging (depends on WP-02C, may run in parallel with WP-02D). No infra paths — provider-specific edge enforcement, alert routing, dashboards, and cloud config move to WP-02F/WP-02G acceptance.
    slice_id: WP-02H-observability-and-abuse-controls
    depends_on:
      - WP-02C-WORKER-QUEUE
    allowed_paths:
      - services/openva_match_service/*
      - docs/operations/*
      - tests/*

  WP-02I-REMOTE-MCP:
    description: Remote MCP resolver activation against the hosted service (WP-02I).
    slice_id: WP-02I-remote-mcp-resolver-activation
    depends_on:
      - WP-02D-CANDIDATE-INGRESS
      - WP-02H-OBSERVABILITY
    allowed_paths:
      - integrations/mcp/*
      - services/openva_match_service/*
      - tests/*

  WP-02J-LIVE-CHECK:
    description: Live-check integration against the hosted resolver (WP-02J).
    slice_id: WP-02J-live-check-integration
    depends_on:
      - WP-02I-REMOTE-MCP
    allowed_paths:
      - services/openva_match_service/*
      - docs/*
      - tests/*

  WP-02K-LAUNCH-EVIDENCE:
    description: Production smokes, launch evidence, and WP-02 programme closeout for the hosted service (WP-02K) — production smoke evidence, rollback + kill-switch drills, public-traffic enablement only after evidence, hosted-live positioning update, release/tag evidence, roadmap final-state update, and closure of the hosted-deployment programme. Maintainer-gated; depends on WP-02G (WP-02J is already in WP-02G's closure).
    slice_id: WP-02K-production-smokes-and-launch-evidence
    depends_on:
      - WP-02G-PRODUCTION-INFRA
    allowed_paths:
      - docs/operations/*
      - infra/*

  WP-02L-POSITIONING:
    description: Positioning reconciliation across docs and READMEs for the hosted launch (WP-02L). DECOMPOSED/historical — the first positioning reconciliation lands in lockstep with the transport via WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP; not independently mergeable for that activation.
    slice_id: WP-02L-positioning-reconciliation
    depends_on:
      - WP-02A-HOSTED-TRANSPORT
    allowed_paths:
      - docs/*
      - README.md
      - integrations/*/README.md

  # Roadmap/contract reconciliation lane for the WP-02 programme. Records the merged
  # in-repo slices (WP-02A transport + WP-02L positioning via the lockstep, and WP-02B
  # async persistence) as complete, removes stale "startable now" readiness wording,
  # and re-encodes the remaining WP-02C..K dependency sequence in BOTH the machine-
  # readable contract (hosted-deployment.yaml) and this manifest TOGETHER, so the
  # depends_on mirror (tests/test_pr_scope_guard.py) stays coherent. This is the ONLY
  # non-policy lane permitted to edit work-package-scope.yaml, and only for the WP-02
  # depends_on edges it must move in lockstep with the contract; the scope-policy
  # MACHINERY (guard, its tests, doc, CI workflow, ownership map) stays SOLELY under
  # WP-PR-SCOPE-POLICY-01. Documentation/contract/drift-test reconciliation only — no
  # service, schema, worker, deployment-artifact, or infrastructure paths, and the
  # decision-only posture flags are NOT flipped (no provisioning, no live endpoint).
  WP-02-ROADMAP-RECONCILIATION-01:
    description: >-
      Roadmap, implementation-plan, hosted-deployment contract, and drift-test
      reconciliation after WP-02A/02L/02B merged: mark those slices complete, drop
      stale "startable now" wording, re-encode the WP-02C..K dependency sequence
      (lockstep across hosted-deployment.yaml and this manifest), revise WP-02H to
      provider-neutral application hardening before staging, extend WP-02K with
      programme closeout, and record the cross-cutting execution constraints. No
      provisioning; decision-only posture preserved.
    depends_on:
      - WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP
      - WP-02B-ASYNC-PERSISTENCE
    allowed_paths:
      - docs/roadmap.md
      - docs/operations/hosted-deployment-implementation-plan.md
      - docs/operations/contracts/hosted-deployment.yaml
      - docs/operations/contracts/work-package-scope.yaml
      - tests/test_hosted_deployment_docs.py
      - tests/test_ai_native_distribution_docs.py
