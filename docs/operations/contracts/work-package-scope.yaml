  # ADR-0006 acceptance precedes WP-02A. The WP-OPENVA-AI-NATIVE-DISTRIBUTION-02 family
  # (a programme umbrella in the decision docs) is decomposed here into one governance
  # work package (the ADR status flip) plus the WP-02A..L implementation slices. Each
  # slice carries a `slice_id` linking to hosted-deployment.yaml `implementation_slices`
  # and a `depends_on` of manifest WP keys; for every WP-02 slice the `depends_on`
  # MINUS the WP-ADR-0006-STATUS-CHANGE governance edge mirrors that slice's
  # `depends_on` in hosted-deployment.yaml.
  WP-ADR-0006-STATUS-CHANGE:
    description: >-
      Flip ADR-0006 (hosted public-read deployment) from Proposed to Accepted — the
      decision-record status change, its index row, the acceptance-count/lifecycle
      tests, and the narrative docs that state the ADR's status (so none keeps saying
      "Proposed" after acceptance). Status reconciliation ONLY — no service, schema,
      worker, persistence, deployment-artifact, or infrastructure paths, and the
      decision-only deployment contract's posture flags are NOT flipped here
      (acceptance authorises the architecture, not provisioning).
    depends_on: []
    allowed_paths:
      - docs/architecture/decisions/ADR-0006-hosted-public-read-deployment.md
      - docs/architecture/decisions/README.md
      - tests/test_ai_native_distribution_docs.py
      # Lifecycle test that pins ADR-0006's Proposed status (must flip on acceptance).
      - tests/test_hosted_deployment_docs.py
      # Narrative docs that state "ADR-0006 is Proposed" — reconciled to Accepted
      # without changing the decision-only posture they describe.
      - docs/roadmap.md
      - docs/public-launch-checklist.md
      - docs/operations/hosted-deployment-runbook.md
      - docs/operations/contracts/hosted-deployment.yaml

  # Composite LOCKSTEP work package for the FIRST hosted-transport activation. ADR-0001
  # requires the seven positioning files to be reconciled in the SAME merge as the first
  # hosted transport ("not afterward"), so that activation is THIS one atomic, narrowly-
  # scoped composite — never a standalone WP-02A or WP-02L PR. WP-02A and WP-02L below are
  # retained only as decomposed/historical definitions and are NOT independently mergeable
  # for that first activation. No slice_id: this is a manifest-only lockstep wrapper, not a
  # hosted-deployment.yaml slice; for the dependency mirror it stands in for WP-02A's slice.
  WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP:
    description: Atomic first hosted-transport activation bundled with ADR-0001 positioning reconciliation (the WP-02A transport surface + the seven positioning files, in one merge). Supersedes standalone WP-02A/WP-02L for this one activation; exact path union, no broad docs/** access.
    depends_on:
      - WP-ADR-0006-STATUS-CHANGE
    allowed_paths:
      # WP-02A transport surface
      - services/openva_match_service/*
      - docs/resolver-api.md
      - tests/*
      # The seven ADR-0001 positioning files (exact paths, NOT docs/**)
      - README.md
      - docs/openva-match-service-contract.md
      - docs/openva-match-service-deployment.md
      - docs/public-launch-checklist.md
      - docs/release-downloads.md
      - docs/v0.1.0-public-launch-readiness.md
      - docs/agent-export-contract.md

  WP-02A-HOSTED-TRANSPORT:
    description: Hosted transport/API for the match service (WP-02A). DECOMPOSED/historical — NOT independently mergeable for the first hosted-transport activation (that lands via WP-02A-L-HOSTED-TRANSPORT-POSITIONING-LOCKSTEP per ADR-0001's positioning lockstep). Retained for decomposition reference.
    slice_id: WP-02A-hosted-transport-api
