# Work-package path-scope manifest. CI evaluates this file from the trusted base.
version: 1
shared_allowed: []

work_packages:
  WP-PR-SCOPE-POLICY-01:
    description: Scope-policy machinery; changes require an independent policy PR.
    allowed_paths:
      - docs/operations/contracts/work-package-scope.yaml
      - docs/operations/pr-scope-guard.md
      - tools/openva/pr_scope_guard.py
      - tests/test_pr_scope_guard.py
      - tests/test_operational_pr_scope.py
      - tests/test_sitemap_discovery_integration.py
      - .github/workflows/validate.yml
      - .github/validation-ownership.yaml

  WP-WEB-BOT-AUTH-CI-BOOTSTRAP-01:
    description: Bootstrap scope for PR #565, covering the manual Web Bot Auth smoke workflow and the CI sharding/control-plane updates needed to land it without weakening PR gates.
    allowed_paths:
      - .github/validation-ownership.yaml
      - .github/workflows/validate.yml
      - .github/workflows/web-bot-auth-smoke.yml
      - docs/architecture/OPENVA_SYSTEM_DESIGN.md
      - docs/ci-and-branch-protection.md
      - docs/operations/WORKFLOW_CONSOLIDATION_AUDIT.md
      - docs/operations/WORKFLOW_OPERATING_MODEL.md
      - docs/operations/contracts/work-package-scope.yaml
      - docs/operations/contracts/workflow-inventory.yaml
      - tests/test_ci_readiness.py
      - tests/test_pr_scope_guard.py
      - tests/test_retired_validation_checks.py
      - tests/test_workflow_contracts.py
      - tests/test_workflow_operating_model.py
      - tests/test_wp41_workflows.py

  WP-OPENVA-CRAWLER-IDENTITY-01:
    description: Cloudflare-verifiable crawler identity, robots pacing, access-policy classification, public operator documentation, and a free-tier key-directory Worker.
    allowed_paths:
      - .github/workflows/catalog-growth-discovery.yml
      - .github/workflows/source-maintenance-report.yml
      - config/crawler-identity.yaml
      - docs/observation-result-taxonomy.md
      - docs/operations/openva-crawler-identity.md
      - infra/cloudflare/openva-web-bot-auth/*
      - tests/test_observe.py
      - tests/test_robots_policy.py
      - tests/test_safe_fetch.py
      - tests/test_safe_verify.py
      - tests/test_sitemap_discovery.py
      - tests/test_source_verification.py
      - tests/test_web_bot_auth.py
      - tools/openva/observe.py
      - tools/openva/robots_policy.py
      - tools/openva/safe_fetch.py
      - tools/openva/safe_verify.py
      - tools/openva/sitemap_discovery.py
      - tools/openva/source_verification.py
      - tools/openva/web_bot_auth.py

  WP-WORKFLOW-CONTROL-PLANE-01:
    description: Existing workflow inventory, retirement contracts, docs, and metadata-only PR validation control plane.
    allowed_paths:
      - .github/workflows/validate-pr-metadata.yml
      - docs/operations/contracts/workflow-inventory.yaml
      - docs/operations/contracts/workflow-retirement.yaml
      - docs/operations/WORKFLOW_OPERATING_MODEL.md
      - docs/operations/WORKFLOW_CONSOLIDATION_AUDIT.md
      - docs/operations/WORKFLOW_RETIREMENT_EVIDENCE.md
      - docs/operations/WORKFLOW_RETIREMENT_PLAN.md
      - tests/test_ci_readiness.py
      - tests/test_workflow_operating_model.py
      - tests/test_workflow_contracts.py
      - tests/test_workflow_retirement.py
      - tests/test_workflow_retirement_enforcement.py
      - tests/test_workflow_retirement_evidence.py
      - tests/test_future_operations_specs.py

  WP-SOURCE-OBSERVATION-FRESHNESS-CONTINUITY-01:
    description: Committed latest-observation continuity and release freshness integration.
    allowed_paths:
      - .github/workflows/observation-ledger-append-pr.yml
      - .github/workflows/source-maintenance-report.yml
      - docs/architecture/SOURCE_OBSERVATION_FRESHNESS_CONTINUITY.md
      - maintenance/source-observations/latest-observations.json
      - tests/test_observation_automerge.py
      - tests/test_observation_ledger.py
      - tests/test_observation_ledger_append_workflow.py
      - tests/test_release_gates.py
      - tests/test_source_maintenance_workflow.py
      - tools/openva/observation_automerge.py
      - tools/openva/observation_ledger.py
      - tools/openva/release_gates.py

  WP-DISCOVERY-LEDGER-APPEND-01:
    description: Data-only append of discovery events from one identified workflow run.
    allowed_paths:
      - maintenance/discovery-events/*.ndjson

  WP-SOURCE-OBSERVATION-LEDGER-APPEND-01:
    description: Data-only append of source observations plus the deterministic latest-observations index from the same artifact.
    allowed_paths:
      - maintenance/source-observations/events/*.ndjson
      - maintenance/source-observations/latest-observations.json

  WP-SOURCE-QUARANTINE-01:
    description: One-source status-only reversible quarantine projection after the existing semantic and not-before gates pass.
    allowed_paths:
      - data/vendors/*/sources/*.yaml
      - dist/vendors/*.json
      - indexes/sources.json
      - maintenance/machine-decisions/*.ndjson

  WP-AUTONOMOUS-OPERATIONAL-PR-CONTROL-PLANE-01:
    description: Exact workflow/control-plane surface for operational PR declarations and generated candidate-promotion catalog PRs.
    allowed_paths:
      - .github/workflows/discovery-ledger-append-pr.yml
      - .github/workflows/observation-ledger-append-pr.yml
      - .github/workflows/source-maintenance-report.yml
      - .github/workflows/candidate-promotion-pr.yml
      - .github/workflows/agent-automerge.yml
      - .github/workflows/catalog-pr-guard.yml
      - data/vendors/**
      - dist/vendors/**
      - docs/operations/contracts/workflow-inventory.yaml
      - indexes/**
      - maintenance/generated/**
      - maintenance/machine-decisions/**
      - maintenance/source-observations/latest-observations.json
      - openva-pack.json
      - tests/test_ci_readiness.py
      - tests/test_candidate_intake_workflows.py
      - tests/test_candidate_promotion_workflow.py
      - tests/test_catalog_guard.py
      - tests/test_generated_catalog_pr_risk.py
      - tests/test_operational_pr_scope.py
      - tests/test_public_launch_readiness.py
      - tests/test_discovery_ledger.py
      - tests/test_observation_ledger.py
      - tests/test_observation_ledger_append_workflow.py
      - tests/test_source_maintenance_workflow.py
      - tests/test_candidate_promotion_actions.py
      - tests/test_promotion_planner.py
      - tests/test_wp41_workflows.py
      - tests/test_source_quarantine.py
      - tests/test_quarantine_automerge.py
      - tests/test_quarantine_workflow.py
      - tools/openva/catalog_guard.py
      - tools/openva/candidate_promotion_actions.py
