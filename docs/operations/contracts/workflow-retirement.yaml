version: 1
contract: workflow-retirement
source_document: docs/operations/WORKFLOW_RETIREMENT_PLAN.md
default_posture:
  unclassified_workflows_block_retirement: true
  destructive_retirement_requires_followup_pr: true
  workflow_deletion_allowed_in_this_contract: false
  workflow_disable_allowed_in_this_contract: false
  workflow_rename_allowed_in_this_contract: false
  workflow_trigger_changes_allowed_in_this_contract: false
  workflow_permission_changes_allowed_in_this_contract: false
  retired_workflows_must_leave_public_inventory: true
statuses:
  - active
  - shadow_report_only
  - deprecated_callable
  - quarantined
  - retired
workflows:
  - name: validate.yml
    current_status: active
    inventory_status: core
    operating_loop: pr_safety
    replacement_owner: validate.yml
    retirement_candidate: false
    retirement_ready: false
    must_not_retire_yet: true
    retirement_blockers: [protects main through validation and generated-output checks]
    required_retirement_evidence: [replacement validation gate, full validation suite pass]
    allowed_triggers_until_retired: [pull_request, push]
    write_permissions_allowed_until_retired: false
