version: 1
contract: workflow-retirement-extension
extends: docs/operations/contracts/workflow-retirement.yaml
workflows:
  - name: discovery-mesh.yml
    current_status: active
    inventory_status: core
    operating_loop: catalog_growth
    replacement_owner: discovery-mesh.yml
    retirement_candidate: false
    retirement_ready: false
    must_not_retire_yet: true
    retirement_blockers:
      - owns uncapped full-catalog sharded source discovery
      - owns candidate-only intake for discovery-mesh evidence
      - owns exact-plan handoff to candidate-promotion-pr.yml without adding a second canonical mutation path
    required_retirement_evidence:
      - replacement full-catalog sharding with no scheduled vendor cap
      - replacement candidate-intake and exact-plan handoff proof
      - validation suite pass
      - maintainer approval of the replacement mutation boundary
    allowed_triggers_until_retired: [workflow_dispatch, schedule, pull_request]
    write_permissions_allowed_until_retired: true
