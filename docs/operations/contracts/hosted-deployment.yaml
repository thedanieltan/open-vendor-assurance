# Hosted public-read deployment contract (WP-OPENVA-AI-NATIVE-DISTRIBUTION-02).
#
# Single machine-readable source of truth for the hosted-deployment DECISION
# package. It records a deployment RECOMMENDATION and an implementation-ready
# architecture; it does NOT provision infrastructure, accept a provider, or
# claim a hosted endpoint is live. The deployment ADR (ADR-0006) is Proposed
# until a maintainer accepts it. Authority order applies: ADR-0001 governs the
# product posture; this contract and ADR-0006 govern how that posture deploys.
#
# Operational metadata only. Not legal, compliance, procurement, security, KYC,
# AML, audit, or vendor-risk advice.

version: 1
contract: hosted-deployment
source_document: docs/operations/hosted-deployment-decision.md
governed_by:
  - docs/architecture/decisions/ADR-0001-hosted-resolver-and-live-verification.md
  - docs/architecture/decisions/ADR-0006-hosted-public-read-deployment.md

# Decision-only posture. Every flag here MUST stay false in this work package;
# flipping any of them is a maintainer-controlled action in a later slice with
# real provisioning evidence. Tests assert these remain false.
posture:
  decision_only: true
  production_infrastructure_provisioned: false
  hosted_endpoint_live: false
  provider_accepted_by_maintainer: false
  dns_or_tls_configured: false
  production_secrets_created: false

# Hard boundaries inherited from ADR-0001 (referenced, not restated). The
# hosted deployment preserves all six acceptance gates.
adr0001_boundaries_preserved:
  non_advisory: true
  public_sources_only: true
  ssrf_safe_fetch_only: true
  no_arbitrary_url_fetch: true
  no_catalogue_mutation_path: true        # PR-bound candidate write-back only
  transient_unpublished_inputs: true
  credential_isolation: true
  honest_degradation_static_fallback: true
  catalogue_determinism_preserved: true

# Deployment recommendation. RECOMMENDATION ONLY — maintainer accepts a provider.
provider_recommendation:
  baseline: google-cloud-run
  alternatives:
    - aws-lambda-container
    - azure-container-apps
  rejected:
    - id: aws-app-runner
      reason: closed to new customers in 2026
    - id: aws-ecs-fargate
      reason: no scale-to-zero; always-on idle cost
    - id: render
      reason: paid tiers do not scale to zero; high idle floor
  accepted_by_maintainer: false

# Durable job/result lifecycle (paired with the schema). The job record is
# operational metadata only and carries no uploaded inventory content.
job_record_schema: schemas/openva/hosted-job-record.schema.json
job_states:
  - received
  - queued
  - executing
  - completed
  - failed
terminal_states:
  - completed
  - failed
transitions:
  received: [queued, failed]
  queued: [executing, failed]
  executing: [completed, failed]
  completed: []
  failed: []
idempotency_key: job_id
result_ttl_hours_default: 24

# Expiry is NOT a persisted state. Expiry is time-based on expires_at: once
# now >= expires_at the API returns a content-free 410 Gone, whether or not the
# physical record has been deleted yet. Physical deletion (the job record, the
# transient request envelope, and the result blob) is by store-native TTL plus an
# object-lifecycle TTL backstop, and is not guaranteed instantaneous.
expiry:
  model: expires_at_then_410_then_delete
  response_when_expired: "410 Gone (content-free)"
  physical_deletion: store_native_ttl_plus_object_lifecycle
  deletes:
    - job_record
    - transient_request_envelope
    - result_blob
  persisted_expired_state: false

# The async data path. The worker reconstructs the request from a TRANSIENT
# request envelope keyed by job_id; the queue and the job record never carry the
# submitted input.
request_envelope:
  store: transient_request_store
  carried_in_queue: false             # queue messages carry job_id only
  carried_in_job_record: false        # the durable record stores only request_digest
  encryption: at_rest
  access: workload_identity_least_privilege   # API writes; worker reads
  deleted_on: [completion, failure, abandonment, ttl]
  max_size: existing_upload_and_row_caps      # OPENVA_MAX_UPLOAD_BYTES / OPENVA_MAX_ROWS

# Result-access authorization. job_id is a loggable correlation id and is NOT an
# access credential. A high-entropy job_token capability is returned once at job
# creation and is required to poll/retrieve the result; it is never logged and
# never stored in plaintext — only its SHA-256 digest (job_token_digest) persists.
result_access:
  correlation_id: job_id              # loggable; not a credential
  capability: job_token               # returned once at creation; never logged
  stored_as: job_token_digest         # sha256 of the capability only
  result_store: transient_result_store

# Service topology components (each is specified in the architecture doc).
topology_components:
  - edge_gateway                      # HTTPS load balancer + rate limiting in front of the API
  - public_api
  - resolver_app
  - async_worker
  - queue
  - transient_request_store          # transient submitted-input envelope (keyed by job_id)
  - durable_job_store
  - transient_result_store           # transient result blob (referenced by result_ref)
  - static_cached_fallback
  - candidate_ingress_boundary
  - health_readiness
  - admin_kill_switch

# Edge architecture. Rate limiting requires a concrete edge in front of the
# service; on the baseline (Cloud Run) that is an external HTTPS Application Load
# Balancer with Cloud Armor, and Cloud Run ingress is restricted so direct
# ingress cannot bypass the edge. The edge adds a fixed cost floor (see cost doc).
edge:
  gateway: external_https_load_balancer_plus_rate_limiting   # e.g. Cloud Armor on GCP
  origin_ingress: restricted_to_edge_only                    # internal-and-cloud-load-balancing on Cloud Run
  bypass_prevented: true
  adds_fixed_cost_floor: true

# Telemetry fields that MUST NEVER be emitted to logs, traces, or metric labels
# (the ADR-0001 transient-input + leakage boundary).
prohibited_telemetry_fields:
  - request_body
  - vendor_identity
  - inventory_row
  - uploaded_inventory
  - tool_arguments
  - candidate_url
  - job_token            # the result-access capability is never logged

# Maintainer-controlled external decisions (the fail-closed boundary). None of
# these is decided in this work package.
maintainer_decisions:
  - id: provider
    recommended: google-cloud-run
  - id: region
    recommended: maintainer-selected (data-residency dependent)
  - id: domain
    recommended: maintainer-owned OpenVA host
  - id: dns_tls
    recommended: managed certificate on the maintainer-owned host
  - id: container_registry
    recommended: provider-native registry with immutable tags
  - id: secrets_and_identity
    recommended: workload identity for cloud APIs; GitHub App key in managed secret store (remote-signing where available)
  - id: spend_ceiling
    recommended: instance/concurrency cap + edge rate limit + budget-alert kill-switch
  - id: production_permissions
    recommended: least-privilege; separate staging and production
  - id: public_traffic_enablement
    recommended: enabled only after staging smokes pass
  - id: adr0006_acceptance
    recommended: maintainer merges ADR-0006 to accept the architecture

# Follow-on implementation slices (dependency-ordered). Specified in the
# implementation plan; each becomes executable after maintainer acceptance.
implementation_slices:
  - id: WP-02A-hosted-transport-api
    depends_on: []
  - id: WP-02B-async-job-persistence
    depends_on: [WP-02A-hosted-transport-api]
  - id: WP-02C-worker-and-queue
    depends_on: [WP-02B-async-job-persistence]
  - id: WP-02D-candidate-ingress-integration
    depends_on: [WP-02C-worker-and-queue]
  - id: WP-02E-artifact-and-supply-chain
    depends_on: [WP-02A-hosted-transport-api]
  - id: WP-02F-staging-environment
    depends_on: [WP-02E-artifact-and-supply-chain, WP-02C-worker-and-queue]
  - id: WP-02G-production-infrastructure
    depends_on: [WP-02F-staging-environment]
  - id: WP-02H-observability-and-abuse-controls
    depends_on: [WP-02F-staging-environment]
  - id: WP-02I-remote-mcp-resolver-activation
    depends_on: [WP-02D-candidate-ingress-integration, WP-02H-observability-and-abuse-controls]
  - id: WP-02J-live-check-integration
    depends_on: [WP-02I-remote-mcp-resolver-activation]
  - id: WP-02K-production-smokes-and-launch-evidence
    depends_on: [WP-02G-production-infrastructure, WP-02J-live-check-integration]
  - id: WP-02L-positioning-reconciliation
    depends_on: [WP-02A-hosted-transport-api]
