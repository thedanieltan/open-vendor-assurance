version: 1
contract: bot-observability
source_document: docs/operations/BOT_OBSERVABILITY.md
input_reports:
  - id: bot_queue_reports
    report_type: bot_queue_decision
    paths:
      - maintenance/bot-queue-report.json
    required: false
    metrics:
      - bot_prs_failed_before_creation
      - queue_denials_by_lane
      - queue_deferrals_by_lane
      - stale_evidence_denials
  - id: bot_failure_routing_reports
    report_type: bot_failure_routing
    paths:
      - maintenance/bot-failure-routing-report.json
    required: false
    metrics:
      - failure_reasons_by_class
      - bot_prs_failed_before_creation
      - source_preflight_failure_rate
      - redirect_canonicalization_rate
  - id: bot_chatops_decision_reports
    report_type: bot_chatops_decision
    paths:
      - maintenance/bot-chatops-decision.json
    required: false
    metrics:
      - chatops_command_decisions_by_status
  - id: bot_dashboard_issue_sync_reports
    report_type: bot_dashboard_issue_sync
    paths:
      - maintenance/bot-dashboard-issue-sync-report.json
    required: false
    metrics:
      - dashboard_issue_sync_decisions_by_status
  - id: bot_dashboard_markdown
    report_type: bot_dashboard_markdown
    paths:
      - maintenance/bot-dashboard.md
    required: false
    metrics:
      - missing_input_count
missing_input_behavior:
  tolerate_missing_optional_inputs: true
  missing_optional_inputs_do_not_fail_build: true
  missing_inputs_are_reported: true
  missing_inputs_do_not_imply_zero_activity: true
outputs:
  json: maintenance/bot-observability-scorecard.json
  markdown: maintenance/bot-observability-scorecard.md
expected_markdown_sections:
  - Summary
  - Metric Completeness
  - PR Lifecycle Metrics
  - Queue Metrics
  - Failure Metrics
  - Chat-Ops Metrics
  - Missing Inputs
  - Next Safe Action
expected_json_shape:
  top_level_fields:
    - version
    - report_type
    - metrics
    - groups
    - inputs
    - missing_inputs
    - completeness
    - next_safe_action
  metric_fields:
    - value
    - confidence
    - completeness
    - sources
freshness_model:
  report_generated_at_field: generated_at
  tolerate_missing_generated_at: true
  stale_threshold_hours:
    queue_report: 24
    failure_routing_report: 24
    chatops_decision_report: 24
    dashboard_issue_sync_report: 24
    dashboard_markdown: 24
metrics:
  - name: bot_prs_opened
    description: Bot-authored PRs opened during the observed period.
    value_type: integer_or_null
    live_github_required: true
  - name: bot_prs_merged
    description: Bot-authored PRs merged during the observed period.
    value_type: integer_or_null
    live_github_required: true
  - name: bot_prs_failed_before_creation
    description: Bot actions stopped before PR creation by queue denial or lane-stop failure routing.
    value_type: integer
    live_github_required: false
  - name: bot_prs_closed
    description: Bot-authored PRs closed without merge during the observed period.
    value_type: integer_or_null
    live_github_required: true
  - name: human_interventions_per_pr
    description: Average maintainer interventions per bot PR.
    value_type: number_or_null
    live_github_required: true
  - name: average_time_to_merge
    description: Average elapsed time from bot PR open to merge.
    value_type: number_or_null
    unit: hours
    live_github_required: true
  - name: failure_reasons_by_class
    description: Failure routing reports grouped by taxonomy code.
    value_type: map
    live_github_required: false
  - name: candidate_conversion_rate
    description: Ratio of discovered candidates that become reviewed promotion actions.
    value_type: number_or_null
    live_github_required: false
  - name: source_preflight_failure_rate
    description: Share of classified failure reports with source_preflight_failure.
    value_type: number_or_null
    live_github_required: false
  - name: redirect_canonicalization_rate
    description: Share of classified failure reports with redirect_canonicalization_failure.
    value_type: number_or_null
    live_github_required: false
  - name: deferred_backlog_age
    description: Maximum local age of deferred queue or dashboard backlog items.
    value_type: number_or_null
    unit: hours
    live_github_required: false
  - name: review_backlog_age
    description: Maximum local age of review-required queue or dashboard backlog items.
    value_type: number_or_null
    unit: hours
    live_github_required: false
  - name: queue_denials_by_lane
    description: Queue deny decisions grouped by lane.
    value_type: map
    live_github_required: false
  - name: queue_deferrals_by_lane
    description: Queue defer decisions grouped by lane.
    value_type: map
    live_github_required: false
  - name: stale_evidence_denials
    description: Queue deny or defer decisions caused by stale or missing evidence.
    value_type: integer
    live_github_required: false
  - name: chatops_command_decisions_by_status
    description: Chat-ops parser decisions grouped by accepted_report_only, denied, ignored, and future statuses.
    value_type: map
    live_github_required: false
